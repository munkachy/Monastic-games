<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Benedictine Bricks</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --sky: #7fd0f5;
    --tan: #e6a95c;
    --tan-light: #f3c885;
    --tan-dark: #b8783a;
    --maroon: #5a1e2a;
    --parchment: #f7deaf;
    --orange: #e8672a;
    --purple: #7d4cc0;
    --rose: #c7406a;
    --gem: #5ab8e8;
    --gold: #f0c030;
    --ink: #3a1420;
    background: var(--sky);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--sky);
    color: var(--ink);
    font-family: "Press Start 2P", ui-monospace, monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    height: 100%;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #stage {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas#game { display: block; touch-action: none; image-rendering: pixelated; }
  canvas { image-rendering: pixelated; }
  button {
    font-family: inherit;
    color: var(--maroon);
    touch-action: manipulation;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* ---- Heads-up display ---- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud button { pointer-events: auto; }
  .topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .banner {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 14px;
    background: var(--tan);
    border: 3px solid var(--maroon);
    border-top: none;
    box-shadow: inset 0 -5px 0 var(--tan-dark);
    color: #fff;
    font-size: 15px;
    text-shadow: 2px 2px 0 var(--maroon);
    font-variant-numeric: tabular-nums;
  }
  .banner.left { border-left: none; border-bottom-right-radius: 10px; }
  .banner.right { border-right: none; border-bottom-left-radius: 10px; }
  .banner small { font-size: 8px; text-shadow: 1px 1px 0 var(--maroon); }
  .banner canvas { width: 22px; height: 22px; }
  #btn-pause {
    width: 30px;
    height: 30px;
    padding: 0;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 14px;
    text-shadow: 2px 2px 0 var(--maroon);
  }
  .diamond {
    position: absolute;
    width: 62px;
    height: 62px;
    transform: rotate(45deg);
    border: 4px solid var(--rose);
    box-shadow: 0 0 0 3px var(--maroon);
    display: grid;
    place-items: center;
  }
  .diamond > * { transform: rotate(-45deg); }
  .next-box { top: 66px; left: 18px; background: var(--tan-light); }
  .next-box canvas { width: 60px; height: 60px; }
  .prayer-box {
    top: 66px;
    right: 18px;
    background: var(--purple);
    color: #fff;
    font-size: 20px;
    text-shadow: 2px 2px 0 var(--maroon);
  }
  .prayer-label {
    position: absolute;
    top: 148px;
    right: 8px;
    width: 84px;
    text-align: center;
    font-size: 7px;
    color: #fff;
    text-shadow: 1px 1px 0 var(--maroon);
  }
  #spells {
    position: absolute;
    top: 168px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .spell {
    position: relative;
    width: 72px;
    height: 72px;
    padding: 0;
    background: transparent;
    border: none;
    display: grid;
    place-items: center;
  }
  .spell .gem {
    width: 48px;
    height: 48px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, #8ad8ff, var(--gem));
    border: 4px solid var(--maroon);
    display: grid;
    place-items: center;
  }
  .spell .gem canvas { width: 34px; height: 34px; transform: rotate(-45deg); }
  .spell .cost {
    position: absolute;
    right: 4px;
    bottom: 4px;
    min-width: 20px;
    padding: 3px 4px;
    border-radius: 10px;
    background: var(--purple);
    border: 2px solid var(--maroon);
    color: #fff;
    font-size: 8px;
  }
  .spell:disabled { cursor: default; }
  .spell:disabled .gem { filter: grayscale(0.8) brightness(0.8); opacity: 0.6; }
  .spell.armed .gem { border-color: var(--gold); box-shadow: 0 0 0 3px var(--maroon), 0 0 12px var(--gold); }
  #candles {
    position: absolute;
    left: 12px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 8px;
    background: rgba(90, 30, 42, 0.25);
    border-radius: 10px;
  }
  #candles canvas { width: 20px; height: 40px; }

  /* ---- Title, results and pause ---- */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(40, 20, 50, 0.45);
  }
  .card {
    width: 100%;
    max-width: 380px;
    max-height: 100%;
    overflow-y: auto;
    background: var(--parchment);
    border: 4px solid var(--maroon);
    border-radius: 6px;
    box-shadow: 0 8px 0 rgba(58, 20, 32, 0.5);
  }
  .ribbon {
    margin: 0;
    padding: 14px 12px;
    background: var(--orange);
    border-bottom: 4px solid var(--maroon);
    color: #fff;
    font-size: 15px;
    line-height: 1.4;
    text-align: center;
    text-shadow: 2px 2px 0 var(--maroon);
    text-wrap: balance;
  }
  .card-body { padding: 16px 18px 20px; text-align: center; }
  .motto { margin: 0 0 12px; font-size: 8px; color: var(--rose); }
  .card-body p { font-size: 9px; line-height: 1.9; margin: 0 0 18px; color: var(--ink); }
  .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .chunky {
    height: 48px;
    padding: 0 20px;
    font-size: 12px;
    color: #fff;
    text-shadow: 1px 1px 0 var(--maroon);
    background: var(--tan);
    border: 3px solid var(--maroon);
    border-radius: 6px;
    box-shadow: inset 0 -5px 0 var(--tan-dark);
  }
  .chunky:active { box-shadow: inset 0 -2px 0 var(--tan-dark); transform: translateY(2px); }
  .chunky:disabled { filter: grayscale(0.7); opacity: 0.6; }

  /* ---- Shop ---- */
  .shop-panel {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--tan);
    border: 4px solid var(--maroon);
    border-radius: 6px;
    overflow: hidden;
  }
  .shop-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 4px solid var(--maroon);
    box-shadow: inset 0 -5px 0 var(--tan-dark);
  }
  .shop-top .coins {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 14px;
    text-shadow: 2px 2px 0 var(--maroon);
  }
  .shop-top .coins canvas { width: 22px; height: 22px; }
  #shop-close { height: 40px; font-size: 10px; padding: 0 12px; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 4px solid var(--maroon); }
  .tab {
    height: 44px;
    font-size: 9px;
    color: #fff;
    text-shadow: 1px 1px 0 var(--maroon);
    border: none;
    border-right: 3px solid var(--maroon);
    opacity: 0.75;
  }
  .tab:last-child { border-right: none; }
  .tab[data-tab="upgrades"] { background: #3d7fd8; }
  .tab[data-tab="rosaries"] { background: #d8405a; }
  .tab[data-tab="habits"] { background: #2eb86a; }
  .tab.current { opacity: 1; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.25); }
  #shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px;
    overflow-y: auto;
    min-height: 0;
  }
  .card-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 6px 10px;
    background: var(--tan-light);
    border: 3px solid var(--maroon);
    border-radius: 4px;
    box-shadow: inset 0 -4px 0 var(--tan-dark);
  }
  .card-item canvas { width: 44px; height: 44px; object-fit: contain; }
  .card-label { font-size: 8px; color: var(--maroon); min-height: 10px; }
  .card-item.buy { background: #c9a6d8; }
  .card-item.worn { background: #b8f0c8; }
  .card-item.picked { outline: 4px solid #fff; outline-offset: -2px; }
  .mentor {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 12px;
    border-top: 4px solid var(--maroon);
    background: var(--orange);
  }
  .mentor > canvas { width: 48px; height: 63px; flex-shrink: 0; }
  .say {
    flex: 1;
    padding: 10px;
    background: var(--parchment);
    border: 3px solid var(--maroon);
    border-radius: 4px;
  }
  .say h2 { margin: 0 0 8px; font-size: 10px; color: var(--rose); }
  .say p { margin: 0 0 8px; font-size: 8px; line-height: 1.8; color: var(--ink); }
  #shop-action { height: 40px; font-size: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="topbar">
        <div class="banner left">
          <button id="btn-pause" aria-label="Pause">II</button>
          <span id="height">0.0</span><small>cubits</small>
        </div>
        <div class="banner right">
          <span id="earned">0</span><canvas data-sprite="coin"></canvas>
        </div>
      </div>
      <div class="diamond next-box" aria-label="Next stone"><canvas id="next"></canvas></div>
      <div class="diamond prayer-box" aria-label="Prayer"><span id="prayer">0</span></div>
      <div class="prayer-label">PRAYER</div>
      <div id="spells">
        <button id="spell-repel" class="spell" aria-label="Holy water: drive off the demon"><span class="gem"><canvas data-sprite="aspergillum"></canvas></span><span class="cost">4</span></button>
        <button id="spell-zap" class="spell" aria-label="Zap: break the last stone"><span class="gem"><canvas data-sprite="bolt"></canvas></span><span class="cost">3</span></button>
        <button id="spell-mortar" class="spell" aria-label="Mortar: the stone sets fast"><span class="gem"><canvas data-sprite="mortar"></canvas></span><span class="cost">3</span></button>
        <button id="spell-scaffold" class="spell" aria-label="Scaffold: a platform level with the tower top"><span class="gem"><canvas data-sprite="scaffold"></canvas></span><span class="cost">5</span></button>
        <button id="spell-gild" class="spell" aria-label="Gild: a stone worth extra coins"><span class="gem"><canvas data-sprite="coin"></canvas></span><span class="cost">2</span></button>
      </div>
      <div id="candles" aria-label="Candles left"></div>
    </div>

    <div id="overlay" class="screen" hidden>
      <div class="card">
        <h1 class="ribbon" id="overlay-title"></h1>
        <div class="card-body">
          <p class="motto">Nisi Dominus aedificaverit domum</p>
          <p id="overlay-text"></p>
          <div class="buttons chunky-row" id="overlay-buttons"></div>
        </div>
      </div>
    </div>

    <div id="shop" class="screen" hidden>
      <div class="shop-panel">
        <div class="shop-top">
          <button id="shop-close" class="chunky" aria-label="Close the shop">&#10005; Back</button>
          <span class="coins"><span id="shop-coins">0</span><canvas data-sprite="coin"></canvas></span>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab" data-tab="upgrades" role="tab">Upgrades</button>
          <button class="tab" data-tab="rosaries" role="tab">Rosaries</button>
          <button class="tab" data-tab="habits" role="tab">Habits</button>
        </div>
        <div id="shop-grid"></div>
        <div class="mentor">
          <canvas data-sprite="novice_master" aria-hidden="true"></canvas>
          <div class="say">
            <h2 id="shop-say-title">Welcome to the shop</h2>
            <p id="shop-say"></p>
            <button id="shop-action" class="chunky" hidden></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="lib/matter.min.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
