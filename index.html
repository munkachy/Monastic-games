<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monastic Games</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; background: #12121c; color: #f3ead3; font-family: "Press Start 2P", monospace; display: flex; justify-content: center; }
  main { max-width: 480px; padding: 40px 16px; }
  h1 { font-size: 20px; color: #e0b030; line-height: 1.5; }
  p { font-size: 10px; line-height: 2; color: #c9c0a8; }
  a.game { display: block; margin: 24px 0; padding: 18px; background: #1f1f2e; border: 3px solid #e0b030; border-radius: 4px; color: #f3ead3; text-decoration: none; }
  a.game strong { display: block; font-size: 14px; color: #e0b030; margin-bottom: 10px; }
  a.game span { font-size: 10px; line-height: 1.8; }
</style>
</head>
<body>
<main>
  <h1>Monastic Games</h1>
  <p>Ora et labora et lude.</p>
  <a class="game" href="nisi-dominus/">
    <strong>Nisi Dominus</strong>
    <span>Stack the stones of the abbey to the golden line, with blessings against the imps.</span>
  </a>
</main>
</body>
</html>
