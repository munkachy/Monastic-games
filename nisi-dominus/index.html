<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nisi Dominus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12121c;
    --panel: #1f1f2e;
    --ink: #f3ead3;
    --gold: #e0b030;
    --button: #2e2e44;
    --button-down: #45456a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Press Start 2P", monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    font-size: 11px;
    background: var(--panel);
  }
  header .stat { display: flex; align-items: center; gap: 6px; }
  header .stones { color: var(--gold); }
  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  canvas#game {
    display: block;
    touch-action: none;
    image-rendering: pixelated;
  }
  #controls {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 10px 12px 12px;
    background: var(--panel);
  }
  button {
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--button);
    border: 2px solid #0008;
    border-bottom-width: 4px;
    border-radius: 6px;
    height: 56px;
    touch-action: manipulation;
    cursor: pointer;
  }
  button:active { background: var(--button-down); border-bottom-width: 2px; }
  button:disabled { opacity: 0.4; }
  #btn-pause { height: auto; font-size: 11px; padding: 6px 10px; border-bottom-width: 2px; }
  #btn-bless { position: relative; }
  #btn-bless canvas { width: 30px; height: 30px; image-rendering: pixelated; vertical-align: middle; }
  #bless-count {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 9px;
    color: var(--gold);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 8, 16, 0.6);
    padding: 16px;
  }
  #overlay[hidden] { display: none; }
  .card {
    max-width: 320px;
    background: var(--panel);
    border: 3px solid var(--gold);
    border-radius: 4px;
    padding: 20px 18px;
    text-align: center;
    box-shadow: 0 6px 0 #0008;
  }
  .card h1 { font-size: 16px; line-height: 1.5; color: var(--gold); margin: 0 0 14px; }
  .card p { font-size: 10px; line-height: 1.8; margin: 0 0 18px; }
  .card button { height: 48px; padding: 0 20px; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="level">Gradus I</span>
    <span class="stat stones">Stones <span id="stones">0</span></span>
    <button id="btn-pause" aria-label="Pause">II</button>
  </header>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay" hidden>
      <div class="card">
        <h1 id="overlay-title"></h1>
        <p id="overlay-text"></p>
        <button id="overlay-btn"></button>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="btn-left" aria-label="Move left">&#9664;</button>
    <button id="btn-rotate" aria-label="Turn">&#8635;</button>
    <button id="btn-right" aria-label="Move right">&#9654;</button>
    <button id="btn-drop" aria-label="Drop">&#9660;</button>
    <button id="btn-bless" aria-label="Bless"><canvas data-sprite="medal"></canvas><span id="bless-count">1</span></button>
  </div>
</div>
<script src="lib/matter.min.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
