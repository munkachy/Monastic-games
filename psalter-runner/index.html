sight of vengeance;\nthey shall bathe their feet in the blood of the wicked.", "“Truly,” men shall say, “the just are rewarded.\nTruly there is a God who does justice on the earth.”"]], ["Eripe me de inimicis", ["Rescue me, God, from my foes;\nprotect me from those who attack me.", "O rescue me from those who do evil\nand save me from bloodthirsty men.", "See, they lie in wait for my life;\npowerful men together against me.\nFor no offense, no sin of mine, Lord,", "for no guilt of mine they rush to take their stand.\nAwake, come to my aid and see!", "Lord of hosts, you are Israel’s God.\nRouse yourself and punish the nations;\nshow no mercy to evil traitors.", "Each evening they come back like dogs.\nThey howl and roam about the city;\nthey prowl in search of food;\nthey snarl till they have their fill.", "See how they gabble open-mouthed;\ntheir lips are filled with insults.\n“For who,” they say, “will hear us?”", "But you, Lord, will laugh them to scorn.\nYou make light of all the nations.", "O my Strength, it is you to whom I turn,\nfor you, O God, are my stronghold,", "the God who shows me love.\nO God, come to my aid\nand let me look in triumph on my foes.", "God, kill them lest my people be seduced;\nrout them by your power, lay them low.\nIt is you, O Lord, who are our shield.", "For the sins of their mouths and their lips,\nfor the curses and lies that they speak\nlet them be caught in their pride.", "Destroy them, Lord, in your anger.\nDestroy them till they are no more.\nLet the world know that you are the ruler\nover Jacob and the ends of the earth.", "Each evening they come back like dogs.\nThey howl and roam about the city;", "they prowl in search of food,\nthey snarl till they have their fill.", "As for me, I will sing of your strength\nand each morning acclaim your love\nfor you have been my stronghold,\na refuge in the day of my distress.", "O my Strength, it is you to whom I turn,\nfor you, O God, are my stronghold,\nthe God who shows me love."]], ["Deus, repulisti nos", ["O God, you have rejected us and broken us.\nYou have been angry; come back to us.", "You have made the earth quake, torn it open.\nRepair what is shattered for it sways.", "You have inflicted hardships on your people\nand made us drink a wine that dazed us.", "You have given those who fear you a signal\nto flee from the enemy’s bow.", "O come, and deliver your friends,\nhelp with your right hand and reply.", "From his holy place God has made this promise;\n“I will triumph and divide the land of Shechem,\nI will measure out the valley of Succoth.", "Gilead is mine and Manasseh,\nEphraim I take for my helmet,\nJudah for my commander’s staff.", "Moab I will use for my washbowl;\non Edom I will plant my shoe.\nOver the Philistines I will shout in triumph.”", "But who will lead me to conquer the fortress?\nWho will bring me face to face with Edom?", "Will you utterly reject us, O God,\nand no longer march with our armies?", "Give us help against the foe:\nfor the help of man is vain.", "With God we shall do bravely\nand he will trample down our foes."]], ["Exaudi, Deus", ["O God, hear my cry!\nListen to my prayer!", "From the end of the earth I call;\nmy heart is faint.\nOn a rock too high for me to reach\nset me on high,", "O you who have been my refuge,\nmy tower against the foe.", "Let me dwell in your tent for ever\nand hide in the shelter of your wings.", "For you, O God, hear my prayer,\ngrant me the heritage of those who fear you.", "May you lengthen the life of the king;\nmay his years cover many generations.", "May he ever sit enthroned before God:\nbid love and truth be his protection.", "So I will always praise your name\nand day after day fulfill my vows."]], ["Nonne Deo", ["In God alone is my soul at rest;\nmy help comes from him.", "He alone is my rock, my stronghold,\nmy fortress; I stand firm.", "How long will you all attack one man\nto break him down,\nas though he were a tottering wall,\nor a tumbling fence?", "Their plan is only to destroy;\nthey take pleasure in lies.\nWith their mouth they utter blessing\nbut in their heart they curse.", "In God alone be at rest, my soul;\nfor my hope comes from him.", "He alone is my rock, my stronghold,\nmy fortress; I stand firm.", "In God is my safety and glory,\nthe rock of my strength.", "Take refuge in God, all you people.\nTrust him at all times.\nPour out your hearts before him\nfor God is our refuge.", "Common folk are only a breath,\ngreat men an illusion.\nPlaced in the scales, they rise;\nthey weigh less than a breath.", "Do not put your trust in oppression\nnor vain hopes on plunder.\nDo not set your heart on riches\neven when they increase.", "For God has said only one thing;\nonly two do I know:\nthat to God alone belongs power", "and to you, Lord, love;\nand that you repay each man\naccording to his deeds."]], ["Deus, Deus meus", ["O God, you are my God, for you I long;\nfor you my soul is thirsting.\nMy body pines for you\nlike a dry, weary land without water.", "So I gaze on you in the sanctuary\nto see your strength and your glory.", "For your love is better than life,\nmy lips will speak your praise.", "So I will bless you all my life,\nin your name I will lift up my hands.", "My soul shall be filled as with a banquet,\nmy mouth shall praise you with joy.", "On my bed I remember you.\nOn you I muse through the night", "for you have been my help;\nin the shadow of your wings I rejoice.", "My soul clings to you;\nyour right hand holds me fast.", "Those who seek to destroy my life\nshall go down to the depths of the earth.", "They shall be put into the power of the sword\nand left as the prey of the jackals.", "But the king shall rejoice in God;\n(all that swear by him shall be blessed,)\nfor the mouth of liars shall be silenced."]], ["Exaudi, Deus", ["Hear my voice, O God, as I complain,\nguard my life from dread of the foe.", "Hide me from the band of the wicked,\nfrom the throng of those who do evil.", "They sharpen their tongues like swords;\nthey aim bitter words like arrows", "to shoot at the innocent from ambush,\nshooting suddenly and recklessly.", "They scheme their evil course;\nthey conspire to lay secret snares.\nThey say: “Who will see us?", "Who can search out our crimes?”\nHe will search who searches the mind\nand knows the depths of the heart.", "God has shot them with his arrow\nand dealt them sudden wounds.", "Their own tongue has brought them to ruin\nand all who see them mock.", "Then will all men fear;\nthey will tell what God has done.\nThey will understand God’s deeds.", "The just will rejoice in the Lord\nand fly to him for refuge.\nAll the upright hearts will glory."]], ["Te decet hymnus", ["To you our praise is due\nin Zion, O God.\nTo you we pay our vows,", "you who hear our prayer.\nTo you all flesh will come", "with its burden of sin.\nToo heavy for us, our offenses,\nbut you wipe them away.", "Blessed is he whom you choose and call\nto dwell in your courts.\nWe are filled with the blessings of your house,\nof your holy temple.", "You keep your pledge with wonders,\nO God our savior,\nthe hope of all the earth\nand of far distant isles.", "You uphold the mountains with your strength,\nyou are girded with power.", "You still the roaring of the seas,\n(the roaring of their waves,)\nand the tumult of the peoples.", "The ends of the earth stand in awe\nat the sight of your wonders.\nThe lands of sunrise and sunset\nyou fill with your joy.", "You care for the earth, give it water;\nyou fill it with riches.\nYour river in heaven brims over\nto provide its grain.\nAnd thus you provide for the earth;", "you drench its furrows;\nyou level it, soften it with showers;\nyou bless its growth.", "You crown the year with your goodness.\nAbundance flows in your steps;", "in the pastures of the wilderness it flows.\nThe hills are girded with joy,", "the meadows covered with flocks,\nthe valleys are decked with wheat.\nThey shout for joy, yes they sing."]], ["Jubilate Deo", ["Cry out with joy to God all the earth,", "O sing to the glory of his name.\nO render him glorious praise.", "Say to God: “How tremendous are your deeds!\nBecause of the greatness of your strength\nyour enemies cringe before you.", "Before you all the earth shall bow,\nshall sing to you, sing to your name!”", "Come and see the works of God,\ntremendous his deeds among men.", "He turned the sea into dry land,\nthey passed through the river dry-shod.\nLet our joy then be in him;", "he rules for ever by his might.\nHis eyes keep watch over the nations:\nlet rebels not rise against him.", "O peoples, bless our God;\nlet the voice of his praise resound,", "of the God who gave life to our souls\nand kept our feet from stumbling.", "For you, O God, have tested us,\nyou have tried us as silver is tried;", "you led us, God, into the snare;\nyou laid a heavy burden on our backs.", "You let foes ride over our heads;\nwe went through fire and through water\nbut then you brought us relief.", "Burnt offering I bring to your house;\nto you I will pay my vows,", "the vows which my lips have uttered,\nwhich my mouth spoke in my distress.", "I will offer burnt offerings of fatlings\nwith the smoke of burning rams.\nI will offer bullocks and goats.", "Come and hear, all who fear God,\nI will tell what he did for my soul:", "to him I cried aloud,\nwith high praise ready on my tongue.", "If there had been evil in my heart,\nthe Lord would not have listened.", "But truly God has listened;\nhe has heeded the voice of my prayer.", "Blessed be God who did not reject my prayer\nnor withhold his love from me."]], ["Deus misereatur", ["O God, be gracious and bless us\nand let your face shed its light upon us.", "So will your ways be known upon earth\nand all nations learn your saving help.", "Let the peoples praise you, O God;\nlet all the peoples praise you.", "Let the nations be glad and exult\nfor you rule the world with justice.\nWith fairness you rule the peoples,\nyou guide the nations on earth.", "Let the peoples praise you, O God;\nlet all the peoples praise you.", "The earth has yielded its fruit\nfor God, our God, has blessed us.", "May God still give us his blessing\ntill the ends of the earth revere him."]], ["Exsurgat Deus", ["Let God arise, let his foes be scattered.\nLet those who hate him flee before him.", "As smoke is blown away so will they be blown away;\nlike wax that melts before the fire,\nso the wicked shall perish at the presence of God.", "But the just shall rejoice at the presence of God,\nthey shall exult and dance for joy.", "O sing to the Lord, make music to his name;\nmake a highway for him who rides on the clouds.\nRejoice in the Lord, exult at his presence.", "Father of the orphan, defender of the widow,\nsuch is God in his holy place.", "God gives the lonely a home to live in;\nhe leads the prisoners forth into freedom;\nbut rebels must dwell in a parched land.", "When you went forth, O God, at the head of your people,", "when you marched across the desert, the earth trembled:\nthe heavens melted at the presence of God,\nat the presence of God, Israel’s God.", "You poured down, O God, a generous rain;\nwhen your people were starved you gave them new life.", "It was there that your people found a home,\nprepared in your goodness, O God, for the poor.", "The Lord gives the word to the bearers of good tidings:\n“The Almighty has defeated a numberless army", "and kings and armies are in flight, in flight\nwhile you were at rest among the sheepfolds.”", "At home the women already share the spoil.\nThey are covered with silver as the wings of a dove,\nits feathers brilliant with shining gold", "and jewels flashing like snow on Mount Zalmon.", "The mountains of Bashan are mighty mountains;\nhigh-ridged mountains are the mountains of Bashan.", "Why look with envy, you high-ridged mountains,\nat the mountain where God has chosen to dwell?\nIt is there that the Lord shall dwell for ever.", "The chariots of God are thousands upon thousands.\nThe Lord has come from Sinai to the holy place.", "You have gone up on high; you have taken captives,\nreceiving men and women in tribute, O God,\neven those who rebel, into your dwelling, O Lord.", "May the Lord be blessed day after day.\nHe bears our burdens, God our savior;", "this God of ours is a God who saves.\nThe Lord our God holds the keys of death.", "And God will smite the head of his foes,\nthe crown of those who persist in their sins.", "The Lord said: “I will bring them back from Bashan;\nI will bring them back from the depth of the sea.", "Then your feet will tread in their blood\nand the tongues of your dogs take their share of the foe.”", "They see your solemn procession, O God,\nthe procession of my God, of my king, to the sanctuary:", "the singers in the forefront, the musicians coming last,\nbetween them, maidens sounding their timbrels.", "“In festive gatherings, bless the Lord;\nbless God, O you who are Israel’s sons.”", "There is Benjamin, least of the tribes, at the head,\nJudah’s princes, a mighty throng,\nZebulun’s princes, Naphtali’s princes.", "Show forth, O God, show forth your might,\nyour might, O God, which you have shown for us.", "For the sake of your temple high in Jerusalem\nmay nations come to you bringing their tribute.", "Threaten the wild beast that dwells in the reeds,\nthe bands of the mighty and rulers of the peoples.\nLet them bow down offering silver.\nScatter the peoples who delight in war.", "Envoys will make their way from Egypt;\nEthiopia will stretch out her hands to God.", "Kingdoms of the earth, sing to God, praise the Lord", "who rides on the heavens, the ancient heavens.\nHe thunders his voice, his mighty voice.", "Come, acknowledge the power of God.\nHis glory is on Israel; his might is in the skies.", "God is to be feared in his holy place.\nHe is the Lord, Israel’s God.\nHe gives strength and power to his people.\nBlessed be God!"]], ["Salvum me fac", ["Save me, O God,\nfor the waters have risen to my neck.", "I have sunk into the mud of the deep\nand there is no foothold.\nI have entered the waters of the deep\nand the waves overwhelm me.", "I am wearied with all my crying,\nmy throat is parched.\nMy eyes are wasted away\nfrom looking for my God.", "More numerous than the hairs on my head\nare those who hate me without cause.\nThose who attack me with lies\nare too much for my strength.\nHow can I restore\nwhat I have never stolen?", "O God, you know my sinful folly;\nmy sins you can see.", "Let not those who hope in you be put to shame\nthrough me, Lord of hosts:\nlet not those who seek you be dismayed\nthrough me, God of Israel.", "It is for you that I suffer taunts,\nthat shame covers my face,", "that I have become a stranger to my brothers,\nan alien to my own mother’s sons.", "I burn with zeal for your house\nand taunts against you fall on me.", "When I afflict my soul with fasting\nthey make it a taunt against me.", "When I put on sackcloth and mourning\nthen they make me a byword,", "the gossip of men at the gates,\nthe subject of drunkard’s songs.", "This is my prayer to you,\nmy prayer for your favor.\nIn your great love, answer me, O God,\nwith your help that never fails;", "rescue me from sinking in the mud,\nsave me from my foes.\nSave me from the waters of the deep", "lest the waves overwhelm me.\nDo not let the deep engulf me\nnor death close its mouth on me.", "Lord, answer, for your love is kind;\nin your compassion, turn towards me.", "Do not hide your face from your servant;\nanswer me quickly for I am in distress.", "Come close to my soul and redeem me;\nransom me pressed by my foes.", "You know how they taunt and deride me;\nmy oppressors are all before you.", "Taunts have broken my heart;\nI have reached the end of my strength.\nI looked in vain for compassion, for consolers;\nnot one could I find.", "For food they gave me poison;\nin my thirst they gave me vinegar to drink.", "Let their table be a snare to them\nand their festive banquets a trap.", "Let their eyes grow dim and blind;\nlet their limbs tremble and shake.", "Pour out your anger upon them,\nlet the heat of your fury overtake them.", "Let their camp be left desolate;\nlet no one dwell in their tents:", "for they persecute one whom you struck;\nthey increase the pain of one you wounded.", "Charge them with guilt upon guilt;\nlet them never be found just in your sight.", "Blot them out from the book of the living;\ndo not enroll them among the just.", "As for me in my poverty and pain,\nlet your help, O God, lift me up.", "I will praise God’s name with a song;\nI will glorify him with thanksgiving.", "A gift pleasing God more than oxen,\nmore than beasts prepared for sacrifice.", "The poor when they see it will be glad\nand God-seeking hearts will revive;", "for the Lord listens to the needy\nand does not spurn his servants in their chains.", "Let the heavens and the earth give him praise,\nthe sea and all its living creatures.", "For God will bring help to Zion\nand rebuild the cities of Judah\nand men shall dwell there in possession.", "The sons of his servants shall inherit it;\nthose who love his name shall dwell there."]], ["Deus, in adjutorium", ["O God, make haste to my rescue,\nLord, come to my aid!", "Let there be shame and confusion\non those who seek my life.\nO let them turn back in confusion,\nwho delight in my harm,", "let them retreat, covered with shame,\nwho jeer at my lot.", "Let there be rejoicing and gladness\nfor all who seek you.\nLet them say for ever: “God is great,”\nwho love your saving help.", "As for me, wretched and poor,\ncome to me, O God.\nYou are my rescuer, my help,\nO Lord, do not delay."]], ["In te, Domine, speravi", ["In you, O Lord, I take refuge;\nlet me never be put to shame.", "In your justice rescue me, free me;\npay heed to me and save me.", "Be a rock where I can take refuge,\na mighty stronghold to save me;\nfor you are my rock, my stronghold.", "Free me from the hand of the wicked,\nfrom the grip of the unjust, of the oppressor.", "It is you, O Lord, who are my hope,\nmy trust, O Lord, from my youth.", "On you I have leaned from my birth;\nfrom my mother’s womb you have been my help.\nMy hope has always been in you.", "My fate has filled many with awe\nbut you are my strong refuge.", "My lips are filled with your praise,\nwith your glory all the day long.", "Do not reject me now that I am old;\nwhen my strength fails do not forsake me.", "For my enemies are speaking about me;\nthose who watch me take counsel together.", "Saying: “God has forsaken him; follow him,\nseize him; there is no one to save him.”", "O God, do not stay far off:\nmy God, make haste to help me!", "Let them be put to shame and destroyed,\nall those who seek my life.\nLet them be covered with shame and confusion,\nall those who seek to harm me.", "But as for me, I will always hope\nand praise you more and more.", "My lips will tell of your justice\nand day by day of your help\n(though I can never tell it all).", "Lord, I will declare your mighty deeds,\nproclaiming your justice, yours alone.", "O God, you have taught me from my youth\nand I proclaim your wonders still.", "Now that I am old and gray-headed,\ndo not forsake me, God.", "Let me tell of your strength and justice to the skies,\ntell of you who have worked such wonders.\nO God, who is like you?", "You have burdened me with bitter troubles\nbut you will give me back my life.\nYou will raise me from the depths of the earth;", "you will exalt me and console me again.", "So I will give you thanks on the lyre\nfor your faithful love, O God.\nTo you will I sing with the harp,\nto you, the Holy One of Israel.", "When I sing to you my lips shall rejoice\nand my soul, which you have redeemed.", "And all the day long my tongue\nshall tell the tale of your justice:\nfor they are put to shame and disgraced,\nall those who seek to harm me."]], ["Deus, judicium", ["O God, give your judgment to the king,\nto a king’s son your justice,", "that he may judge your people in justice\nand your poor in right judgment.", "May the mountains bring forth peace for the people\nand the hills, justice.", "May he defend the poor of the people\nand save the children of the needy\n(and crush the oppressor).", "He shall endure like the sun and the moon\nfrom age to age.", "He shall descend like rain on the meadow,\nlike raindrops on the earth.", "In his days justice shall flourish\nand peace till the moon fails.", "He shall rule from sea to sea,\nfrom the Great River to earth’s bounds.", "Before him his enemies shall fall,\nhis foes lick the dust.", "The kings of Tarshish and the seacoasts\nshall pay him tribute.\nThe kings of Sheba and Seba\nshall bring him gifts.", "Before him all kings shall fall prostrate,\nall nations shall serve him.", "For he shall save the poor when they cry\nand the needy who are helpless.", "He will have pity on the weak\nand save the lives of the poor.", "From oppression he will rescue their lives,\nto him their blood is dear.", "(Long may he live,\nmay the gold of Sheba be given him.)\nThey shall pray for him without ceasing\nand bless him all the day.", "May corn be abundant in the land\nto the peaks of the mountains.\nMay its fruit rustle like Lebanon;\nmay people flourish in the cities\nlike grass on the earth.", "May his name be blessed for ever\nand endure like the sun.\nEvery tribe shall be blessed in him,\nall nations bless his name.", "Blessed be the Lord, God of Israel,\nwho alone works wonders,", "ever blessed his glorious name.\nLet his glory fill the earth.\nAmen! Amen!"]], ["Quam bonus Israel!", ["How good God is to Israel,\nto those who are pure of heart.", "Yet my feet came close to stumbling,\nmy steps had almost slipped", "for I was filled with envy of the proud\nwhen I saw how the wicked prosper.", "For them there are no pains;\ntheir bodies are sound and sleek.", "They do not share in men’s sorrows;\nthey are not stricken like others.", "So they wear their pride like a necklace,\nthey clothe themselves with violence.", "Their hearts overflow with malice,\ntheir minds seethe with plots.", "They scoff; they speak with malice;\nfrom on high they plan oppression.", "They have set their mouths in the heavens\nand their tongues dictate to the earth.", "So the people turn to follow them\nand drink in all their words.", "They say: “How can God know?\nDoes the Most High take any notice?”", "Look at them, such are the wicked,\nbut untroubled, they grow in wealth.", "How useless to keep my heart pure\nand wash my hands in innocence,", "when I was stricken all day long,\nsuffered punishment day after day.", "Then I said: “If I should speak like that,\nI should betray the race of your sons.”", "I strove to fathom this problem,\ntoo hard for my mind to understand,", "until I pierced the mysteries of God\nand understood what becomes of the wicked.", "How slippery the paths on which you set them;\nyou make them slide to destruction.", "How suddenly they come to their ruin,\nwiped out, destroyed by terrors.", "Like a dream one wakes from, O Lord,\nwhen you wake you dismiss them as phantoms.", "And so when my heart grew embittered\nand when I was cut to the quick,", "I was stupid and did not understand,\nno better than a beast in your sight.", "Yet I was always in your presence;\nyou were holding me by my right hand.", "You will guide me by your counsel\nand so you will lead me to glory.", "What else have I in heaven but you?\nApart from you I want nothing on earth.", "My body and my heart faint for joy;\nGod is my possession for ever.", "All those who abandon you shall perish;\nyou will destroy all those who are faithless.", "To be near God is my happiness.\nI have made the Lord God my refuge.\nI will tell of your works\nat the gates of the city of Zion."]], ["Ut quid, Deus?", ["Why, O God, have you cast us off for ever?\nWhy blaze with anger at the sheep of your pasture?", "Remember your people whom you chose long ago,\nthe tribe you redeemed to be your own possession,\nthe mountain of Zion where you made your dwelling.", "Turn your steps to these places that are utterly ruined!\nThe enemy has laid waste the whole of the sanctuary.", "Your foes have made uproar in your house of prayer:\nthey have set up their emblems, their foreign emblems,", "high above the entrance to the sanctuary.", "Their axes have battered the wood of its doors.\nThey have struck together with hatchet and pickax.", "O God, they have set your sanctuary on fire;\nthey have razed and profaned the place where you dwell.", "They said in their hearts: “Let us utterly crush them;\nlet us burn every shrine of God in the land.”", "There is no sign from God, nor have we a prophet,\nwe have no one to tell us how long it will last.", "How long, O God, is the enemy to scoff?\nIs the foe to insult your name for ever?", "Why, O Lord, do you hold back your hand?\nWhy do you keep your right hand hidden?", "Yet God is our king from time past,\nthe giver of help through all the land.", "It was you who divided the sea by your might,\nwho shattered the heads of the monsters in the sea.", "It was you who crushed Leviathan’s heads\nand gave him as food to the untamed beasts.", "It was you opened springs and torrents;\nit was you who dried up ever-flowing rivers.", "Yours is the day and yours is the night.", "It was you who appointed the light and the sun;\nit was you who fixed the bounds of the earth:\nyou who made both summer and winter.", "Remember this, Lord, and see the enemy scoffing;\na senseless people insults your name.", "Do not give Israel, your dove, to the hawk\nnor forget the life of your poor ones for ever.", "Remember your covenant; every cave in the land\nis a place where violence makes its home.", "Do not let the oppressed return disappointed;\nlet the poor and the needy bless your name.", "Arise, O God, and defend your cause!\nRemember how the senseless revile you all the day.", "Do not forget the clamor of your foes,\nthe daily increasing uproar of your foes."]], ["Confitebimur tibi", ["We give thanks to you, O God,\nwe give thanks and call upon your name.\nWe recount your wonderful deeds.", "“When I reach the appointed time,\nthen I will judge with justice.", "Though the earth and all who dwell in it may rock,\nit is I who uphold its pillars.", "To the boastful I say: ‘Do not boast,’\nto the wicked: ‘Do not flaunt your strength,", "do not flaunt your strength on high.\nDo not speak with insolent pride.’ “", "For neither from the east nor the west,\nnor from desert or mountains comes judgment,", "but God himself is the judge.\nOne he humbles, another he exalts.", "The Lord holds a cup in his hand,\nfull of wine, foaming and spiced.\nHe pours it; they drink it to the dregs;\nall the wicked on the earth must drain it.", "As for me, I will rejoice for ever\nand sing psalms to Jacob’s God.", "He shall break the power of the wicked,\nwhile the strength of the just shall be exalted."]], ["Notus in Judaea", ["God, you are made known in Judah;\nin Israel your name is great.", "You set up your tent in Jerusalem\nand your dwelling place in Zion.", "It was there you broke the flashing arrows,\nthe shield, the sword, the armor.", "You, O Lord, are resplendent,\nmore majestic than the everlasting mountains.", "The warriors, despoiled, slept in death;\nthe hands of the soldiers were powerless.", "At your threat, O God of Jacob,\nhorse and rider lay stunned.", "You, you alone, strike terror.\nWho shall stand when your anger is roused?", "You uttered your sentence from the heavens;\nthe earth in terror was still", "when you arose to judge,\nto save the humble of the earth.", "Men’s anger will serve to praise you;\nits survivors surround you with joy.", "Make vows to your God and fulfill them.\nLet all pay tribute to him who strikes terror,", "who cuts short the breath of princes,\nwho strikes terror in the kings of the earth."]], ["Voce mea ad Dominum", ["I cry aloud to God,\ncry aloud to God that he may hear me.", "In the day of my distress I sought the Lord.\nMy hands were raised at night without ceasing;\nmy soul refused to be consoled.", "I remembered my God and I groaned.\nI pondered and my spirit fainted.", "You withheld sleep from my eyes.\nI was troubled, I could not speak.", "I thought of the days of long ago\nand remembered the years long past.", "At night I mused within my heart.\nI pondered and my spirit questioned.", "“Will the Lord reject us for ever?\nWill he show us his favor no more?", "Has his love vanished for ever?\nHas his promise come to an end?", "Does God forget his mercy\nor in anger withhold his compassion?”", "I said: “This is what causes my grief;\nthat the way of the Most High has changed.”", "I remember the deeds of the Lord,\nI remember your wonders of old,", "I muse on all your works\nand ponder your mighty deeds.", "Your ways, O God, are holy.\nWhat god is as great as our God?", "You are the God who works wonders.\nYou showed your power among the peoples.", "Your strong arm redeemed your people,\nthe sons of Jacob and Joseph.", "The waters saw you, O God,\nthe waters saw you and trembled;\nthe depths were moved with terror.", "The clouds poured down rain,\nthe skies sent forth their voice;\nyour arrows flashed to and fro.", "Your thunder rolled round the sky,\nyour flashes lighted up the world.\nThe earth was moved and trembled", "when your way led through the sea,\nyour path through the mighty waters\nand no one saw your footprints.", "You guided your people like a flock\nby the hand of Moses and Aaron."]], ["Attendite, popule", ["Give heed, my people, to my teaching;\nturn your ear to the words of my mouth.", "I will open my mouth in a parable\nand reveal hidden lessons of the past.", "The things we have heard and understood,\nthe things our fathers have told us,", "these we will not hide from their children\nbut will tell them to the next generation:\nthe glories of the Lord and his might\nand the marvelous deeds he has done,", "the witness he gave to Jacob,\nthe law he established in Israel.\nHe gave a command to our fathers\nto make it known to their children", "that the next generation might know it,\nthe children yet to be born.", "They too should arise and tell their sons\nthat they too should set their hope in God\nand never forget God’s deeds\nbut keep every one of his commands,", "so that they might not be like their fathers,\na defiant and rebellious race,\na race whose heart was fickle,\nwhose spirit was unfaithful to God.", "The sons of Ephraim, armed with the bow,\nturned back in the day of battle.", "They failed to keep God’s covenant\nand would not walk according to his law.", "They forgot the things he has done,\nthe marvelous deeds he had shown them.", "He did wonders in the sight of their fathers,\nin Egypt, in the plains of Zoan.", "He divided the sea and led them through\nand made the waters stand up like a wall.", "By day he led them with a cloud,\nby night, with a light of fire.", "He split the rocks in the desert.\nHe gave them plentiful drink as from the deep.", "He made streams flow out from the rock\nand made waters run down like rivers.", "Yet still they sinned against him;\nthey defied the Most High in the desert.", "In their heart they put God to the test\nby demanding the food they craved.", "They even spoke against God.\nThey said: “Is it possible for God\nto prepare a table in the desert?", "It was he who struck the rock,\nwater flowed and swept down in torrents.\nBut can he also give us bread?\nCan he provide meat for his people?”", "When he heard this the Lord was angry.\nA fire was kindled against Jacob,\nhis anger rose against Israel", "for having no faith in God;\nfor refusing to trust in his help.", "Yet he commanded the clouds above\nand opened the gates of heaven.", "He rained down manna for their food,\nand gave them bread from heaven.", "Mere men ate the bread of angels.\nHe sent them abundance of food;", "he made the east wind blow from heaven\nand roused the south wind by his might.", "He rained food on them like dust,\nwinged fowl like the sands of the sea.", "He let it fall in the midst of their camp\nand all around their tents.", "So they ate and had their fill;\nand he gave them all they craved.", "But before they had sated their craving,\nwhile the food was still in their mouths,", "God’s anger rose against them.\nHe slew the strongest among them,\nstruck down the flower of Israel.", "Despite this they went on sinning;\nthey had no faith in his wonders:", "so he ended their days like a breath\nand their years in sudden ruin.", "When he slew them then they would seek him,\nreturn and seek him in earnest.", "They would remember that God was their rock,\nGod the Most High their redeemer.", "But the words they spoke were mere flattery;\nthey lied to him with their lips.", "For their hearts were not truly with him;\nthey were not faithful to his covenant.", "Yet he who is full of compassion\nforgave them their sin and spared them.\nSo often he held back his anger\nwhen he might have stirred up his rage.", "He remembered they were only men,\na breath that passes never to return.", "How often they defied him in the wilderness\nand caused him pain in the desert!", "Yet again they put God to the test\nand grieved the Holy One of Israel.", "They did not remember his deeds\nnor the day he saved them from the foe;", "when he worked his miracles in Egypt,\nhis wonders in the plains of Zoan;", "when he turned their rivers into blood,\nmade their streams impossible to drink.", "He sent dog-flies against them to devour them\nand swarms of frogs to molest them.", "He gave their crops to the grub,\nthe fruit of their labor to the locust.", "He destroyed their vines with hail,\ntheir sycamore trees with frost.", "He gave up their cattle to plague,\ntheir flocks and herds to pestilence.", "He turned on them the heat of his anger,\nfury, rage and havoc,\na troop of destroying angels.", "He gave free course to his anger.\nHe did not spare them from death\nbut gave their lives to the plague.", "He struck all the first-born in Egypt,\nthe finest flower in the dwellings of Ham.", "Then he brought forth his people like sheep;\nhe guided them safely in the desert.", "He led them safely with nothing to fear,\nwhile the sea engulfed their foes.", "So he brought them to his holy land,\nto the mountain which his right hand had won.", "He drove out the nations before them,\nand divided the land for their heritage.\nTheir tents he gave as a dwelling\nto each one of Israel’s tribes.", "Still they put God to the proof and defied him;\nthey refused to obey the Most High.", "They strayed, faithless like their fathers,\nlike a bow on which the archer cannot count.", "With their mountain shrines they angered him;\nmade him jealous with the idols they served.", "God saw this and was filled with fury:\nhe utterly rejected Israel.", "He forsook his dwelling place in Shiloh,\nthe tent where he lived among men.", "He gave his ark into captivity,\nhis glorious ark into the hands of the foe.", "He gave up his people to the sword,\nin his anger against his chosen ones.", "So war devoured their young men,\ntheir maidens had no wedding songs;", "their priests fell by the sword,\nand their widows made no lament.", "Then the Lord awoke as if from sleep,\nlike a warrior overcome with wine.", "He struck his foes from behind\nand put them to everlasting shame.", "He rejected the tent of Joseph;\nHe did not choose the tribe of Ephraim", "but he chose the tribe of Judah,\nthe hill of Zion which he loves.", "He built his shrine like the heavens,\nor like the earth which he made firm for ever.", "And he chose David his servant\nand took him away from the sheepfolds.", "From the care of the ewes he called him\nto be shepherd of Jacob his people,\nof Israel his own possession.", "He tended them with blameless heart,\nwith discerning mind he led them."]], ["Deus, venerunt", ["O God, the nations have invaded your land,\nthey have profaned your holy temple.\nThey have made Jerusalem a heap of ruins.", "They have handed over the bodies of your servants\nas food to feed the birds of heaven\nand the flesh of your faithful to the beasts of the earth.", "They have poured out blood like water in Jerusalem;\nno one is left to bury the dead.", "We have become the taunt of our neighbors,\nthe mockery and scorn of those who surround us.", "How long, O Lord? Will you be angry for ever;\nhow long will your anger burn like fire?", "Pour out your rage on the nations,\nthe nations that do not know you.\nPour out your rage on the kingdoms\nthat do not call on your name,", "for they have devoured Jacob\nand laid waste the land where they dwell.", "Do not hold the guilt of our father against us.\nLet your compassion hasten to meet us;\nwe are left in the depths of distress.", "O God our savior, come to our help.\nCome for the sake of the glory of your name.\nO Lord our God, forgive us our sins;\nrescue us for the sake of your name.", "Why should the nations say: “Where is their God?”\nLet us see the nations around us repaid\nwith vengeance for the blood of your servants that was shed!", "Let the groans of the prisoners come before you;\nlet your strong arm reprieve those condemned to die.", "Pay back to our neighbors seven times over\nthe taunts with which they taunted you, O Lord.", "But we, your people, the flock of your pasture,\nwill give you thanks for ever and ever.\nWe will tell your praise from age to age."]], ["Qui regis Israel", ["O shepherd of Israel, hear us,\nyou who lead Joseph’s flock,\nshine forth from your cherubim throne", "upon Ephraim, Benjamin, Manasseh.\nO Lord, rouse up your might,\nO Lord, come to our help.", "God of hosts bring us back;\nlet your face shine on us and we shall be saved.", "Lord God of hosts, how long\nwill you frown on your people’s plea?", "You have fed them with tears for their bread,\nand abundance of tears for their drink.", "You have made us the taunt of our neighbors,\nour enemies laugh us to scorn.", "God of hosts, bring us back;\nlet your face shine on us and we shall be saved.", "You brought a vine out of Egypt;\nto plant it you drove out the nations.", "Before it you cleared the ground;\nit took root and spread through the land.", "The mountains were covered with its shadow,\nthe cedars of God with its boughs.", "It stretched out its branches to the sea,\nto the Great River it stretched out its shoots.", "Then why have you broken down its walls?\nIt is plucked by all who pass by.", "It is ravaged by the boar of the forest,\ndevoured by the beasts of the field.", "God of hosts, turn again, we implore,\nlook down from heaven and see.", "Visit the vine and protect it,\nthe vine your right hand has planted.", "They have burnt it with fire and destroyed it.\nMay they perish at the frown of your face.", "May your hand be on the man you have chosen,\nthe man you have given your strength.", "And we shall never forsake you again;\ngive us life that we may call upon your name.", "God of hosts, bring us back;\nlet your face shine on us and we shall be saved."]], ["Exsultate Deo", ["Ring out your joy to God our strength,\nshout in triumph to the God of Jacob.", "Raise a song and sound the timbrel,\nthe sweet-sounding harp and the lute;", "blow the trumpet at the new moon,\nwhen the moon is full, on our feast.", "For this is Israel’s law,\na command of the God of Jacob.", "He imposed it as a rule on Joseph,\nwhen he went out against the land of Egypt.\nA voice I did not know said to me:", "“I freed your shoulder from the burden;\nyour hands were freed from the load.", "You called in distress and I saved you.\nI answered, concealed in the storm cloud;\nat the waters of Meribah I tested you.", "Listen, my people, to my warning.\nO Israel, if only you would heed!", "Let there be no foreign god among you,\nno worship of an alien god.", "I am the Lord your God,\nwho brought you from the land of Egypt.\nOpen wide your mouth and I will fill it.", "But my people did not heed my voice\nand Israel would not obey,", "so I left them in their stubbornness of heart\nto follow their own designs.", "O that my people would heed me,\nthat Israel would walk in my ways!", "At once I would subdue their foes,\nturn my hand against their enemies.", "The Lord’s enemies would cringe at their feet\nand their subjection would last for ever.\nBut Israel I would feed with finest wheat\nand fill them with honey from the rock.”"]], ["Deus stetit", ["God stands in the divine assembly.\nIn the midst of the gods he gives judgment.", "“How long will you judge unjustly\nand favor the cause of the wicked?", "Do justice for the weak and the orphan,\ndefend the afflicted and the needy.", "Rescue the weak and the poor;\nset them free from the hand of the wicked.", "Unperceiving, they grope in the darkness\nand the order of the world is shaken.", "I have said to you: ‘You are gods\nand all of you, sons of the Most High.’", "And yet, you shall die like men,\nyou shall fall like any earthly princes.”", "Arise, O God, judge the earth,\nfor you rule all the nations."]], ["Deus, quis similis?", ["O God, do not keep silent,\ndo not be dumb and unmoved, O God,", "for your enemies raise a tumult.\nThose who hate you lift up their heads.", "They plot against your people,\nconspire against those you love.", "They say: “Come, let us destroy them as a nation;\nlet the name of Israel be forgotten.”", "They conspire with a single mind,\nthey make common alliance against you,", "the camps of Edom and of Ishmael,\nthe camps of Moab and Hagar,", "the land of Ammon and Amalek,\nPhilistia, with the people of Tyre.", "Assyria, too, is their ally\nand joins hands with the sons of Lot.", "Treat them like Midian, like Sisera,\nlike Jabin at the River Kishon,", "the men who were destroyed at Endor,\nwhose bodies rotted on the ground.", "Make their captains like Oreb and Zeeb,\nall their princes like Zebah and Zalmunna,", "the men who said: “Let us take\nthe fields of God for ourselves.”", "My God, scatter them like chaff,\ndrive them like straw in the wind!", "As fire that burns away the forest,\nas flame that sets the mountains ablaze,", "drive them away with your tempest\nand fill them with terror at your storm.", "Cover their faces with shame,\ntill they seek your name, O Lord.", "Shame and terror be theirs for ever;\nlet them be disgraced, let them perish!", "Let them know that your name is the Lord,\nthe Most High over all the earth."]], ["Quam dilecta!", ["How lovely is your dwelling place,\nLord, God of hosts.", "My soul is longing and yearning,\nis yearning for the courts of the Lord.\nMy heart and my soul ring out their joy\nto God, the living God.", "The sparrow herself finds a home\nand the swallow a nest for her brood;\nshe lays her young by your altars,\nLord of hosts, my king and my God.", "They are happy, who dwell in your house,\nfor ever singing your praise.", "They are happy, whose strength is in you,\nin whose hearts are the roads to Zion.", "As they go through the Bitter Valley\nthey make it a place of springs\n(the autumn rain covers it with blessings).", "They walk with ever growing strength,\nthey will see the God of gods in Zion.", "O Lord God of hosts, hear my prayer,\ngive ear, O God of Jacob.", "Turn your eyes, O God, our shield,\nlook on the face of your anointed.", "One day within your courts\nis better than a thousand elsewhere.\nThe threshold of the house of God\nI prefer to the dwellings of the wicked.", "For the Lord God is a rampart, a shield;\nhe will give us his favor and glory.\nThe Lord will not refuse any good\nto those who walk without blame.", "Lord, God of hosts,\nhappy the man who trusts in you!"]], ["Benedixisti, Domine", ["O Lord, you once favored your land\nand revived the fortunes of Jacob,", "you forgave the guilt of your people\nand covered all their sins.", "You averted all your rage,\nyou calmed the heat of your anger.", "Revive us now, God, our helper!\nPut an end to your grievance against us.", "Will you be angry with us for ever,\nwill your anger never cease?", "Will you not restore again our life\nthat your people may rejoice in you?", "Let us see, O Lord, your mercy\nand give us your saving help.", "I will hear what the Lord God has to say,\na voice that speaks of peace,\npeace for his people and his friends\nand those who turn to him in their hearts.", "His help is near for those who fear him\nand his glory will dwell in our land.", "Mercy and faithfulness have met;\njustice and peace have embraced.", "Faithfulness shall spring from the earth\nand justice look down from heaven.", "The Lord will make us prosper\nand our earth shall yield its fruit.", "Justice shall march before him\nand peace shall follow his steps."]], ["Inclina, Domine", ["Turn your ear, O Lord, and give answer\nfor I am poor and needy.", "Preserve my life, for I am faithful;\nsave the servant who trusts in you.", "You are my God, have mercy on me, Lord,\nfor I cry to you all the day long.", "Give joy to your servant, O Lord,\nfor to you I lift up my soul.", "O Lord, you are good and forgiving,\nfull of love to all who call.", "Give heed, O Lord, to my prayer\nand attend to the sound of my voice.", "In the day of distress I will call\nand surely you will reply.", "Among the gods there is none like you, O Lord;\nnor work to compare with yours.", "All the nations shall come to adore you\nand glorify your name, O Lord:", "for you are great and do marvelous deeds,\nyou who alone are God.", "Show me, Lord, your way\nso that I may walk in your truth.\nGuide my heart to fear your name.", "I will praise you, Lord my God, with all my heart\nand glorify your name for ever;", "for your love to me has been great:\nyou have saved me from the depths of the grave.", "The proud have risen against me;\nruthless men seek my life;\nto you they pay no heed.", "But you, God of mercy and compassion,\nslow to anger, O Lord,\nabounding in love and truth,", "turn and take pity on me.\nO give your strength to your servant\nand save your handmaid’s child.", "Show me the sign of your favor\nthat my foes may see to their shame\nthat you console me and give me your help."]], ["Fundamenta ejus", ["On the holy mountain is his city\ncherished by the Lord.", "The Lord prefers the gates of Zion\nto all Jacob’s dwellings.", "Of you are told glorious things,\nO city of God!", "Babylon and Egypt I will count\namong those who know me;\nPhilistia, Tyre, Ethiopia,\nthese will be her children", "and Zion shall be called “Mother”\nfor all shall be her children.\nIt is he, the Lord Most High,\nwho gives each his place.", "In his register of peoples he writes:\n“These are her children,”", "and while they dance they will sing:\n“In you all find their home.”"]], ["Domine, Deus", ["Lord my God, I call for help by day;\nI cry at night before you.", "Let my prayer come into your presence.\nO turn your ear to my cry.", "For my soul is filled with evils;\nmy life is on the brink of the grave.", "I am reckoned as one in the tomb;\nI have reached the end of my strength,", "Like one alone among the dead,\nlike the slain lying in their graves,\nlike those you remember no more,\ncut off, as they are, from your hand.", "You have laid me in the depths of the tomb,\nin places that are dark, in the depths.", "Your anger weighs down upon me;\nI am drowned beneath your waves.", "You have taken away my friends\nand made me hateful in their sight.\nImprisoned, I cannot escape;", "my eyes are sunken with grief.\nI call to you, Lord, all the day long;\nto your I stretch out my hands.", "Will you work your wonders for the dead?\nWill the shades stand and praise you?", "Will your love be told in the grave\nor your faithfulness among the dead?", "Will your wonders be known in the dark\nor your justice in the land of oblivion?", "As for me, Lord, I call to you for help;\nin the morning my prayer comes before you.", "Lord, why do you reject me?\nWhy do you hide your face?", "Wretched, close to death from my youth,\nI have borne your trials; I am numb.", "Your fury has swept down upon me;\nyour terrors have utterly destroyed me.", "They surround me all the day like a flood,\nthey assail me all together.", "Friend and neighbor you have taken away:\nmy one companion is darkness."]], ["Misericordias Domini", ["I will sing for ever of your love, O Lord;\nthrough all ages my mouth will proclaim your truth.", "Of this I am sure, that your love lasts for ever,\nthat your truth is firmly established as the heavens.", "“With my chosen one I have made a covenant;\nI have sworn to David my servant:", "I will establish your dynasty for ever\nand set up your throne through all ages.”", "The heavens proclaim your wonders, O Lord;\nthe assembly of your holy ones proclaims your truth.", "For who in the skies can compare with the Lord\nor who is like the Lord among the sons of God?", "A God to be feared in the council of the holy ones,\ngreat and dreadful to all around him.", "O Lord God of hosts, who is your equal?\nYou are mighty, O Lord, and truth is your garment.", "It is you who rule the sea in its pride;\nit is you who still the surging of its waves.", "It is you who trod Rahab underfoot like a corpse,\nscattering your foes with your mighty arm.", "The heavens are yours, the world is yours.\nIt is you who founded the earth and all it holds;", "it is you who created the North and the South.\nTabor and Hermon shout for joy at your name.", "Yours is a mighty arm, O Lord;\nyour hand is strong, your right hand ready.", "Justice and right are the pillars of your throne,\nlove and truth walk in your presence.", "Happy the people who acclaim such a king,\nwho walk, O Lord, in the light of your face,", "who find their joy every day in your name,\nwho make your justice the source of their bliss.", "For you, O Lord, are the glory of their strength;\nby your favor it is that our might is exalted;", "for our ruler is in the keeping of the Lord;\nour king in the keeping of the Holy One of Israel.", "Of old you spoke in a vision.\nTo your friends the prophets you said:\n“I have set the crown on a warrior,\nI have exalted one chosen from the people.", "I have found David my servant\nand with my holy oil anointed him.", "My hand shall always be with him\nand my arm shall make him strong.", "The enemy shall never outwit him\nnor the evil ones oppress him.", "I will beat down his foes before him\nand smite those who hate him.", "My truth and my love shall be with him;\nby my name his might shall be exalted.", "I will stretch out his hand to the Sea\nand his right hand as far as the River.", "He will say to me: ‘You are my father,\nmy God, the rock who saves me.’", "And I will make him my first-born,\nthe highest of the kings of the earth.", "I will keep my love for him always;\nwith him my covenant shall last.", "I will establish his dynasty for ever,\nmake his throne endure as the heavens.", "If his sons forsake my law\nand refuse to walk as I decree", "and if ever they violate my statutes,\nrefusing to keep my commands;", "then I will punish their offenses with the rod,\nthen I will scourge them on account of their guilt.", "But I will never take back my love,\nmy truth will never fail.", "I will never violate my covenant\nnor go back on the word I have spoken.", "Once for all, I have sworn by my holiness.\n‘I will never lie to David.", "His dynasty shall last for ever.\nIn my sight his throne is like the sun;", "like the moon, it shall endure for ever,\na faithful witness in the skies.’ “", "And yet you have spurned, rejected,\nyou are angry with the one you have anointed.", "You have broken your covenant with your servant\nand dishonored his crown in the dust.", "You have broken down all his walls\nand reduced his fortresses to ruins.", "He is despoiled by all who pass by;\nhe has become the taunt of his neighbors.", "You have exalted the right hand of his foes;\nyou have made all his enemies rejoice.", "You have made his sword give way,\nyou have not upheld him in battle.", "You have brought his glory to an end;\nyou have hurled his throne to the ground.", "You have cut short the years of his youth;\nyou have heaped disgrace upon him.", "How long, O Lord? Will you hide yourself for ever?\nHow long will your anger burn like a fire?", "Remember, Lord, the shortness of my life\nand how frail you have made the sons of men.", "What man can live and never see death?\nWho can save himself from the grasp of the grave?", "Where are the mercies of the past, O Lord,\nwhich you have sworn in your faithfulness to David?", "Remember, Lord, how your servant is taunted,\nhow I have to bear all the insults of the peoples.", "Thus your enemies taunt me, O Lord,\nmocking your anointed at every step.", "Blessed be the Lord for ever.\nAmen, amen!"]], ["Domine, refugium", ["O Lord, you have been our refuge\nfrom one generation to the next.", "Before the mountains were born\nor the earth or the world brought forth,\nyou are God, without beginning or end.", "You turn men back to dust\nand say: “Go back, sons of men.”", "To your eyes a thousand years\nare like yesterday, come and gone,\nno more than a watch in the night.", "You sweep men away like a dream,\nlike the grass which springs up in the morning.", "In the morning it springs up and flowers:\nby evening it withers and fades.", "So we are destroyed in your anger,\nstruck with terror in your fury.", "Our guilt lies open before you;\nour secrets in the light of your face.", "All our days pass away in your anger.\nOur life is over like a sigh.", "Our span is seventy years,\nor eighty for those who are strong.\nAnd most of these are emptiness and pain.\nThey pass swiftly and we are gone.", "Who understands the power of your anger\nand fears the strength of your fury?", "Make us know the shortness of our life\nthat we may gain wisdom of heart.", "Lord, relent! Is your anger for ever?\nShow pity to your servants.", "In the morning, fill us with your love;\nwe shall exult and rejoice all our days.", "Give us joy to balance our affliction\nfor the years when we knew misfortune.", "Show forth your work to your servants;\nlet your glory shine on their children.", "Let the favor of the Lord be upon us:\ngive success to the work of our hands.\n(give success to the work of our hands)."]], ["Qui habitat", ["He who dwells in the shelter of the Most High\nand abides in the shade of the Almighty", "says to the Lord: “My refuge,\nmy stronghold, my God in whom I trust!”", "It is he who will free you from the snare\nof the fowler who seeks to destroy you;", "he will conceal you with his pinions\nand under his wings you will find refuge.", "You will not fear the terror of the night\nnor the arrow that flies by day,", "nor the plague that prowls in the darkness\nnor the scourge that lays waste at noon.", "A thousand may fall at your side,\nten thousand fall at your right,\nyou, it will never approach;\nhis faithfulness is buckler and shield.", "Your eyes have only to look\nto see how the wicked are repaid,", "you who have said: “Lord, my refuge!”\nand have made the Most High your dwelling.", "Upon you no evil shall fall,\nno plague approach where you dwell.", "For you has he commanded his angels,\nto keep you in all your ways.", "They shall bear you upon their hands\nlest you strike your foot against a stone.", "On the lion and the viper you will tread\nand trample the young lion and the dragon.", "Since he clings to me in love, I will free him;\nprotect him for he knows my name.", "When he calls I shall answer: “I am with you,”\nI will save him in distress and give him glory.", "With length of days I will content him;\nI shall let him see my saving power."]], ["Bonum est confiteri", ["It is good to give thanks to the Lord,\nto make music to your name, O Most High,", "to proclaim your love in the morning\nand your truth in the watches of the night,", "on the ten-stringed lyre and the lute,\nwith the murmuring sound of the harp.", "Your deeds, O Lord, have made me glad;\nfor the work of your hands I shout with joy.", "O Lord, how great are your works!\nHow deep are your designs!", "The foolish man cannot know this\nand the fool cannot understand.", "Though the wicked spring up like grass\nand all who do evil thrive,\nthey are doomed to be eternally destroyed.", "But you, Lord, are eternally on high.", "See how your enemies perish;\nall doers of evil are scattered.", "To me you give the wild ox’s strength;\nyou anoint me with the purest oil.", "My eyes looked in triumph on my foes;\nmy ears heard gladly of their fall.", "The just will flourish like the palm tree\nand grow like a Lebanon cedar.", "Planted in the house of the Lord\nthey will flourish in the courts of our God,", "still bearing fruit when they are old,\nstill full of sap, still green,", "to proclaim that the Lord is just.\nIn him, my rock, there is no wrong."]], ["Dominus regnavit", ["The Lord is king, with majesty enrobed;\nthe Lord has robed himself with might,\nhe has girded himself with power.\nThe world you made firm, not to be moved;", "your throne has stood firm from of old.\nFrom all eternity, O Lord, you are.", "The waters have lifted up, O Lord,\nthe waters have lifted up their voice,\nthe waters have lifted up their thunder.", "Greater than the roar of mighty waters\nmore glorious than the surgings of the sea,\nthe Lord is glorious on high.", "Truly your decrees are to be trusted.\nHoliness is fitting to your house,\nO Lord, until the end of time."]], ["Deus ultionum", ["O Lord, avenging God,\navenging God, appear!", "Judge of the earth, arise,\ngive the proud what they deserve!", "How long, O Lord, shall the wicked,\nhow long shall the wicked triumph?", "They bluster with arrogant speech;\nthe evil-doers boast to each other.", "They crush your people, Lord,\nthey afflict the ones you have chosen", "They kill the widow and the stranger\nand murder the fatherless child.", "And they say: “The Lord does not see;\nthe God of Jacob pays no heed.”", "Mark this, most senseless of people;\nfools, when will you understand?", "Can he who made the ear, not hear?\nCan he who formed the eye, not see?", "Will he who trains nations not punish?\nWill he who instructs us not have knowledge?", "(The Lord knows the thoughts of men.\nHe knows they are no more than a breath.)", "Happy the man whom you teach, O Lord,\nwhom you train by means of your law;", "to him you give peace in evil days\nwhile the pit is being dug for the wicked.", "The Lord will not abandon his people\nnor forsake those who are his own;", "for judgment shall again be just\nand all true hearts shall uphold it.", "Who will stand up for me against the wicked?\nWho will defend me from those who do evil?", "If the Lord were not to help me,\nI would soon go down into the silence.", "When I think: “I have lost my foothold”;\nyour mercy, Lord, holds me up.", "When cares increase in my heart\nyour consolation calms my soul.", "Can judges who do evil be your friends?\nThey do injustice under cover of law;", "they attack the life of the just\nand condemn innocent blood.", "As for me, the Lord will be a stronghold;\nmy God will be the rock where I take refuge.", "He will repay them for their evil wickedness,\ndestroy them for their evil deeds.\nThe Lord, our God, will destroy them."]], ["Venite, exultemus", ["Come, ring out our joy to the Lord;\nhail the rock who saves us.", "Let us come before him, giving thanks,\nwith songs let us hail the Lord.", "A mighty God is the Lord,\na great king above all gods.", "In his hands are the depths of the earth;\nthe heights of the mountains are his.", "To him belongs the sea, for he made it\nand the dry land shaped by his hands.", "Come in; let us bow and bend low;\nlet us kneel before the God who made us", "for he is our God and we\nthe people who belong to his pasture,\nthe flock that is led by his hand.\nO that today you would listen to his voice!", "“Harden not your hearts as at Meribah,\nas on that day at Massah in the desert", "when your fathers put me to the test;\nwhen they tried me, though they saw my work.", "For forty years I was wearied of these people\nand I said: ‘Their hearts are astray,\nthese people do not know my ways.", "Then I took an oath in my anger:\n‘Never shall they enter my rest.’”"]], ["Cantate Domino", ["O sing a new song to the Lord,\nsing to the Lord all the earth.", "O sing to the Lord, bless his name.\nProclaim his help day by day,", "tell among the nations his glory\nand his wonders among all the peoples.", "The Lord is great and worthy of praise,\nto be feared above all gods;", "the gods of the heathens are naught.\nIt was the Lord who made the heavens,", "his are majesty and state and power\nand splendor in his holy place.", "Give the Lord, you families of peoples,\ngive the Lord glory and power;", "give the Lord the glory of his name.\nBring an offering and enter his courts,", "worship the Lord in his temple.\nO earth, tremble before him.", "Proclaim to the nations: “God is king.”\nThe world he made firm in its place;\nhe will judge the people in fairness.", "Let the heavens rejoice and earth be glad,\nlet the sea and all within it thunder praise,", "let the land and all it bears rejoice,\nall the trees of the wood shout for joy", "at the presence of the Lord for he comes,\nhe comes to rule the earth.\nWith justice he will rule the world,\nhe will judge the peoples with his truth."]], ["Dominus regnavit", ["The Lord is king, let earth rejoice,\nlet all the coastlands be glad.", "Cloud and darkness are his raiment;\nhis throne, justice and right.", "A fire prepares his path;\nit burns up his foes on every side.", "His lightnings light up the world,\nthe earth trembles at the sight.", "The mountains melt like wax\nbefore the Lord of all the earth.", "The skies proclaim his justice;\nall peoples see his glory.", "Let those who serve idols be ashamed,\nthose who boast of their worthless gods.\nAll you spirits, worship him.", "Zion hears and is glad;\nthe people of Judah rejoice\nbecause of your judgments, O Lord.", "For you indeed are the Lord\nmost high above all the earth,\nexalted far above all spirits.", "The Lord loves those who hate evil;\nhe guards the souls of his saints;\nhe sets them free from the wicked.", "Light shines forth for the just\nand joy for the upright of heart.", "Rejoice, you just, in the Lord;\ngive glory to his holy name."]], ["Cantate Domino", ["Sing a new song to the Lord\nfor he has worked wonders.\nHis right hand and his holy arm\nhave brought salvation.", "The Lord has made known his salvation;\nhas shown his justice to the nations.", "He has remembered his truth and love\nfor the house of Israel.\nAll the ends of the earth have seen\nthe salvation of our God.", "Shout to the Lord, all the earth,\nring out your joy.", "Sing psalms to the Lord with the harp\nwith the sound of music.", "With trumpets and the sound of the horn\nacclaim the King, the Lord.", "Let the sea and all within it, thunder;\nthe world, and all its peoples.", "Let the rivers clap their hands\nand the hills ring out their joy", "at the presence of the Lord: for he comes,\nhe comes to rule the earth.\nHe will rule the world with justice\nand the peoples with fairness."]], ["Dominus regnavit", ["The Lord is king; the peoples tremble.\nHe is throned on the cherubim; the earth quakes.", "The Lord is great in Zion.\nHe is supreme over all the peoples.", "Let them praise his name, so terrible and great,", "he is holy, full of power.\nYou are a king who loves what is right;\nyou have established equity, justice and right;\nyou have established them in Jacob.", "Exalt the Lord our God;\nbow down before Zion, his footstool.\nHe the Lord is holy.", "Among his priests were Aaron and Moses,\namong those who invoked his name was Samuel.\nThey invoked the Lord and he answered.", "To them he spoke in the pillar of cloud.\nThey did his will; they kept the law,\nwhich he, the Lord, had given.", "O Lord our God, you answered them.\nFor them you were a God who forgives;\nyet you punished their offenses.", "Exalt the Lord our God;\nbow down before his holy mountain\nfor the Lord our God is holy."]], ["Jubilate Deo", ["Cry out with joy to the Lord, all the earth.", "Serve the Lord with gladness.\nCome before him, singing for joy.", "Know that he, the Lord, is God.\nHe made us, we belong to him,\nwe are his people, the sheep of his flock.", "Go within his gates, giving thanks.\nEnter his courts with songs of praise.\nGive thanks to him and bless his name.", "Indeed, how good is the Lord,\neternal his merciful love.\nHe is faithful from age to age."]], ["Misericordiam et judicium", ["My song is of mercy and justice;\nI sing to you, O Lord.", "I will walk in the way of perfection.\nO when, Lord, will you come?\nI will walk with blameless heart\nwithin my house;", "I will not set before my eyes\nwhatever is base.\nI will hate the ways of the crooked;\nthey shall not be my friends.", "The false-hearted must keep far away;\nthe wicked I disown.", "The man who slanders his neighbor in secret\nI will bring to silence.\nThe man of proud looks and haughty heart\nI will never endure.", "I look to the faithful in the land\nthat they may dwell with me.\nHe who walks in the way of perfection\nshall be my friend.", "No man who practices deceit\nshall live within my house.\nNo man who utters lies shall stand\nbefore my eyes.", "Morning by morning I will silence\nall the wicked in the land,\nuprooting from the city of the Lord\nall who do evil."]], ["Domine, exaudi", ["O Lord, listen to my prayer\nand let my cry for help reach you.", "Do not hide your face from me\nin the day of my distress.\nTurn your ear towards me\nand answer me quickly when I call.", "For my days are vanishing like smoke,\nmy bones burn away like a fire.", "My heart is withered like the grass.\nI forget to eat my bread.", "I cry with all my strength\nand my skin clings to my bones.", "I have become like a pelican in the wilderness\nlike an owl in desolate places.", "I lie awake and I moan\nlike some lonely bird on a roof.", "All day long my foes revile me;\nthose who hate me use my name as a curse.", "The bread I eat is ashes;\nmy drink is mingled with tears.", "In your anger, Lord, and your fury\nyou have lifted me up and thrown me down.", "My days are like a passing shadow\nand I wither away like the grass.", "But you, O Lord, will endure for ever\nand your name from age to age.", "You will arise and have mercy on Zion:\nfor this is the time to have mercy,\n(yes, the time appointed has come)", "for your servants love her very stones,\nare moved with pity even for her dust.", "The nations shall fear the name of the Lord\nand all the earth’s kings your glory,", "when the Lord shall build up Zion again\nand appear in all his glory.", "Then he will turn to the prayers of the helpless;\nhe will not despise their prayers.", "Let this be written for ages to come\nthat a people yet unborn may praise the Lord;", "for the Lord leaned down from his sanctuary on high.\nHe looked down from heaven to the earth", "that he might hear the groans of the prisoners\nand free those condemned to die.", "The sons of your servants shall dwell untroubled\nand their race shall endure before you", "that the name of the Lord may be proclaimed in Zion\nand his praise in the heart of Jerusalem,", "when peoples and kingdoms are gathered together\nto pay their homage to the Lord.", "He has broken my strength in mid-course;\nhe has shortened the days of my life.", "I say to God: “Do not take me away\nbefore my days are complete,\nyou, whose days last from age to age.", "Long ago you founded the earth\nand the heavens are the work of your hands.", "They will perish but you will remain.\nThey will all wear out like a garment.\nYou will change them like clothes that are changed.", "But you neither change, nor have an end.”"]], ["Benedic, anima mea", ["My soul, give thanks to the Lord\nall my being, bless his holy name.", "My soul, give thanks to the Lord\nand never forget all his blessings.", "It is he who forgives all your guilt,\nwho heals every one of your ills,", "who redeems your life from the grave,\nwho crowns you with love and compassion,", "who fills your life with good things,\nrenewing your youth like an eagle’s.", "The Lord does deeds of justice,\ngives judgment for all who are oppressed.", "He made known his ways to Moses\nand his deeds to Israel’s sons.", "The Lord is compassion and love,\nslow to anger and rich in mercy.", "His wrath will come to an end;\nhe will not be angry for ever.", "He does not treat us according to our sins\nnor repay us according to our faults.", "For as the heavens are high above the earth\nso strong is his love for those who fear him.", "As far as the east is from the west\nso far does he remove our sins.", "As a father has compassion on his sons,\nthe Lord has pity on those who fear him;", "for he knows of what we are made,\nhe remembers that we are dust.", "As for man, his days are like grass;\nhe flowers like the flower of the field;", "the wind blows and he is gone\nand his place never sees him again.", "But the love of the Lord is everlasting\nupon those who hold him in fear;\nhis justice reaches out to children’s children", "when they keep his covenant in truth,\nwhen they keep his will in their mind.", "The Lord has set his sway in heaven\nand his kingdom is ruling over all.", "Give thanks to the Lord, all his angels,\nmighty in power, fulfilling his word,\nwho heed the voice of his word.", "Give thanks to the Lord, all his hosts,\nhis servants who do his will.", "Give thanks to the Lord, all his works,\nin every place where he rules.\nMy soul, give thanks to the Lord!"]], ["Benedic, anima mea", ["Bless the Lord, my soul!\nLord God, how great you are,\nclothed in majesty and glory,", "wrapped in light as in a robe!\nYou stretch out the heavens like a tent.", "Above the rains you build your dwelling.\nYou make the clouds your chariot,\nyou walk on the wings of the wind,", "you make the winds your messengers\nand flashing fire your servants.", "You founded the earth on its base,\nto stand firm from age to age.", "You wrapped it with the ocean like a cloak:\nthe waters stood higher than the mountains.", "At your threat they took to flight;\nat the voice of your thunder they fled.", "They rose over the mountains and flowed down\nto the place which you had appointed.", "You set limits they might not pass\nlest they return to cover the earth.", "You make springs gush forth in the valleys;\nthey flow in between the hills.", "They give drink to all the beasts of the field;\nthe wild asses quench their thirst.", "On their banks dwell the birds of heaven;\nfrom the branches they sing their song.", "From your dwelling you water the hills;\nearth drinks its fill of your gift.", "You make the grass grow for the cattle\nand the plants to serve man’s needs,\nthat he may bring forth bread from the earth", "and wine to cheer man’s heart;\noil, to make his face shine\nand bread to strengthen man’s heart.", "The trees of the Lord drink their fill,\nthe cedars he planted on Lebanon;", "there the birds build their nests;\non the treetop the stork has her home.", "The goats find a home on the mountains\nand rabbits hide in the rocks.", "You made the moon to mark the months;\nthe sun knows the time for its setting.", "When you spread the darkness it is night\nand all the beasts of the forest creep forth.", "The young lions roar for their prey\nand ask their food from God.", "At the rising of the sun they steal away\nand go to rest in their dens.", "Man goes out to his work,\nto labor till evening falls.", "How many are your works, O Lord!\nIn wisdom you have made them all.\nThe earth is full of your riches.", "There is the sea, vast and wide,\nwith its moving swarms past counting,\nliving things great and small.", "The ships are moving there\nand the monsters you made to play with.", "All of these look to you\nto give them their food in due season.", "You give it, they gather it up:\nyou open your hand, they have their fill.", "You hide your face, they are dismayed;\nyou take back your spirit, they die,\nreturning to the dust from which they came.", "You send forth your spirit, they are created;\nand you renew the face of the earth.", "May the glory of the Lord last for ever!\nMay the Lord rejoice in his works!", "He looks on the earth and it trembles;\nthe mountains send forth smoke at his touch.", "I will sing to the Lord all my life,\nmake music to my God while I live.", "May my thoughts be pleasing to him.\nI find my joy in the Lord.", "Let sinners vanish from the earth\nand the wicked exist no more.\nBless the Lord, my soul."]], ["Confitemini Domino", ["ALLELUIA!\nGive thanks to the Lord, tell his name,\nmake known his deeds among the peoples.", "O sing to him, sing his praise;\ntell all his wonderful works!", "Be proud of his holy name,\nlet the hearts that seek the Lord rejoice.", "Consider the Lord and his strength;\nconstantly seek his face.", "Remember the wonders he has done,\nhis miracles, the judgments he spoke.", "O children of Abraham, his servant,\nO sons of the Jacob he chose,", "he, the Lord, is our God;\nhis judgments prevail in all the earth.", "He remembers his covenant for ever,\nhis promise for a thousand generations,", "the covenant he made with Abraham,\nthe oath he swore to Isaac.", "He confirmed it for Jacob as a law,\nfor Israel as a covenant for ever.", "He said: “I am giving you a land,\nCanaan, your appointed heritage.”", "When they were few in number,\na handful of strangers in the land,", "when they wandered from country to country,\nfrom one kingdom and nation to another,", "he allowed no one to oppress them;\nhe admonished kings on their account:", "“Do not touch those I have anointed;\ndo no harm to any of my prophets.”", "But he called down a famine on the land;\nhe broke the staff that supported them.", "He had sent a man before them,\nJoseph, sold as a slave.", "His feet were put in chains,\nhis neck was bound with iron,", "until what he said came to pass\nand the word of the Lord proved him true.", "Then the king sent and released him,\nthe ruler of the people set him free,", "making him master of his house\nand ruler of all he possessed,", "to instruct his princes as he pleased\nand to teach his elders wisdom.", "So Israel came into Egypt;\nJacob lived in the country of Ham.", "He gave his people increase;\nhe made them stronger than their foes,", "whose hearts he turned to hate his people\nand to deal deceitfully with his servants.", "Then he sent Moses his servant\nand Aaron the man he had chosen.", "Through them he showed his marvels\nand his wonders in the country of Ham.", "He sent darkness, and dark was made\nbut Egypt resisted his words.", "He turned the waters into blood\nand caused their fish to die.", "Their land was alive with frogs,\neven to the halls of their kings.", "He spoke; the dog-fly came\nand gnats covered the land.", "He sent hailstones in place of the rain\nand flashing fire in their land.", "He struck their vines and fig trees;\nhe shattered the trees through their land.", "He spoke; the locusts came,\nyoung locusts, too many to be counted.", "They ate up every blade in the land;\nthey ate up all the fruit of their fields.", "He struck all the first-born in their land,\nthe finest flower of their sons.", "He led out Israel with silver and gold.\nIn his tribes were none who fell behind.", "Egypt rejoiced when they left\nfor dread had fallen upon them.", "He spread a cloud as a screen\nand fire to give light in the darkness.", "When they asked for food he sent quails;\nhe filled them with bread from heaven.", "He pierced the rock to give them water;\nit gushed forth in the desert like a river.", "For he remembered his holy word,\nwhich he gave to Abraham his servant.", "So he brought out his people with joy,\nhis chosen ones with shouts of rejoicing.", "And he gave them the land of the nations.\nThey took the fruit of other men’s toil,", "that thus they might keep his precepts,\nthat thus they might observe his laws.\nALLELUIA!"]], ["Confitemini Domino", ["ALLELUIA!\nO give thanks to the Lord for he is good;\nfor his love endures for ever.", "Who can tell the Lord’s mighty deeds?\nWho can recount all his praise?", "They are happy who do what is right,\nwho at all times do what is just.", "O Lord, remember me\nout of the love you have for your people.\nCome to me, Lord, with your help", "that I may see the joy of your chosen ones\nand may rejoice in the gladness of your nation\nand share the glory of your people.", "Our sin is the sin of our fathers;\nwe have done wrong, our deeds have been evil.", "Our fathers when they were in Egypt\npaid no heed to your wonderful deeds.\nThey forgot the greatness of your love,\nat the Red Sea defied the Most High.", "Yet he saved them for the sake of his name,\nin order to make known his power.", "He threatened the Red Sea; it dried up\nand he led them through the deep as through the desert.", "He saved them from the hand of the foe;\nhe saved them from the grip of the enemy.", "The waters covered their oppressors;\nnot one of them was left alive.", "Then they believed in his words:\nthen they sang his praises.", "But they soon forgot his deeds\nand would not wait upon his will.", "They yielded to their cravings in the desert\nand put God to the test in the wilderness.", "He granted them the favor they asked\nand sent disease among them.", "Then they rebelled, envious of Moses\nand of Aaron, who was holy to the Lord.", "The earth opened and swallowed up Dathan\nand buried the clan of Abiram.", "Fire blazed up against their clan\nand flames devoured the rebels.", "They fashioned a calf at Horeb\nand worshipped an image of metal,", "exchanging the God who was their glory\nfor the image of a bull that eats grass.", "They forgot the God who was their savior,\nwho had done such great things in Egypt,", "such portents in the land of Ham,\nsuch marvels at the Red Sea.", "For this he said he would destroy them,\nbut Moses, the man he had chosen,\nstood in the breach before him,\nto turn back his anger from destruction.", "Then they scorned the land of promise;\nthey had no faith in his word.", "They complained inside their tents\nand would not listen to the voice of the Lord.", "So he raised his hand to swear an oath\nthat he would lay them low in the desert;", "would scatter their sons among the nations\nand disperse them throughout the lands.", "They bowed before the Baal of Peor;\nate offerings made to lifeless gods.", "They roused him to anger with their deeds\nand plague broke out among them.", "Then Phinehas stood up and intervened.\nThus the plague was ended", "and this was counted in his favor\nfrom age to age for ever.", "They provoked him at the waters of Meribah.\nThrough their fault it went ill with Moses;", "for they made his heart grow bitter\nand he uttered words that were rash.", "They failed to destroy the peoples\nas the Lord had given command,", "but instead they mingled with the nations\nand learned to act as they did.", "They worshipped the idols of the nations\nand these became a snare to entrap them.", "They even offered their own sons\nand their daughters in sacrifice to demons.", "They shed the blood of the innocent,\nthe blood of their sons and daughters\nwhom they offered to the idols of Canaan.\nThe land was polluted with blood.", "So they defiled themselves by their deeds\nand broke their marriage bond with the Lord", "till his anger blazed against his people;\nhe was filled with horror at his chosen ones.", "So he gave them into the hand of the nations\nand their foes became their rulers.", "Their enemies became their oppressors;\nthey were subdued beneath their hand.", "Time after time God rescued them,\nbut in their malice they dared to defy him\nand sank low through their guilt.", "In spite of this he paid heed to their distress,\nso often as he heard their cry.", "
