For their sake he remembered his covenant.\nIn the greatness of his love he relented", "and he let them be treated with mercy\nby all who held them captive.", "O Lord, our God, save us!\nBring us together from among the nations\nthat we may thank your holy name\nand make it our glory to praise you.", "Blessed be the Lord, God of Israel,\nfor ever, from age to age.\nLet all the people cry out:\n“Amen! Amen! ALLELUIA!”"]], ["Confitemini Domino", ["“O give thanks to the Lord for he is good;\nfor his love endures for ever.”", "Let them say this, the Lord’s redeemed,\nwhom he redeemed from the hand of the foe", "and gathered from far-off lands,\nfrom east and west, north and south.", "Some wandered in the desert, in the wilderness,\nfinding no way to a city they could dwell in.", "Hungry they were and thirsty;\ntheir soul was fainting within them.", "Then they cried to the Lord in their need\nand he rescued them from their distress", "and he led them along the right way,\nto reach a city they could dwell in.", "Let them thank the Lord for his love,\nfor the wonders he does for men:", "for he satisfies the thirsty soul;\nhe fills the hungry with good things.", "Some lay in darkness and in gloom,\nprisoners in misery and chains,", "having defied the words of God\nand spurned the counsels of the Most High.", "He crushed their spirit with toil;\nthey stumbled; there was no one to help.", "Then they cried to the Lord in their need\nand he rescued them from their distress.", "He led them forth from darkness and gloom\nand broke their chains to pieces.", "Let them thank the Lord for his goodness,\nfor the wonders he does for men:", "for he bursts the gates of bronze\nand shatters the iron bars.", "Some were sick on account of their sins\nand afflicted on account of their guilt.", "They had a loathing for every food;\nthey came close to the gates of death.", "Then they cried to the Lord in their need\nand he rescued them from their distress.", "He sent forth his word to heal them\nand saved their life from the grave.", "Let them thank the Lord for his love,\nfor the wonders he does for men.", "Let them offer a sacrifice of thanks\nand tell of his deeds with rejoicing.", "Some sailed to the sea in ships\nto trade on the mighty waters.", "These men have seen the Lord’s deeds,\nthe wonders he does in the deep.", "For he spoke; he summoned the gale,\ntossing the waves of the sea", "up to heaven and back into the deep;\ntheir souls melted away in their distress.", "They staggered, reeled like drunken men,\nfor all their skill was gone.", "Then they cried to the Lord in their need\nand he rescued them from their distress.", "He stilled the storm to a whisper:\nall the waves of the sea were hushed.", "They rejoiced because of the calm\nand he led them to the haven they desired.", "Let them thank the Lord for his love,\nfor the wonders he does for men.", "Let them exalt him in the gathering of the people\nand praise him in the meeting of the elders.", "He changes streams into a desert,\nsprings of water into thirsty ground,", "fruitful land into a salty waste,\nfor the wickedness of those who live there.", "But he changes desert into streams,\nthirsty ground into springs of water.", "There he settles the hungry\nand they build a city to dwell in.", "They sow fields and plant their vines;\nthese yield crops for the harvest.", "He blesses them; they grow in numbers.\nHe does not let their herds decrease.", "He pours contempt upon princes,\nmakes them wander in trackless wastes.", "They diminish, are reduced to nothing\nby oppression, evil and sorrow.", "But he raises the needy from distress;\nmakes families numerous as a flock.", "The upright see it and rejoice\nbut all who do wrong are silenced.", "Whoever is wise, let him heed these things.\nAnd consider the love of the Lord."]], ["Paratum cor meum", ["My heart is ready, O God;\nI will sing, sing your praise.\nAwake, my soul;", "awake, lyre and harp,\nI will awake the dawn.", "I will thank you, Lord, among the peoples,\namong the nations I will praise you,", "for your love reaches to the heavens\nand your truth to the skies.", "O God, arise above the heavens;\nmay your glory shine on earth!", "O come and deliver your friends;\nhelp with your right hand and reply.", "From his holy place God has made this promise;\n“I will triumph and divide the land of Shechem,\nI will measure out the valley of Succoth.", "Gilead is mine and Manasseh,\nEphraim I take for my helmet,\nJudah for my commander’s staff.", "Moab I will use for my washbowl,\non Edom I will plant my shoe.\nOver the Philistines I will shout in triumph.”", "But who will lead me to conquer the fortress?\nWho will bring me face to face with Edom?", "Will you utterly reject us, O God,\nand no longer march with our armies?", "Give us help against the foe,\nfor the help of man is vain.", "With God we shall do bravely\nand he will trample down our foes."]], ["Deus, laudem", ["O God whom I praise, do not be silent,", "for the mouths of deceit and wickedness\nare opened against me.", "They speak to me with lying tongues;\nthey beset me with words of hate\nand attack me without cause.", "In return for my love they accuse me\nwhile I pray for them.", "They repay me evil for good,\nhatred for love.", "Appoint a wicked man as his judge;\nlet an accuser stand at his right.", "When he is judged let him come out condemned;\nlet his prayer be considered as sin.", "Let the days of his life be few;\nlet another man take his office.", "Let his children be fatherless orphans\nand his wife become a widow.", "Let his children be wanderers and beggars\ndriven from the ruins of their home.", "Let the creditor seize all his goods;\nlet strangers take the fruit of his work.", "Let no one show him any mercy\nnor pity his fatherless children.", "Let all his sons be destroyed\nand with them their names be blotted out.", "Let his father’s guilt be remembered,\nhis mother’s be retained.", "Let it always stand before the Lord,\nthat their memory be cut off from the earth.", "For he did not think of showing mercy\nbut pursued the poor and the needy,", "hounding the wretched to death.\nHe loved cursing; let curses fall upon him.\nHe scorned blessing; let blessing pass him by.", "He put on cursing like his coat;\nlet it sink into his body like water;\nlet it sink like oil into his bones;", "let it be like the clothes that cover him,\nlike a girdle he cannot take off!", "Let the Lord thus repay my accusers,\nall those who speak evil against me.", "For your name’s sake act in my defense;\nin the goodness of your love be my rescuer.", "For I am poor and needy\nand my heart is pierced within me.", "I fade like an evening shadow;\nI am shaken off like a locust.", "My knees are weak from fasting;\nmy body is thin and gaunt.", "I have become an object of scorn,\nall who see me toss their heads.", "Help me, Lord my God;\nsave me because of your love.", "Let them know that this is your work,\nthat this is your doing, O Lord.", "They may curse but you will bless.\nLet my attackers be put to shame,\nbut let your servant rejoice.", "Let my accusers be clothed with dishonor,\ncovered with shame as with a cloak.", "Loud thanks to the Lord are on my lips.\nI will praise him in the midst of the throng,", "for he stands at the poor man’s side\nto save him from those who condemn him."]], ["Dixit Dominus", ["The Lord’s revelation to my Master:\n“Sit on my right:\nyour foes I will put beneath your feet.”", "The Lord will yield from Zion\nyour scepter of power:\nrule in the midst of all your foes.", "A prince from the day of your birth\non the holy mountains;\nfrom the womb before the dawn I begot you.", "The Lord has sworn an oath he will not change.\n“You are a priest for ever,\na priest like Melchizedek of old.”", "The Master standing at your right hand\nwill shatter kings in the day of his wrath.", "He, the judge of the nations\nwill heap high the bodies;\nheads shall be scattered far and wide.", "He shall drink from the stream by the wayside\nand therefore he shall lift up his head."]], ["Confitebor tibi", ["ALLELUIA!\nI will thank the Lord with all my heart\nin the meeting of the just and their assembly.", "Great are the works of the Lord,\nto be pondered by all who love them.", "Majestic and glorious his work,\nhis justice stands firm for ever.", "He makes us remember his wonders.\nThe Lord is compassion and love.", "He gives food to those who fear him;\nkeeps his covenant ever in mind.", "He has shown his might to his people\nby giving them the lands of the nations.", "His works are justice and truth,\nhis precepts are all of them sure,", "standing firm for ever and ever;\nthey are made in uprightness and truth.", "He has sent deliverance to his people\nand established his covenant for ever.\nHoly his name, to be feared.", "To fear the Lord is the first stage of wisdom;\nall who do so prove themselves wise.\nHis praise shall last for ever!"]], ["Beatus vir", ["ALLELUIA!\nHappy the man who fears the Lord,\nwho takes delight in all his commands.", "His sons shall be powerful on earth;\nthe children of the upright are blessed.", "Riches and wealth are in his house;\nhis justice stands firm for ever.", "He is a light in the darkness for the upright:\nhe is generous, merciful and just.", "The good man takes pity and lends,\nhe conducts his affairs with honor.", "The just man will never waver:\nhe will be remembered for ever.", "He has no fear of evil news;\nwith a firm heart he trusts in the Lord.", "With a steadfast heart he will not fear;\nhe will see the downfall of his foes.", "Open-handed,\nhe gives to the poor;\nhis justice stands firm for ever.\nHis head will be raised in glory.", "The wicked man sees and is angry,\ngrinds his teeth and fades away;\nthe desire of the wicked leads to doom."]], ["Laudate, pueri", ["ALLELUIA!\nPraise, O servants of the Lord,\npraise the name of the Lord!", "May the name of the Lord be blessed\nboth now and for evermore!", "From the rising of the sun to its setting\npraised be the name of the Lord!", "High above all nations is the Lord,\nabove the heavens his glory.", "Who is like the Lord, our God,\nwho has risen on high to his throne", "yet stoops from the heights to look down,\nto look down upon heaven and earth?", "From the dust he lifts up the lowly,\nfrom the dung-heap he raises the poor", "to set them in the company of princes,\nyes, with the princes of his people.", "To the childless wife he gives a home\nand gladdens her heart with children."]], ["In exitu Israel", ["ALLELUIA!\nWhen Israel came forth from Egypt,\nJacob’s sons from an alien people", "Judah became the Lord’s temple,\nIsrael became his kingdom.", "The sea fled at the sight:\nthe Jordan turned back on its course,", "the mountains leapt like rams\nand the hills like yearling sheep.", "Why was it, sea, that you fled,\nthat you turned back, Jordan, on your course?", "Mountains, that you leapt like rams;\nhills, like yearling sheep?", "Tremble, O earth, before the Lord,\nin the presence of the God of Jacob,", "who turns the rock into a pool\nand flint into a spring of water."]], ["Non nobis, Domine", ["Not to us, Lord, not to us,\nbut to your name give the glory\nfor the sake of your love and your truth,", "lest the heathen say: “Where is their God?”", "But our God is in the heavens;\nhe does whatever he wills.", "Their idols are silver and gold,\nthe work of human hands.", "They have mouths but they cannot speak;\nthey have eyes but they cannot see;", "they have ears but they cannot hear;\nthey have nostrils but they cannot smell.", "With their hands they cannot feel;\nwith their feet they cannot walk.\n(No sound comes from their throats.)", "Their makers will come to be like them\nand so will all who trust in them.", "Sons of Israel, trust in the Lord;\nhe is their help and their shield.", "Sons of Aaron, trust in the Lord;\nhe is their help and their shield.", "You who fear him, trust in the Lord;\nhe is their help and their shield.", "He remembers us, and he will bless us;\nhe will bless the sons of Israel.\n(He will bless the sons of Aaron.)", "The Lord will bless those who fear him,\nthe little no less than the great:", "to you may the Lord grant increase,\nto you and all your children.", "May you be blessed by the Lord,\nthe maker of heaven and earth.", "The heavens belong to the Lord\nbut the earth he has given to men.", "The dead shall not praise the Lord,\nnor those who go down into the silence.", "But we who live bless the Lord\nnow and for ever. Amen."]], ["Dilexi, quoniam", ["ALLELUIA!\nI love the Lord for he has heard\nthe cry of my appeal;", "for he turned his ear to me\nin the day when I called him.", "They surrounded me, the snares of death,\nwith the anguish of the tomb;\nthey caught me, sorrow and distress.", "I called on the Lord’s name.\nO Lord, my God, deliver me!", "How gracious is the Lord, and just;\nour God has compassion.", "The Lord protects the simple hearts;\nI was helpless so he saved me.", "Turn back, my soul, to your rest\nfor the Lord has been good;", "he has kept my soul from death,\n(my eyes from tears)\nand my feet from stumbling.", "I will walk in the presence of the Lord\nin the land of the living.", "I trusted, even when I said:\n“I am sorely afflicted,”", "and when I said in my alarm:\n“No man can be trusted.”", "How can I repay the Lord\nfor his goodness to me?", "The cup of salvation I will raise;\nI will call on the Lord’s name.", "My vows to the Lord I will fulfill\nbefore all his people.", "O precious in the eyes of the Lord\nis the death of his faithful.", "Your servant, Lord, your servant am I;\nyou have loosened my bonds.", "A thanksgiving sacrifice I make;\nI will call on the Lord’s name.", "My vows to the Lord I will fulfill\nbefore all his people,", "in the courts of the house of the Lord,\nin your midst, O Jerusalem."]], ["Laudate Dominum", ["ALLELUIA!\nO praise the Lord, all you nations,\nacclaim him all you peoples!", "Strong is his love for us;\nhe is faithful for ever."]], ["Confitemini Domino", ["ALLELUIA!\nGive thanks to the Lord for he is good,\nfor his love endures for ever.", "Let the sons of Israel say:\n“His love endures for ever.”", "Let the sons of Aaron say:\n“His love endures for ever.”", "Let those who fear the Lord say:\n“His love endures for ever.”", "I called to the Lord in my distress;\nhe answered and freed me.", "The Lord is at my side; I do not fear.\nWhat can man do against me?", "The Lord is at my side as my helper;\nI shall look down on my foes.", "It is better to take refuge in the Lord\nthan to trust in men;", "it is better to take refuge in the Lord\nthan to trust in princes.", "The nations all encompassed me;\nin the Lord’s name I crushed them.", "They compassed me, compassed me about;\nin the Lord’s name I crushed them.", "They compassed me about like bees;\nthey blazed like a fire among thorns.\nIn the Lord’s name I crushed them.", "I was thrust down, thrust down and falling,\nbut the Lord was my helper.", "The Lord is my strength and my song;\nhe was my savior.", "There are shouts of joy and victory\nin the tents of the just.\nThe Lord’s right hand has triumphed;", "his right hand raised me.\nThe Lord’s right hand has triumphed;", "I shall not die, I shall live\nand recount his deeds.", "I was punished, I was punished by the Lord,\nbut not doomed to die.", "Open to me the gates of holiness:\nI will enter and give thanks.", "This is the Lord’s own gate\nwhere the just may enter.", "I will thank you for you have answered\nand you are my savior.", "The stone which the builders rejected\nhas become the corner stone.", "This is the work of the Lord,\na marvel in our eyes.", "This day was made by the Lord;\nwe rejoice and are glad.", "O Lord, grant us salvation;\nO Lord, grant success.", "Blessed in the name of the Lord\nis he who comes.\nWe bless you from the house of the Lord;", "the Lord God is our light.\nGo forward in procession with branches\neven to the altar.", "You are my God, I thank you.\nMy God, I praise you.", "Give thanks to the Lord for he is good;\nfor his love endures for ever."]], ["Beati immaculati", ["They are happy whose life is blameless,\nwho follow God’s law!", "They are happy who do his will,\nseeking him with all their hearts,", "who never do anything evil\nbut walk in his ways.", "You have laid down your precepts\nto be obeyed with care.", "May my footsteps be firm\nto obey your statutes.", "Then I shall not be put to shame\nas I heed your commands.", "I will thank you with an upright heart\nas I learn your decrees.", "I will obey your statutes;\ndo not forsake me.", "How shall the young remain sinless?\nBy obeying your word.", "I have sought you with all my heart;\nlet me not stray from your commands.", "I treasure your promise in my heart\nlest I sin against you.", "Blessed are you, O Lord;\nteach me your statutes.", "With my tongue I have recounted\nthe decrees of your lips.", "I rejoiced to do your will\nas though all riches were mine.", "I will ponder all your precepts\nand consider your paths.", "I take delight in your statutes;\nI will not forget your word.", "Bless your servant and I shall live\nand obey your word.", "Open my eyes that I may see\nthe wonders of your law.", "I am a pilgrim on the earth;\nshow me your commands.", "My soul is ever consumed\nas I long for your decrees.", "You threaten the proud, the accursed,\nwho turn from your commands.", "Relieve me from scorn and contempt\nfor I do your will.", "Though the princes sit plotting against me\nI ponder on your statutes.", "Your will is my delight;\nyour statutes are my counselors.", "My soul lies in the dust;\nby your will revive me.", "I declared my ways and you answered;\nteach me your statutes.", "Make me grasp the way of your precepts\nand I will muse on your wonders.", "My soul pines away with grief;\nby your word raise me up.", "Keep me from the way of error\nand teach me your law.", "I have chosen the way of truth\nwith your decrees before me.", "I bind myself to do your will;\nLord, do not disappoint me.", "I will run the way of your commands;\nyou give freedom to my heart.", "Teach me the demands of your statutes\nand I will keep them to the end.", "Train me to observe your law,\nto keep it with my heart.", "Guide me in the path of your commands;\nfor there is my delight.", "Bend my heart to your will\nand not to love of gain.", "Keep my eyes from what is false;\nby your word, give me life.", "Keep the promise you have made\nto the servant who fears you.", "Keep me from the scorn I dread,\nfor your decrees are good.", "See, I long for your precepts;\nthen in your justice, give me life.", "Lord, let your love come upon me,\nthe saving help of your promise.", "And I shall answer those who taunt me\nfor I trust in your word.", "Do not take the word of truth from my mouth\nfor I trust in your decrees.", "I shall always keep your law\nfor ever and ever.", "I shall walk in the path of freedom\nfor I seek your precepts.", "I will speak of your will before kings\nand not be abashed.", "Your commands have been my delight;\nthese I have loved.", "I will worship your commands and love them\nand ponder your statutes.", "Remember your word to your servant\nby which you gave me hope.", "This is my comfort in sorrow:\nthat your promise gives me life.", "Though the proud may utterly deride me\nI keep to your law.", "I remember your decrees of old\nand these, Lord, console me.", "I am seized with indignation at the wicked\nwho forsake your law.", "Your statutes have become my song\nin the land of exile.", "I think of your name in the nighttime\nand I keep your law.", "This has been my blessing,\nthe keeping of your precepts.", "My part, I have resolved, O Lord,\nis to obey your word.", "With all my heart I implore your favor;\nshow the mercy of your promise.", "I have pondered over many ways\nand returned to your will.", "I made haste and did not delay\nto obey your commands.", "Though the nets of the wicked ensnared me\nI remembered your law.", "At midnight I will rise and thank you\nfor your just decrees.", "I am a friend of all who revere you,\nwho obey your precepts.", "Lord, your love fills the earth.\nTeach me your statutes.", "Lord, you have been good to your servant\naccording to your word.", "Teach me discernment and knowledge\nfor I trust in your commands.", "Before I was afflicted I strayed\nbut now I keep your word.", "You are good and your deeds are good;\nteach me your statutes.", "Though proud men smear me with lies\nyet I keep your precepts.", "Their minds are closed to good\nbut your law is my delight.", "It was good for me to be afflicted,\nto learn your statutes.", "The law from your mouth means more to me\nthan silver and gold.", "It was your hands that made me and shaped me:\nhelp me to learn your commands.", "Your faithful will see me and rejoice\nfor I trust in your word.", "Lord, I know that your decrees are right,\nthat you afflicted me justly.", "Let your love be ready to console me\nby your promise to your servant.", "Let your love come and I shall live\nfor your law is my delight.", "Shame the proud who harm me with lies\nwhile I ponder your precepts.", "Let your faithful turn to me,\nthose who know your will.", "Let my heart be blameless in your statutes\nlest I be ashamed.", "I yearn for your saving help;\nI hope in your word.", "My eyes yearn to see your promise.\nWhen will you console me?", "Though parched and exhausted with waiting\nI remember your statutes.", "How long must your servant suffer?\nWhen will you judge my foes?", "For me the proud have dug pitfalls,\nagainst your law.", "Your commands are all true; then help me\nwhen lies oppress me.", "They almost made an end of me on earth,\nbut I kept your precepts.", "Because of your love give me life\nand I will do your will.", "Your word, O Lord, for ever\nstands firm in the heavens:", "your truth lasts from age to age,\nlike the earth you created.", "By your decree it endures to this day;\nfor all things serve you.", "Had your law not been my delight\nI would have died in my affliction.", "I will never forget your precepts\nfor with them you give me life.", "Save me, for I am yours\nsince I seek your precepts.", "Though the wicked lie in wait to destroy me\nyet I ponder your will.", "I have seen that all perfection has an end\nbut your command is boundless.", "Lord, how I love your law!\nIt is ever in my mind.", "Your command makes me wiser than my foes;\nfor it is mine for ever.", "I have more insight than all who teach me\nfor I ponder your will.", "I have more understanding than the old\nfor I keep your precepts.", "I turn my feet from evil paths\nto obey your word.", "I have not turned from your decrees;\nyou yourself have taught me.", "Your promise is sweeter to my taste\nthan honey in the mouth.", "I gain understanding from your precepts\nand so I hate false ways.", "Your word is a lamp for my steps\nand a light for my path.", "I have sworn and have made up my mind\nto obey your decrees.", "Lord, I am deeply afflicted;\nby your word give me life.", "Accept, Lord, the homage of my lips\nand teach me your decrees.", "Though I carry my life in my hands,\nI remember your law.", "Though the wicked try to ensnare me,\nI do not stray from your precepts.", "Your will is my heritage for ever,\nthe joy of my heart.", "I set myself to carry out your statutes\nin fullness, for ever.", "I have no love for half-hearted men;\nmy love is for your law.", "You are my shelter, my shield;\nI hope in your word.", "Leave me, you who do evil;\nI will keep God’s command.", "If you uphold me by your promise I shall live;\nlet my hopes not be in vain.", "Sustain me and I shall be saved\nand ever observe your statutes.", "You spurn all who swerve from your statutes;\ntheir cunning is in vain.", "You throw away the wicked like dross;\nso I love your will.", "I tremble before you in terror;\nI fear your decrees.", "I have done what is right and just:\nlet me not be oppressed.", "Vouch for the welfare of your servant\nlest the proud oppress me.", "My eyes yearn for your saving help\nand the promise of your justice.", "Treat your servant with love\nand teach me your statutes.", "I am your servant, give me knowledge;\nthen I shall know your will.", "It is time for the Lord to act\nfor your law has been broken.", "That is why I love your commands\nmore than finest gold,", "why I rule my life by your precepts,\nand hate false ways.", "Your will is wonderful indeed;\ntherefore I obey it.", "The unfolding of your word gives light\nand teaches the simple.", "I open my mouth and I sigh\nas I yearn for your commands.", "Turn and show me your mercy;\nshow justice to your friends.", "Let my steps be guided by your promise;\nlet no evil rule me.", "Redeem me from man’s oppression\nand I will keep your precepts.", "Let your face shine on your servant\nand teach me your decrees.", "Tears stream from my eyes\nbecause your law is disobeyed.", "Lord, you are just indeed;\nyour decrees are right.", "You have imposed your will with justice\nand with absolute truth.", "I am carried away by anger\nfor my foes forget your word.", "Your promise is tried in the fire,\nthe delight of your servant.", "Although I am weak and despised,\nI remember your precepts.", "Your justice is eternal justice\nand your law is truth.", "Though anguish and distress have seized me,\nI delight in your commands.", "The justice of your will is eternal:\nif you teach me I shall live.", "I call with all my heart; Lord, hear me,\nI will keep your statutes.", "I call upon you, save me\nand I will do your will.", "I rise before dawn and cry for help,\nI hope in your word.", "My eyes watch through the night\nto ponder your promise.", "In your love hear my voice, O Lord;\ngive me life by your decrees.", "Those who harm me unjustly draw near;\nthey are far from your law.", "But you, O Lord, are close,\nyour commands are truth.", "Long have I known that your will\nis established for ever.", "See my affliction and save me\nfor I remember your law.", "Uphold my cause and defend me;\nby your promise, give me life.", "Salvation is far from the wicked\nwho are heedless of your statutes.", "Numberless, Lord, are your mercies;\nwith your decrees give me life.", "Though my foes and oppressors are countless\nI have not swerved from your will.", "I look at the faithless with disgust;\nthey ignore your promise.", "See how I love your precepts;\nin your mercy give me life.", "Your word is founded on truth,\nyour decrees are eternal.", "Though princes oppress me without cause\nI stand in awe of your word.", "I take delight in your promise\nlike one who finds a treasure.", "Lies I hate and detest\nbut your law is my love.", "Seven times a day I praise you\nfor your just decrees.", "The lovers of your law have great peace;\nthey never stumble.", "I await your saving help,\nO Lord, I fulfill your commands.", "My soul obeys your will\nand loves it dearly.", "I obey your precepts and your will;\nall that I do is before you.", "Lord, let my cry come before you:\nteach me by your word.", "Let my pleading come before you:\nsave me by your promise.", "Let my lips proclaim your praise\nbecause you teach me your statutes.", "Let my tongue sing your promise\nfor your commands are just.", "Let your hand be ready to help me,\nsince I have chosen your precepts.", "Lord, I long for your saving help\nand your law is my delight.", "Give life to my soul that I may praise you.\nLet your decrees give me help.", "I am lost like a sheep; seek your servant\nfor I remember your commands."]], ["Ad Dominum", ["To the Lord in the hour of my distress\nI call and he answers me.", "“O Lord, save my soul from lying lips,\nfrom the tongue of the deceitful.”", "What shall he repay you in return,\nO treacherous tongue?", "The warrior’s arrows sharpened\nand coals, red-hot,\nblazing.", "(Alas, that I abide a stranger in Meshech,\ndwell among the tents of Kedar!)", "Long enough have I been dwelling\nwith those who hate peace.", "I am for peace, but when I speak,\nthey are for fighting."]], ["Levavi oculos", ["I lift up my eyes to the mountains;\nfrom where shall come my help?", "My help shall come from the Lord\nwho made heaven and earth.", "May he never allow you to stumble!\nLet him sleep not, your guard.", "No, he sleeps not nor slumbers,\nIsrael’s guard.", "The Lord is your guard and your shade;\nat your right side he stands.", "By day the sun shall not smite you\nnor the moon in the night.", "The Lord will guard you from evil,\nhe will guard your soul.", "The Lord will guard your going and coming\nboth now and for ever."]], ["Laetatus sum", ["I rejoiced when I heard them say:\n“Let us go to God’s house.”", "And now our feet are standing\nwithin your gates, O Jerusalem.", "Jerusalem is built as a city\nstrongly compact.", "It is there that the tribes go up,\nthe tribes of the Lord.\nFor Israel’s law it is,\nthere to praise the Lord’s name.", "There were set the thrones of judgment\nof the house of David.", "For the peace of Jerusalem pray:\n“Peace be to your homes!", "May peace reign in your walls,\nin your palaces, peace!”", "For love of my brethren and friends\nI say: “Peace upon you.”", "For love of the house of the Lord\nI will ask for your good."]], ["Ad te levavi oculos meos", ["To you have I lifted up my eyes,\nyou who dwell in the heavens;", "my eyes, like the eyes of slaves\non the hand of their lords.\nLike the eyes of a servant\non the hand of her mistress,", "so our eyes are on the Lord our God\ntill he show us his mercy.", "Have mercy on us, Lord, have mercy.\nWe are filled with contempt.", "Indeed all too full is our soul\nwith the scorn of the rich,\n(with the proud man’s disdain)."]], ["Nisi quia Dominus", ["“If the Lord had not been on our side,”\nthis is Israel’s song.", "“If the Lord had not been on our side\nwhen men rose up against us,", "then would they have swallowed us alive\nwhen their anger was kindled.", "Then would the waters have engulfed us,\nthe torrent gone over us;", "over our head would have swept\nthe raging waters.”", "Blessed be the Lord who did not give us\na prey to their teeth!", "Our life, like a bird, has escaped\nfrom the snare of the fowler.\nIndeed the snare has been broken\nand we have escaped.", "Our help is in the name of the Lord,\nwho made heaven and earth."]], ["Qui confidunt", ["Those who put their trust in the Lord\nare like Mount Zion, that cannot be shaken,\nthat stands for ever.", "Jerusalem! The mountains surround her,\nso the Lord surrounds his people\nboth now and for ever.", "For the scepter of the wicked shall not rest\nover the land of the just\nfor fear that the hands of the just\nshould turn to evil.", "Do good, Lord, to those who are good,\nto the upright of heart;", "but the crooked and those who do evil,\ndrive them away!\nOn Israel, peace!"]], ["In convertendo", ["When the Lord delivered Zion from bondage,\nit seemed like a dream.", "Then was our mouth filled with laughter,\non our lips there were songs.\nThe heathens themselves said: “What marvels\nthe Lord worked for them!”", "What marvels the Lord worked for us!\nIndeed we were glad.", "Deliver us, O Lord, from our bondage\nas streams in dry land.", "Those who are sowing in tears\nwill sing when they reap.", "They go out, they go out, full of tears,\ncarrying seed for the sowing:\nthey come back, they come back, full of song,\ncarrying their sheaves."]], ["Nisi Dominus", ["If the Lord does not build the house,\nin vain do its builders labor;\nif the Lord does not watch over the city,\nin vain does the watchman keep vigil.", "In vain is your earlier rising,\nyour going later to rest,\nyou who toil for the bread you eat,\nwhen he pours gifts on his beloved while they slumber.", "Truly sons are a gift from the Lord,\na blessing, the fruit of the womb.", "Indeed the sons of youth\nare like arrows in the hand of a warrior.", "O the happiness of the man\nwho has filled his quiver with these arrows!\nHe will have no cause for shame\nwhen he disputes with his foes in the gateways."]], ["Beati omnes", ["O blessed are those who fear the Lord\nand walk in his ways!", "By the labor of your hands you shall eat.\nYou will be happy and prosper;", "the wife like a fruitful vine\nin the heart of your house;\nYour children like shoots of the olive,\naround your table.", "Indeed thus shall be blessed\nthe man who fears the Lord.", "May the Lord bless you from Zion\nall the days of your life!", "May you see your children’s children\nin a happy Jerusalem!\nOn Israel, peace!"]], ["Saepe expugnaverunt", ["“They have pressed me hard from my youth,”\nthis is Israel’s song.", "“They have pressed me hard from my youth\nbut could never destroy me.", "They plowed my back like plowmen,\ndrawing long furrows.", "But the Lord who is just, has destroyed\nthe yoke of the wicked.”", "Let them be shamed and routed,\nthose who hate Zion!", "Let them be like grass on the roof\nthat withers before it flowers.", "With that no reaper fills his arms,\nno binder makes his sheaves", "and those passing by will not say:\n“On you the Lord’s blessing!”\n“We bless you in the name of the Lord.”"]], ["De profundis", ["Out of the depths I cry to you, O Lord,", "Lord, hear my voice!\nO let your ears be attentive\nto the voice of my pleading.", "If you, O Lord, should mark our guilt,\nLord, who would survive?", "But with you is found forgiveness:\nfor this we revere you.", "My soul is waiting for the Lord.\nI count on his word.", "My soul is longing for the Lord\nmore than watchman for daybreak.\n(Let the watchman count on daybreak", "and Israel on the Lord.)\nBecause with the Lord there is mercy\nand fullness of redemption,", "Israel indeed he will redeem\nfrom all its iniquity."]], ["Domine, non est", ["O Lord, my heart is not proud\nnor haughty my eyes.\nI have not gone after things too great\nnor marvels beyond me.", "Truly I have set my soul\nin silence and peace.\nA weaned child on its mother’s breast,\neven so is my soul.", "O Israel, hope in the Lord\nboth now and forever."]], ["Memento, Domine", ["O Lord, remember David\nand all the many hardships he endured,", "the oath he swore to the Lord,\nhis vow to the Strong One of Jacob.", "“I will not enter the house where I live\nnor go to the bed where I rest.", "I will give no sleep to my eyes,\nto my eyelids I will give no slumber", "till I find a place for the Lord,\na dwelling for the Strong One of Jacob.”", "At Ephrata we heard of the ark;\nwe found it in the plains of Yearim.", "“Let us go to the place of his dwelling;\nlet us go to kneel at his footstool.”", "Go up, Lord, to the place of your rest,\nyou and the ark of your strength.", "Your priests shall be clothed with holiness;\nyour faithful shall ring out their joy.", "For the sake of David your servant\ndo not reject your anointed.", "The Lord swore an oath to David;\nhe will not go back on this word:\n“A son, the fruit of your body,\nwill I set upon your throne.", "If they keep my covenant in truth\nand my laws that I have taught them,\ntheir sons too shall rule\non your throne from age to age.”", "For the Lord has chosen Zion;\nhe has desired it for his dwelling:", "“This is my resting-place for ever;\nhere have I chosen to live.", "I will greatly bless her produce,\nI will fill her poor with bread.", "I will clothe her priests with salvation\nand her faithful shall ring out their joy.", "There David’s stock will flower;\nI will prepare a lamp for my anointed.", "I will cover his enemies with shame\nbut on him my crown shall shine.”"]], ["Ecce quam bonum!", ["How good and how pleasant it is,\nwhen brothers live in unity!", "It is like precious oil upon the head\nrunning down upon the beard,\nrunning down upon Aaron’s beard,\nupon the collar of his robes.", "It is like the dew of Hermon which falls\non the heights of Zion.\nFor there the Lord gives his blessing,\nlife for ever."]], ["Ecce nunc", ["O come, bless the Lord,\nall you who serve the Lord,\nwho stand in the house of the Lord,\nin the courts of the house of our God.", "Lift up your hands to the holy place\nand bless the Lord through the night.", "May the Lord bless you from Zion,\nhe who made both heaven and earth."]], ["Laudate nomen", ["ALLELUIA!\nPraise the name of the Lord,\npraise him, servants of the Lord,", "who stand in the house of the Lord\nin the courts of the house of our God.", "Praise the Lord for the Lord is good.\nSing a psalm to his name for he is loving.", "For the Lord has chosen Jacob for himself\nand Israel for his own possession.", "For I know that the Lord is great,\nthat our Lord is high above all gods.", "The Lord does whatever he wills,\nin heaven, on earth, in the seas.", "He summons clouds from the ends of the earth;\nmakes lightning produce the rain;\nfrom his treasuries he sends forth the wind.", "The first-born of the Egyptians he smote,\nof man and beast alike.", "Signs and wonders he worked\nin the midst of your land, O Egypt,\nagainst Pharaoh and all his servants.", "Nations in their greatness he struck\nand kings in their splendor he slew.", "Sihon, king of the Amorites,\nOg, the king of Bashan,\nand all the kingdoms of Canaan.", "He let Israel inherit their land;\non his people their land he bestowed.", "Lord, your name stands for ever,\nunforgotten from age to age,", "for the Lord does justice for his people;\nthe Lord takes pity on his servants.", "Pagan idols are silver and gold,\nthe work of human hands.", "They have mouths but they cannot speak;\nthey have eyes but they cannot see.", "They have ears but they cannot hear;\nthere is never a breath on their lips.", "Their makers will come to be like them\nand so will all who trust in them!", "Sons of Israel, bless the Lord!\nSons of Aaron, bless the Lord!", "Sons of Levi, bless the Lord!\nYou who fear him, bless the Lord!", "From Zion may the Lord be blessed,\nhe who dwells in Jerusalem!"]], ["Confitemini", ["ALLELUIA!\nO give thanks to the Lord for he is good,\nfor his love endures for ever.", "Give thanks to the God of gods\nfor his love endures for ever.", "Give thanks to the Lord of lords,\nfor his love endures for ever;", "who alone has wrought marvelous works,\nfor his love endures for ever;", "whose wisdom it was made the skies,\nfor his love endures for ever;", "who fixed the earth firmly on the seas,\nfor his love endures for ever.", "It was he who made the great lights,\nfor his love endures for ever;", "the sun to rule in the day,\nfor his love endures for ever;", "the moon and the stars in the night,\nfor his love endures for ever.", "The first-born of the Egyptians he smote,\nfor his love endures for ever.", "He brought Israel out from the midst,\nfor his love endures for ever;", "arm outstretched, with power in his hand,\nfor his love endures for ever.", "He divided the Red Sea in two,\nfor his love endures for ever;", "he made Israel pass through the midst,\nfor his love endures for ever;", "he flung Pharaoh and his force in the sea,\nfor his love endures for ever.", "Through the desert his people he led,\nfor his love endures for ever.", "Nations in their greatness he struck,\nfor his love endures for ever.", "Kings in their splendor he slew,\nfor his love endures for ever.", "Sihon, king of the Amorites,\nfor his love endures for ever;", "and Og, the king of Bashan,\nfor his love endures for ever.", "He let Israel inherit their land,\nfor his love endures for ever.", "On his servant their land he bestowed,\nfor his love endures for ever.", "He remembered us in our distress,\nfor his love endures for ever.", "And he snatched us away from our foes,\nfor his love endures for ever.", "He gives food to all living things,\nfor his love endures for ever.", "To the God of heaven give thanks,\nfor his love endures for ever."]], ["Super flumina", ["By the rivers of Babylon\nthere we sat and wept,\nremembering Zion;", "on the poplars that grew there\nwe hung up our harps.", "For it was there that they asked us,\nour captors, for songs,\nour oppressors, for joy.\n“Sing to us,” they said,\n“one of Zion’s songs.”", "O how could we sing\nthe song of the Lord\non alien soil?", "If I forget you, Jerusalem,\nlet my right hand wither!", "O let my tongue\ncleave to my mouth\nif I remember you not,\nif I prize not Jerusalem\nabove all my joys!", "Remember, O Lord,\nagainst the sons of Edom\nthe day of Jerusalem;\nwhen they said: “Tear it down!\nTear it down to its foundations!”", "O Babylon, destroyer,\nhe is happy who repays you\nthe ills you brought on us.", "He shall seize and shall dash\nyour children on the rock!"]], ["Confitebor tibi", ["I thank you, Lord, with all my heart,\nyou have heard the words of my mouth.\nIn the presence of the angels I will bless you.", "I will adore before your holy temple.\nI thank you for your faithfulness and love\nwhich excel all we ever knew of you.", "On the day I called, you answered;\nyou increased the strength of my soul.", "All earth’s kings shall thank you\nwhen they hear the words of your mouth.", "They shall sing of the Lord’s ways:\n“How great is the glory of the Lord!”", "The Lord is high yet he looks on the lowly\nand the haughty he knows from afar.", "Though I walk in the midst of affliction\nyou give me life and frustrate my foes.\nYou stretch out your hand and save me,", "your hand will do all things for me.\nYour love, O Lord, is eternal,\ndiscard not the work of your hands."]], ["Domine, probasti", ["O Lord, you search me and you know me,", "you know my resting and my rising,\nyou discern my purpose from afar.", "You mark when I walk or lie down,\nall my ways lie open to you.", "Before ever a word is on my tongue\nyou know it, O Lord, through and through.", "Behind and before you besiege me,\nyour hand ever laid upon me.", "Too wonderful for me this knowledge,\ntoo high, beyond my reach.", "O where can I go from your spirit,\nor where can I flee from your face?", "If I climb the heavens, you are there.\nIf I lie in the grave, you are there.", "If I take the wings of the dawn\nand dwell at the sea’s furthest end,", "even there your hand would lead me,\nyour right hand would hold me fast.", "If I say: “Let the darkness hide me\nand the light around me be night,”", "even darkness is not dark for you\nand the night is as clear as the day.", "For it was you who created my being,\nknit me together in my mother’s womb.", "I thank you for the wonder of my being,\nfor the wonders of all your creation.\nAlready you knew my soul", "my body held no secret from you\nwhen I was being fashioned in secret\nand molded in the depths of the earth.", "Your eyes saw all my actions,\nthey were all of them written in your book;\nevery one of my days was decreed\nbefore one of them came into being.", "To me, how mysterious your thoughts,\nthe sum of them not to be numbered!", "If I count them, they are more than the sand;\nto finish, I must be eternal, like you.", "O God, that you would slay the wicked!\nMen of blood, keep far away from me!", "With deceit they rebel against you\nand set your designs at naught.", "Do I not hate those who hate you,\nabhor those who rise against you?", "I hate them with a perfect hate\nand they are foes to me.", "O search me, God, and know my heart.\nO test me and know my thoughts.", "See that I follow not the wrong path\nand lead me in the path of life eternal."]], ["Eripe me, Domine", ["Rescue me, Lord, from evil men;\nfrom the violent keep me safe,", "from those who plan evil in their hearts\nand stir up strife every day;", "who sharpen their tongue like an adder’s,\nwith the poison of viper on their lips.", "Lord, guard me from the hands of the wicked;\nfrom the violent keep me safe;\nthey plan to make me stumble.", "The proud have hidden a trap,\nhave spread out lines in a net,\nset snares across my path.", "I have said to the Lord: “You are my God.”\nLord, hear the cry of my appeal!", "Lord my God, my mighty help,\nyou shield my head in the battle.", "Do not grant the wicked their desire\nnor let their plots succeed.", "Those surrounding me lift up their heads.\nLet the malice of their speech overwhelm them.", "Let coals of fire rain upon them.\nLet them be flung in the abyss, no more to rise.", "Let the slanderer not endure upon the earth.\nLet evil hunt the violent man to death!", "I know that the Lord will avenge the poor,\nthat he will do justice for the needy.\nTruly the just will praise your name\nthe upright shall live in your presence."]], ["Domine, clamavi", ["I have called to you, Lord; hasten to help me!\nHear my voice when I cry to you.", "Let my prayer arise before you like incense,\nthe raising of my hands like an evening oblation.", "Set, O Lord, a guard over my mouth;\nkeep watch, O Lord, at the door of my lips!", "Do not turn my heart to things that are wrong,\nto evil deeds with men who are sinners.\nNever allow me to share in their feasting.", "If a just man strikes or reproves me it is kindness\nbut let the oil of the wicked not anoint my head.\nLet my prayer be ever against their malice.", "Their princes were thrown down by the side of the rock;\nthen they understood that my words were kind.", "As a millstone is shattered to pieces on the ground,\nso their bones were strewn at the mouth of the grave.", "To you, Lord God, my eyes are turned:\nin you I take refuge; spare my soul!", "From the trap they have laid for me keep me safe:\nkeep me from the snares of those who do evil.", "Let the wicked fall into the traps they have set\nwhile I pursue my way unharmed."]], ["Voce mea ad Dominum", ["With all my voice I cry to the Lord,\nwith all my voice I entreat the Lord.", "I pour out my trouble before him;\nI tell him all my distress", "while my spirit faints within me.\nBut you, O Lord, know my path.\nOn the way where I shall walk\nthey have hidden a snare to entrap me.", "Look on my right and see:\nthere is no one who takes my part.\nI have no means of escape,\nnot one who cares for my soul.", "I cry to you, O Lord.\nI have said: “You are my refuge\nall I have in the land of the living.”", "Listen, then, to my cry\nfor I am in the depths of distress.\nRescue me from those who pursue me\nfor they are stronger than I.", "Bring my soul out of this prison\nand then I shall praise your name.\nAround me the just will assemble\nbecause of your goodness to me."]], ["Domine, exaudi", ["Lord, listen to my prayer:\nturn your ear to my appeal.\nYou are faithful, you are just; give answer.", "Do not call your servant to judgment\nfor no one is just in your sight.", "The enemy pursues my soul;\nhe has crushed my life to the ground;\nhe has made me dwell in darkness\nlike the dead, long forgotten.", "Therefore my spirit fails;\nmy heart is numb within me.", "I remember the days that are past:\nI ponder all your works.\nI muse on what your hand has wrought", "and to you I stretch out my hands.\nLike a parched land my soul thirsts for you.", "Lord, make haste and answer;\nfor my spirit fails within me.\nDo not hide your face\nlest I become like those in the grave.", "In the morning let me know your love\nfor I put my trust in you.\nMake me know the way I should walk:\nto you I lift up my soul.", "Rescue me, Lord, from my enemies;\nI have fled to you for refuge.", "Teach me to do your will\nfor you, O Lord, are my God.\nLet your good spirit guide me\nin ways that are level and smooth.", "For your name’s sake, Lord, save my life;\nin your justice save my soul from distress.", "In your love make an end of my foes;\ndestroy all those who oppress me\nfor I am your servant, O Lord."]], ["Benedictus Dominus", ["Blessed be the Lord, my rock,\nwho trains my arms for battle,\nwho prepares my hands for war.", "He is my love, my fortress;\nhe is my stronghold, my savior\nmy shield, my place of refuge.\nHe brings peoples under my rule.", "Lord, what is man that you care for him,\nmortal man, that you keep him in mind;", "man, who is merely a breath\nwhose life fades like a passing shadow?", "Lower your heavens and come down;\ntouch the mountains; wreathe them in smoke.", "Flash your lightnings; rout the foe,\nshoot your arrows and put them to flight.", "Reach down from heaven and save me;\ndraw me out from the mighty waters,\nfrom the hands of alien foes", "whose mouths are filled with lies,\nwhose hands are raised in perjury.", "To you, O God, will I sing a new song;\nI will play on the ten-stringed harp", "to you who give kings their victory,\nwho set David your servant free.", "You set him free from the evil sword;\nyou rescued him from alien foes\nwhose mouths were filled with lies,\nwhose hands were raised in perjury.", "Let our sons then flourish like saplings\ngrown tall and strong from their youth,\nour daughters graceful as columns,\nadorned as though for a palace.", "Let our barns be filled to overflowing\nwith crops of every kind;\nour sheep increasing by thousands,\nmyriads of sheep in our fields,", "our cattle heavy with young,\nno ruined wall, no exile,\nno sound of weeping in our streets.", "Happy the people with such blessings;\nhappy the people whose God is the Lord."]], ["Exaltabo te, Deus", ["I will give you glory, O God my king,\nI will bless your name for ever.", "I will bless you day after day\nand praise your name for ever.", "The Lord is great, highly to be praised,\nhis greatness cannot be measured.", "Age to age shall proclaim your works,\nshall declare your mighty deeds,", "shall speak of your splendor and glory,\ntell the tale of your wonderful works.", "They will speak of your terrible deeds,\nrecount your greatness and might.", "They will recall your abundant goodness;\nage to age shall ring out your justice.", "The Lord is kind and full of compassion,\nslow to anger, abounding in love.", "How good is the Lord to all,\ncompassionate to all his creatures.", "All your creatures shall thank you, O Lord,\nand your friends shall repeat their blessing.", "They shall speak of the glory of your reign\nand declare your might, O God,", "to make known to all your mighty deeds\nand the glorious splendor of your reign.", "Yours is an everlasting kingdom;\nyour rule lasts from age to age.\nThe Lord is faithful in all his words\nand loving in all his deeds.", "The Lord supports all who fall\nand raises up all who are bowed down.", "The eyes of all creatures look to you\nand you give them their food in due time.", "You open wide your hand,\ngrant the desires of all who live.", "The Lord is just in all his ways\nand loving in all his deeds.", "He is close to all who call him,\nwho call on him from their hearts.", "He grants the desires of those who fear him,\nhe hears their cry and he saves them.", "The Lord protects all who love him;\nthe wicked he will utterly destroy.", "Let me speak the praise of the Lord,\nlet all peoples bless his holy name\nfor ever, for ages unending."]], ["Lauda, anima mea", ["ALLELUIA!\nMy soul, give praise to the Lord;", "I will praise the Lord all my days,\nmake music to my God while I live.", "Put no trust in princes,\nin mortal men in whom there is no help.", "Take their breath, they return to clay\nand their plans that day come to nothing.", "He is happy who is helped by Jacob’s God,\nwhose hope is in the Lord his God,", "who alone made heaven and earth,\nthe seas and all they contain.\nIt is the Lord who keeps faith for ever,", "who is just to those who are oppressed.\nIt is he who gives bread to the hungry,\nthe Lord, who sets prisoners free,", "the Lord who gives sight to the blind,\nwho raises up those who are bowed down,", "the Lord, who protects the stranger\nand upholds the widow and orphan.\nIt is the Lord who loves the just\nbut thwarts the path of the wicked.", "The Lord will reign for ever,\nZion’s God, from age to age.\nALLELUIA!"]], ["Lauda, Jerusalem", ["ALLELUIA!\nPraise the Lord for he is good;\nsing to our God for he is loving:\nto him our praise is due.", "The Lord builds up Jerusalem\nand brings back Israel’s exiles,", "he heals the broken-hearted,\nhe binds up all their wounds." // A small figure in the style of the game, drawn from blocks: robe, head,
// veil or hood, hands. (x, y) is the top-left of a 12 x 22 box; f is the
// running frame; face is 1 (right) or -1 (left).
function drawFigure(L, x, y, f, opt) {
  opt = opt || {};
  x = Math.round(x); y = Math.round(y);
  const ink = "#140c1c";
  const bob = opt.still ? 0 : (f % 2);
  const fy = y + bob;
  // Legs and feet, running.
  if (!opt.seated) {
    const a = opt.air ? 1 : f % 4 < 2 ? 0 : 1;
    rect(x + 2 + (a ? 0 : 2), y + 19, 3, 3, ink); rect(x + 7 - (a ? 0 : 2), y + 19, 3, 3, ink);
  }
  // Robe.
  rect(x + 1, fy + 8, 10, 12, ink);
  rect(x + 2, fy + 9, 8, 10, L.robe);
  rect(x + 2, fy + 15, 8, 4, L.shade);
  if (L.mantle) { rect(x + 1, fy + 9, 2, 10, L.mantle); rect(x + 9, fy + 9, 2, 10, L.mantle); }
  if (L.armor) { rect(x + 2, fy + 9, 8, 6, L.armor); rect(x + 3, fy + 10, 6, 1, "#ffffff"); }
  if (L.cord) { rect(x + 2, fy + 13, 8, 1, L.cord); rect(x + 4, fy + 14, 1, 4, L.cord); }
  // Arms.
  rect(x + (opt.reach ? 10 : 9), fy + 10, 3, 3, L.skin);
  // Head.
  rect(x + 2, fy, 8, 9, ink);
  rect(x + 3, fy + 1, 6, 7, L.skin);
  rect(x + 7, fy + 3, 1, 1, ink);
  if (L.veil) { rect(x + 2, fy, 3, 9, L.veil); rect(x + 2, fy, 8, 2, L.veil); rect(x + 4, fy + 1, 5, 1, L.wimple); rect(x + 3, fy + 7, 6, 2, L.wimple); }
  if (L.hood) { rect(x + 2, fy, 2, 9, L.robe); rect(x + 2, fy, 8, 1, L.robe); }
  if (L.hair && !L.hood) { rect(x + 3, fy + 1, 6, 1, L.hair); rect(x + 3, fy + 1, 1, 3, L.hair); }
  if (L.tonsure) { rect(x + 3, fy + 1, 6, 2, L.hair); rect(x + 5, fy + 1, 2, 1, L.skin); }
  if (L.beard) { rect(x + 4, fy + 5, 5, 3, L.beard); }
  if (L.helm) { rect(x + 2, fy - 1, 8, 3, "#c8ccd4"); rect(x + 5, fy - 3, 2, 2, "#b8322a"); }
  if (L.crown) { rect(x + 3, fy - 2, 6, 2, "#e8b94a"); rect(x + 3, fy - 4, 1, 2, "#e8b94a"); rect(x + 5, fy - 4, 2, 2, "#e8b94a"); rect(x + 8, fy - 4, 1, 2, "#e8b94a"); }
  if (L.eyes) rect(x + 6, fy + 3, 2, 1, L.eyes);
  // Things held.
  if (L.hold === "rose") { rect(x + 11, fy + 8, 2, 2, "#d8324a"); rect(x + 11, fy + 10, 1, 3, "#2f7a3a"); }
  if (L.staff) { rect(x + 12, fy + 2, 1, 18, "#8a5a2b"); rect(x + 11, fy + 2, 3, 1, "#8a5a2b"); }
  if (L.board && !opt.air) { rect(x - 5, fy - 2, 4, 22, "#140c1c"); rect(x - 4, fy - 1, 2, 20, "#ffcf5a"); rect(x - 4, fy + 8, 2, 2, "#3a8ad0"); }
  if (L.sprig) { rect(x + 11, fy + 6, 1, 6, "#2f7a3a"); rect(x + 10, fy + 5, 3, 2, "#5ac04a"); rect(x + 12, fy + 8, 2, 1, "#5ac04a"); }
  if (L.gold) { rect(x + 2, fy + 13, 8, 1, "#e8b94a"); }
  if (L.wreath) { rect(x + 3, fy - 1, 6, 1, "#f4f0e8"); rect(x + 3, fy - 1, 1, 1, "#ff7a9a"); rect(x + 6, fy - 1, 1, 1, "#ff7a9a"); }
  if (L.keys) { rect(x + 11, fy + 9, 3, 1, "#e8b94a"); rect(x + 12, fy + 9, 1, 5, "#e8b94a"); rect(x + 11, fy + 12, 3, 1, "#cfd6dc"); }
  if (L.mitre) { rect(x + 3, fy - 4, 6, 4, "#f4f0e8"); rect(x + 5, fy - 6, 2, 2, "#f4f0e8"); rect(x + 5, fy - 4, 2, 4, "#e8b94a"); }
  if (L.heart) { rect(x + 11, fy + 8, 3, 3, "#d8324a"); rect(x + 12, fy + 6, 1, 2, "#ffb030"); }
  if (L.sash) { for (let k = 0; k < 6; k++) rect(x + 3 + k, fy + 9 + k, 2, 1, L.sash); }
  if (L.candles) { rect(x + 2, fy - 2, 8, 2, "#3a8a3a"); for (const k of [2, 5, 8]) { rect(x + k, fy - 5, 1, 3, "#f4f0e8"); rect(x + k, fy - 7, 1, 2, "#ffcf5a"); } }
  if (L.dove) { rect(x + 1, fy - 5, 4, 2, "#ffffff"); rect(x - 1, fy - 6, 2, 1, "#ffffff"); }
  if (L.weapon) { rect(x - 3, fy + 6, 1, 14, "#8a8a92"); rect(x - 4, fy + 4, 3, 3, "#c8ccd4"); }
}

// ---- Input ------------------------------------------------------------------------
const input = { jumpHeld: false, jumpPressed: false, attackPressed: false, taps: [] };
const jumpPointers = new Set();
function toGame(ev) { return { x: (ev.clientX - offX) / scale, y: (ev.clientY - offY) / scale }; }
// Touches anywhere on the screen count, not only on the picture: on a phone
// held upright, the black space above and below is part of the controls.
addEventListener("pointerdown", (ev) => {
  if (ev.cancelable) ev.preventDefault();
  Snd.init();
  const p = toGame(ev);
  if (state === "play") {
    if (p.x > W - 22 && p.x <= W && p.y >= 0 && p.y < 20) { pause(); return; }
    if (ev.clientX < innerWidth / 2) { jumpPointers.add(ev.pointerId); input.jumpHeld = true; input.jumpPressed = true; }
    else input.attackPressed = true;
  } else input.taps.push(p);
}, { passive: false });
const release = (ev) => { jumpPointers.delete(ev.pointerId); input.jumpHeld = jumpPointers.size > 0; };
addEventListener("pointerup", release); addEventListener("pointercancel", release);
addEventListener("contextmenu", (e) => e.preventDefault());
const JUMP_KEYS = ["Space", "ArrowUp", "KeyW", "KeyZ"], ATTACK_KEYS = ["KeyX", "KeyJ", "Enter", "KeyK"];
const keys = new Set();
addEventListener("keydown", (e) => {
  Snd.init();
  if (e.repeat) return;
  keys.add(e.code);
  if (state === "play") {
    if (JUMP_KEYS.includes(e.code)) { input.jumpHeld = true; input.jumpPressed = true; e.preventDefault(); }
    if (ATTACK_KEYS.includes(e.code)) { input.attackPressed = true; e.preventDefault(); }
    if (e.code === "KeyP" || e.code === "Escape") pause();
  } else input.taps.push({ key: e.code });
  if (e.code === "KeyM") Snd.toggle();
});
addEventListener("keyup", (e) => { keys.delete(e.code); if (JUMP_KEYS.includes(e.code)) input.jumpHeld = jumpPointers.size > 0 || JUMP_KEYS.some((k) => keys.has(k)); });
addEventListener("blur", () => { if (state === "play") pause(); });

// ---- Things in the world -------------------------------------------------------------
// Every level is built from three kinds of thing: ground (solid blocks with
// walls), platforms (you land on them from above; some bounce), and
// entities (foes, hazards, neumes to catch). x runs from 0 at the start of a
// phase to its length; y grows downward, with level ground at 150.

const GROUND = 150;
function E(type, x, y, w, h, extra) { return Object.assign({ type, x, y, w, h, hp: 1, hostile: true, alive: true, t: 0 }, extra || {}); }
const neume = (x, y) => E("neume", x, y, 8, 8, { hostile: false, prize: true });

// ---- The phases ------------------------------------------------------------------------
// Each psalm runs through four phases. A phase builds its stretch of world,
// paints its own sky, and names the verses shown while it runs. `into` is
// the cut scene that opens it.

function arcOfNeumes(ents, x, y, n) { for (let i = 0; i < n; i++) ents.push(neume(x + i * 14, y - Math.sin((i / (n - 1 || 1)) * Math.PI) * 22)); }

// A stretch of ground, now and then broken by a gap.
function groundWithGaps(r, L, kind, gapChance, gapMin, gapMax, segs, ents, gapDecor) {
  let x = -200;
  while (x < L + 400) {
    const w = x < 200 ? 480 : 150 + r() * 220;
    segs.push({ x0: x, x1: x + w, y: GROUND, kind });
    x += w;
    if (x > 300 && x < L - 100 && r() < gapChance) { const g = gapMin + r() * (gapMax - gapMin); if (gapDecor) ents.push(E(gapDecor, x, GROUND + 4, g, 30, { hostile: false, decor: true })); x += g; }
  }
}
const prize = (look, x, y) => E("gift", x, y, 9, 9, { hostile: false, prize: true, look });
// Places along the run, spaced out, where something is set.
function spots(r, L, gap, spread, f) { let x = 340; while (x < L - 200) { f(x); x += gap + r() * spread; } }

      const w = 54 + r() * 70, y = GROUND - Math.round(r() * 2) * 8;

// How many stages a psalm of so many verses gets.
const stageCount = (n) => (n <= 3 ? 1 : n <= 7 ? 2 : n <= 13 ? 3 : n <= 24 ? 4 : n <= 60 ? 5 : 8);
const TITLE_SKIP = new Set(["and", "but", "for", "the", "o", "a", "then", "so", "that", "who", "when"]);
// A stage's name: the line of its verses that carries its image, shortened.
function stageName(verses, kind) {
  const lines = verses.join("\n").replace(/ALLELUIA!?/g, "").split("\n").map((l) => l.trim()).filter((l) => l.length > 6);
  const list = (IMAGERY[kind] || "").split(" ");
  let best = lines.find((l) => l.toLowerCase().split(/[^a-z]+/).some((w) => list.includes(w))) || lines[0] || "Alleluia";
  best = best.replace(/[“”"()]/g, "").replace(/‘/g, "").replace(/[,;:.!?]+$/, "");
  // Up to the first pause, if that leaves a phrase of three words or more.
  const clause = best.split(/[,;:]/)[0].trim().split(/\s+/);
  while (clause.length > 2 && TITLE_SKIP.has(clause[0].toLowerCase())) clause.shift();
  if (clause.length >= 4) best = clause.join(" ");
  let words = best.trim().split(/\s+/);
  while (words.length > 2 && TITLE_SKIP.has(words[0].toLowerCase())) words.shift();
  if (words.length > 7) words = words.slice(0, 7).concat("…");
  const s = words.join(" ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
// The plan of a psalm: its stages, each with its verses, its place, its pace.
const planCache = {};

  const given = PLANS[num];
  const count = given ? given.length : stageCount(n);
  const per = n / count;
  const progress = pi / 149;                       // later psalms run a little faster
  const stages = [];
  let prev = null, anchor = -1;
  for (let i = 0; i < count; i++) {
    let idx = []; for (let v = Math.floor(i * per); v < Math.max(Math.floor((i + 1) * per), Math.floor(i * per) + 1); v++) idx.push(v);
    const text = idx.map((v) => verses[v]).join(" ").toLowerCase();
    let kind = given && given[i];

function drawPlay() {
  const P = world.P;
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));
  SKY[P.sky](camX, camY, world.t);
  for (const g of world.segs) drawSeg(g, camX, camY);
  for (const e of world.ents) if (e.type === "lava" || e.type === "river") drawEntity(e);
  for (const p of world.plats) drawPlat(p, camX, camY);
  for (const e of world.ents) if (e.type !== "lava" && e.type !== "river" && e.x - camX < W + 20 && e.x - camX > -40) drawEntity(e);
  drawShots();
  drawPlayer();
  for (const p of parts) rect(p.x - camX, p.y - camY, 2, 2, p.c);
  ctx.restore();
  drawHud();
}

function pause() { if (state === "play") { state = "pause"; input.taps = []; } }
