<canvas id="screen" aria-label="Psalter Runner"></canvas>
<script>
"use strict";
// Psalter Runner: a 16-bit auto-runner through all 150 psalms.
// One file, nothing to load. Left half of the screen: tap to jump, hold to
// float. Right half: tap to attack. Keys: Space / Up / W to jump (hold to
// float), X / J / Enter to attack, P or Esc to pause, M for sound.

// ---- The psalms ------------------------------------------------------------------
// The text in the background, and under the run: the Douay-Rheims Bible
// (Challoner, in the public domain), from the Lumina project
// (github.com/munkachy/lumina), checked verse by verse against drbo.org and
// eBible.org, without the psalm headings, each verse set in lines at its
// colons and semicolons.
// Each phase below names the verses it shows, counting from 0.
const flat = (v) => v.replace(/\n/g, " ");
// [Latin incipit, verses, Vulgate number], Psalms 1 to 150 in the Hebrew
// numbering; the Douay's own (Vulgate) number is shown beside it where it differs.
const PSALTER = [["Beatus vir qui non abiit", ["Blessed is the man who hath not walked in the counsel of the ungodly, nor stood in the way of sinners, nor sat in the chair of pestilence:", "But his will is in the law of the Lord, and on his law he shall meditate day and night.", "And he shall be like a tree which is planted near the running waters, which shall bring forth its fruit, in due season. And his leaf shall not fall off:\nand all whatsoever he shall do shall prosper.", "Not so the wicked, not so:\nbut like the dust, which the wind driveth from the face of the earth.", "Therefore the wicked shall not rise again in judgment:\nnor sinners in the council of the just.", "For the Lord knoweth the way of the just:\nand the way of the wicked shall perish."], "1"], ["Quare fremuerunt gentes", ["Why have the Gentiles raged, and the people devised vain things?", "The kings of the earth stood up, and the princes met together, against the Lord, and against his Christ.", "Let us break their bonds asunder:\nand let us cast away their yoke from us.", "He that dwelleth in heaven shall laugh at them:\nand the Lord shall deride them.", "Then shall he speak to them in his anger, and trouble them in his rage.", "But I am appointed king by him over Sion, his holy mountain, preaching his commandment.", "The Lord hath said to me:\nThou art my son, this day have I begotten thee.", "Ask of me, and I will give thee the Gentiles for thy inheritance, and the utmost parts of the earth for thy possession.", "Thou shalt rule them with a rod of iron, and shalt break them in pieces like a potter's vessel.", "And now, O ye kings, understand:\nreceive instruction, you that judge the earth.", "Serve ye the Lord with fear:\nand rejoice unto him with trembling.", "Embrace discipline, lest at any time the Lord be angry, and you perish from the just way.", "When his wrath shall be kindled in a short time, blessed are all they that trust in him."], "2"], ["Domine, quid multiplicati", ["Why, O Lord, are they multiplied that afflict me? Many are they who rise up against me.", "Many say to my soul:\nThere is no salvation for him in his God.", "But thou, O Lord, art my protector, my glory, and the lifter up of my head.", "I have cried to the Lord with my voice:\nand he hath heard me from his holy hill.", "I have slept and taken my rest:\nand I have risen up, because the Lord hath protected me.", "I will not fear thousands of the people surrounding me:\narise, O Lord;\nsave me, O my God.", "For thou hast struck all them who are my adversaries without cause:\nthou hast broken the teeth of sinners.", "Salvation is of the Lord:\nand thy blessing is upon thy people."], "3"], ["Cum invocarem", ["When I called upon him, the God of my justice heard me:\nwhen I was in distress, thou hast enlarged me. Have mercy on me:\nand hear my prayer.", "O ye sons of men, how long will you be dull of heart? why do you love vanity, and seek after lying?", "Know ye also that the Lord hath made his holy one wonderful:\nthe Lord will hear me when I shall cry unto him.", "Be angry, and sin not:\nthe things you say in your hearts, be sorry for them upon your beds.", "Offer up the sacrifice of justice, and trust in the Lord:\nmany say, Who sheweth us good things?", "The light of thy countenance, O Lord, is signed upon us:\nthou hast given gladness in my heart.", "By the fruit of their corn, their wine and oil, they are multiplied.", "In peace in the selfsame I will sleep, and I will rest:", "For thou, O Lord, singularly hast settled me in hope."], "4"], ["Verba mea auribus", ["Give ear, O Lord, to my words, understand my cry.", "Hearken to the voice of my prayer, O my King and my God.", "For to thee will I pray:\nO Lord, in the morning thou shalt hear my voice.", "In the morning I will stand before thee, and will see:\nbecause thou art not a God that willest iniquity.", "Neither shall the wicked dwell near thee:\nnor shall the unjust abide before thy eyes.", "Thou hatest all the workers of iniquity:\nthou wilt destroy all that speak a lie. The bloody and the deceitful man the Lord will abhor.", "But as for me in the multitude of thy mercy, I will come into thy house;\nI will worship towards thy holy temple, in thy fear.", "Conduct me, O Lord, in thy justice:\nbecause of my enemies, direct my way in thy sight.", "For there is no truth in their mouth:\ntheir heart is vain.", "Their throat is an open sepulchre:\nthey dealt deceitfully with their tongues:\njudge them, O God. Let them fall from their devices:\naccording to the multitude of their wickedness cast them out:\nfor they have provoked thee, O Lord.", "But let all them be glad that hope in thee:\nthey shall rejoice for ever, and thou shalt dwell in them. And all they that love thy name shall glory in thee.", "For thou wilt bless the just. O Lord, thou hast crowned us, as with a shield of thy good will."], "5"], ["Domine, ne in furore", ["O Lord, rebuke me not in thy indignation, nor chastise me in thy wrath.", "Have mercy on me, O Lord, for I am weak:\nheal me, O Lord, for my bones are troubled.", "And my soul is troubled exceedingly:\nbut thou, O Lord, how long?", "Turn to me, O Lord, and deliver my soul:\nO save me for thy mercy's sake.", "For there is no one in death, that is mindful of thee:\nand who shall confess to thee in hell?", "I have laboured in my groanings, every night I will wash my bed:\nI will water my couch with my tears.", "My eye is troubled through indignation:\nI have grown old amongst all my enemies.", "Depart from me, all ye workers of iniquity:\nfor the Lord hath heard the voice of my weeping.", "The Lord hath heard my supplication:\nthe Lord hath received my prayer.", "Let all my enemies be ashamed, and be very much troubled:\nlet them be turned back, and be ashamed very speedily."], "6"], ["Domine, Deus meus", ["O Lord my God, in thee have I put my trust:\nsave me from all them that persecute me, and deliver me.", "Lest at any time he seize upon my soul like a lion, while there is no one to redeem me, nor to save.", "O Lord, my God, if I have done this thing, if there be iniquity in my hands:", "If I have rendered to them that repaid me evils, let me deservedly fall empty before my enemies.", "Let the enemy pursue my soul, and take it, and tread down my life, on the earth, and bring down my glory to the dust.", "Rise up, O Lord, in thy anger:\nand be thou exalted in the borders of my enemies. And arise, O Lord, my God, in the precept which thou hast commanded:", "And a congregation of people shall surround thee. And for their sakes return thou on high.", "The Lord judgeth the people. Judge me, O Lord, according to my justice, and according to my innocence in me.", "The wickedness of sinners shall be brought to nought;\nand thou shalt direct the just:\nthe searcher of hearts and reins is God.", "Just is my help from the Lord;\nwho saveth the upright of heart.", "God is a just judge, strong and patient:\nis he angry every day?", "Except you will be converted, he will brandish his sword;\nhe hath bent his bow, and made it ready.", "And in it he hath prepared the instruments of death, he hath made ready his arrows for them that burn .", "Behold he hath been in labour with injustice:\nhe hath conceived sorrow, and brought forth iniquity.", "He hath opened a pit and dug it:\nand he is fallen into the hole he made.", "His sorrow shall be turned on his own head:\nand his iniquity shall come down upon his crown.", "I will give glory to the Lord according to his justice:\nand will sing to the name of the Lord the most high."], "7"], ["Domine, Dominus noster", ["O Lord, our Lord, how admirable is thy name in the whole earth! For thy magnificence is elevated above the heavens.", "Out of the mouth of infants and of sucklings thou hast perfected praise, because of thy enemies, that thou mayst destroy the enemy and the avenger.", "For I will behold thy heavens, the works of thy fingers:\nthe moon and the stars which thou hast founded.", "What is man, that thou art mindful of him? or the son of man, that thou visitest him?", "Thou hast made him a little less than the angels, thou hast crowned him with glory and honour:", "And hast set him over the works of thy hands.", "Thou hast subjected all things under his feet, all sheep and oxen:\nmoreover, the beasts also of the fields.", "The birds of the air, and the fishes of the sea, that pass through the paths of the sea.", "O Lord our Lord, how admirable is thy name in all the earth!"], "8"], ["Confitebor tibi", ["I will give praise to thee, O Lord, with my whole heart:\nI will relate all thy wonders.", "I will be glad, and rejoice in thee:\nI will sing to thy name, O thou most high.", "When my enemy shall be turned back:\nthey shall be weakened, and perish before thy face.", "For thou hast maintained my judgment and my cause:\nthou hast sat on the throne, who judgest justice.", "Thou hast rebuked the Gentiles, and the wicked one hath perished;\nthou hast blotted out their name for ever and ever.", "The swords of the enemy have failed unto the end:\nand their cities thou hast destroyed. Their memory hath perished with a noise:", "But the Lord remaineth for ever. He hath prepared his throne in judgment:", "And he shall judge the world in equity, he shall judge the people in justice.", "And the Lord is become a refuge for the poor:\na helper in due time in tribulation.", "And let them trust in thee who know thy name:\nfor thou hast not forsaken them that seek thee, O Lord.", "Sing ye to the Lord, who dwelleth in Sion:\ndeclare his ways among the Gentiles:", "For requiring their blood, he hath remembered them:\nhe hath not forgotten the cry of the poor.", "Have mercy on me, O Lord:\nsee my humiliation which I suffer from my enemies.", "Thou that liftest me up from the gates of death, that I may declare all thy praises in the gates of the daughter of Sion.", "I will rejoice in thy salvation:\nthe Gentiles have stuck fast in the destruction which they have prepared. Their foot hath been taken in the very snare which they hid.", "The Lord shall be known when he executeth judgments:\nthe sinner hath been caught in the works of his own hands.", "The wicked shall be turned into hell, all the nations that forget God.", "For the poor man shall not be forgotten to the end:\nthe patience of the poor shall not perish for ever.", "Arise, O Lord, let not man be strengthened:\nlet the Gentiles be judged in thy sight.", "Appoint, O Lord, a lawgiver over them:\nthat the Gentiles may know themselves to be but men."], "9A"], ["Ut quid Domine", ["Why, O Lord, hast thou retired afar off? why dost thou slight us in our wants, in the time of trouble?", "Whilst the wicked man is proud, the poor is set on fire:\nthey are caught in the counsels which they devise.", "For the sinner is praised in the desires of his soul:\nand the unjust man is blessed.", "The sinner hath provoked the Lord, according to the multitude of his wrath, he will not seek him:", "God is not before his eyes:\nhis ways are filthy at all times. Thy judgments are removed from his sight:\nhe shall rule over all his enemies.", "For he hath said in his heart:\nI shall not be moved from generation to generation, and shall be without evil.", "His mouth is full of cursing, and of bitterness, and of deceit:\nunder his tongue are labour and sorrow.", "He sitteth in ambush with the rich, in private places, that he may kill the innocent.", "His eyes are upon the poor man:\nHe lieth in wait in secret like a lion in his den. He lieth in ambush that he may catch the poor man:\nto catch the poor, whilst he draweth him to him.", "In his net he will bring him down, he will crouch and fall, when he shall have power over the poor.", "For he hath said in his heart:\nGod hath forgotten, he hath turned away his face, not to see to the end.", "Arise, O Lord God, let thy hand be exalted:\nforget not the poor.", "Wherefore hath the wicked provoked God? for he hath said in his heart:\nHe will not require it.", "Thou seest it, for thou considerest labour and sorrow:\nthat thou mayst deliver them into thy hands. To thee is the poor man left:\nthou wilt be a helper to the orphan.", "Break thou the arm of the sinner and of the malignant:\nhis sin shall be sought, and shall not be found.", "The Lord shall reign to eternity, yea, for ever and ever:\nye Gentiles shall perish from his land.", "The Lord hath heard the desire of the poor:\nthy ear hath heard the preparation of their heart.", "To judge for the fatherless and for the humble, that man may no more presume to magnify himself upon earth."], "9B"], ["In Domino confido", ["In the Lord I put my trust:\nhow then do you say to my soul:\nGet thee away from hence to the mountain, like a sparrow.", "For, lo, the wicked have bent their bow:\nthey have prepared their arrows in the quiver, to shoot in the dark the upright of heart.", "For they have destroyed the things which thou hast made:\nbut what has the just man done?", "The Lord is in his holy temple, the Lord's throne is in heaven. His eyes look on the poor man:\nhis eyelids examine the sons of men.", "The Lord trieth the just and the wicked:\nbut he that loveth iniquity, hateth his own soul.", "He shall rain snares upon sinners:\nfire and brimstone, and storms of winds, shall be the portion of their cup.", "For the Lord is just, and hath loved justice:\nhis countenance hath beheld righteousness."], "10"], ["Salva me fac", ["Save me, O Lord, for there is now no saint:\ntruths are decayed from among the children of men.", "They have spoken vain things, every one to his neighbour:\nwith deceitful lips, and with a double heart have they spoken.", "May the Lord destroy all deceitful lips, and the tongue that speaketh proud things.", "Who have said:\nWe will magnify our tongue:\nour lips are our own:\nwho is Lord over us?", "By reason of the misery of the needy, and the groans of the poor, now will I arise, saith the Lord. I will set him in safety:\nI will deal confidently in his regard.", "The words of the Lord are pure words:\nas silver tried by the fire, purged from the earth, refined seven times.", "Thou, O Lord, wilt preserve us:\nand keep us from this generation for ever.", "The wicked walk round about:\naccording to thy highness, thou hast multiplied the children of men."], "11"], ["Usquequo, Domine?", ["How long, O Lord, wilt thou forget me unto the end? how long dost thou turn away thy face from me?", "How long shall I take counsels in my soul, sorrow in my heart all the day?", "How long shall my enemy be exalted over Me?", "Consider, and hear me, O Lord, my God. Enlighten my eyes, that I never sleep in death:", "Lest at any time my enemy say:\nI have prevailed against him. They that trouble me, will rejoice when I am moved:", "But I have trusted in thy mercy. My heart shall rejoice in thy salvation:\nI will sing to the Lord, who giveth me good things:\nyea, I will sing to the name of the Lord, the most high."], "12"], ["Dixit insipiens", ["The fool hath said in his heart:\nThere is no God. They are corrupt, and are become abominable in their ways:\nthere is none that doth good, no not one.", "The Lord hath looked down from heaven upon the children of men, to see if there be any that understand and seek God.", "They are all gone aside, they are become unprofitable together:\nthere is none that doth good:\nno not one. Their throat is an open sepulchre;\nwith their tongues they acted deceitfully:\nthe poison of asps is under their lips. Their mouth is full of cursing and bitterness;\ntheir feet are swift to shed blood. Destruction and unhappiness in their ways;\nand the way of peace they have not known:\nthere is no fear of God before their eyes.", "Shall not all they know that work iniquity, who devour my people as they eat bread?", "They have not called upon the Lord:\nthere have they trembled for fear, where there was no fear.", "For the Lord is in the just generation:\nyou have confounded the counsel of the poor man;\nbut the Lord is his hope.", "Who shall give out of Sion the salvation of Israel? when the Lord shall have turned away the captivity of his people, Jacob shall rejoice, and Israel shall be glad."], "13"], ["Domine, quis habitabit?", ["Lord, who shall dwell in thy tabernacle? or who shall rest in thy holy hill?", "He that walketh without blemish, and worketh justice:", "He that speaketh truth in his heart, who hath not used deceit in his tongue:\nNor hath done evil to his neighbour:\nnor taken up a reproach against his neighbours.", "In his sight the malignant is brought to nothing:\nbut he glorifieth them that fear the Lord. He that sweareth to his neighbour, and deceiveth not;", "He that hath not put out his money to usury, nor taken bribes against the innocent:\nHe that doth these things, shall not be moved for ever."], "14"], ["Conserva me, Domine", ["Preserve me, O Lord, for I have put my trust in thee.", "I have said to the Lord, thou art my God, for thou hast no need of my goods.", "To the saints, who are in his land, he hath made wonderful all my desires in them.", "Their infirmities were multiplied:\nafterwards they made haste. I will not gather together their meetings for blood offerings:\nnor will I be mindful of their names by my lips.", "The Lord is the portion of my inheritance and of my cup:\nit is thou that wilt restore my inheritance to me.", "The lines are fallen unto me in goodly places:\nfor my inheritance is goodly to me.", "I will bless the Lord, who hath given me understanding:\nmoreover, my reins also have corrected me even till night.", "I set the Lord always in my sight:\nfor he is at my right hand, that I be not moved.", "Therefore my heart hath been glad, and my tongue hath rejoiced:\nmoreover, my flesh also shall rest in hope.", "Because thou wilt not leave my soul in hell;\nnor wilt thou give thy holy one to see corruption.", "Thou hast made known to me the ways of life, thou shalt fill me with joy with thy countenance:\nat thy right hand are delights even to the end."], "15"], ["Exaudi Domine", ["Hear, O Lord, my justice:\nattend to my supplication. Give ear unto my prayer, which proceedeth not from deceitful lips.", "Let my judgment come forth from thy countenance:\nlet thy eyes behold the things that are equitable.", "Thou hast proved my heart, and visited it by night, thou hast tried me by fire:\nand iniquity hath not been found in me.", "That my mouth may not speak the works of men:\nfor the sake of the words of thy lips, I have kept hard ways.", "Perfect thou my goings in thy paths:\nthat my footsteps be not moved.", "I have cried to thee, for thou, O God, hast heard me:\nO incline thy ear unto me, and hear my words.", "Shew forth thy wonderful mercies;\nthou who savest them that trust in thee.", "From them that resist thy right hand keep me, as the apple of thy eye. Protect me under the shadow of thy wings.", "From the face of the wicked who have afflicted me. My enemies have surrounded my soul:", "They have shut up their fat:\ntheir mouth hath spoken proudly.", "They have cast me forth, and now they have surrounded me:\nthey have set their eyes bowing down to the earth.", "They have taken me, as a lion prepared for the prey;\nand as a young lion dwelling in secret places.", "Arise, O Lord, disappoint him and supplant him;\ndeliver my soul from the wicked one;\nthy sword", "From the enemies of thy hand. O Lord, divide them from the few of the earth in their life:\ntheir belly is filled from thy hidden stores. They are full of children:\nand they have left to their little ones the rest of their substance.", "But as for me, I will appear before thy sight in justice:\nI shall be satisfied when thy glory shall appear."], "16"], ["Diligam te, Domine", ["I will love thee, O Lord, my strength:", "The Lord is my firmament, my refuge, and my deliverer. My God is my helper, and in him will I put my trust. My protector, and the horn of my salvation, and my support.", "Praising, I will call upon the Lord:\nand I shall be saved from my enemies.", "The sorrows of death surrounded me:\nand the torrents of iniquity troubled me.", "The sorrows of hell encompassed me:\nand the snares of death prevented me.", "In my affliction I called upon the Lord, and I cried to my God:\nAnd he heard my voice from his holy temple:\nand my cry before him came into his ears.", "The earth shook and trembled:\nthe foundations of the mountains were troubled and were moved, because he was angry with them.", "There went up a smoke in his wrath:\nand a fire flamed from his face:\ncoals were kindled by it.", "He bowed the heavens, and came down, and darkness was under his feet.", "And he ascended upon the cherubim, and he flew;\nhe flew upon the wings of the winds.", "And he made darkness his covert, his pavilion round about him:\ndark waters in the clouds of the air.", "At the brightness that was before him the clouds passed, hail and coals of fire.", "And the Lord thundered from heaven, and the Highest gave his voice:\nhail and coals of fire.", "And he sent forth his arrows, and he scattered them:\nhe multiplied lightnings, and troubled them.", "Then the fountains of waters appeared, and the foundations of the world were discovered:\nAt thy rebuke, O Lord, at the blast of the spirit of thy wrath.", "He sent from on high, and took me:\nand received me out of many waters.", "He delivered me from my strongest enemies, and from them that hated me:\nfor they were too strong for me.", "They prevented me in the day of my affliction:\nand the Lord became my protector.", "And he brought me forth into a large place:\nhe saved me, because he was well pleased with me.", "And the Lord will reward me according to my justice;\nand will repay me according to the cleanness of my hands:", "Because I have kept the ways of the Lord;\nand have not done wickedly against my God.", "For till his judgments are in my sight:\nand his justices I have not put away from me.", "And I shall be spotless with him:\nand shall keep myself from my iniquity.", "And the Lord will reward me according to my justice:\nand according to the cleanness of my hands before his eyes.", "With the holy thou wilt be holy;\nand with the innocent man thou wilt be innocent:", "And with the elect thou wilt be elect:\nand with the perverse thou wilt be perverted.", "For thou wilt save the humble people;\nbut wilt bring down the eyes of the proud.", "For thou lightest my lamp, O Lord:\nO my God, enlighten my darkness.", "For by thee I shall be delivered from temptation;\nand through my God I shall go over a wall.", "As for my God, his way is undefiled:\nthe words of the Lord are fire-tried:\nhe is the protector of all that trust in him.", "For who is God but the Lord? or who is God but our God?", "God, who hath girt me with strength;\nand made my way blameless.", "Who hath made my feet like the feet of harts:\nand who setteth me upon high places.", "Who teacheth my hands to war:\nand thou hast made my arms like a brazen bow.", "And thou hast given me the protection of thy salvation:\nand thy right hand hath held me up:\nAnd thy discipline hath corrected me unto the end:\nand thy discipline, the same shall teach me.", "Thou hast enlarged my steps under me;\nand my feet are not weakened.", "I will pursue after my enemies, and overtake them:\nand I will not turn again till they are consumed.", "I will break them, and they shall not be able to stand:\nthey shall fall under my feet.", "And thou hast girded me with strength unto battle;\nand hast subdued under me them that rose up against me.", "And thou hast made my enemies turn their back upon me, and hast destroyed them that hated me.", "They cried, but there was none to save them, to the Lord:\nbut he heard them not.", "And I shall beat them as small as the dust before the wind;\nI shall bring them to nought, like the dirt in the streets.", "Thou wilt deliver me from the contradictions of the people;\nthou wilt make me head of the Gentiles.", "A people which I knew not, hath served me:\nat the hearing of the ear they have obeyed me.", "The children that are strangers have lied to me, strange children have faded away, and have halted from their paths.", "The Lord liveth, and blessed be my God, and let the God of my salvation be exalted:", "O God, who avengest me, and subduest the people under me, my deliverer from my enemies.", "And thou wilt lift me up above them that rise up against me:\nfrom the unjust man thou wilt deliver me.", "Therefore will I give glory to thee, O Lord, among the nations, and I will sing a psalm to thy name.", "Giving great deliverance to his king, and shewing mercy to David, his anointed:\nand to his seed for ever."], "17"], ["Caeli enarrant", ["The heavens shew forth the glory of God, and the firmament declareth the work of his hands.", "Day to day uttereth speech, and night to night sheweth knowledge.", "There are no speeches nor languages, where their voices are not heard.", "Their sound hath gone forth into all the earth:\nand their words unto the ends of the world.", "He hath set his tabernacle in the sun:\nand he, as a bridegroom coming out of his bride chamber, Hath rejoiced as a giant to run the way:", "His going out is from the end of heaven, And his circuit even to the end thereof:\nand there is no one that can hide himself from his heat.", "The law of the Lord is unspotted, converting souls:\nthe testimony of the Lord is faithful, giving wisdom to little ones.", "The justices of the Lord are right, rejoicing hearts:\nthe commandment of the Lord is lightsome, enlightening the eyes.", "The fear of the Lord is holy, enduring for ever and ever:\nthe judgments of the Lord are true, justified in themselves.", "More to be desired than gold and many precious stones:\nand sweeter than honey and the honeycomb.", "For thy servant keepeth them, and in keeping them there is a great reward.", "Who can understand sins? from my secret ones cleanse me, O Lord:", "And from those of others spare thy servant. If they shall have no dominion over me, then shall I be without spot:\nand I shall be cleansed from the greatest sin.", "And the words of my mouth shall be such as may please:\nand the meditation of my heart always in thy sight. O Lord, my helper and my Redeemer."], "18"], ["Exaudiat te Dominus", ["May the Lord hear thee in the day of tribulation:\nmay the name of the God of Jacob protect thee.", "May he send thee help from the sanctuary:\nand defend thee out of Sion.", "May he be mindful of all thy sacrifices:\nand may thy whole burnt offering be made fat.", "May he give thee according to thy own heart;\nand confirm all thy counsels.", "We will rejoice in thy salvation;\nand in the name of our God we shall be exalted.", "The Lord fulfill all thy petitions:\nnow have I known that the Lord hath saved his anointed. He will hear him from his holy heaven:\nthe salvation of his right hand is in powers .", "Some trust in chariots, and some in horses:\nbut we will call upon the name of the Lord, our God.", "They are bound, and have fallen:\nbut we are risen, and are set upright. O Lord, save the king:\nand hear us in the day that we shall call upon thee."], "19"], ["Domine, in virtute tua", ["In thy strength, O Lord, the king shall joy;\nand in thy salvation he shall rejoice exceedingly.", "Thou hast given him his heart's desire:\nand hast not withholden from him the will of his lips.", "For thou hast prevented him with blessings of sweetness:\nthou hast set on his head a crown of precious stones.", "He asked life of thee:\nand thou hast given him length of days for ever and ever.", "His glory is great in thy salvation:\nglory and great beauty shalt thou lay upon him.", "For thou shalt give him to be a blessing for ever and ever:\nthou shalt make him joyful in gladness with thy countenance.", "For the king hopeth in the Lord:\nand through the mercy of the most High he shall not be moved.", "Let thy hand be found by all thy enemies:\nlet thy right hand find out all them that hate thee.", "Thou shalt make them as an oven of fire, in the time of thy anger:\nthe Lord shall trouble them in his wrath, and fire shall devour them.", "Their fruit shalt thou destroy from the earth:\nand their seed from among the children of men.", "For they have intended evils against thee:\nthey have devised counsels which they have not been able to establish.", "For thou shalt make them turn their back:\nin thy remnants thou shalt prepare their face.", "Be thou exalted, O Lord, in thy own strength:\nwe will sing and praise thy power."], "20"], ["Deus, Deus meus", ["O God my God, look upon me:\nwhy hast thou forsaken me? Far from my salvation are the words of my sins.", "O my God, I shall cry by day, and thou wilt not hear:\nand by night, and it shall not be reputed as folly in me.", "But thou dwellest in the holy place, the praise of Israel.", "In thee have our fathers hoped:\nthey have hoped, and thou hast delivered them.", "They cried to thee, and they were saved:\nthey trusted in thee, and were not confounded.", "But I am a worm, and no man:\nthe reproach of men, and the outcast of the people.", "All they that saw me have laughed me to scorn:\nthey have spoken with the lips, and wagged the head.", "He hoped in the Lord, let him deliver him:\nlet him save him, seeing he delighteth in him.", "For thou art he that hast drawn me out of the womb:\nmy hope from the breasts of my mother.", "I was cast upon thee from the womb. From my mother's womb thou art my God,", "Depart not from me. For tribulation is very near:\nfor there is none to help me.", "Many calves have surrounded me:\nfat bulls have besieged me.", "They have opened their mouths against me, as a lion ravening and roaring.", "I am poured out like water;\nand all my bones are scattered. My heart is become like wax melting in the midst of my bowels.", "My strength is dried up like a potsherd, and my tongue hath cleaved to my jaws:\nand thou hast brought me down into the dust of death.", "For many dogs have encompassed me:\nthe council of the malignant hath besieged me. They have dug my hands and feet.", "They have numbered all my bones. And they have looked and stared upon me.", "They parted my garments amongst them;\nand upon my vesture they cast lots.", "But thou, O Lord, remove not thy help to a distance from me;\nlook towards my defence.", "Deliver, O God, my soul from the sword:\nmy only one from the hand of the dog.", "Save me from the lion's mouth;\nand my lowness from the horns of the unicorns.", "I will declare thy name to my brethren:\nin the midst of the church will I praise thee.", "Ye that fear the Lord, praise him:\nall ye the seed of Jacob, glorify him.", "Let all the seed of Israel fear him:\nbecause he hath not slighted nor despised the supplication of the poor man. Neither hath he turned away his face from me:\nand when I cried to him he heard me.", "With thee is my praise in a great church:\nI will pay my vows in the sight of them that fear him.", "The poor shall eat and shall be filled:\nand they shall praise the Lord that seek him:\ntheir hearts shall live for ever and ever.", "All the ends of the earth shall remember, and shall be converted to the Lord:\nAnd all the kindreds of the Gentiles shall adore in his sight.", "For the kingdom is the Lord's;\nand he shall have dominion over the nations.", "All the fat ones of the earth have eaten and have adored:\nall they that go down to the earth shall fall before him.", "And to him my soul shall live:\nand my seed shall serve him.", "There shall be declared to the Lord a generation to come:\nand the heavens shall shew forth his justice to a people that shall be born, which the Lord hath made."], "21"], ["Dominus regit me", ["The Lord ruleth me:\nand I shall want nothing.", "He hath set me in a place of pasture. He hath brought me up, on the water of refreshment:", "He hath converted my soul. He hath led me on the paths of justice, for his own name's sake.", "For though I should walk in the midst of the shadow of death, I will fear no evils, for thou art with me. Thy rod and thy staff, they have comforted me.", "Thou hast prepared a table before me against them that afflict me. Thou hast anointed my head with oil;\nand my chalice which inebriateth me, how goodly is it!", "And thy mercy will follow me all the days of my life. And that I may dwell in the house of the Lord unto length of days."], "22"], ["Domini est terra", ["The earth is the Lord's and the fulness thereof:\nthe world, and all they that dwell therein.", "For he hath founded it upon the seas;\nand hath prepared it upon the rivers.", "Who shall ascend into the mountain of the Lord:\nor who shall stand in his holy place?", "The innocent in hands, and clean of heart, who hath not taken his soul in vain, nor sworn deceitfully to his neighbour.", "He shall receive a blessing from the Lord, and mercy from God his Saviour.", "This is the generation of them that seek him, of them that seek the face of the God of Jacob.", "Lift up your gates, O ye princes, and be ye lifted up, O eternal gates:\nand the King of Glory shall enter in.", "Who is this King of Glory? the Lord who is strong and mighty:\nthe Lord mighty in battle.", "Lift up your gates, O ye princes, and be ye lifted up, O eternal gates:\nand the King of Glory shall enter in.", "Who is this King of Glory? the Lord of hosts, he is the King of Glory."], "23"], ["Ad te, Domine, levavi", ["To thee, O Lord, have I lifted up my soul.", "In thee, O my God, I put my trust;\nlet me not be ashamed.", "Neither let my enemies laugh at me:\nfor none of them that wait on thee shall be confounded.", "Let all them be confounded that act unjust things without cause. Shew, O Lord, thy ways to me, and teach me thy paths.", "Direct me in thy truth, and teach me;\nfor thou art God my Saviour;\nand on thee have I waited all the day long.", "Remember, O Lord, thy bowels of compassion;\nand thy mercies that are from the beginning of the world.", "The sins of my youth and my ignorances do not remember. According to thy mercy remember thou me:\nfor thy goodness' sake, O Lord.", "The Lord is sweet and righteous:\ntherefore he will give a law to sinners in the way.", "He will guide the mild in judgment:\nhe will teach the meek his ways.", "All the ways of the Lord are mercy and truth, to them that seek after his covenant and his testimonies.", "For thy name's sake, O Lord, thou wilt pardon my sin:\nfor it is great.", "Who is the man that feareth the Lord? He hath appointed him a law in the way he hath chosen.", "His soul shall dwell in good things:\nand his seed shall inherit the land.", "The Lord is a firmament to them that fear him:\nand his covenant shall be made manifest to them.", "My eyes are ever towards the Lord:\nfor he shall pluck my feet out of the snare.", "Look thou upon me, and have mercy on me;\nfor I am alone and poor.", "The troubles of my heart are multiplied:\ndeliver me from my necessities.", "See my abjection and my labour;\nand forgive me all my sins.", "Consider my enemies for they are multiplied, and have hated me with an unjust hatred.", "Keep thou my soul, and deliver me:\nI shall not be ashamed, for I have hoped in thee.", "The innocent and the upright have adhered to me:\nbecause I have waited on thee.", "Deliver Israel, O God, from all his tribulations."], "24"], ["Judica me, Domine", ["Judge me, O Lord, for I have walked in my innocence:\nand I have put my trust in the Lord, and shall not be weakened.", "Prove me, O Lord, and try me;\nburn my reins and my heart.", "For thy mercy is before my eyes;\nand I am well pleased with thy truth.", "I have not sat with the council of vanity:\nneither will I go in with the doers of unjust things.", "I have hated the assembly of the malignant;\nand with the wicked I will not sit.", "I will wash my hands among the innocent;\nand will compass thy altar, O Lord:", "That I may hear the voice of thy praise:\nand tell of all thy wondrous works.", "I have loved, O Lord, the beauty of thy house;\nand the place where thy glory dwelleth.", "Take not away my soul, O God, with the wicked:\nnor my life with bloody men:", "In whose hands are iniquities:\ntheir right hand is filled with gifts.", "But as for me, I have walked in my innocence:\nredeem me, and have mercy on me.", "My foot hath stood in the direct way:\nin the churches I will bless thee, O Lord."], "25"], ["Dominus illuminatio", ["The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life:\nof whom shall I be afraid?", "Whilst the wicked draw near against me, to eat my flesh. My enemies that trouble me, have themselves been weakened, and have fallen.", "If armies in camp should stand together against me, my heart shall not fear. If a battle should rise up against me, in this will I be confident.", "One thing I have asked of the Lord, this will I seek after;\nthat I may dwell in the house of the Lord all the days of my life. That I may see the delight of the Lord, and may visit his temple.", "For he hath hidden me in his tabernacle;\nin the day of evils, he hath protected me in the secret place of his tabernacle.", "He hath exalted me upon a rock:\nand now he hath lifted up my head above my enemies. I have gone round, and have offered up in his tabernacle a sacrifice of jubilation:\nI will sing, and recite a psalm to the Lord.", "Hear, O Lord, my voice, with which I have cried to thee:\nhave mercy on me and hear me.", "My heart hath said to thee:\nMy face hath sought thee:\nthy face, O Lord, will I still seek.", "Turn not away thy face from me;\ndecline not in thy wrath from thy servant. Be thou my helper, forsake me not;\ndo not thou despise me, O God my Saviour.", "For my father and my mother have left me:\nbut the Lord hath taken me up.", "Set me, O Lord, a law in thy way, and guide me in the right path, because of my enemies.", "Deliver me not over to the will of them that trouble me;\nfor unjust witnesses have risen up against me;\nand iniquity hath lied to itself.", "I believe to see the good things of the Lord in the land of the living.", "Expect the Lord, do manfully, and let thy heart take courage, and wait thou for the Lord."], "26"], ["Ad te Domine", ["Unto thee will I cry, O Lord:\nO my God, be not thou silent to me:\nlest thou be silent to me, I become like them that go down into the pit.", "Hear, O Lord, the voice of my supplication, when I pray to thee;\nwhen I lift up my hands to thy holy temple.", "Draw me not away together with the wicked;\nand with the workers of iniquity destroy me not:\nWho speak peace with their neighbour, but evils are in their hearts.", "Give them according to their works, and according to the wickedness of their inventions. According to the works of their hands give thou to them:\nrender to them their reward.", "Because they have not understood the works of the Lord, and the operations of his hands:\nthou shalt destroy them, and shalt not build them up.", "Blessed be the Lord, for he hath heard the voice of my supplication.", "The Lord is my helper and my protector:\nin him hath my heart confided, and I have been helped. And my flesh hath flourished again, and with my will I will give praise to him.", "The Lord is the strength of his people, and the protector of the salvation of his anointed.", "Save, O Lord, thy people, and bless thy inheritance:\nand rule them and exalt them for ever."], "27"], ["Afferte Domino", ["Bring to the Lord, O ye children of God:\nbring to the Lord the offspring of rams.", "Bring to the Lord glory and honour:\nbring to the Lord glory to his name:\nadore ye the Lord in his holy court.", "The voice of the Lord is upon the waters;\nthe God of majesty hath thundered, The Lord is upon many waters.", "The voice of the Lord is in power;\nthe voice of the Lord in magnificence.", "The voice of the Lord breaketh the cedars:\nyea, the Lord shall break the cedars of Libanus.", "And shall reduce them to pieces, as a calf of Libanus, and as the beloved son of unicorns.", "The voice of the Lord divideth the flame of fire:", "The voice of the Lord shaketh the desert:\nand the Lord shall shake the desert of Cades.", "The voice of the Lord prepareth the stags:\nand he will discover the thick woods:\nand in his temple all shall speak his glory.", "The Lord maketh the flood to dwell:\nand the Lord shall sit king for ever. The Lord will give strength to his people:\nthe Lord will bless his people with peace."], "28"], ["Exaltabo te, Domine", ["I will extol thee, O Lord, for thou hast upheld me:\nand hast not made my enemies to rejoice over me.", "O Lord my God, I have cried to thee, and thou hast healed me.", "Thou hast brought forth, O Lord, my soul from hell:\nthou hast saved me from them that go down into the pit.", "Sing to the Lord, O ye his saints:\nand give praise to the memory of his holiness.", "For wrath is in his indignation;\nand life in his good will. In the evening weeping shall have place, and in the morning gladness.", "And in my abundance I said:\nI shall never be moved.", "O Lord, in thy favour, thou gavest strength to my beauty. Thou turnedst away thy face from me, and I became troubled.", "To thee, O Lord, will I cry:\nand I will make supplication to my God.", "What profit is there in my blood, whilst I go down to corruption? Shall dust confess to thee, or declare thy truth?", "The Lord hath heard, and hath had mercy on me:\nthe Lord became my helper.", "Thou hast turned for me my mourning into joy:\nthou hast cut my sackcloth, and hast compassed me with gladness:", "To the end that my glory may sing to thee, and I may not regret:\nO Lord my God, I will give praise to thee for ever."], "29"], ["In te, Domine, speravi", ["In thee, O Lord, have I hoped, let me never be confounded:\ndeliver me in thy justice.", "Bow down thy ear to me:\nmake haste to deliver me. Be thou unto me a God, a protector, and a house of refuge, to save me.", "For thou art my strength and my refuge;\nand for thy name's sake thou wilt lead me, and nourish me.", "Thou wilt bring me out of this snare, which they have hidden for me:\nfor thou art my protector.", "Into thy hands I commend my spirit:\nthou hast redeemed me, O Lord, the God of truth.", "Thou hast hated them that regard vanities, to no purpose. But I have hoped in the Lord:", "I will be glad and rejoice in thy mercy. For thou hast regarded my humility, thou hast saved my soul out of distresses.", "And thou hast not shut me up in the hands of the enemy:\nthou hast set my feet in a spacious place.", "Have mercy on me, O Lord, for I am afflicted:\nmy eye is troubled with wrath, my soul, and my belly:", "For my life is wasted with grief:\nand my years in sighs. My strength is weakened through poverty and my bones are disturbed.", "I am become a reproach among all my enemies, and very much to my neighbours;\nand a fear to my acquaintance. They that saw me without fled from me.", "I am forgotten as one dead from the heart. I am become as a vessel that is destroyed.", "For I have heard the blame of many that dwell round about. While they assembled together against me, they consulted to take away my life.", "But I have put my trust in thee, O Lord:\nI said:\nThou art my God.", "My lots are in thy hands. Deliver me out of the hands of my enemies;\nand from them that persecute me.", "Make thy face to shine upon thy servant;\nsave me in thy mercy.", "Let me not be confounded, O Lord, for I have called upon thee. Let the wicked be ashamed, and be brought down to hell.", "Let deceitful lips be made dumb. Which speak iniquity against the just, with pride and abuse.", "O how great is the multitude of thy sweetness, O Lord, which thou hast hidden for them that fear thee! Which thou hast wrought for them that hope in thee, in the sight of the sons of men.", "Thou shalt hide them in the secret of thy face, from the disturbance of men. Thou shalt protect them in thy tabernacle from the contradiction of tongues.", "Blessed be the Lord, for he hath shewn his wonderful mercy to me in a fortified city.", "But I said in the excess of my mind:\nI am cast away from before thy eyes. Therefore thou hast heard the voice of my prayer, when I cried to thee.", "O love the Lord, all ye his saints:\nfor the Lord will require truth, and will repay them abundantly that act proudly.", "Do ye manfully, and let your heart be strengthened, all ye that hope in the Lord."], "30"], ["Beati quorum", ["Blessed are they whose iniquities are forgiven, and whose sins are covered.", "Blessed is the man to whom the Lord hath not imputed sin, and in whose spirit there is no guile.", "Because I was silent my bones grew old;\nwhilst I cried out all the day long.", "For day and night thy hand was heavy upon me:\nI am turned in my anguish, whilst the thorn is fastened.", "I have acknowledged my sin to thee, and my injustice I have not concealed. I said I will confess against myself my injustice to the Lord:\nand thou hast forgiven the wickedness of my sin.", "For this shall every one that is holy pray to thee in a seasonable time. And yet in a flood of many waters, they shall not come nigh unto him.", "Thou art my refuge from the trouble which hath encompassed me:\nmy joy, deliver me from them that surround me.", "I will give thee understanding, and I will instruct thee in this way, in which thou shalt go:\nI will fix my eyes upon thee.", "Do not become like the horse and the mule, who have no understanding. With bit and bridle bind fast their jaws, who come not near unto thee.", "Many are the scourges of the sinner, but mercy shall encompass him that hopeth in the Lord.", "Be glad in the Lord, and rejoice, ye just, and glory, all ye right of heart."], "31"], ["Exultate, justi", ["Rejoice in the Lord, O ye just:\npraise becometh the upright.", "Give praise to the Lord on the harp;\nsing to him with the psaltery, the instrument of ten strings.", "Sing to him a new canticle, sing well unto him with a loud noise.", "For the word of the Lord is right, and all his works are done with faithfulness.", "He loveth mercy and judgment;\nthe earth is full of the mercy of the Lord.", "By the word of the Lord the heavens were established;\nand all the power of them by the spirit of his mouth:", "Gathering together the waters of the sea, as in a vessel;\nlaying up the depths in storehouses.", "Let all the earth fear the Lord, and let all the inhabitants of the world be in awe of him.", "For he spoke and they were made:\nhe commanded and they were created.", "The Lord bringeth to naught the counsels of nations;\nand he rejecteth the devices of people, and casteth away the counsels of princes.", "But the counsel of the Lord standeth for ever:\nthe thoughts of his heart to all generations.", "Blessed is the nation whose God is the Lord:\nthe people whom he hath chosen for his inheritance.", "The Lord hath looked from heaven:\nhe hath beheld all the sons of men.", "From his habitation which he hath prepared, he hath looked upon all that dwell on the earth.", "He who hath made the hearts of every one of them:\nwho understandeth all their works.", "The king is not saved by a great army:\nnor shall the giant be saved by his own great strength.", "Vain is the horse for safety:\nneither shall he be saved by the abundance of his strength.", "Behold the eyes of the Lord are on them that fear him:\nand on them that hope in his mercy.", "To deliver their souls from death;\nand feed them in famine.", "Our soul waiteth for the Lord:\nfor he is our helper and protector.", "For in him our heart shall rejoice:\nand in his holy name we have trusted.", "Let thy mercy, O Lord, be upon us, as we have hoped in thee."], "32"], ["Benedicam Dominum", ["I will bless the Lord at all times, his praise shall be always in my mouth.", "In the Lord shall my soul be praised:\nlet the meek hear and rejoice.", "O magnify the Lord with me;\nand let us extol his name together.", "I sought the Lord, and he heard me;\nand he delivered me from all my troubles.", "Come ye to him and be enlightened:\nand your faces shall not be confounded.", "This poor man cried, and the Lord heard him:\nand saved him out of all his troubles.", "The angel of the Lord shall encamp round about them that fear him:\nand shall deliver them.", "O taste, and see that the Lord is sweet:\nblessed is the man that hopeth in him.", "Fear the Lord, all ye his saints:\nfor there is no want to them that fear him.", "The rich have wanted, and have suffered hunger:\nbut they that seek the Lord shall not be deprived of any good.", "Come, children, hearken to me:\nI will teach you the fear of the Lord.", "Who is the man that desireth life:\nwho loveth to see good days?", "Keep thy tongue from evil, and thy lips from speaking guile.", "Turn away from evil and do good:\nseek after peace and pursue it.", "The eyes of the Lord are upon the just:\nand his ears unto their prayers.", "But the countenance of the Lord is against them that do evil things:\nto cut off the remembrance of them from the earth.", "The just cried, and the Lord heard them:\nand delivered them out of all their troubles.", "The Lord is nigh unto them that are of a contrite heart:\nand he will save the humble of spirit.", "Many are the afflictions of the just;\nbut out of them all will the Lord deliver them.", "The Lord keepeth all their bones, not one of them shall be broken.", "The death of the wicked is very evil:\nand they that hate the just shall be guilty.", "The Lord will redeem the souls of his servants:\nand none of them that trust in him shall offend."], "33"], ["Judica, Domine", ["Judge thou, O Lord, them that wrong me:\noverthrow them that fight against me.", "Take hold of arms and shield:\nand rise up to help me.", "Bring out the sword, and shut up the way against them that persecute me:\nsay to my soul:\nI am thy salvation.", "Let them be confounded and ashamed that seek after my soul. Let them be turned back and be confounded that devise against me.", "Let them become as dust before the wind:\nand let the angel of the Lord straiten them.", "Let their way become dark and slippery;\nand let the angel of the Lord pursue them.", "For without cause they have hidden their net for me unto destruction:\nwithout cause they have upbraided my soul.", "Let the snare which he knoweth not come upon him:\nand let the net which he hath hidden catch him:\nand into that very snare let them fall.", "But my soul shall rejoice in the Lord;\nand shall be delighted in his salvation.", "All my bones shall say:\nLord, who is like to thee? Who deliverest the poor from the hand of them that are stronger than he;\nthe needy and the poor from them that strip him.", "Unjust witnesses rising up have asked me things I knew not.", "They repaid me evil for good:\nto the depriving me of my soul.", "But as for me, when they were troublesome to me, I was clothed with haircloth. I humbled my soul with fasting;\nand my prayer shall be turned into my bosom.", "As a neighbour and as an own brother, so did I please:\nas one mourning and sorrowful so was I humbled.", "But they rejoiced against me, and came together:\nscourges were gathered together upon me, and I knew not.", "They were separated, and repented not:\nthey tempted me, they scoffed at me with scorn:\nthey gnashed upon me with their teeth.", "Lord, when wilt thou look upon me? rescue thou my soul from their malice:\nmy only one from the lions.", "I will give thanks to thee in a great church;\nI will praise thee in a strong people.", "Let not them that are my enemies wrongfully rejoice over me:\nwho have hated me without cause, and wink with the eyes.", "For they spoke indeed peaceably to me;\nand speaking in the anger of the earth they devised guile.", "And they opened their mouth wide against me;\nthey said:\nWell done, well done, our eyes have seen it.", "Thou hast seen, O Lord, be not thou silent:\nO Lord, depart not from me.", "Arise, and be attentive to my judgment:\nto my cause, my God, and my Lord.", "Judge me, O Lord my God according to thy justice, and let them not rejoice over me.", "Let them not say in their hearts:\nIt is well, it is well, to our mind:\nneither let them say:\nWe have swallowed him up.", "Let them blush:\nand be ashamed together, who rejoice at my evils. Let them be clothed with confusion and shame, who speak great things against me.", "Let them rejoice and be glad, who are well pleased with my justice, and let them say always:\nThe Lord be magnified, who delights in the peace of his servant.", "And my tongue shall meditate thy justice, thy praise all the day long."], "34"], ["Dixit injustus", ["The unjust hath said within himself, that he would sin:\nthere is no fear of God before his eyes.", "For in his sight he hath done deceitfully, that his iniquity may be found unto hatred.", "The words of his mouth are iniquity and guile:\nhe would not understand that he might do well.", "He hath devised iniquity on his bed, he hath set himself on every way that is not good:\nbut evil he hath not hated.", "O Lord, thy mercy is in heaven, and thy truth reacheth even to the clouds.", "Thy justice is as the mountains of God, thy judgments are a great deep. Men and beasts thou wilt preserve, O Lord:", "O how hast thou multiplied thy mercy, O God! But the children of men shall put their trust under the covert of thy wings.", "They shall be inebriated with the plenty of thy house;\nand thou shalt make them drink of the torrent of thy pleasure.", "For with thee is the fountain of life;\nand in thy light we shall see light.", "Extend thy mercy to them that know thee, and thy justice to them that are right in heart.", "Let not the foot of pride come to me, and let not the hand of the sinner move me.", "There the workers of iniquity are fallen, they are cast out, and could not stand."], "35"], ["Noli aemulari", ["Be not emulous of evildoers;\nnor envy them that work iniquity.", "For they shall shortly wither away as grass, and as the green herbs shall quickly fall.", "Trust in the Lord, and do good, and dwell in the land, and thou shalt be fed with its riches.", "Delight in the Lord, and he will give thee the requests of thy heart.", "Commit thy way to the Lord, and trust in him, and he will do it.", "And he will bring forth thy justice as the light, and thy judgment as the noonday.", "Be subject to the Lord and pray to him. Envy not the man who prospereth in his way;\nthe man who doth unjust things.", "Cease from anger, and leave rage;\nhave no emulation to do evil.", "For the evildoers shall be cut off:\nbut they that wait upon the Lord shall inherit the land.", "For yet a little while, and the wicked shall not be:\nand thou shalt seek his place, and shalt not find it.", "But the meek shall inherit the land, and shall delight in abundance of peace.", "The sinner shall watch the just man:\nand shall gnash upon him with his teeth.", "But the Lord shall laugh at him:\nfor he foreseeth that his day shall come.", "The wicked have drawn out the sword:\nthey have bent their bow. To cast down the poor and needy, to kill the upright of heart.", "Let their sword enter into their own hearts, and let their bow be broken.", "Better is a little to the just, than the great riches of the wicked.", "For the arms of the wicked shall be broken in pieces;\nbut the Lord strengtheneth the just.", "The Lord knoweth the days of undefiled;\nand their inheritance shall be for ever.", "They shall not be confounded in the evil time;\nand in the days of famine they shall be filled:", "Because the wicked shall perish. And the enemies of the Lord, presently after they shall be honoured and exalted, shall come to nothing and vanish like smoke.", "The sinner shall borrow, and not pay again;\nbut the just sheweth mercy and shall give.", "For such as bless him shall inherit the land:\nbut such as curse him shall perish.", "With the Lord shall the steps of a man be directed, and he shall like well his way.", "When he shall fall he shall not be bruised, for the Lord putteth his hand under him.", "I have been young and now am old;\nand I have not seen the just forsaken, nor his seed seeking bread.", "He sheweth mercy, and lendeth all the day long;\nand his seed shall be in blessing.", "Decline from evil and do good, and dwell for ever and ever.", "For the Lord loveth judgment, and will not forsake his saints:\nthey shall be preserved for ever. The unjust shall be punished, and the seed of the wicked shall perish.", "But the just shall inherit the land, and shall dwell therein for evermore.", "The mouth of the just shall meditate wisdom:\nand his tongue shall speak judgment.", "The law of his God is in his heart, and his steps shall not be supplanted.", "The wicked watcheth the just man, and seeketh to put him to death,", "But the Lord will not leave him in his hands;\nnor condemn him when he shall be judged.", "Expect the Lord and keep his way:\nand he will exalt thee to inherit the land:\nwhen the sinners shall perish thou shalt see.", "I have seen the wicked highly exalted, and lifted up like the cedars of Libanus.", "And I passed by, and lo, he was not:\nand I sought him and his place was not found.", "Keep innocence, and behold justice:\nfor there are remnants for the peaceable man.", "But the unjust shall be destroyed together:\nthe remnants of the wicked shall perish.", "But the salvation of the just is from the Lord, and he is their protector in the time of trouble.", "And the Lord will help them and deliver them:\nand he will rescue them from the wicked, and save them because they have hoped in him."], "36"], ["Domine, ne in furore", ["Rebuke me not, O Lord, in thy indignation;\nnor chastise me in thy wrath.", "For thy arrows are fastened in me:\nand thy hand hath been strong upon me.", "There is no health in my flesh, because of thy wrath:\nthere is no peace for my bones, because of my sins.", "For my iniquities are gone over my head:\nand as a heavy burden are become heavy upon me.", "My sores are putrified and corrupted, because of my foolishness.", "I am become miserable, and am bowed down even to the end:\nI walked sorrowful all the day long.", "For my loins are filled with illusions;\nand there is no health in my flesh.", "I am afflicted and humbled exceedingly:\nI roared with the groaning of my heart.", "Lord, all my desire is before thee, and my groaning is not hidden from thee.", "My heart is troubled, my strength hath left me, and the light of my eyes itself is not with me.", "My friends and my neighbours have drawn near, and stood against me. And they that were near me stood afar off:", "And they that sought my soul used violence. And they that sought evils to me spoke vain things, and studied deceits all the day long.", "But I, as a deaf man, heard not:\nand as a dumb man not opening his mouth.", "And I became as a man that heareth not:\nand that hath no reproofs in his mouth.", "For in thee, O Lord, have I hoped:\nthou wilt hear me, O Lord my God.", "For I said:\nLest at any time my enemies rejoice over me:\nand whilst my feet are moved, they speak great things against me.", "For I am ready for scourges:\nand my sorrow is continually before me.", "For I will declare my iniquity:\nand I will think for my sin.", "But my enemies live, and are stronger than I:\nand they that hate me wrongfully are multiplied.", "They that render evil for good, have detracted me, because I followed goodness.", "Forsake me not, O Lord my God:\ndo not thou depart from me.", "Attend unto my help, O Lord, the God of my salvation."], "37"], ["Dixi, custodiam", ["I said:\nI will take heed to my ways:\nthat I sin not with my tongue. I have set guard to my mouth, when the sinner stood against me.", "I was dumb, and was humbled, and kept silence from good things:\nand my sorrow was renewed.", "My heart grew hot within me:\nand in my meditation a fire shall flame out.", "I spoke with my tongue:\nO Lord, make me know my end. And what is the number of my days:\nthat I may know what is wanting to me.", "Behold thou hast made my days measurable, and my substance is as nothing before thee. And indeed all things are vanity:\nevery man living.", "Surely man passeth as an image:\nyea, and he is disquieted in vain. He storeth up:\nand he knoweth not for whom he shall gather these things.", "And now what is my hope? is it not the Lord? and my substance is with thee.", "Deliver thou me from all my iniquities:\nthou hast made me a reproach to the fool.", "I was dumb, and I opened not my mouth, because thou hast done it.", "Remove thy scourges from me. The strength of thy hand hath made me faint in rebukes:", "Thou hast corrected man for iniquity. And thou hast made his soul to waste away like a spider:\nsurely in vain is any man disquieted.", "Hear my prayer, O Lord, and my supplication:\ngive ear to my tears. Be not silent:\nfor I am a stranger with thee, and a sojourner as all my fathers were.", "O forgive me, that I may be refreshed, before I go hence, and be no more."], "38"], ["Expectans, expectavi", ["With expectation I have waited for the Lord, and he was attentive to me.", "And he heard my prayers, and brought me out of the pit of misery and the mire of dregs. And he set my feet upon a rock, and directed my steps.", "And he put a new canticle into my mouth, a song to our God. Many shall see, and shall fear:\nand they shall hope in the Lord.", "Blessed is the man whose trust is in the name of the Lord;\nand who hath not had regard to vanities, and lying follies.", "Thou hast multiplied thy wonderful works, O Lord my God:\nand in thy thoughts there is no one like to thee. I have declared and I have spoken they are multiplied above number.", "Sacrifice and oblation thou didst not desire;\nbut thou hast pierced ears for me. Burnt offering and sin offering thou didst not require:", "Then said I, Behold I come. In the head of the book it is written of me", "That I should do thy will:\nO my God, I have desired it, and thy law in the midst of my heart.", "I have declared thy justice in a great church, lo, I will not restrain my lips:\nO Lord, thou knowest it.", "I have not hid thy justice within my heart:\nI have declared thy truth and thy salvation. I have not concealed thy mercy and thy truth from a great council.", "Withhold not thou, O Lord, thy tender mercies from me:\nthy mercy and thy truth have always upheld me.", "For evils without number have surrounded me;\nmy iniquities have overtaken me, and I was not able to see. They are multiplied above the hairs of my head:\nand my heart hath forsaken me.", "Be pleased, O Lord, to deliver me:\nlook down, O Lord, to help me.", "Let them be confounded and ashamed together, that seek after my soul to take it away. Let them be turned backward and be ashamed that desire evils to me.", "Let them immediately bear their confusion, that say to me:\nTis well , tis well.", "Let all that seek thee rejoice and be glad in thee:\nand let such as love thy salvation say always:\nThe Lord be magnified.", "But I am a beggar and poor:\nthe Lord is careful for me. Thou art my helper and my protector:\nO my God, be not slack."], "39"], ["Beatus qui intelligit", ["Blessed is he that understandeth concerning the needy and the poor:\nthe Lord will deliver him in the evil day.", "The Lord preserve him and give him life, and make him blessed upon the earth:\nand deliver him not up to the will of his enemies.", "The Lord help him on his bed of sorrow:\nthou hast turned all his couch in his sickness.", "I said:\nO Lord, be thou merciful to me:\nheal my soul, for I have sinned against thee.", "My enemies have spoken evils against me:\nwhen shall he die and his name perish?", "And if he came in to see me, he spoke vain things:\nhis heart gathered together iniquity to itself. He went out and spoke to the same purpose.", "All my enemies whispered together against me:\nthey devised evils to me.", "They determined against me an unjust word:\nshall he that sleepeth rise again no more?", "For even the man of peace, in whom I trusted, who ate my bread, hath greatly supplanted me.", "But thou, O Lord, have mercy on me, and raise me up again:\nand I will requite them.", "By this I know, that thou hast had a good will for me:\nbecause my enemy shall not rejoice over me.", "But thou hast upheld me by reason of my innocence:\nand hast established me in thy sight for ever.", "Blessed be the Lord the God of Israel from eternity to eternity. So be it. So be it."], "40"], ["Quemadmodum", ["As the hart panteth after the fountains of water;\nso my soul panteth after thee, O God.", "My soul hath thirsted after the strong living God;\nwhen shall I come and appear before the face of God?", "My tears have been my bread day and night, whilst it is said to me daily:\nWhere is thy God?", "These things I remembered, and poured out my soul in me:\nfor I shall go over into the place of the wonderful tabernacle, even to the house of God:\nWith the voice of joy and praise;\nthe noise of one feasting.", "Why art thou sad, O my soul? and why dost thou trouble me? Hope in God, for I will still give praise to him:\nthe salvation of my countenance,", "And my God. My soul is troubled within myself:\ntherefore will I remember thee from the land of Jordan and Hermoniim, from the little hill.", "Deep calleth on deep, at the noise of thy flood-gates. All thy heights and thy billows have passed over me.", "In the daytime the Lord hath commanded his mercy;\nand a canticle to him in the night. With me is prayer to the God of my life.", "I will say to God:\nThou art my support. Why hast thou forgotten me? and why go I mourning, whilst my enemy afflicteth me?", "Whilst my bones are broken, my enemies who trouble me have reproached me;\nWhilst they say to me day by day:\nWhere is thy God?", "Why art thou cast down, O my soul? and why dost thou disquiet me? Hope thou in God, for I will still give praise to him:\nthe salvation of my countenance, and my God."], "41"], ["Judica me, Deus", ["Judge me, O God, and distinguish my cause from the nation that is not holy:\ndeliver me from the unjust and deceitful man.", "For thou art God my strength:\nwhy hast thou cast me off? and why do I go sorrowful whilst the enemy afflicteth me?", "Send forth thy light and thy truth:\nthey have conducted me, and brought me unto thy holy hill, and into thy tabernacles.", "And I will go in to the altar of God:\nto God who giveth joy to my youth.", "To thee, O God my God, I will give praise upon the harp:\nwhy art thou sad, O my soul? and why dost thou disquiet me?", "Hope in God, for I will still give praise to him:\nthe salvation of my countenance, and my God."], "42"], ["Deus, auribus", ["We have heard, O God, with our ears:\nour fathers have declared to us, The work thou hast wrought in their days, and in the days of old.", "Thy hand destroyed the Gentiles, and thou plantedst them:\nthou didst afflict the people and cast them out.", "For they got not the possession of the land by their own sword:\nneither did their own arm save them. But thy right hand and thy arm, and the light of thy countenance:\nbecause thou wast pleased with them.", "Thou art thyself my king and my God, who commandest the saving of Jacob.", "Through thee we will push down our enemies with the horn:\nand through thy name we will despise them that rise up against us.", "For I will not trust in my bow:\nneither shall my sword save me.", "But thou hast saved us from them that afflict us:\nand hast put them to shame that hate us.", "In God shall we glory all the day long:\nand in thy name we will give praise for ever.", "But now thou hast cast us off, and put us to shame:\nand thou, O God, wilt not go out with our armies.", "Thou hast made us turn our back to our enemies:\nand they that hated us plundered for themselves.", "Thou hast given us up like sheep to be eaten:\nthou hast scattered us among the nations.", "Thou hast sold thy people for no price:\nand there was no reckoning in the exchange of them.", "Thou hast made us a reproach to our neighbours, a scoff and derision to them that are round about us.", "Thou hast made us a byword among the Gentiles:\na shaking of the head among the people.", "All the day long my shame is before me:\nand the confusion of my face hath covered me,", "At the voice of him that reproacheth and detracteth me:\nat the face of the enemy and persecutor.", "All these things have come upon us, yet we have not forgotten thee:\nand we have not done wickedly in thy covenant.", "And our heart hath not turned back:\nneither hast thou turned aside our steps from thy way.", "For thou hast humbled us in the place of affliction:\nand the shadow of death hath covered us.", "If we have forgotten the name of our God, and if we have spread forth our hands to a strange god:", "Shall not God search out these things:\nfor he knoweth the secrets of the heart. Because for thy sake we are killed all the day long:\nwe are counted as sheep for the slaughter.", "Arise, why sleepest thou, O Lord? arise, and cast us not off to the end.", "Why turnest thou thy face away? and forgettest our want and our trouble?", "For our soul is humbled down to the dust:\nour belly cleaveth to the earth.", "Arise, O Lord, help us and redeem us for thy name's sake."], "43"], ["Eructavit cor meum", ["My heart hath uttered a good word:\nI speak my works to the king:\nMy tongue is the pen of a scrivener that writeth swiftly.", "Thou art beautiful above the sons of men:\ngrace is poured abroad in thy lips;\ntherefore hath God blessed thee for ever.", "Gird thy sword upon thy thigh, O thou most mighty.", "With thy comeliness and thy beauty set out, proceed prosperously, and reign. Because of truth and meekness and justice:\nand thy right hand shall conduct thee wonderfully.", "Thy arrows are sharp:\nunder thee shall people fall, into the hearts of the king's enemies.", "Thy throne, O God, is for ever and ever:\nthe sceptre of thy kingdom is a sceptre of uprightness.", "Thou hast loved justice, and hated iniquity:\ntherefore God, thy God, hath anointed thee with the oil of gladness above thy fellows.", "Myrrh and stacte and cassia perfume thy garments, from the ivory houses:\nout of which", "The daughters of kings have delighted thee in thy glory. The queen stood on thy right hand, in gilded clothing;\nsurrounded with variety.", "Hearken, O daughter, and see, and incline thy ear:\nand forget thy people and thy father's house.", "And the king shall greatly desire thy beauty;\nfor he is the Lord thy God, and him they shall adore.", "And the daughters of Tyre with gifts, yea, all the rich among the people, shall entreat thy countenance.", "All the glory of the king's daughter is within in golden borders,", "Clothed round about with varieties. After her shall virgins be brought to the king:\nher neighbours shall be brought to thee.", "They shall be brought with gladness and rejoicing:\nthey shall be brought into the temple of the king.", "Instead of thy fathers, sons are born to thee:\nthou shalt make them princes over all the earth.", "They shall remember thy name throughout all generations. Therefore shall people praise thee for ever;\nyea, for ever and ever."], "44"], ["Deus noster refugium", ["Our God is our refuge and strength:\na helper in troubles, which have found us exceedingly.", "Therefore we will not fear, when the earth shall be troubled;\nand the mountains shall be removed into the heart of the sea.", "Their waters roared and were troubled:\nthe mountains were troubled with his strength.", "The stream of the river maketh the city of God joyful:\nthe most High hath sanctified his own tabernacle.", "God is in the midst thereof, it shall not be moved:\nGod will help it in the morning early.", "Nations were troubled, and kingdoms were bowed down:\nhe uttered his voice, the earth trembled.", "The Lord of armies is with us:\nthe God of Jacob is our protector.", "Come and behold ye the works of the Lord:\nwhat wonders he hath done upon earth,", "Making wars to cease even to the end of the earth. He shall destroy the bow, and break the weapons:\nand the shield he shall burn in the fire.", "Be still and see that I am God;\nI will be exalted among the nations, and I will be exalted in the earth.", "The Lord of armies is with us:\nthe God of Jacob is our protector."], "45"], ["Omnes gentes, plaudite", ["O clap your hands, all ye nations:\nshout unto God with the voice of joy,", "For the Lord is high, terrible:\na great king over all the earth.", "He hath subdued the people under us;\nand the nations under our feet.", "He hath chosen for us his inheritance the beauty of Jacob which he hath loved.", "God is ascended with jubilee, and the Lord with the sound of trumpet.", "Sing praises to our God, sing ye:\nsing praises to our king, sing ye.", "For God is the king of all the earth:\nsing ye wisely.", "God shall reign over the nations:\nGod sitteth on his holy throne.", "The princes of the people are gathered together, with the God of Abraham:\nfor the strong gods of the earth are exceedingly exalted."], "46"], ["Magnus Dominus", ["Great is the Lord, and exceedingly to be praised in the city of our God, in his holy mountain.", "With the joy of the whole earth is mount Sion founded, on the sides of the north, the city of the great king.", "In her houses shall God be known, when he shall protect her.", "For behold the kings of the earth assembled themselves:\nthey gathered together.", "So they saw, and they wondered, they were troubled, they were moved:", "Trembling took hold of them. There were pains as of a woman in labour.", "With a vehement wind thou shalt break in pieces the ships of Tharsis.", "As we have heard, so have we seen, in the city of the Lord of hosts, in the city of our God:\nGod hath founded it for ever.", "We have received thy mercy, O God, in the midst of thy temple.", "According to thy name, O God, so also is thy praise unto the ends of the earth:\nthy right hand is full of justice.", "Let mount Sion rejoice, and the daughters of Juda be glad;\nbecause of thy judgments, O Lord.", "Surround Sion, and encompass her:\ntell ye in her towers.", "Set your hearts on her strength;\nand distribute her houses, that ye may relate it in another generation.", "For this is God, our God unto eternity, and for ever and ever:\nhe shall rule us for evermore."], "47"], ["Audite haec, omnes", ["Hear these things, all ye nations:\ngive ear, all ye inhabitants of the world.", "All you that are earthborn, and you sons of men:\nboth rich and poor together.", "My mouth shall speak wisdom:\nand the meditation of my heart understanding.", "I will incline my ear to a parable;\nI will open my proposition on the psaltery.", "Why shall I fear in the evil day? the iniquity of my heel shall encompass me.", "They that trust in their own strength, and glory in the multitude of their riches,", "No brother can redeem, nor shall man redeem:\nhe shall not give to God his ransom,", "Nor the price of the redemption of his soul:\nand shall labour for ever,", "And shall still live unto the end.", "He shall not see destruction, when he shall see the wise dying:\nthe senseless and the fool shall perish together:\nAnd they shall leave their riches to strangers:", "And their sepulchres shall be their houses for ever. Their dwelling places to all generations:\nthey have called their lands by their names.", "And man when he was in honour did not understand;\nhe is compared to senseless beasts, and is become like to them.", "This way of theirs is a stumblingblock to them:\nand afterwards they shall delight in their mouth.", "They are laid in hell like sheep:\ndeath shall feed upon them. And the just shall have dominion over them in the morning;\nand their help shall decay in hell from their glory.", "But God will redeem my soul from the hand of hell, when he shall receive me.", "Be not thou afraid, when a man shall be made rich, and when the glory of his house shall be increased.", "For when he shall die he shall take nothing away;\nnor shall his glory descend with him.", "For in his lifetime his soul will be blessed:\nand he will praise thee when thou shalt do well to him.", "He shall go in to the generations of his fathers:\nand he shall never see light.", "Man when he was in honour did not understand:\nhe hath been compared to senseless beasts, and made like to them."], "48"], ["Deus deorum", ["The God of gods, the Lord hath spoken:\nand he hath called the earth. From the rising of the sun, to the going down thereof:", "Out of Sion the loveliness of his beauty.", "God shall come manifestly:\nour God shall come, and shall not keep silence. A fire shall burn before him:\nand a mighty tempest shall be round about him.", "He shall call heaven from above, and the earth, to judge his people.", "Gather ye together his saints to him:\nwho set his covenant before sacrifices.", "And the heavens shall declare his justice:\nfor God is judge.", "Hear, O my people, and I will speak:\nO Israel, and I will testify to thee:\nI am God, thy God.", "I will not reprove thee for thy sacrifices:\nand thy burnt offerings are always in my sight.", "I will not take calves out of thy house:\nnor he-goats out of thy flocks.", "For all the beasts of the woods are mine:\nthe cattle on the hills, and the oxen.", "I know all the fowls of the air:\nand with me is the beauty of the field.", "If I should be hungry, I would not tell thee:\nfor the world is mine, and the fulness thereof.", "Shall I eat the flesh of bullocks? or shall I drink the blood of goats?", "Offer to God the sacrifice of praise:\nand pay thy vows to the most High.", "And call upon me in the day of trouble:\nI will deliver thee, and thou shalt glorify me.", "But to the sinner God hath said:\nWhy dost thou declare my justices, and take my covenant in thy mouth?", "Seeing thou hast hated discipline:\nand hast cast my words behind thee.", "If thou didst see a thief thou didst run with him:\nand with adulterers thou hast been a partaker.", "Thy mouth hath abounded
