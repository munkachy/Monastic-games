to God, all the earth;\nmake melody, rejoice and sing.", "Sing praise to the Lord on the harp, on the harp, and with the voice of a psalm:", "With long trumpets, and sound of cornet. Make a joyful noise before the Lord our king:", "Let the sea be moved and the fulness thereof:\nthe world and they that dwell therein.", "The rivers shall clap their hands, the mountains shall rejoice together", "At the presence of the Lord:\nbecause he cometh to judge the earth. He shall judge the world with justice, and the people with equity."], "97"], ["Dominus regnavit", ["The Lord hath reigned, let the people be angry:\nhe that sitteth on the cherubims:\nlet the earth be moved.", "The lord is great in Sion, and high above all people.", "Let them give praise to thy great name:\nfor it is terrible and holy:", "And the king's honour loveth judgment. Thou hast prepared directions:\nthou hast done judgment and justice in Jacob.", "Exalt ye the Lord our God, and adore his footstool, for it is holy.", "Moses and Aaron among his priests:\nand Samuel among them that call upon his name. They called upon the Lord, and he heard them:", "He spoke to them in the pillar of the cloud. They kept his testimonies, and the commandment which he gave them.", "Thou didst hear them, O Lord our God:\nthou wast a merciful God to them, and taking vengeance on all their inventions.", "Exalt ye the Lord our God, and adore at his holy mountain:\nfor the Lord our God is holy."], "98"], ["Jubilate Deo", ["Sing joyfully to God, all the earth:\nserve ye the Lord with gladness. Come in before his presence with exceeding great joy.", "Know ye that the Lord he is God:\nhe made us, and not we ourselves. We are his people and the sheep of his pasture.", "Go ye into his gates with praise, into his courts with hymns:\nand give glory to him. Praise ye his name:", "For the Lord is sweet, his mercy endureth for ever, and his truth to generation and generation."], "99"], ["Misericordiam et judicium", ["Mercy and judgment I will sing to thee, O Lord:\nI will sing,", "And I will understand in the unspotted way, when thou shalt come to me. I walked in the innocence of my heart, in the midst of my house.", "I did not set before my eyes any unjust thing:\nI hated the workers of iniquities.", "The perverse heart did not cleave to me:\nand the malignant, that turned aside from me, I would not know.", "The man that in private detracted his neighbour, him did I persecute. With him that had a proud eye, and an unsatiable heart, I would not eat.", "My eyes were upon the faithful of the earth, to sit with me:\nthe man that walked in the perfect way, he served me.", "He that worketh pride shall not dwell in the midst of my house:\nhe that speaketh unjust things did not prosper before my eyes.", "In the morning I put to death all the wicked of the land:\nthat I might cut off all the workers of iniquity from the city of the Lord."], "100"], ["Domine, exaudi", ["Hear, O Lord, my prayer:\nand let my cry come to thee.", "Turn not away thy face from me:\nin the day when I am in trouble, incline thy ear to me. In what day soever I shall call upon thee, hear me speedily.", "For my days are vanished like smoke, and my bones are grown dry like fuel for the fire.", "I am smitten as grass, and my heart is withered:\nbecause I forgot to eat my bread.", "Through the voice of my groaning, my bone hath cleaved to my flesh.", "I am become like to a pelican of the wilderness:\nI am like a night raven in the house.", "I have watched, and am become as a sparrow all alone on the housetop.", "All the day long my enemies reproached me:\nand they that praised me did swear against me.", "For I did eat ashes like bread, and mingled my drink with weeping.", "Because of thy anger and indignation:\nfor having lifted me up thou hast thrown me down.", "My days have declined like a shadow, and I am withered like grass.", "But thou, O Lord, endurest for ever:\nand thy memorial to all generations.", "Thou shalt arise and have mercy on Sion:\nfor it is time to have mercy on it, for the time is come.", "For the stones thereof have pleased thy servants:\nand they shall have pity on the earth thereof.", "And the Gentiles shall fear thy name, O Lord, and all the kings of the earth thy glory.", "For the Lord hath built up Sion:\nand he shall be seen in his glory.", "He hath had regard to the prayer of the humble:\nand he hath not despised their petition.", "Let these things be written unto another generation:\nand the people that shall be created shall praise the Lord:", "Because he hath looked forth from his high sanctuary:\nfrom heaven the Lord hath looked upon the earth.", "That he might hear the groans of them that are in fetters:\nthat he might release the children of the slain:", "That they may declare the name of the Lord in Sion:\nand his praise in Jerusalem;", "When the people assemble together, and kings, to serve the Lord.", "He answered him in the way of his strength:\nDeclare unto me the fewness of my days.", "Call me not away in the midst of my days:\nthy years are unto generation and generation.", "In the beginning, O Lord, thou foundedst the earth:\nand the heavens are the works of thy hands.", "They shall perish but thou remainest:\nand all of them shall grow old like a garment:\nAnd as a vesture thou shalt change them, and they shall be changed.", "But thou art always the selfsame, and thy years shall not fail.", "The children of thy servants shall continue and their seed shall be directed for ever."], "101"], ["Benedic, anima mea", ["Bless the Lord, O my soul:\nand let all that is within me bless his holy name.", "Bless the Lord, O my soul, and never forget all he hath done for thee.", "Who forgiveth all thy iniquities:\nwho healeth all thy diseases.", "Who redeemeth thy life from destruction:\nwho crowneth thee with mercy and compassion.", "Who satisfieth thy desire with good things:\nthy youth shall be renewed like the eagle's.", "The Lord doth mercies, and judgment for all that suffer wrong.", "He hath made his ways known to Moses:\nhis wills to the children of Israel.", "The Lord is compassionate and merciful:\nlongsuffering and plenteous in mercy.", "He will not always be angry:\nnor will he threaten for ever.", "He hath not dealt with us according to our sins:\nnor rewarded us according to our iniquities.", "For according to the height of the heaven above the earth:\nhe hath strengthened his mercy towards them that fear him.", "As far as the east is from the west, so far hath he removed our iniquities from us.", "As a father hath compassion on his children, so hath the Lord compassion on them that fear him:", "For he knoweth our frame. He remembereth that we are dust:", "Man's days are as grass, as the flower of the field so shall he flourish.", "For the spirit shall pass in him, and he shall not be:\nand he shall know his place no more.", "But the mercy of the Lord is from eternity and unto eternity upon them that fear him:\nAnd his justice unto children's children,", "To such as keep his covenant, And are mindful of his commandments to do them.", "The lord hath prepared his throne in heaven:\nand his kingdom shall rule over all.", "Bless the Lord, all ye his angels:\nyou that are mighty in strength, and execute his word, hearkening to the voice of his orders.", "Bless the Lord, all ye his hosts:\nyou ministers of his that do his will.", "Bless the Lord, all his works:\nin every place of his dominion, O my soul, bless thou the Lord."], "102"], ["Benedic, anima mea", ["Bless the Lord, O my soul:\nO Lord my God, thou art exceedingly great. Thou hast put on praise and beauty:", "And art clothed with light as with a garment. Who stretchest out the heaven like a pavilion:", "Who coverest the higher rooms thereof with water. Who makest the clouds thy chariot:\nwho walkest upon the wings of the winds.", "Who makest thy angels spirits:\nand thy ministers a burning fire.", "Who hast founded the earth upon its own bases:\nit shall not be moved for ever and ever.", "The deep like a garment is its clothing:\nabove the mountains shall the waters stand.", "At thy rebuke they shall flee:\nat the voice of thy thunder they shall fear.", "The mountains ascend, and the plains descend into the place which thou hast founded for them.", "Thou hast set a bound which they shall not pass over;\nneither shall they return to cover the earth.", "Thou sendest forth springs in the vales:\nbetween the midst of the hills the waters shall pass.", "All the beasts of the field shall drink:\nthe wild asses shall expect in their thirst.", "Over them the birds of the air shall dwell:\nfrom the midst of the rocks they shall give forth their voices.", "Thou waterest the hills from thy upper rooms:\nthe earth shall be filled with the fruit of thy works:", "Bringing forth grass for cattle, and herb for the service of men. That thou mayst bring bread out of the earth:", "And that wine may cheer the heart of man. That he may make the face cheerful with oil:\nand that bread may strengthen man's heart.", "The trees of the field shall be filled, and the cedars of Libanus which he hath planted:", "There the sparrows shall make their nests. The highest of them is the house of the heron.", "The high hills are a refuge for the harts, the rock for the irchins.", "He hath made the moon for seasons:\nthe sun knoweth his going down.", "Thou hast appointed darkness, and it is night:\nin it shall all the beasts of the woods go about:", "The young lions roaring after their prey, and seeking their meat from God.", "The sun ariseth, and they are gathered together:\nand they shall lie down in their dens.", "Man shall go forth to his work, and to his labour until the evening.", "How great are thy works, O Lord? thou hast made all things in wisdom:\nthe earth is filled with thy riches.", "So is this great sea, which stretcheth wide its arms:\nthere are creeping things without number:\nCreatures little and great.", "There the ships shall go. This sea dragon which thou hast formed to play therein.", "All expect of thee that thou give them food in season.", "What thou givest to them they shall gather up:\nwhen thou openest thy hand, they shall all be filled with good.", "But if thou turnest away thy face, they shall be troubled:\nthou shalt take away their breath, and they shall fail, and shall return to their dust.", "Thou shalt send forth thy spirit, and they shall be created:\nand thou shalt renew the face of the earth.", "May the glory of the Lord endure for ever:\nthe Lord shall rejoice in his works.", "He looketh upon the earth, and maketh it tremble:\nhe toucheth the mountains, and they smoke.", "I will sing to the Lord as long as I live:\nI will sing praise to my God while I have my being.", "Let my speech be acceptable to him:\nbut I will take delight in the Lord.", "Let sinners be consumed out of the earth, and the unjust, so that they be no more:\nO my soul, bless thou the Lord."], "103"], ["Confitemini Domino", ["Give glory to the Lord, and call upon his name:\ndeclare his deeds among the Gentiles.", "Sing to him, yea sing praises to him:\nrelate all his wondrous works.", "Glory ye in his holy name:\nlet the heart of them rejoice that seek the Lord.", "Seek ye the lord, and be strengthened:\nseek his face evermore.", "Remember his marvellous works which he hath done;\nhis wonders, and the judgments of his mouth.", "O ye seed of Abraham his servant;\nye sons of Jacob his chosen.", "He is the Lord our God:\nhis judgments are in all the earth.", "He hath remembered his covenant for ever:\nthe word which he commanded to a thousand generations.", "Which he made to Abraham;\nand his oath to Isaac:", "And he appointed the same to Jacob for a law, and to Israel for an everlasting testament:", "Saying:\nTo thee will I give the land of Chanaan, the lot of your inheritance.", "When they were but a small number:\nyea very few, and sojourners therein:", "And they passed from nation to nation, and from one kingdom to another people.", "He suffered no man to hurt them:\nand he reproved kings for their sakes.", "Touch ye not my anointed:\nand do no evil to my prophets.", "And he called a famine upon the land:\nand he broke in pieces all the support of bread.", "He sent a man before them:\nJoseph, who was sold for a slave.", "They humbled his feet in fetters:\nthe iron pierced his soul,", "Until his word came. The word of the Lord inflamed him.", "The king sent, and he released him:\nthe ruler of the people, and he set him at liberty.", "He made him master of his house, and ruler of all his possession.", "That he might instruct his princes as himself, and teach his ancients wisdom.", "And Israel went into Egypt:\nand Jacob was a sojourner in the land of Cham.", "And he increased his people exceedingly:\nand strengthened them over their enemies.", "He turned their heart to hate his people:\nand to deal deceitfully with his servants.", "He sent Moses his servant:\nAaron the man whom he had chosen.", "He gave them power to shew his signs, and his wonders in the land of Cham.", "He sent darkness, and made it obscure:\nand grieved not his words.", "He turned their waters into blood, and destroyed their fish.", "Their land brought forth frogs, in the inner chambers of their kings.", "He spoke, and there came divers sorts of flies and sciniphs in all their coasts.", "He gave them hail for rain, a burning fire in the land.", "And he destroyed their vineyards and their fig trees:\nand he broke in pieces the trees of their coasts.", "He spoke, and the locust came, and the bruchus, of which there was no number.", "And they devoured all the grass in their land, and consumed all the fruit of their ground.", "And he slew all the firstborn in their land:\nthe firstfruits of all their labour.", "And he brought them out with silver and gold:\nand there was not among their tribes one that was feeble.", "Egypt was glad when they departed:\nfor the fear of them lay upon them.", "He spread a cloud for their protection, and fire to give them light in the night.", "They asked, and the quail came:\nand he filled them with the bread of heaven.", "He opened the rock, and waters flowed:\nrivers ran down in the dry land.", "Because he remembered his holy word, which he had spoken to his servant Abraham.", "And he brought forth his people with joy, and his chosen with gladness.", "And he gave them the lands of the Gentiles:\nand they possessed the labours of the people:", "That they might observe his justifications, and seek after his law."], "104"], ["Confitemini Domino", ["Give glory to the Lord, for he is good:\nfor his mercy endureth for ever.", "Who shall declare the powers of the Lord? who shall set forth all his praises?", "Blessed are they that keep judgment, and do justice at all times.", "Remember us, O Lord, in the favour of thy people:\nvisit us with thy salvation.", "That we may see the good of thy chosen, that we may rejoice in the joy of thy nation:\nthat thou mayst be praised with thy inheritance.", "We have sinned with our fathers:\nwe have acted unjustly, we have wrought iniquity.", "Our fathers understood not thy wonders in Egypt:\nthey remembered not the multitude of thy mercies:\nAnd they provoked to wrath going up to the sea, even the Red Sea.", "And he saved them for his own name's sake:\nthat he might make his power known.", "And he rebuked the Red Sea and it was dried up:\nand he led them through the depths, as in a wilderness.", "And he saved them from the hand of them that hated them:\nand he redeemed them from the hand of the enemy.", "And the water covered them that afflicted them:\nthere was not one of them left.", "And they believed his words:\nand they sang his praises.", "They had quickly done, they forgot his works:\nand they waited not for his counsels.", "And they coveted their desire in the desert:\nand they tempted God in the place without water.", "And he gave them their request:\nand sent fulness into their souls.", "And they provoked Moses in the camp, Aaron the holy one of the Lord.", "The earth opened and swallowed up Dathan:\nand covered the congregation of Abiron.", "And a fire was kindled in their congregation:\nthe flame burned the wicked.", "They made also a calf in Horeb:\nand they adored the graven thing.", "And they changed their glory into the likeness of a calf that eateth grass.", "They forgot God, who saved them, who had done great things in Egypt,", "Wondrous works in the land of Cham:\nterrible things in the Red Sea.", "And he said that he would destroy them:\nhad not Moses his chosen stood before him in the breach:\nTo turn away his wrath, lest he should destroy them.", "And they set at nought the desirable land. They believed not his word,", "And they murmured in their tents:\nthey hearkened not to the voice of the Lord.", "And he lifted up his hand over them:\nto overthrow them in the desert;", "And to cast down their seed among the nations, and to scatter them in the countries.", "They also were initiated to Beelphegor:\nand ate the sacrifices of the dead.", "And they provoked him with their inventions:\nand destruction was multiplied among them.", "Then Phinees stood up, and pacified him:\nand the slaughter ceased.", "And it was reputed to him unto justice, to generation and generation for evermore.", "They provoked him also at the waters of contradiction:\nand Moses was afflicted for their sakes:", "Because they exasperated his spirit. And he distinguished with his lips.", "They did not destroy the nations of which the Lord spoke unto them.", "And they were mingled among the heathens, and learned their works:", "And served their idols, and it became a stumblingblock to them.", "And they sacrificed their sons, and their daughters to devils.", "And they shed innocent blood:\nthe blood of their sons and of their daughters which they sacrificed to the idols of Chanaan. And the land was polluted with blood,", "And was defiled with their works:\nand they went aside after their own inventions.", "And the Lord was exceedingly angry with his people:\nand he abhorred his inheritance.", "And he delivered them into the hands of the nations:\nand they that hated them had dominion over them.", "And their enemies afflicted them:\nand they were humbled under their hands:", "Many times did he deliver them. But they provoked him with their counsel:\nand they were brought low by their iniquities.", "And he saw when they were in tribulation:\nand he heard their prayer.", "And he was mindful of his covenant:\nand repented according to the multitude of his mercies.", "And he gave them unto mercies, in the sight of all those that had made them captives.", "Save us, O Lord, our God:\nand gather us from among nations:\nThat we may give thanks to thy holy name, and may glory in thy praise.", "Blessed be the Lord the God of Israel, from everlasting to everlasting:\nand let all the people say:\nSo be it, so be it."], "105"], ["Confitemini Domino", ["Give glory to the Lord, for he is good:\nfor his mercy endureth for ever.", "Let them say so that have been redeemed by the Lord, whom he hath redeemed from the hand of the enemy:\nand gathered out of the countries.", "From the rising and the setting of the sun, from the north and from the sea.", "They wandered in a wilderness, in a place without water:\nthey found not the way of a city for their habitation.", "They were hungry and thirsty:\ntheir soul fainted in them.", "And they cried to the Lord in their tribulation:\nand he delivered them out of their distresses.", "And he led them into the right way, that they might go to a city of habitation.", "Let the mercies of the Lord give glory to him:\nand his wonderful works to the children of men.", "For he hath satisfied the empty soul, and hath filled the hungry soul with good things.", "Such as sat in darkness and in the shadow of death:\nbound in want and in iron.", "Because they had exasperated the words of God:\nand provoked the counsel of the most High:", "And their heart was humbled with labours:\nthey were weakened, and there was none to help them.", "Then they cried to the Lord in their affliction:\nand he delivered them out of their distresses.", "And he brought them out of darkness, and the shadow of death;\nand broke their bonds in sunder.", "Let the mercies of the Lord give glory to him, and his wonderful works to the children of men.", "Because he hath broken gates of brass, and burst the iron bars.", "He took them out of the way of their iniquity:\nfor they were brought low for their injustices.", "Their soul abhorred all manner of meat:\nand they drew nigh even to the gates of death.", "And they cried to the Lord in their affliction:\nand he delivered them out of their distresses.", "He sent his word, and healed them:\nand delivered them from their destructions.", "Let the mercies of the Lord give glory to him:\nand his wonderful works to the children of men.", "And let them sacrifice the sacrifice of praise:\nand declare his works with joy.", "They that go down to the sea in ships, doing business in the great waters:", "These have seen the works of the Lord, and his wonders in the deep.", "He said the word, and there arose a storm of wind:\nand the waves thereof were lifted up.", "They mount up to the heavens, and they go down to the depths:\ntheir soul pined away with evils.", "They were troubled, and reeled like a drunken man;\nand all their wisdom was swallowed up.", "And they cried to the Lord in their affliction:\nand he brought them out of their distresses.", "And he turned the storm into a breeze:\nand its waves were still.", "And they rejoiced because they were still:\nand he brought them to the haven which they wished for.", "Let the mercies of the Lord give glory to him, and his wonderful works to the children of men.", "And let them exalt him in the church of the people:\nand praise him in the chair of the ancients.", "He hath turned rivers into a wilderness:\nand the sources of water into dry ground:", "A fruitful land into barrenness, for the wickedness of them that dwell therein.", "He hath turned a wilderness into pools of water, and a dry land into water springs.", "And hath placed there the hungry;\nand they made a city for their habitation.", "And they sowed fields, and planted vineyards:\nand they yielded fruit of birth.", "And he blessed them, and they were multiplied exceedingly:\nand their cattle he suffered not to decrease.", "Then they were brought to be few:\nand they were afflicted through the trouble of evils and sorrow.", "Contempt was poured forth upon their princes:\nand he caused them to wander where there was no passing, and out of the way.", "And he helped the poor out of poverty:\nand made him families like a flock of sheep.", "The just shall see, and shall rejoice, and all iniquity shall stop their mouth.", "Who is wise, and will keep these things;\nand will understand the mercies of the Lord?"], "106"], ["Paratum cor meum", ["My heart is ready, O God, my heart is ready:\nI will sing, and will give praise, with my glory.", "Arise, my glory;\narise, psaltery and harp:\nI will arise in the morning early.", "I will praise thee, O Lord, among the people:\nand I will sing unto thee among the populations.", "For thy mercy is great above the heavens:\nand thy truth even unto the clouds.", "Be thou exalted, O God, above the heavens, and thy glory over all the earth:", "That thy beloved may be delivered. Save with thy right hand and hear me.", "God hath spoken in his holiness. I will rejoice, and I will divide Sichem and I will mete out the vale of tabernacles.", "Galaad is mine:\nand Manasses is mine and Ephraim the protection of my head. Juda is my king:", "Moab the pot of my hope. Over Edom I will stretch out my shoe:\nthe aliens are become my friends.", "Who will bring me into the strong city? who will lead me into Edom?", "Wilt not thou, O God, who hast cast us off? and wilt not thou, O God, go forth with our armies?", "O grant us help from trouble:\nfor vain is the help of man.", "Through God we shall do mightily:\nand he will bring our enemies to nothing."], "107"], ["Deus, laudem", ["O God, be not thou silent in my praise:\nfor the mouth of the wicked and the mouth of the deceitful man is opened against me.", "They have spoken against me with deceitful tongues;\nand they have compassed me about with words of hatred;\nand have fought against me without cause.", "Instead of making me a return of love, they detracted me:\nbut I gave myself to prayer.", "And they repaid me evil for good:\nand hatred for my love.", "Set thou the sinner over him:\nand may the devil stand at his right hand.", "When he is judged, may he go out condemned;\nand may his prayer be turned to sin.", "May his days be few:\nand his bishopric let another take.", "May his children be fatherless, and his wife a widow.", "Let his children be carried about vagabonds, and beg;\nand let them be cast out of their dwellings.", "May the usurer search all his substance:\nand let strangers plunder his labours.", "May there be none to help him:\nnor none to pity his fatherless offspring.", "May his posterity be cut off;\nin one generation may his name be blotted out.", "May the iniquity of his fathers be remembered in the sight of the Lord:\nand let not the sin of his mother be blotted out.", "May they be before the Lord continually, and let the memory of them perish from the earth:", "Because he remembered not to shew mercy,", "But persecuted the poor man and the beggar;\nand the broken in heart, to put him to death.", "And he loved cursing, and it shall come unto him:\nand he would not have blessing, and it shall be far from him. And he put on cursing, like a garment:\nand it went in like water into his entrails, and like oil in his bones.", "May it be unto him like a garment which covereth him;\nand like a girdle with which he is girded continually.", "This is the work of them who detract me before the Lord;\nand who speak evils against my soul.", "But thou, O Lord, do with me for thy name's sake:\nbecause thy mercy is sweet. Do thou deliver me,", "For I am poor and needy, and my heart is troubled within me.", "I am taken away like the shadow when it declineth:\nand I am shaken off as locusts.", "My knees are weakened through fasting:\nand my flesh is changed for oil.", "And I am become a reproach to them:\nthey saw me and they shaked their heads.", "Help me, O Lord my God;\nsave me;\naccording to thy mercy.", "And let them know that this is thy hand:\nand that thou, O Lord, hast done it.", "They will curse and thou will bless:\nlet them that rise up against me be confounded:\nbut thy servant shall rejoice.", "Let them that detract me be clothed with shame:\nand let them be covered with their confusion as with a double cloak.", "I will give great thanks to the Lord with my mouth:\nand in the midst of many I will praise him.", "Because he hath stood at the right hand of the poor, to save my soul from persecutors."], "108"], ["Dixit Dominus", ["The Lord said to my Lord:\nSit thou at my right hand:\nUntil I make thy enemies thy footstool.", "The Lord will send forth the sceptre of thy power out of Sion:\nrule thou in the midst of thy enemies.", "With thee is the principality in the day of thy strength:\nin the brightness of the saints:\nfrom the womb before the day star I begot thee.", "The Lord hath sworn, and he will not repent:\nThou art a priest for ever according to the order of Melchisedech.", "The Lord at thy right hand hath broken kings in the day of his wrath.", "He shall judge among nations, he shall fill ruins:\nhe shall crush the heads in the land of the many.", "He shall drink of the torrent in the way:\ntherefore shall he lift up the head."], "109"], ["Confitebor tibi", ["I will praise thee, O Lord, with my whole heart;\nin the council of the just, and in the congregation.", "Great are the works of the Lord:\nsought out according to all his wills.", "His work is praise and magnificence:\nand his justice continueth for ever and ever.", "He hath made a remembrance of his wonderful works, being a merciful and gracious Lord:", "He hath given food to them that fear him. He will be mindful for ever of his covenant:", "He will shew forth to his people the power of his works.", "That he may give them the inheritance of the Gentiles:\nthe works of his hands are truth and judgment.", "All his commandments are faithful:\nconfirmed for ever and ever, made in truth and equity.", "He hath sent redemption to his people:\nhe hath commanded his covenant for ever. Holy and terrible is his name:", "The fear of the Lord is the beginning of wisdom. A good understanding to all that do it:\nhis praise continueth for ever and ever."], "110"], ["Beatus vir", ["Blessed is the man that feareth the Lord:\nhe shall delight exceedingly in his commandments.", "His seed shall be mighty upon earth:\nthe generation of the righteous shall be blessed.", "Glory and wealth shall be in his house:\nand his justice remaineth for ever and ever.", "To the righteous a light is risen up in darkness:\nhe is merciful, and compassionate and just.", "Acceptable is the man that sheweth mercy and lendeth:\nhe shall order his words with judgment:", "Because he shall not be moved for ever.", "The just shall be in everlasting remembrance:\nhe shall not fear the evil hearing. His heart is ready to hope in the Lord:", "His heart is strengthened, he shall not be moved until he look over his enemies.", "He hath distributed, he hath given to the poor:\nhis justice remaineth for ever and ever:\nhis horn shall be exalted in glory.", "The wicked shall see, and shall be angry, he shall gnash with his teeth and pine away:\nthe desire of the wicked shall perish."], "111"], ["Laudate, pueri", ["Praise the Lord, ye children:\npraise ye the name of the Lord.", "Blessed be the name of the Lord, from henceforth now and for ever.", "From the rising of the sun unto the going down of the same, the name of the Lord is worthy of praise.", "The Lord is high above all nations;\nand his glory above the heavens.", "Who is as the Lord our God, who dwelleth on high:", "And looketh down on the low things in heaven and in earth?", "Raising up the needy from the earth, and lifting up the poor out of the dunghill:", "That he may place him with princes, with the princes of his people.", "Who maketh a barren woman to dwell in a house, the joyful mother of children."], "112"], ["In exitu Israel", ["When Israel went out of Egypt, the house of Jacob from a barbarous people:", "Judea was made his sanctuary, Israel his dominion.", "The sea saw and fled:\nJordan was turned back.", "The mountains skipped like rams, and the hills like the lambs of the flock.", "What ailed thee, O thou sea, that thou didst flee:\nand thou, O Jordan, that thou wast turned back?", "Ye mountains, that ye skipped like rams, and ye hills, like lambs of the flock?", "At the presence of the Lord the earth was moved, at the presence of the God of Jacob:", "Who turned the rock into pools of water, and the stony hill into fountains of waters."], "113A"], ["Non nobis, Domine", ["Not to us, O Lord, not to us;\nbut to thy name give glory.", "For thy mercy, and for thy truth's sake:\nlest the Gentiles should say:\nWhere is their God?", "But our God is in heaven:\nhe hath done all things whatsoever he would.", "The idols of the Gentiles are silver and gold, the works of the hands of men.", "They have mouths and speak not:\nthey have eyes and see not.", "They have ears and hear not:\nthey have noses and smell not.", "They have hands and feel not:\nthey have feet and walk not:\nneither shall they cry out through their throat.", "Let them that make them become like unto them:\nand all such as trust in them.", "The house of Israel hath hoped in the Lord:\nhe is their helper and their protector.", "The house of Aaron hath hoped in the Lord:\nhe is their helper and their protector.", "They that fear the Lord hath hoped in the Lord:\nhe is their helper and their protector.", "The Lord hath been mindful of us, and hath blessed us. He hath blessed the house of Israel:\nhe hath blessed the house of Aaron.", "He hath blessed all that fear the Lord, both little and great.", "May the Lord add blessings upon you:\nupon you, and upon your children.", "Blessed be you of the Lord, who made heaven and earth.", "The heaven of heaven is the Lord's:\nbut the earth he has given to the children of men.", "The dead shall not praise thee, O Lord:\nnor any of them that go down to hell.", "But we that live bless the Lord:\nfrom this time now and for ever."], "113B"], ["Dilexi, quoniam", ["I have loved, because the Lord will hear the voice of my prayer.", "Because he hath inclined his ear unto me:\nand in my days I will call upon him.", "The sorrows of death have encompassed me:\nand the perils of hell have found me. I met with trouble and sorrow:", "And I called upon the name of the Lord. O Lord, deliver my soul.", "The Lord is merciful and just, and our God sheweth mercy.", "The Lord is the keeper of little ones:\nI was little and he delivered me.", "Turn, O my soul, into thy rest:\nfor the Lord hath been bountiful to thee.", "For he hath delivered my soul from death:\nmy eyes from tears, my feet from falling.", "I will please the Lord in the land of the living.", "I have believed, therefore have I spoken;\nbut I have been humbled exceedingly.", "I said in my excess:\nEvery man is a liar.", "What shall I render to the Lord, for all the things he hath rendered unto me?", "I will take the chalice of salvation;\nand I will call upon the name of the Lord.", "I will pay my vows to the Lord before all his people:", "Precious in the sight of the Lord is the death of his saints.", "O Lord, for I am thy servant:\nI am thy servant, and the son of thy handmaid. Thou hast broken my bonds:", "I will sacrifice to thee the sacrifice of praise, and I will call upon the name of the Lord.", "I will pay my vows to the Lord in the sight of all his people:", "In the courts of the house of the Lord, in the midst of thee, O Jerusalem."], "114–115"], ["Laudate Dominum", ["O Praise the Lord, all ye nations:\npraise him, all ye people.", "For his mercy is confirmed upon us:\nand the truth of the Lord remaineth for ever."], "116"], ["Confitemini Domino", ["Give praise to the Lord, for he is good:\nfor his mercy endureth for ever.", "Let Israel now say, that he is good:\nthat his mercy endureth for ever.", "Let the house of Aaron now say, that his mercy endureth for ever.", "Let them that fear the Lord now say, that his mercy endureth for ever.", "In my trouble I called upon the Lord:\nand the Lord heard me, and enlarged me.", "The Lord is my helper:\nI will not fear what man can do unto me.", "The Lord is my helper:\nand I will look over my enemies.", "It is good to confide in the Lord, rather than to have confidence in man.", "It is good to trust in the Lord, rather than to trust in princes.", "All nations compassed me about;\nand, in the name of the Lord I have been revenged on them.", "Surrounding me they compassed me about:\nand in the name of the Lord I have been revenged on them.", "They surrounded me like bees, and they burned like fire among thorns:\nand in the name of the Lord I was revenged on them.", "Being pushed I was overturned that I might fall:\nbut the Lord supported me.", "The Lord is my strength and my praise:\nand he is become my salvation.", "The voice of rejoicing and of salvation is in the tabernacles of the just.", "The right hand of the Lord hath wrought strength:\nthe right hand of the Lord hath exulted me:\nthe right hand of the Lord hath wrought strength.", "I shall not die, but live:\nand shall declare the works of the Lord.", "The Lord chastising hath chastised me:\nbut he hath not delivered me over to death.", "Open ye to me the gates of justice:\nI will go into them, and give praise to the Lord.", "This is the gate of the Lord, the just shall enter into it.", "I will give glory to thee because thou hast heard me:\nand art become my salvation.", "The stone which the builders rejected;\nthe same is become the head of the corner.", "This is the Lord's doing, and it is wonderful in our eyes.", "This is the day which the Lord hath made:\nlet us be glad and rejoice therein.", "O Lord, save me:\nO Lord, give good success.", "Blessed be he that cometh in the name Lord. We have blessed you out of the house of the Lord.", "The Lord is God, and he hath shone upon us. Appoint a solemn day, with shady boughs, even to the horn of the altar.", "Thou art my God, and I will praise thee:\nthou art my God, and I will exalt thee. I will praise thee, because thou hast heard me, and art become my salvation.", "O praise ye the Lord, for he is good:\nfor his mercy endureth for ever."], "117"], ["Beati immaculati", ["Blessed are the undefiled in the way, who walk in the law of the Lord.", "Blessed are they who search his testimonies :\nthat seek him with their whole heart.", "For they that work iniquity, have not walked in his ways.", "Thou hast commanded thy commandments to be kept most diligently.", "O! that my ways may be directed to keep thy justifications.", "Then shall I not be confounded, when I shall look into all thy commandments.", "I will praise thee with uprightness of heart, when I shall have learned the judgments of thy justice.", "I will keep thy justifications:\nO! do not thou utterly forsake me.", "By what doth a young man correct his way? by observing thy words.", "With my whole heart have I sought after thee:\nlet me not stray from thy commandments.", "Thy words have I hidden in my heart, that I may not sin against thee.", "Blessed art thou, O Lord:\nteach me thy justifications.", "With my lips I have pronounced all the judgments of thy mouth.", "I have been delighted in the way of thy testimonies, as in all riches.", "I will meditate on thy commandments:\nand I will consider thy ways.", "I will think of thy justifications:\nI will not forget thy words.", "Give bountifully to thy servant, enliven me:\nand I shall keep thy words.", "Open thou my eyes:\nand I will consider the wondrous things of thy law.", "I am a sojourner on the earth:\nhide not thy commandments from me.", "My soul hath coveted to long for thy justifications, at all times.", "Thou hast rebuked the proud:\nthey are cursed who decline from thy commandments.", "Remove from me reproach and contempt:\nbecause I have sought after thy testimonies.", "For princes sat, and spoke against me:\nbut thy servant was employed in thy justifications.", "For thy testimonies are my meditation:\nand thy justifications my counsel.", "My soul hath cleaved to the pavement:\nquicken thou me according to thy word.", "I have declared my ways, and thou hast heard me:\nteach me thy justifications.", "Make me to understand the way of thy justifications:\nand I shall be exercised in thy wondrous works.", "My soul hath slumbered through heaviness:\nstrengthen thou me in thy words.", "Remove from me the way of iniquity:\nand out of thy law have mercy on me.", "I have chosen the way of truth:\nthy judgments I have not forgotten.", "I have stuck to thy testimonies, O Lord:\nput me not to shame.", "I have run the way of thy commandments, when thou didst enlarge my heart.", "Set before me for a law the way of thy justifications, O Lord:\nand I will always seek after it.", "Give me understanding, and I will search thy law;\nand I will keep it with my whole heart.", "Lead me into the path of thy commandments;\nfor this same I have desired.", "Incline my heart into thy testimonies and not to covetousness.", "Turn away my eyes that they may not behold vanity:\nquicken me in thy way.", "Establish thy word to thy servant, in thy fear.", "Turn away my reproach, which I have apprehended:\nfor thy judgments are delightful.", "Behold I have longed after thy precepts:\nquicken me in thy justice.", "Let thy mercy also come upon me, O Lord:\nthy salvation according to thy word.", "So shall I answer them that reproach me in any thing;\nthat I have trusted in thy words.", "And take not thou the word of truth utterly out of my mouth:\nfor in thy words have I hoped exceedingly.", "So shall I always keep thy law, for ever and ever.", "And I walked at large:\nbecause I have sought after thy commandments.", "And I spoke of thy testimonies before kings:\nand I was not ashamed.", "I meditated also on thy commandments, which I loved.", "And I lifted up my hands to thy commandments, which I loved:\nand I was exercised in thy justifications.", "Be thou mindful of thy word to thy servant, in which thou hast given me hope.", "This hath comforted me in my humiliation:\nbecause thy word hath enlivened me.", "The proud did iniquitously altogether:\nbut I declined not from thy law.", "I remembered, O Lord, thy judgments of old:\nand I was comforted.", "A fainting hath taken hold of me, because of the wicked that forsake thy law.", "Thy justifications were the subject of my song, in the place of my pilgrimage.", "In the night I have remembered thy name, O Lord:\nand have kept thy law.", "This happened to me:\nbecause I sought after thy justifications.", "O Lord, my portion, I have said, I would keep thy law.", "I entreated thy face with all my heart:\nhave mercy on me according to thy word.", "I have thought on my ways:\nand turned my feet unto thy testimonies.", "I am ready, and am not troubled:\nthat I may keep thy commandments.", "The cords of the wicked have encompassed me:\nbut I have not forgotten thy law.", "I rose at midnight to give praise to thee;\nfor the judgments of thy justification.", "I am a partaker with all them that fear thee, and that keep thy commandments.", "The earth, O Lord, is full of thy mercy:\nteach me thy justifications.", "Thou hast done well with thy servant, O Lord, according to thy word.", "Teach me goodness and discipline and knowledge;\nfor I have believed thy commandments.", "Before I was humbled I offended;\ntherefore have I kept thy word.", "Thou art good;\nand in thy goodness teach me thy justifications.", "The iniquity of the proud hath been multiplied over me:\nbut I will seek thy commandments with my whole heart.", "Their heart is curdled like milk:\nbut I have meditated on thy law.", "It is good for me that thou hast humbled me, that I may learn thy justifications.", "The law of thy mouth is good to me, above thousands of gold and silver.", "Thy hands have made me and formed me:\ngive me understanding, and I will learn thy commandments.", "They that fear thee shall see me, and shall be glad:\nbecause I have greatly hoped in thy words.", "I know, O Lord, that thy judgments are equity:\nand in thy truth thou hast humbled me.", "O! let thy mercy be for my comfort, according to thy word unto thy servant.", "Let thy tender mercies come unto me, and I shall live:\nfor thy law is my meditation.", "Let the proud be ashamed, because they have done unjustly towards me:\nbut I will be employed in thy commandments.", "Let them that fear thee turn to me:\nand they that know thy testimonies.", "Let my heart be undefiled in thy justifications, that I may not be confounded.", "My soul hath fainted after thy salvation:\nand in thy word I have very much hoped.", "My eyes have failed for thy word, saying:\nWhen wilt thou comfort me?", "For I am become like a bottle in the frost:\nI have not forgotten thy justifications.", "How many are the days of thy servant:\nwhen wilt thou execute judgment on them that persecute me?", "The wicked have told me fables:\nbut not as thy law.", "All thy statutes are truth:\nthey have persecuted me unjustly, do thou help me.", "They had almost made an end of me upon earth:\nbut I have not forsaken thy commandments.", "Quicken thou me according to thy mercy:\nand I shall keep the testimonies of thy mouth.", "For ever, O Lord, thy word standeth firm in heaven.", "Thy truth unto all generations:\nthou hast founded the earth, and it continueth.", "By thy ordinance the day goeth on:\nfor all things serve thee.", "Unless thy law had been my meditation, I had then perhaps perished in my abjection.", "Thy justifications I will never forget:\nfor by them thou hast given me life.", "I am thine, save thou me:\nfor I have sought thy justifications.", "The wicked have waited for me to destroy me:\nbut I have understood thy testimonies.", "I have seen an end to all persecution:\nthy commandment is exceeding broad.", "O how have I loved thy law, O Lord! it is my meditation all the day.", "Through thy commandment, thou hast made me wiser than my enemies:\nfor it is ever with me.", "I have understood more than all my teachers:\nbecause thy testimonies are my meditation.", "I have had understanding above ancients:\nbecause I have sought thy commandments.", "I have restrained my feet from every evil way:\nthat I may keep thy words.", "I have not declined from thy judgments, because thou hast set me a law.", "How sweet are thy words to my palate! more than honey to my mouth.", "By thy commandments I have had understanding:\ntherefore have I hated every way of iniquity.", "Thy word is a lamp to my feet, and a light to my paths.", "I have sworn and am determined to keep the judgments of thy justice.", "I have been humbled, O Lord, exceedingly:\nquicken thou me according to thy word.", "The free offerings of my mouth make acceptable, O Lord:\nand teach me thy judgments.", "My soul is continually in my hands:\nand I have not forgotten thy law.", "Sinners have laid a snare for me:\nbut I have not erred from thy precepts.", "I have purchased thy testimonies for an inheritance for ever:\nbecause they are a joy to my heart.", "I have inclined my heart to do thy justifications for ever, for the reward.", "I have hated the unjust:\nand have loved thy law.", "Thou art my helper and my protector:\nand in thy word I have greatly hoped.", "Depart from me, ye malignant:\nand I will search the commandments of my God.", "Uphold me according to thy word, and I shall live:\nand let me not be confounded in my expectation.", "Help me, and I shall be saved:\nand I will meditate always on thy justifications.", "Thou hast despised all them that fall off from thy judgments;\nfor their thought is unjust.", "I have accounted all the sinners of the earth prevaricators:\ntherefore have I loved thy testimonies.", "Pierce thou my flesh with thy fear:\nfor I am afraid of thy judgments.", "I have done judgment and justice:\ngive me not up to them that slander me.", "Uphold thy servant unto good:\nlet not the proud calumniate me.", "My eyes have fainted after thy salvation:\nand for the word of thy justice.", "Deal with thy servant according to thy mercy:\nand teach me thy justifications.", "I am thy servant:\ngive me understanding that I may know thy testimonies.", "It is time, O Lord, to do:\nthey have dissipated thy law.", "Therefore have I loved thy commandments above gold and the topaz.", "Therefore was I directed to all thy commandments:\nI have hated all wicked ways.", "Thy testimonies are wonderful:\ntherefore my soul hath sought them.", "The declaration of thy words giveth light:\nand giveth understanding to little ones.", "I opened my mouth, and panted:\nbecause I longed for thy commandments.", "Look thou upon me, and have mercy on me according to the judgment of them that love thy name.", "Direct my steps according to thy word:\nand let no iniquity have dominion over me.", "Redeem me from the calumnies of men:\nthat I may keep thy commandments.", "Make thy face to shine upon thy servant:\nand teach me thy justifications.", "My eyes have sent forth springs of water:\nbecause they have not kept thy law.", "Thou art just, O Lord:\nand thy judgment is right.", "Thou hast commanded justice thy testimonies:\nand thy truth exceedingly.", "My zeal hath made me pine away:\nbecause my enemies forgot thy words.", "Thy word is exceedingly refined:\nand thy servant hath loved it.", "I am very young and despised;\nbut I forgot not thy justifications.", "Thy justice is justice for ever:\nand thy law is the truth.", "Trouble and anguish have found me:\nthy commandments are my meditation.", "Thy testimonies are justice for ever:\ngive me understanding, and I shall live.", "I cried with my whole heart, hear me, O Lord:\nI will seek thy justifications.", "I cried unto thee, save me:\nthat I may keep thy commandments.", "I prevented the dawning of the day, and cried:\nbecause in thy words I very much hoped.", "My eyes to thee have prevented the morning:\nthat I might meditate on thy words.", "Hear thou my voice, O Lord, according to thy mercy:\nand quicken me according to thy mercy.", "They that persecute me have drawn nigh to iniquity;\nbut they are gone far off from thy law.", "Thou art near, O Lord:\nand all thy ways are truth.", "I have known from the beginning concerning thy testimonies:\nthat thou hast founded them for ever.", "See my humiliation and deliver me:\nfor I have not forgotten thy law.", "Judge my judgment and redeem me:\nquicken thou me for thy word's sake.", "Salvation is far from sinners;\nbecause they have not sought thy justifications.", "Many, O Lord, are thy mercies:\nquicken me according to thy judgment.", "Many are they that persecute me and afflict me;\nbut I have not declined from thy testimonies.", "I beheld the transgressors, and I pined away;\nbecause they kept not thy word.", "Behold I have loved thy commandments, O Lord;\nquicken me thou in thy mercy.", "The beginning of thy words is truth:\nall the judgments of thy justice are for ever.", "Princes have persecuted me without cause:\nand my heart hath been in awe of thy words.", "I will rejoice at thy words, as one that hath found great spoil.", "I have hated and abhorred iniquity;\nbut I have loved thy law.", "Seven times a day I have given praise to thee, for the judgments of thy justice.", "Much peace have they that love thy law, and to them there is no stumbling block.", "I looked to thy salvation, O Lord:\nand I loved thy commandments.", "My soul hath kept thy testimonies and hath loved them exceedingly.", "I have kept thy commandments and thy testimonies:\nbecause all my ways are in thy sight.", "Let my supplication, O Lord, come near in thy sight:\ngive me understanding according to thy word.", "Let my request come in before thee;\ndeliver thou me according to thy word.", "My lips shall utter a hymn, when thou shalt teach me thy justifications.", "My tongue shall pronounce thy word:\nbecause all thy commandments are justice.", "Let thy hand be with me to save me;\nfor I have chosen thy precepts.", "I have longed for thy salvation, O Lord;\nand thy law is my meditation.", "My soul shall live and shall praise thee:\nand thy judgments shall help me.", "I have gone astray like a sheep that is lost:\nseek thy servant, because I have not forgotten thy commandments."], "118"], ["Ad Dominum", ["In my trouble I cried to the Lord:\nand he heard me.", "O Lord, deliver my soul from wicked lips, and a deceitful tongue.", "What shall be given to thee, or what shall be added to thee, to a deceitful tongue?", "The sharp arrows of the mighty, with coals that lay waste.", "Woe is me, that my sojourning is prolonged! I have dwelt with the inhabitants of Cedar:", "My soul hath been long a sojourner.", "With them that hated peace I was peaceable:\nwhen I spoke to them they fought against me without cause."], "119"], ["Levavi oculos", ["I have lifted up my eyes to the mountains, from whence help shall come to me.", "My help is from the Lord, who made heaven and earth.", "May he not suffer thy foot to be moved:\nneither let him slumber that keepeth thee.", "Behold he shall neither slumber nor sleep, that keepeth Israel.", "The Lord is thy keeper, the Lord is thy protection upon thy right hand.", "The sun shall not burn thee by day:\nnor the moon by night.", "The Lord keepeth thee from all evil:\nmay the Lord keep thy soul.", "May the Lord keep thy coming in and thy going out;\nfrom henceforth now and for ever."], "120"], ["Laetatus sum", ["I rejoiced at the things that were said to me:\nWe shall go into the house of the Lord.", "Our feet were standing in thy courts, O Jerusalem.", "Jerusalem, which is built as a city, which is compact together.", "For thither did the tribes go up, the tribes of the Lord:\nthe testimony of Israel, to praise the name of the Lord.", "Because their seats have sat in judgment, seats upon the house of David.", "Pray ye for the things that are for the peace of Jerusalem:\nand abundance for them that love thee.", "Let peace be in thy strength:\nand abundance in thy towers.", "For the sake of my brethren, and of my neighbours, I spoke peace of thee.", "Because of the house of the Lord our God, I have sought good things for thee."], "121"], ["Ad te levavi oculos meos", ["To thee have I lifted up my eyes, who dwellest in heaven.", "Behold as the eyes of servants are on the hands of their masters, As the eyes of the handmaid are on the hands of her mistress:\nso are our eyes unto the Lord our God, until he have mercy on us.", "Have mercy on us, O Lord, have mercy on us:\nfor we are greatly filled with contempt.", "For our soul is greatly filled:\nwe are a reproach to the rich, and contempt to the proud."], "122"], ["Nisi quia Dominus", ["If it had not been that the Lord was with us, let Israel now say:", "If it had not been that the Lord was with us, When men rose up against us,", "Perhaps they had swallowed us up alive. When their fury was enkindled against us,", "Perhaps the waters had swallowed us up.", "Our soul hath passed through a torrent:\nperhaps our soul had passed through a water insupportable.", "Blessed be the Lord, who hath not given us to be a prey to their teeth.", "Our soul hath been delivered as a sparrow out of the snare of the fowlers. The snare is broken, and we are delivered.", "Our help is in the name of the Lord, who made heaven and earth."], "123"], ["Qui confidunt", ["They that trust in the Lord shall be as mount Sion:\nhe shall not be moved for ever that dwelleth", "In Jerusalem. Mountains are round about it:\nso the Lord is round about his people from henceforth now and for ever.", "For the Lord will not leave the rod of sinners upon the lot of the just:\nthat the just may not stretch forth their hands to iniquity.", "Do good, O Lord, to those that are good, and to the upright of heart.", "But such as turn aside into bonds, the Lord shall lead out with the workers of iniquity:\npeace upon Israel."], "124"], ["In convertendo", ["When the Lord brought back the captivity of Sion, we became like men comforted.", "Then was our mouth filled with gladness;\nand our tongue with joy. Then shall they say among the Gentiles:\nThe Lord hath done great things for them.", "The Lord hath done great things for us:\nwe are become joyful.", "Turn again our captivity, O Lord, as a stream in the south.", "They that sow in tears shall reap in joy.", "Going they went and wept, casting their seeds.", "But coming they shall come with joyfulness, carrying their sheaves."], "125"], ["Nisi Dominus", ["Unless the Lord build the house, they labour in vain that build it. Unless the Lord keep the city, he watcheth in vain that keepeth it.", "It is vain for you to rise before light, rise ye after you have sitten, you that eat the bread of sorrow. When he shall give sleep to his beloved,", "Behold the inheritance of the Lord are children:\nthe reward, the fruit of the womb.", "As arrows in the hand of the mighty, so the children of them that have been shaken.", "Blessed is the man that hath filled the desire with them;\nhe shall not be confounded when he shall speak to his enemies in the gate."], "126"], ["Beati omnes", ["Blessed are all they that fear the Lord:\nthat walk in his ways.", "For thou shalt eat the labours of thy hands:\nblessed art thou, and it shall be well with thee.", "Thy wife as a fruitful vine, on the sides of thy house. Thy children as olive plants, round about thy table.", "Behold, thus shall the man be blessed that feareth the Lord.", "May the Lord bless thee out of Sion:\nand mayest thou see the good things of Jerusalem all the days of thy life.", "And mayest thou see thy children's children, peace upon Israel."], "127"], ["Saepe expugnaverunt", ["Often have they fought against me from my youth, let Israel now say.", "Often have they fought against me from my youth:\nbut they could not prevail over me.", "The wicked have wrought upon my back:\nthey have lengthened their iniquity.", "The Lord who is just will cut the necks of sinners:", "Let them all be confounded and turned back that hate Sion.", "Let them be as grass on the tops of houses:\nwhich withered before it be plucked up:", "Wherewith the mower filleth not his hand:\nnor he that gathereth sheaves his bosom.", "And they that have passed by have not said:\nThe blessing of the Lord be upon you:\nwe have blessed you in the name of the Lord."], "128"], ["De profundis", ["Out of the depths I have cried to thee, O Lord:", "Lord, hear my voice. Let thy ears be attentive to the voice of my supplication.", "If thou, O Lord, wilt mark iniquities:\nLord, who shall stand it.", "For with thee there is merciful forgiveness:\nand by reason of thy law, I have waited for thee, O Lord. My soul hath relied on his word:", "My soul hath hoped in the Lord.", "From the morning watch even until night, let Israel hope in the Lord.", "Because with the Lord there is mercy:\nand with him plentiful redemption.", "And he shall redeem Israel from all his iniquities."], "129"], ["Domine, non est", ["Lord, my heart is not exalted:\nnor are my eyes lofty. Neither have I walked in great matters, nor in wonderful things above me.", "If I was not humbly minded, but exalted my soul:\nAs a child that is weaned is towards his mother, so reward in my soul.", "Let Israel hope in the Lord, from henceforth now and for ever."], "130"], ["Memento, Domine", ["O Lord, remember David, and all his meekness.", "How he swore to the Lord, he vowed a vow to the God of Jacob:", "If I shall enter into the tabernacle of my house:\nif I shall go up into the bed wherein I lie:", "If I shall give sleep to my eyes, or slumber to my eyelids,", "Or rest to my temples:\nuntil I find out a place for the Lord, a tabernacle for the God of Jacob.", "Behold we have heard of it in Ephrata:\nwe have found it in the fields of the wood.", "We will go into his tabernacle:\nwe will adore in the place where his feet stood.", "Arise, O Lord, into thy resting place:\nthou and the ark, which thou hast sanctified.", "Let thy priests be clothed with justice:\nand let thy saints rejoice.", "For thy servant David's sake, turn not away the face of thy anointed.", "The Lord hath sworn truth to David, and he will not make it void:\nof the fruit of thy womb I will set upon thy throne.", "If thy children will keep thy covenant, and these my testimonies which I shall teach them:\nTheir children also for evermore shall sit upon thy throne.", "For the Lord hath chosen Sion:\nhe hath chosen it for his dwelling.", "This is my rest for ever and ever:\nhere will I dwell, for I have chosen it.", "Blessing I will bless her widow:\nI will satisfy her poor with bread.", "I will clothe her priests with salvation, and her saints shall rejoice with exceeding great joy.", "There will I bring forth a horn to David:\nI have prepared a lamp for my anointed.", "His enemies I will clothe with confusion:\nbut upon him will my sanctification flourish."], "131"], ["Ecce quam bonum!", ["Behold how good and how pleasant it is for brethren to dwell in unity.", "Like the precious ointment on the head, that ran down upon the beard, the beard of Aaron, Which ran down to the skirt of his garment:", "As the dew of Hermon, which descendeth upon mount Sion. For there the Lord hath commandeth blessing, and life for evermore."], "132"], ["Ecce nunc", ["Behold now bless ye the Lord, all ye servants of the Lord:\nWho stand in the house of the Lord, in the courts of the house of our God.", "In the nights lift up your hands to the holy places, and bless ye the Lord.", "May the Lord out of Sion bless thee, he that made heaven and earth."], "133"], ["Laudate nomen", ["Praise ye the name of the Lord:\nO you his servants, praise the Lord:", "You that stand in the house of the Lord, in the courts of the house of our God.", "Praise ye the Lord, for the Lord is good:\nsing ye to his name, for it is sweet.", "For the Lord hath chosen Jacob unto himself:\nIsrael for his own possession.", "For I have known that the Lord is great, and our God is above all gods.", "Whatsoever the Lord hath pleased he hath done, in heaven, in earth, in the sea, and in all the deeps.", "He bringeth up clouds from the end of the earth:\nhe hath made lightnings for the rain. He bringeth forth winds out of his stores:", "He slew the firstborn of Egypt from man even unto beast.", "He sent forth signs and wonders in the midst of thee, O Egypt:\nupon Pharao, and upon all his servants.", "He smote many nations, and slew mighty kings:", "Sehon king of the Amorrhites, and Og king of Basan, and all the kingdoms of Chanaan.", "And gave their land for an inheritance, for an inheritance to his people Israel.", "Thy name, O Lord, is for ever:\nthy memorial, O Lord, unto all generations.", "For the Lord will judge his people, and will be entreated in favour of his servants.", "The idols of the Gentiles are silver and gold, the works of men's hands.", "They have a mouth, but they speak not:\nthey have eyes, but they see not.", "They have ears, but they hear not:\nneither is there any breath in their mouths.", "Let them that make them be like to them:\nand every one that trusteth in them.", "Bless the Lord, O house of Israel:\nbless the Lord, O house of Aaron.", "Bless the Lord, O house of Levi:\nyou that fear the Lord, bless the Lord.", "Blessed be the Lord out of Sion, who dwelleth in Jerusalem."], "134"], ["Confitemini", ["Praise the Lord , for he is good:\nfor his mercy endureth for ever.", "Praise ye the God of gods:\nfor his mercy endureth for ever.", "Praise ye the Lord of lords:\nfor his mercy endureth for ever.", "Who alone doth great wonders:\nfor his mercy endureth for ever.", "Who made the heavens in understanding:\nfor his mercy endureth for ever.", "Who established the earth above the waters:\nfor his mercy endureth for ever.", "Who made the great lights:\nfor his mercy endureth for ever.", "The sun to rule over the day:\nfor his mercy endureth for ever.", "The moon and the stars to rule the night:\nfor his mercy endureth for ever.", "Who smote Egypt with their firstborn:\nfor his mercy endureth for ever.", "Who brought out Israel from among them:\nfor his mercy endureth for ever.", "With a mighty hand and a stretched out arm:\nfor his mercy endureth for ever.", "Who divided the Red Sea into parts:\nfor his mercy endureth for ever.", "And brought out Israel through the midst thereof:\nfor his mercy endureth for ever.", "And overthrew Pharao and his host in the Red Sea:\nfor his mercy endureth for ever.", "Who led his people through the desert:\nfor his mercy endureth for ever.", "Who smote great kings:\nfor his mercy endureth for ever.", "And slew strong kings:\nfor his mercy endureth for ever.", "Sehon king of the Amorrhites:\nfor his mercy endureth for ever.", "And Og king of Basan:\nfor his mercy endureth for ever.", "And he gave their land for an inheritance:\nfor his mercy endureth for ever.", "For an inheritance to his servant Israel:\nfor his mercy endureth for ever.", "For he was mindful of us in our affliction:\nfor his mercy endureth for ever.", "And he redeemed us from our enemies:\nfor his mercy endureth for ever.", "Who giveth food to all flesh:\nfor his mercy endureth for ever.", "Give glory to the God of heaven:\nfor his mercy endureth for ever.", "Give glory to the Lord of lords:\nfor his mercy endureth for ever."], "135"], ["Super flumina", ["Upon the rivers of Babylon, there we sat and wept:\nwhen we remembered Sion:", "On the willows in the midst thereof we hung up our instruments.", "For there they that led us into captivity required of us the words of songs. And they that carried us away, said:\nSing ye to us a hymn of the songs of Sion.", "How shall we sing the song of the Lord in a strange land?", "If I forget thee, O Jerusalem, let my right hand be forgotten.", "Let my tongue cleave to my jaws, if I do not remember thee:\nIf I make not Jerusalem the beginning of my joy.", "Remember, O Lord, the children of Edom, in the day of Jerusalem:\nWho say:\nRase it, rase it, even to the foundation thereof.", "O daughter of Babylon, miserable:\nblessed shall he be who shall repay thee thy payment which thou hast paid us.", "Blessed be he that shall take and dash thy little ones against the rock."], "136"], ["Confitebor tibi", ["I will praise thee, O Lord, with my whole heart:\nfor thou hast heard the words of my mouth. I will sing praise to thee in the sight of the angels:", "I will worship towards thy holy temple, and I will give glory to thy name. For thy mercy, and for thy truth:\nfor thou hast magnified thy holy name above all.", "In what day soever I shall call upon thee, hear me:\nthou shall multiply strength in my soul.", "May all the kings of the earth give glory to thee:\nfor they have heard all the words of thy mouth.", "And let them sing in the ways of the Lord:\nfor great is the glory of the Lord.", "For the Lord is high, and looketh on the low:\nand the high he knoweth afar off.", "If I shall walk in the midst of tribulation, thou wilt quicken me:\nand thou hast stretched forth thy hand against the wrath of my enemies:\nand thy right hand hath saved me.", "The Lord will repay for me:\nthy mercy, O Lord, endureth for ever:\nO despise not the work of thy hands."], "137"], ["Domine, probasti", ["Lord, thou hast proved me, and known me:", "Thou hast known my sitting down, and my rising up.", "Thou hast understood my thoughts afar off:\nmy path and my line thou hast searched out." // ---- The screen -----------------------------------------------------------------
// A 320 x 180 picture, scaled up with hard edges, as a 16-bit console would.
const W = 320, H = 180;
// The picture is still laid out on a 320 x 180 grid, and the art keeps its
// big square pixels; but the canvas itself is finer (R times), so words
// come out smooth and easy to read.
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0, R = 3;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  R = clamp(Math.round(scale * (window.devicePixelRatio || 1)), 2, 4);
  cv.width = W * R; cv.height = H * R;
  ctx.imageSmoothingEnabled = false;
  const w = Math.floor(W * scale), h = Math.floor(H * scale);
  offX = Math.floor((innerWidth - w) / 2); offY = Math.floor((innerHeight - h) / 2);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.style.left = offX + "px"; cv.style.top = offY + "px";
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
addEventListener("resize", resize); resize();
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// ---- Words ---------------------------------------------------------------------
// Clear type, drawn at the canvas's full resolution: a friendly sans-serif
// for the game's own words, a book serif for the psalms.
const SANS = "'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif";
const SERIF = "Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif";
const fontOf = (size, serif) => (serif ? "italic 600 " : "700 ") + size + "px " + (serif ? SERIF : SANS);
function measure(str, size, serif) { ctx.save(); ctx.font = fontOf(size, serif); const w = ctx.measureText(str).width; ctx.restore(); return w; }
function text(str, x, y, o) {
  o = o || {};
  const size = o.size || 8, color = o.color || "#ffffff", edge = o.edge === undefined ? "#140c1c" : o.edge;
  ctx.save();
  ctx.font = fontOf(size, o.serif);
  ctx.textAlign = o.align || "left"; ctx.textBaseline = "top";
  if (edge) { ctx.lineJoin = "round"; ctx.lineWidth = Math.max(1.6, size / 4.5); ctx.strokeStyle = edge; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}
function wrapText(str, size, width, serif) {
  const words = flat(str).split(" "), lines = []; let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (measure(t, size, serif) > width && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}

// ---- Music and sound ----------------------------------------------------------------
// The sound of the 16-bit consoles and the Commodore 64, made in the browser:
// pulse waves whose width sweeps, a resonant filter on a sawtooth for the
// bass, a stepped triangle, drums of noise. The techniques are Tim Follin's:
// chords played as one voice switching notes fifty times a second, so the
// ear hears the whole chord shimmer; trills, bends and late vibrato on the
// lead; an echo that is the music repeating itself a little later; and a
// lift into a new key. Every stage has its own song, built on one of the
// Gregorian psalm tones and set to the scene: peaceful by the river, in
// heaven and in the dream; driving in the wind and on the mountain;
// dangerous over the fire and among the teeth.

    sfxGain = ac.createGain(); sfxGain.gain.value = 2.2; sfxGain.connect(master);

    const room = ac.createGain(); room.gain.value = 0.2; sfxGain.connect(room).connect(reverbSend);

  // ---- The instruments ----
  function pulseWave(duty) {

// ---- The whole Psalter ---------------------------------------------------------------
// Psalms 1 to 3 have their stages made by hand, above. Every other psalm is
// laid out from its own words: its verses are shared out among a few stages,
// and each stage is set in the place its imagery calls for (a shepherd's
// pasture, the stormy deep, the snare of the fowler, the courts of the
// temple, lions, thunder, the willows of Babylon...). A few famous psalms
// are laid out by hand in PLANS below.

// A stretch of ground, now and then broken by a gap.
function groundWithGaps(r, L, kind, gapChance, gapMin, gapMax, segs, ents, gapDecor) {
  let x = -200;
  while (x < L + 400) {
    const w = x < 200 ? 480 : 150 + r() * 220;
    segs.push({ x0: x, x1: x + w, y: GROUND, kind });
    x += w;
    if (x > 300 && x < L - 100 && r() < gapChance) { const g = gapMin + r() * (gapMax - gapMin); if (gapDecor) ents.push(E(gapDecor, x, GROUND + 4, g, 30, { hostile: false, decor: true })); x += g; }
  }
}
const prize = (look, x, y) => E("gift", x, y, 9, 9, { hostile: false, prize: true, look });
// Places along the run, spaced out, where something is set.
function spots(r, L, gap, spread, f) { let x = 340; while (x < L - 200) { f(x); x += gap + r() * spread; } }

const BUILD = {
  sea(r, L, d) {
    // The deep: boats and rocks to leap between, spouts of spray, the waves.
    const segs = [], plats = [], ents = [];

    let x = 260;

      const w = 54 + r() * 70, y = GROUND - Math.round(r() * 2) * 8;
      plats.push({ x0: x, x1: x + w, base: y, y, bob: 3, ph: r() * 6, kind: r() < 0.5 ? "boat" : "raft" });
      if (r() < 0.5) arcOfNeumes(ents, x + 6, y - 32, 3);
      x += w;
    }
    plats.push({ x0: x + 30, x1: x + 600, base: GROUND, y: GROUND, kind: "boat" });
    return { segs, plats, ents };
  },
  pasture(r, L, d) {

let joined = null;     // a saint who has just joined, to announce

// Start a psalm in the way the chosen mode asks.

function drawTransition(dt) {
