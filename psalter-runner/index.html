with evil, and thy tongue framed deceits.", "Sitting thou didst speak against thy brother, and didst lay a scandal against thy mother's son:", "These things hast thou done, and I was silent. Thou thoughtest unjustly that I should be like to thee:\nbut I will reprove thee, and set before thy face.", "Understand these things, you that forget God;\nlest he snatch you away, and there be none to deliver you.", "The sacrifice of praise shall glorify me:\nand there is the way by which I will shew him the salvation of God."], "49"], ["Miserere mei, Deus", ["Have mercy on me, O God, according to thy great mercy. And according to the multitude of thy tender mercies blot out my iniquity.", "Wash me yet more from my iniquity, and cleanse me from my sin.", "For I know my iniquity, and my sin is always before me.", "To thee only have I sinned, and have done evil before thee:\nthat thou mayst be justified in thy words, and mayst overcome when thou art judged.", "For behold I was conceived in iniquities;\nand in sins did my mother conceive me.", "For behold thou hast loved truth:\nthe uncertain and hidden things of thy wisdom thou hast made manifest to me.", "Thou shalt sprinkle me with hyssop, and I shall be cleansed:\nthou shalt wash me, and I shall be made whiter than snow.", "To my hearing thou shalt give joy and gladness:\nand the bones that have been humbled shall rejoice.", "Turn away thy face from my sins, and blot out all my iniquities.", "Create a clean heart in me, O God:\nand renew a right spirit within my bowels.", "Cast me not away from thy face;\nand take not thy holy spirit from me.", "Restore unto me the joy of thy salvation, and strengthen me with a perfect spirit.", "I will teach the unjust thy ways:\nand the wicked shall be converted to thee.", "Deliver me from blood, O God, thou God of my salvation:\nand my tongue shall extol thy justice.", "O Lord, thou wilt open my lips:\nand my mouth shall declare thy praise.", "For if thou hadst desired sacrifice, I would indeed have given it:\nwith burnt offerings thou wilt not be delighted.", "A sacrifice to God is an afflicted spirit:\na contrite and humbled heart, O God, thou wilt not despise.", "Deal favourably, O Lord, in thy good will with Sion;\nthat the walls of Jerusalem may be built up.", "Then shalt thou accept the sacrifice of justice, oblations and whole burnt offerings:\nthen shall they lay calves upon thy altar."], "50"], ["Quid gloriaris?", ["Why dost thou glory in malice, thou that art mighty in iniquity?", "All the day long thy tongue hath devised injustice:\nas a sharp razor, thou hast wrought deceit.", "Thou hast loved malice more than goodness:\nand iniquity rather than to speak righteousness.", "Thou hast loved all the words of ruin, O deceitful tongue.", "Therefore will God destroy thee for ever:\nhe will pluck thee out, and remove thee from thy dwelling place:\nand thy root out of the land of the living.", "The just shall see and fear, and shall laugh at him, and say:", "Behold the man that made not God his helper:\nBut trusted in the abundance of his riches:\nand prevailed in his vanity.", "But I, as a fruitful olive tree in the house of God, have hoped in the mercy of God for ever, yea for ever and ever.", "I will praise thee for ever, because thou hast done it:\nand I will wait on thy name, for it is good in the sight of thy saints."], "51"], ["Dixit insipiens", ["The fool said in his heart:\nThere is no God.", "They are corrupted, and become abominable in iniquities:\nthere is none that doth good.", "God looked down from heaven on the children of men:\nto see if there were any that did understand, or did seek God.", "All have gone aside, they are become unprofitable together, there is none that doth good, no not one.", "Shall not all the workers of iniquity know, who eat up my people as they eat bread?", "They have not called upon God:\nthere have they trembled for fear, where there was no fear. For God hath scattered the bones of them that please men:\nthey have been confounded, because God hath despised them.", "Who will give out of Sion the salvation of Israel? when God shall bring back the captivity of his people, Jacob shall rejoice, and Israel shall be glad."], "52"], ["Deus, in nomine", ["Save me, O God, by thy name, and judge me in thy strength.", "O God, hear my prayer:\ngive ear to the words of my mouth.", "For strangers have risen up against me;\nand the mighty have sought after my soul:\nand they have not set God before their eyes.", "For behold God is my helper:\nand the Lord is the protector of my soul.", "Turn back the evils upon my enemies;\nand cut them off in thy truth.", "I will freely sacrifice to thee, and will give praise, O God, to thy name:\nbecause it is good:", "For thou hast delivered me out of all trouble:\nand my eye hath looked down upon my enemies."], "53"], ["Exaudi, Deus", ["Hear, O God, my prayer, and despise not my supplication:", "Be attentive to me and hear me. I am grieved in my exercise;\nand am troubled,", "At the voice of the enemy, and at the tribulation of the sinner. For they have cast iniquities upon me:\nand in wrath they were troublesome to me.", "My heart is troubled within me:\nand the fear of death is fallen upon me.", "Fear and trembling are come upon me:\nand darkness hath covered me.", "And I said:\nWho will give me wings like a dove, and I will fly and be at rest?", "Lo, I have gone far off flying away;\nand I abode in the wilderness.", "I waited for him that hath saved me from pusillanimity of spirit, and a storm.", "Cast down, O Lord, and divide their tongues;\nfor I have seen iniquity and contradiction in the city.", "Day and night shall iniquity surround it upon its walls:\nand in the midst thereof are labour,", "And injustice. And usury and deceit have not departed from its streets.", "For if my enemy had reviled me, I would verily have borne with it. And if he that hated me had spoken great things against me, I would perhaps have hidden myself from him.", "But thou a man of one mind, my guide, and my familiar,", "Who didst take sweetmeats together with me:\nin the house of God we walked with consent.", "Let death come upon them, and let them go down alive into hell. For there is wickedness in their dwellings:\nin the midst of them.", "But I have cried to God:\nand the Lord will save me.", "Evening and morning, and at noon I will speak and declare:\nand he shall hear my voice.", "He shall redeem my soul in peace from them that draw near to me:\nfor among many they were with me.", "God shall hear, and the Eternal shall humble them. For there is no change with them, and they have not feared God:", "He hath stretched forth his hand to repay. They have defiled his covenant,", "They are divided by the wrath of his countenance, and his heart hath drawn near. His words are smoother than oil, and the same are darts.", "Cast thy care upon the Lord, and he shall sustain thee:\nhe shall not suffer the just to waver for ever.", "But thou, O God, shalt bring them down into the pit of destruction. Bloody and deceitful men shall not live out half their days;\nbut I will trust in thee, O Lord."], "54"], ["Miserere mei, Deus", ["Have mercy on me, O God, for man hath trodden me under foot;\nall the day long he hath afflicted me fighting against me.", "My enemies have trodden on me all the day long;\nfor they are many that make war against me.", "From the height of the day I shall fear:\nbut I will trust in thee.", "In God I will praise my words, in God I have put my trust:\nI will not fear what flesh can do against me.", "All the day long they detested my words:\nall their thoughts were against me unto evil.", "They will dwell and hide themselves:\nthey will watch my heel. As they have waited for my soul,", "For nothing shalt thou save them:\nin thy anger thou shalt break the people in pieces. O God,", "I have declared to thee my life:\nthou hast set my tears in thy sight, As also in thy promise.", "Then shall my enemies be turned back. In what day soever I shall call upon thee, behold I know thou art my God.", "In God will I praise the word, in the Lord will I praise his speech. In God have I hoped, I will not fear what man can do to me.", "In me, O God, are vows to thee, which I will pay, praises to thee:", "Because thou hast delivered my soul from death, my feet from falling:\nthat I may please in the sight of God, in the light of the living."], "55"], ["Miserere mei, Deus", ["Have mercy on me, O God, have mercy on me:\nfor my soul trusteth in thee. And in the shadow of thy wings will I hope, until iniquity pass away.", "I will cry to God the most high;\nto God who hath done good to me.", "He hath sent from heaven and delivered me:\nhe hath made them a reproach that trod upon me. God hath sent his mercy and his truth,", "And he hath delivered my soul from the midst of the young lions. I slept troubled. The sons of men, whose teeth are weapons and arrows, and their tongue a sharp sword.", "Be thou exalted, O God, above the heavens, and thy glory above all the earth.", "They prepared a snare for my feet;\nand they bowed down my soul. They dug a pit before my face, and they are fallen into it.", "My heart is ready, O God, my heart is ready:\nI will sing, and rehearse a psalm.", "Arise, O my glory, arise psaltery and harp:\nI will arise early.", "I will give praise to thee, O Lord, among the people:\nI will sing a psalm to thee among the nations.", "For thy mercy is magnified even to the heavens:\nand thy truth unto the clouds.", "Be thou exalted, O God, above the heavens:\nand thy glory above all the earth."], "56"], ["Si vere utique", ["If in very deed you speak justice:\njudge right things, ye sons of men.", "For in your heart you work iniquity:\nyour hands forge injustice in the earth.", "The wicked are alienated from the womb;\nthey have gone astray from the womb:\nthey have spoken false things.", "Their madness is according to the likeness of a serpent:\nlike the deaf asp that stoppeth her ears:", "Which will not hear the voice of the charmers;\nnor of the wizard that charmeth wisely.", "God shall break in pieces their teeth in their mouth:\nthe Lord shall break the grinders of the lions.", "They shall come to nothing, like water running down;\nhe hath bent his bow till they be weakened.", "Like wax that melteth they shall be taken away:\nfire hath fallen on them, and they shall not see the sun.", "Before your thorns could know the brier;\nhe swalloweth them up, as alive, in his wrath.", "The just shall rejoice when he shall see the revenge:\nhe shall wash his hands in the blood of the sinner.", "And man shall say:\nIf indeed there be fruit to the just:\nthere is indeed a God that judgeth them on the earth."], "57"], ["Eripe me de inimicis", ["Deliver me from my enemies, O my God;\nand defend me from them that rise up against me.", "Deliver me from them that work iniquity, and save me from bloody men.", "For behold they have caught my soul:\nthe mighty have rushed in upon me:", "Neither is it my iniquity, nor my sin, O Lord:\nwithout iniquity have I run, and directed my steps.", "Rise up thou to meet me, and behold:\neven thou, O Lord, the God of hosts, the God of Israel. Attend to visit all the nations:\nhave no mercy on all them that work iniquity.", "They shall return at evening, and shall suffer hunger like dogs:\nand shall go round about the city.", "Behold they shall speak with their mouth, and a sword is in their lips:\nfor who, say they, hath heard us?", "But thou, O Lord, shalt laugh at them:\nthou shalt bring all the nations to nothing.", "I will keep my strength to thee:\nfor thou art my protector:", "My God, his mercy shall prevent me.", "God shall let me see over my enemies:\nslay them not, lest at any time my people forget. Scatter them by thy power;\nand bring them down, O Lord, my protector:", "For the sin of their mouth, and the word of their lips:\nand let them be taken in their pride. And for their cursing and lying they shall be talked of,", "When they are consumed:\nwhen they are consumed by thy wrath, and they shall be no more. And they shall know that God will rule Jacob, and all the ends of the earth.", "They shall return at evening and shall suffer hunger like dogs:\nand shall go round about the city.", "They shall be scattered abroad to eat, and shall murmur if they be not filled.", "But I will sing thy strength:\nand will extol thy mercy in the morning. For thou art become my support, and my refuge, in the day of my trouble.", "Unto thee, O my helper, will I sing, for thou art God my defence:\nmy God my mercy."], "58"], ["Deus, repulisti nos", ["O God, thou hast cast us off, and hast destroyed us;\nthou hast been angry, and hast had mercy on us.", "Thou hast moved the earth, and hast troubled it:\nheal thou the breaches thereof, for it has been moved.", "Thou hast shewn thy people hard things;\nthou hast made us drink wine of sorrow.", "Thou hast given a warning to them that fear thee:\nthat they may flee from before the bow:\nThat thy beloved may be delivered.", "Save me with thy right hand, and hear me.", "God hath spoken in his holy place:\nI will rejoice, and I will divide Sichem;\nand will mete out the vale of tabernacles.", "Galaad is mine, and Manasses is mine:\nand Ephraim is the strength of my head. Juda is my king:", "Moab is the pot of my hope. Into Edom will I stretch out my shoe:\nto me the foreigners are made subject.", "Who will bring me into the strong city? who will lead me into Edom?", "Wilt not thou, O God, who hast cast us off? and wilt not thou, O God, go out with our armies?", "Give us help from trouble:\nfor vain is the salvation of man.", "Through God we shall do mightily:\nand he shall bring to nothing them that afflict us."], "59"], ["Exaudi, Deus", ["Hear, O God, my supplication:\nbe attentive to my prayer.", "To thee have I cried from the ends of the earth:\nwhen my heart was in anguish, thou hast exalted me on a rock. Thou hast conducted me;", "For thou hast been my hope;\na tower of strength against the face of the enemy.", "In thy tabernacle I shall dwell for ever:\nI shall be protected under the covert of thy wings.", "For thou, my God, hast heard my prayer:\nthou hast given an inheritance to them that fear thy name.", "Thou wilt add days to the days of the king:\nhis years even to generation and generation.", "He abideth for ever in the sight of God:\nhis mercy and truth who shall search?", "So will I sing a psalm to thy name for ever and ever:\nthat I may pay my vows from day to day."], "60"], ["Nonne Deo", ["Shall not my soul be subject to God? for from him is my salvation.", "For he is my God and my saviour:\nhe is my protector, I shall be moved no more.", "How long do you rush in upon a man? you all kill, as if you were thrusting down a leaning wall, and a tottering fence.", "But they have thought to cast away my price;\nI ran in thirst:\nthey blessed with their mouth, but cursed with their heart.", "But be thou, O my soul, subject to God:\nfor from him is my patience.", "For he is my God and my saviour:\nhe is my helper, I shall not be moved.", "In God is my salvation and my glory:\nhe is the God of my help, and my hope is in God.", "Trust in him, all ye congregation of people:\npour out your hearts before him. God is our helper for ever.", "But vain are the sons of men, the sons of men are liars in the balances:\nthat by vanity they may together deceive.", "Trust not in iniquity, and cover not robberies:\nif riches abound, set not your heart upon them.", "God hath spoken once, these two things have I heard, that power belongeth to God,", "And mercy to thee, O Lord;\nfor thou wilt render to every man according to his works."], "61"], ["Deus, Deus meus", ["O God, my God, to thee do I watch at break of day. For thee my soul hath thirsted;\nfor thee my flesh, O how many ways!", "In a desert land, and where there is no way, and no water:\nso in the sanctuary have I come before thee, to see thy power and thy glory.", "For thy mercy is better than lives:\nthee my lips shall praise.", "Thus will I bless thee all my life long:\nand in thy name I will lift up my hands.", "Let my soul be filled as with marrow and fatness:\nand my mouth shall praise thee with joyful lips.", "If I have remembered thee upon my bed, I will meditate on thee in the morning:", "Because thou hast been my helper. And I will rejoice under the covert of thy wings:", "My soul hath stuck close to thee:\nthy right hand hath received me.", "But they have sought my soul in vain, they shall go into the lower parts of the earth:", "They shall be delivered into the hands of the sword, they shall be the portions of foxes.", "But the king shall rejoice in God, all they shall be praised that swear by him:\nbecause the mouth is stopped of them that speak wicked things."], "62"], ["Exaudi, Deus", ["Hear O God, my prayer, when I make supplication to thee:\ndeliver my soul from the fear of the enemy.", "Thou hast protected me from the assembly of the malignant;\nfrom the multitude of the workers of iniquity.", "For they have whetted their tongues like a sword;\nthey have bent their bow a bitter thing,", "To shoot in secret the undefiled.", "They will shoot at him on a sudden, and will not fear:\nthey are resolute in wickedness. They have talked of hiding snares;\nthey have said:\nWho shall see them?", "They have searched after iniquities:\nthey have failed in their search. Man shall come to a deep heart:", "And God shall be exalted. The arrows of children are their wounds:", "And their tongues against them are made weak. All that saw them were troubled;", "And every man was afraid. And they declared the works of God, and understood his doings.", "The just shall rejoice in the Lord, and shall hope in him:\nand all the upright in heart shall be praised."], "63"], ["Te decet hymnus", ["A hymn, O God, becometh thee in Sion:\nand a vow shall be paid to thee in Jerusalem.", "O hear my prayer:\nall flesh shall come to thee.", "The words of the wicked have prevailed over us:\nand thou wilt pardon our transgressions.", "Blessed is he whom thou hast chosen and taken to thee:\nhe shall dwell in thy courts. We shall be filled with the good things of thy house;\nholy is thy temple,", "Wonderful in justice. Hear us, O God our saviour, who art the hope of all the ends of the earth, and in the sea afar off.", "Thou who preparest the mountains by thy strength, being girded with power:", "Who troublest the depth of the sea, the noise of its waves. The Gentiles shall be troubled,", "And they that dwell in the uttermost borders shall be afraid at thy signs:\nthou shalt make the outgoings of the morning and of the evening to be joyful.", "Thou hast visited the earth, and hast plentifully watered it;\nthou hast many ways enriched it. The river of God is filled with water, thou hast prepared their food:\nfor so is its preparation.", "Fill up plentifully the streams thereof, multiply its fruits;\nit shall spring up and rejoice in its showers.", "Thou shalt bless the crown of the year of thy goodness:\nand thy fields shall be filled with plenty.", "The beautiful places of the wilderness shall grow fat:\nand the hills shall be girded about with joy,", "The rams of the flock are clothed, and the vales shall abound with corn:\nthey shall shout, yea they shall sing a hymn."], "64"], ["Jubilate Deo", ["Shout with joy to God, all the earth,", "Sing ye a psalm to his name;\ngive glory to his praise.", "Say unto God, How terrible are thy works, O Lord! in the multitude of thy strength thy enemies shall lie to thee.", "Let all the earth adore thee, and sing to thee:\nlet it sing a psalm to thy name.", "Come and see the works of God;\nwho is terrible in his counsels over the sons of men.", "Who turneth the sea into dry land, in the river they shall pass on foot:\nthere shall we rejoice in him.", "Who by his power ruleth for ever:\nhis eyes behold the nations;\nlet not them that provoke him be exalted in themselves.", "O bless our God, ye Gentiles:\nand make the voice of his praise to be heard.", "Who hath set my soul to live:\nand hath not suffered my feet to be moved:", "For thou, O God, hast proved us:\nthou hast tried us by fire, as silver is tried.", "Thou hast brought us into a net, thou hast laid afflictions on our back:", "Thou hast set men over our heads. We have passed through fire and water, and thou hast brought us out into a refreshment.", "I will go into thy house with burnt offerings:\nI will pay thee my vows,", "Which my lips have uttered, And my mouth hath spoken, when I was in trouble.", "I will offer up to thee holocausts full of marrow, with burnt offerings of rams:\nI will offer to thee bullocks with goats.", "Come and hear, all ye that fear God, and I will tell you what great things he hath done for my soul.", "I cried to him with my mouth:\nand I extolled him with my tongue.", "If I have looked at iniquity in my heart, the Lord will not hear me.", "Therefore hath God heard me, and hath attended to the voice of my supplication.", "Blessed be God, who hath not turned away my prayer, nor his mercy from me."], "65"], ["Deus misereatur", ["May God have mercy on us, and bless us:\nmay he cause the light of his countenance to shine upon us, and may he have mercy on us.", "That we may know thy way upon earth:\nthy salvation in all nations.", "Let people confess to thee, O God:\nlet all people give praise to thee.", "Let the nations be glad and rejoice:\nfor thou judgest the people with justice, and directest the nations upon earth.", "Let the people, O God, confess to thee:\nlet all the people give praise to thee:", "The earth hath yielded her fruit. May God, our God bless us,", "May God bless us:\nand all the ends of the earth fear him."], "66"], ["Exsurgat Deus", ["Let God arise, and let his enemies be scattered:\nand let them that hate him flee from before his face.", "As smoke vanisheth, so let them vanish away:\nas wax melteth before the fire, so let the wicked perish at the presence of God.", "And let the just feast, and rejoice before God:\nand be delighted with gladness.", "Sing ye to God, sing a psalm to his name, make a way for him who ascendeth upon the west:\nthe Lord is his name. Rejoice ye before him:\nbut the wicked shall be troubled at his presence,", "Who is the father of orphans, and the judge of widows. God in his holy place:", "God who maketh men of one manner to dwell in a house:\nWho bringeth out them that were bound in strength;\nin like manner them that provoke, that dwell in sepulchres.", "O God, when thou didst go forth in the sight of thy people, when thou didst pass through the desert:", "The earth was moved, and the heavens dropped at the presence of the God of Sina, at the presence of the God of Israel.", "Thou shalt set aside for thy inheritance a free rain, O God:\nand it was weakened, but thou hast made it perfect.", "In it shall thy animals dwell;\nin thy sweetness, O God, thou hast provided for the poor.", "The Lord shall give the word to them that preach good tidings with great power.", "The king of powers is of the beloved, of the beloved;\nand the beauty of the house shall divide spoils.", "If you sleep among the midst of lots, you shall be as the wings of a dove covered with silver, and the hinder parts of her back with the paleness of gold.", "When he that is in heaven appointeth kings over her, they shall be whited with snow in Selmon.", "The mountain of God is a fat mountain. A curdled mountain, a fat mountain.", "Why suspect, ye curdled mountains? A mountain in which God is well pleased to dwell:\nfor there the Lord shall dwell unto the end.", "The chariot of God is attended by ten thousands;\nthousands of them that rejoice:\nthe Lord is among them in Sina, in the holy place.", "Thou hast ascended on high, thou hast led captivity captive;\nthou hast received gifts in men. Yea for those also that do not believe, the dwelling of the Lord God.", "Blessed be the Lord day by day:\nthe God of our salvation will make our journey prosperous to us.", "Our God is the God of salvation:\nand of the Lord, of the Lord are the issues from death.", "But God shall break the heads of his enemies:\nthe hairy crown of them that walk on in their sins.", "The Lord said:\nI will turn them from Basan, I will turn them into the depth of the sea:", "That thy foot may be dipped in the blood of thy enemies;\nthe tongue of thy dogs be red with the same.", "They have seen thy goings, O God, the goings of my God:\nof my king who is in his sanctuary.", "Princes went before joined with singers, in the midst of young damsels playing on timbrels.", "In the churches bless ye God the Lord, from the fountains of Israel.", "There is Benjamin a youth, in ecstasy of mind. The princes of Juda are their leaders:\nthe princes of Zabulon, the princes of Nephthali.", "Command thy strength , O God:\nconfirm, O God, what thou hast wrought in us.", "From thy temple in Jerusalem, kings shall offer presents to thee.", "Rebuke the wild beasts of the reeds, the congregation of bulls with the kine of the people;\nwho seek to exclude them who are tried with silver. Scatter thou the nations that delight in wars:", "Ambassadors shall come out of Egypt:\nEthiopia shall soon stretch out her hands to God.", "Sing to God, ye kingdoms of the earth:\nsing ye to the Lord:\nSing ye to God,", "Who mounteth above the heaven of heavens, to the east. Behold he will give to his voice the voice of power:", "Give ye glory to God for Israel, his magnificence, and his power is in the clouds.", "God is wonderful in his saints:\nthe God of Israel is he who will give power and strength to his people. Blessed be God."], "67"], ["Salvum me fac", ["Save me, O God:\nfor the waters are come in even unto my soul.", "I stick fast in the mire of the deep and there is no sure standing. I am come into the depth of the sea, and a tempest hath overwhelmed me.", "I have laboured with crying;\nmy jaws are become hoarse, my eyes have failed, whilst I hope in my God.", "They are multiplied above the hairs of my head, who hate me without cause. My enemies are grown strong who have wrongfully persecuted me:\nthen did I pay that which I took not away.", "O God, thou knowest my foolishness;\nand my offences are not hidden from thee:", "Let not them be ashamed for me, who look for thee, O Lord, the Lord of hosts. Let them not be confounded on my account, who seek thee, O God of Israel.", "Because for thy sake I have borne reproach;\nshame hath covered my face.", "I am become a stranger to my brethren, and an alien to the sons of my mother.", "For the zeal of thy house hath eaten me up:\nand the reproaches of them that reproached thee are fallen upon me.", "And I covered my soul in fasting:\nand it was made a reproach to me.", "And I made haircloth my garment:\nand I became a byword to them.", "They that sat in the gate spoke against me:\nand they that drank wine made me their song.", "But as for me, my prayer is to thee, O Lord;\nfor the time of thy good pleasure, O God. In the multitude of thy mercy hear me, in the truth of thy salvation.", "Draw me out of the mire, that I may not stick fast:\ndeliver me from them that hate me, and out of the deep waters.", "Let not the tempest of water drown me, nor the deep swallow me up:\nand let not the pit shut her mouth upon me.", "Hear me, O Lord, for thy mercy is kind;\nlook upon me according to the multitude of thy tender mercies.", "And turn not away thy face from thy servant:\nfor I am in trouble, hear me speedily.", "Attend to my soul, and deliver it:\nsave me because of my enemies.", "Thou knowest my reproach, and my confusion, and my shame.", "In thy sight are all they that afflict me;\nmy heart hath expected reproach and misery. And I looked for one that would grieve together with me, but there was none:\nand for one that would comfort me, and I found none.", "And they gave me gall for my food, and in my thirst they gave me vinegar to drink.", "Let their table become as a snare before them, and a recompense, and a stumblingblock.", "Let their eyes be darkened that they see not;\nand their back bend thou down always.", "Pour out thy indignation upon them:\nand let thy wrathful anger take hold of them.", "Let their habitation be made desolate:\nand let there be none to dwell in their tabernacles.", "Because they have persecuted him whom thou hast smitten;\nand they have added to the grief of my wounds.", "Add thou iniquity upon their iniquity:\nand let them not come into thy justice.", "Let them be blotted out of the book of the living;\nand with the just let them not be written.", "But I am poor and sorrowful:\nthy salvation, O God, hath set me up.", "I will praise the name of God with a canticle:\nand I will magnify him with praise.", "And it shall please God better than a young calf, that bringeth forth horns and hoofs.", "Let the poor see and rejoice:\nseek ye God, and your soul shall live.", "For the Lord hath heard the poor:\nand hath not despised his prisoners.", "Let the heavens and the earth praise him;\nthe sea, and every thing that creepeth therein.", "For God will save Sion, and the cities of Juda shall be built up. And they shall dwell there, and acquire it by inheritance.", "And the seed of his servants shall possess it;\nand they that love his name shall dwell therein."], "68"], ["Deus, in adjutorium", ["O God, come to my assistance;\nO Lord, make haste to help me.", "Let them be confounded and ashamed that seek my soul:", "Let them be turned backward, and blush for shame that desire evils to me:\nLet them be presently turned away blushing for shame that say to me:\nTis well, tis well .", "Let all that seek thee rejoice and be glad in thee;\nand let such as love thy salvation say always:\nThe Lord be magnified.", "But I am needy and poor;\nO God, help me. Thou art my helper and my deliverer:\nO lord, make no delay."], "69"], ["In te, Domine, speravi", ["In thee, O Lord, I have hoped, let me never be put to confusion:", "Deliver me in thy justice, and rescue me. Incline thy ear unto me, and save me.", "Be thou unto me a God, a protector, and a place of strength:\nthat thou mayst make me safe. For thou art my firmament and my refuge.", "Deliver me, O my God, out of the hand of the sinner, and out of the hand of the transgressor of the law and of the unjust.", "For thou art my patience, O Lord:\nmy hope, O Lord, from my youth.", "By thee have I been confirmed from the womb:\nfrom my mother's womb thou art my protector. Of thee shall I continually sing:", "I am become unto many as a wonder, but thou art a strong helper.", "Let my mouth be filled with praise, that I may sing thy glory;\nthy greatness all the day long.", "Cast me not off in the time of old age:\nwhen my strength shall fail, do not thou forsake me.", "For my enemies have spoken against me;\nand they that watched my soul have consulted together,", "Saying:\nGod hath forsaken him:\npursue and take him, for there is none to deliver him.", "O God, be not thou far from me:\nO my God, make haste to my help.", "Let them be confounded and come to nothing that detract my soul;\nlet them be covered with confusion and shame that seek my hurt.", "But I will always hope;\nand will add to all thy praise.", "My mouth shall shew forth thy justice;\nthy salvation all the day long. Because I have not known learning,", "I will enter into the powers of the Lord:\nO Lord, I will be mindful of thy justice alone.", "Thou hast taught me, O God, from my youth:\nand till now I will declare thy wonderful works.", "And unto old age and grey hairs:\nO God, forsake me not, Until I shew forth thy arm to all the generation that is to come:\nThy power,", "And thy justice, O God, even to the highest great things thou hast done:\nO God, who is like to thee?", "How great troubles hast thou shewn me, many and grievous:\nand turning thou hast brought me to life, and hast brought me back again from the depths of the earth:", "Thou hast multiplied thy magnificence;\nand turning to me thou hast comforted me.", "For I will also confess to thee thy truth with the instruments of psaltery:\nO God, I will sing to thee with the harp, thou holy one of Israel.", "My lips shall greatly rejoice, when I shall sing to thee;\nand my soul which thou hast redeemed.", "Yea and my tongue shall meditate on thy justice all the day;\nwhen they shall be confounded and put to shame that seek evils to me."], "70"], ["Deus, judicium", ["Give to the king thy judgment, O God, and to the king's son thy justice:\nTo judge thy people with justice, and thy poor with judgment.", "Let the mountains receive peace for the people:\nand the hills justice.", "He shall judge the poor of the people, and he shall save the children of the poor:\nand he shall humble the oppressor.", "And he shall continue with the sun and before the moon, throughout all generations.", "He shall come down like rain upon the fleece;\nand as showers falling gently upon the earth.", "In his days shall justice spring up, and abundance of peace, till the moon be taken away.", "And he shall rule from sea to sea, and from the river unto the ends of the earth.", "Before him the Ethiopians shall fall down:\nand his enemies shall lick the ground.", "The kings of Tharsis and the islands shall offer presents:\nthe kings of the Arabians and of Saba shall bring gifts:", "And all kings of the earth shall adore him:\nall nations shall serve him.", "For he shall deliver the poor from the mighty:\nand the needy that had no helper.", "He shall spare the poor and needy:\nand he shall save the souls of the poor.", "He shall redeem their souls from usuries and iniquity:\nand their names shall be honourable in his sight.", "And he shall live, and to him shall be given of the gold of Arabia, for him they shall always adore:\nthey shall bless him all the day.", "And there shall be a firmament on the earth on the tops of mountains, above Libanus shall the fruit thereof be exalted:\nand they of the city shall flourish like the grass of the earth.", "Let his name be blessed for evermore:\nhis name continueth before the sun. And in him shall all the tribes of the earth be blessed:\nall nations shall magnify him.", "Blessed be the Lord, the God of Israel, who alone doth wonderful things.", "And blessed be the name of his majesty for ever:\nand the whole earth shall be filled with his majesty. So be it. So be it.", "The praises of David, the son of Jesse, are ended."], "71"], ["Quam bonus Israel!", ["How good is God to Israel, to them that are of a right heart!", "But my feet were almost moved;\nmy steps had well nigh slipped.", "Because I had a zeal on occasion of the wicked, seeing the prosperity of sinners.", "For there is no regard to their death, nor is there strength in their stripes.", "They are not in the labour of men:\nneither shall they be scourged like other men.", "Therefore pride hath held them fast:\nthey are covered with their iniquity and their wickedness.", "Their iniquity hath come forth, as it were from fatness:\nthey have passed into the affection of the heart.", "They have thought and spoken wickedness:\nthey have spoken iniquity on high.", "They have set their mouth against heaven:\nand their tongue hath passed through the earth.", "Therefore will my people return here and full days shall be found in them.", "And they said:\nHow doth God know? and is there knowledge in the most High?", "Behold these are sinners;\nand yet, abounding in the world they have obtained riches.", "And I said:\nThen have I in vain justified my heart, and washed my hands among the innocent.", "And I have been scourged all the day;\nand my chastisement hath been in the mornings.", "If I said:\nI will speak thus;\nbehold I should condemn the generation of thy children.", "I studied that I might know this thing, it is a labour in my sight:", "Until I go into the sanctuary of God, and understand concerning their last ends.", "But indeed for deceits thou hast put it to them:\nwhen they were lifted up thou hast cast them down.", "How are they brought to desolation? they have suddenly ceased to be:\nthey have perished by reason of their iniquity.", "As the dream of them that awake, O Lord;\nso in thy city thou shalt bring their image to nothing.", "For my heart hath been inflamed, and my reins have been changed:", "And I am brought to nothing, and I knew not.", "I am become as a beast before thee:\nand I am always with thee.", "Thou hast held me by my right hand;\nand by thy will thou hast conducted me, and with thy glory thou hast received me.", "For what have I in heaven? and besides thee what do I desire upon earth?", "For thee my flesh and my heart hath fainted away:\nthou art the God of my heart, and the God that is my portion for ever.", "For behold they that go far from thee shall perish:\nthou hast destroyed all them that are disloyal to thee.", "But it is good for me to adhere to my God, to put my hope in the Lord God:\nThat I may declare all thy praises, in the gates of the daughter of Sion."], "72"], ["Ut quid, Deus?", ["O God, why hast thou cast us off unto the end:\nwhy is thy wrath enkindled against the sheep of thy pasture?", "Remember thy congregation, which thou hast possessed from the beginning. The sceptre of thy inheritance which thou hast redeemed:\nmount Sion in which thou hast dwelt.", "Lift up thy hands against their pride unto the end;\nsee what things the enemy hath done wickedly in the sanctuary.", "And they that hate thee have made their boasts, in the midst of thy solemnity. They have set up their ensigns for signs,", "And they knew not both in the going out and on the highest top. As with axes in a wood of trees,", "They have cut down at once the gates thereof, with axe and hatchet they have brought it down.", "They have set fire to thy sanctuary:\nthey have defiled the dwelling place of thy name on the earth.", "They said in their heart, the whole kindred of them together:\nLet us abolish all the festival days of God from the land.", "Our signs we have not seen, there is now no prophet:\nand he will know us no more.", "How long, O God, shall the enemy reproach:\nis the adversary to provoke thy name for ever?", "Why dost thou turn away thy hand:\nand thy right hand out of the midst of thy bosom for ever?", "But God is our king before ages:\nhe hath wrought salvation in the midst of the earth.", "Thou by thy strength didst make the sea firm:\nthou didst crush the heads of the dragons in the waters.", "Thou hast broken the heads of the dragon:\nthou hast given him to be meat for the people of the Ethiopians.", "Thou hast broken up the fountains and the torrents:\nthou hast dried up the Ethan rivers.", "Thine is the day, and thine is the night:\nthou hast made the morning light and the sun.", "Thou hast made all the borders of the earth:\nthe summer and the spring were formed by thee.", "Remember this, the enemy hath reproached the Lord:\nand a foolish people hath provoked thy name.", "Deliver not up to beasts the souls that confess to thee:\nand forget not to the end the souls of thy poor.", "Have regard to thy covenant:\nfor they that are the obscure of the earth have been filled with dwellings of iniquity.", "Let not the humble be turned away with confusion:\nthe poor and needy shall praise thy name.", "Arise, O God, judge thy own cause:\nremember thy reproaches with which the foolish man hath reproached thee all the day.", "Forget not the voices of thy enemies:\nthe pride of them that hate thee ascendeth continually."], "73"], ["Confitebimur tibi", ["We will praise thee, O God:\nwe will praise, and we will call upon thy name. We will relate thy wondrous works:", "When I shall take a time, I will judge justices.", "The earth is melted, and all that dwell therein:\nI have established the pillars thereof.", "I said to the wicked:\nDo not act wickedly:\nand to the sinners:\nLift not up the horn.", "Lift not up your horn on high:\nspeak not iniquity against God.", "For neither from the east, nor from the west, nor from the desert hills:", "For God is the judge. One he putteth down, and another he lifteth up:", "For in the hand of the Lord there is a cup of strong wine full of mixture. And he hath poured it out from this to that:\nbut the dregs thereof are not emptied:\nall the sinners of the earth shall drink.", "But I will declare for ever:\nI will sing to the God of Jacob.", "And I will break all the horns of sinners:\nbut the horns of the just shall be exalted."], "74"], ["Notus in Judaea", ["In Judea God is known:\nhis name is great in Israel.", "And his place is in peace:\nand his abode in Sion:", "There hath he broken the powers of bows, the shield, the sword, and the battle.", "Thou enlightenest wonderfully from the everlasting hills.", "All the foolish of heart were troubled. They have slept their sleep;\nand all the men of riches have found nothing in their hands.", "At thy rebuke, O God of Jacob, they have all slumbered that mounted on horseback.", "Thou art terrible, and who shall resist thee? from that time thy wrath.", "Thou hast caused judgment to be heard from heaven:\nthe earth trembled and was still,", "When God arose in judgment, to save all the meek of the earth.", "For the thought of man shall give praise to thee:\nand the remainders of the thought shall keep holiday to thee.", "Vow ye, and pay to the Lord your God:\nall you that are round about him bring presents. To him that is terrible,", "Even to him who taketh away the spirit of princes:\nto the terrible with the kings of the earth."], "75"], ["Voce mea ad Dominum", ["I cried to the Lord with my voice;\nto God with my voice, and he gave ear to me.", "In the day of my trouble I sought God, with my hands lifted up to him in the night, and I was not deceived. My soul refused to be comforted:", "I remembered God, and was delighted, and was exercised, and my spirit swooned away.", "My eyes prevented the watches:\nI was troubled, and I spoke not.", "I thought upon the days of old:\nand I had in my mind the eternal years.", "And I meditated in the night with my own heart:\nand I was exercised and I swept my spirit.", "Will God then cast off for ever? or will he never be more favourable again?", "Or will he cut off his mercy for ever, from generation to generation?", "Or will God forget to shew mercy? or will he in his anger shut up his mercies?", "And I said, Now have I begun:\nthis is the change of the right hand of the most High.", "I remembered the works of the Lord:\nfor I will be mindful of thy wonders from the beginning.", "And I will meditate on all thy works:\nand will be employed in thy inventions.", "Thy way, O God, is in the holy place:\nwho is the great God like our God?", "Thou art the God that dost wonders. Thou hast made thy power known among the nations:", "With thy arm thou hast redeemed thy people the children of Jacob and of Joseph.", "The waters saw thee, O God, the waters saw thee:\nand they were afraid, and the depths were troubled.", "Great was the noise of the waters:\nthe clouds sent out a sound. For thy arrows pass:", "The voice of thy thunder in a wheel. Thy lightnings enlightened the world:\nthe earth shook and trembled.", "Thy way is in the sea, and thy paths in many waters:\nand thy footsteps shall not be known.", "Thou hast conducted thy people like sheep, by the hand of Moses and Aaron."], "76"], ["Attendite, popule", ["Attend, O my people, to my law:\nincline your ears to the words of my mouth.", "I will open my mouth in parables:\nI will utter propositions from the beginning.", "How great things have we heard and known, and our fathers have told us.", "They have not been hidden from their children, in another generation. Declaring the praises of the Lord, and his powers, and his wonders which he hath done.", "And he set up a testimony in Jacob:\nand made a law in Israel. How great things he commanded our fathers, that they should make the same known to their children:", "That another generation might know them. The children that should be born and should rise up, and declare them to their children.", "That they may put their hope in God and may not forget the works of God:\nand may seek his commandments.", "That they may not become like their fathers, a perverse and exasperating generation. A generation that set not their heart aright:\nand whose spirit was not faithful to God.", "The sons of Ephraim who bend and shoot with the bow:\nthey have turned back in the day of battle.", "They kept not the covenant of God:\nand in his law they would not walk.", "And they forgot his benefits, and his wonders that he had shewn them.", "Wonderful things did he do in the sight of their fathers, in the land of Egypt, in the field of Tanis.", "He divided the sea and brought them through:\nand he made the waters to stand as in a vessel.", "And he conducted them with a cloud by day:\nand all the night with a light of fire.", "He struck the rock in the wilderness:\nand gave them to drink, as out of the great deep.", "He brought forth water out of the rock:\nand made streams run down as rivers.", "And they added yet more sin against him:\nthey provoked the most High to wrath in the place without water.", "And they tempted God in their hearts, by asking meat for their desires.", "And they spoke ill of God:\nthey said:\nCan God furnish a table in the wilderness?", "Because he struck the rock, and the waters gushed out, and the streams overflowed. Can he also give bread, or provide a table for his people?", "Therefore the Lord heard, and was angry:\nand a fire was kindled against Jacob, and wrath came up against Israel.", "Because they believed not in God:\nand trusted not in his salvation.", "And he had commanded the clouds from above, and had opened the doors of heaven.", "And had rained down manna upon them to eat, and had given them the bread of heaven.", "Man ate the bread of angels:\nhe sent them provisions in abundance.", "He removed the south wind from heaven:\nand by his power brought in the southwest wind.", "And he rained upon them flesh as dust:\nand feathered fowls like as the sand of the sea.", "And they fell in the midst of their camp, round about their pavilions.", "So they did eat, and were filled exceedingly, and he gave them their desire:", "They were not defrauded of that which they craved. As yet their meat was in their mouth:", "And the wrath of God came upon them. And he slew the fat ones amongst them, and brought down the chosen men of Israel.", "In all these things they sinned still:\nand they believed not for his wondrous works.", "And their days were consumed in vanity, and their years in haste.", "When he slew them, then they sought him:\nand they returned, and came to him early in the morning.", "And they remembered that God was their helper:\nand the most high God their redeemer.", "And they loved him with their mouth:\nand with their tongue they lied unto him:", "But their heart was not right with him:\nnor were they counted faithful in his covenant.", "But he is merciful, and will forgive their sins:\nand will not destroy them. And many a time did he turn away his anger:\nand did not kindle all his wrath.", "And he remembered that they are flesh:\na wind that goeth and returneth not.", "How often did they provoke him in the desert:\nand move him to wrath in the place without water?", "And they turned back and tempted God:\nand grieved the holy one of Israel.", "They remembered not his hand, in the day that he redeemed them from the hand of him that afflicted them:", "How he wrought his signs in Egypt, and his wonders in the field of Tanis.", "And he turned their rivers into blood, and their showers that they might not drink.", "He sent amongst them divers sores of flies, which devoured them:\nand frogs which destroyed them.", "And he gave up their fruits to the blast, and their labours to the locust.", "And he destroyed their vineyards with hail, and their mulberry trees with hoarfrost.", "And he gave up their cattle to the hail, and their stock to the fire.", "And he sent upon them the wrath of his indignation:\nindignation and wrath and trouble, which he sent by evil angels.", "He made a way for a path to his anger:\nhe spared not their souls from death, and their cattle he shut up in death.", "And he killed all the firstborn in the land of Egypt:\nthe firstfruits of all their labour in the tabernacles of Cham.", "And he took away his own people as sheep:\nand guided them in the wilderness like a flock.", "And he brought them out in hope and they feared not:\nand the sea overwhelmed their enemies.", "And he brought them into the mountain of his sanctuary:\nthe mountain which his right hand had purchased. And he cast out the Gentiles before them:\nand by lot divided to them their land by a line of distribution.", "And he made the tribes of Israel to dwell in their tabernacles.", "Yet they tempted, and provoked the most high God:\nand they kept not his testimonies.", "And they turned away, and kept not the covenant:\neven like their fathers they were turned aside as a crooked bow.", "They provoked him to anger on their hills:\nand moved him to jealousy with their graven things.", "God heard, and despised them, and he reduced Israel exceedingly as it were to nothing.", "And he put away the tabernacle of Silo, his tabernacle where he dwelt among men.", "And he delivered their strength into captivity:\nand their beauty into the hands of the enemy.", "And he shut up his people under the sword:\nand he despised his inheritance.", "Fire consumed their young men:\nand their maidens were not lamented.", "Their priests fell by the sword:\nand their widows did not mourn.", "And the Lord was awaked as one out of sleep, and like a mighty man that hath been surfeited with wine.", "And he smote his enemies on the hinder parts:\nhe put them to an everlasting reproach.", "And he rejected the tabernacle of Joseph:\nand chose not the tribe of Ephraim:", "But he chose the tribe of Juda, mount Sion which he loved.", "And he built his sanctuary as of unicorns, in the land which he founded for ever.", "And he chose his servant David, and took him from the flocks of sheep:\nhe brought him from following the ewes great with young,", "To feed Jacob his servant and Israel his inheritance.", "And he fed them in the innocence of his heart:\nand conducted them by the skillfulness of his hands."], "77"], ["Deus, venerunt", ["O God, the heathens are come into thy inheritance, they have defiled thy holy temple:\nthey have made Jerusalem as a place to keep fruit.", "They have given the dead bodies of thy servants to be meat for the fowls of the air:\nthe flesh of thy saints for the beasts of the earth.", "They have poured out their blood as water, round about Jerusalem and there was none to bury them.", "We are become a reproach to our neighbours:\na scorn and derision to them that are round about us.", "How long, O Lord, wilt thou be angry for ever:\nshall thy zeal be kindled like a fire?", "Pour out thy wrath upon the nations that have not known thee:\nand upon the kingdoms that have not called upon thy name.", "Because they have devoured Jacob;\nand have laid waste his place.", "Remember not our former iniquities:\nlet thy mercies speedily prevent us, for we are become exceeding poor.", "Help us, O God, our saviour:\nand for the glory of thy name, O Lord, deliver us:\nand forgive us our sins for thy name's sake:", "Lest they should say among the Gentiles:\nWhere is their God? And let him be made known among the nations before our eyes, By the revenging the blood of thy servants, which hath been shed:", "Let the sighing of the prisoners come in before thee. According to the greatness of thy arm, take possession of the children of them that have been put to death.", "And render to our neighbours sevenfold in their bosom:\nthe reproach wherewith they have reproached thee, O Lord.", "But we thy people, and the sheep of thy pasture, will give thanks to thee for ever. We will shew forth thy praise, unto generation and generation."], "78"], ["Qui regis Israel", ["Give ear, O thou that rulest Israel:\nthou that leadest Joseph like a sheep. Thou that sittest upon the cherubims, shine forth", "Before Ephraim, Benjamin, and Manasses. Stir up thy might, and come to save us.", "Convert us, O God:\nand shew us thy face, and we shall be saved.", "O Lord God of hosts, how long wilt thou be angry against the prayer of thy servant?", "How long wilt thou feed us with the bread of tears:\nand give us for our drink tears in measure?", "Thou hast made us to be a contradiction to our neighbours:\nand our enemies have scoffed at us.", "O God of hosts, convert us:\nand shew thy face, and we shall be saved.", "Thou hast brought a vineyard out of Egypt:\nthou hast cast out the Gentiles and planted it.", "Thou wast the guide of its journey in its sight:\nthou plantedst the roots thereof, and it filled the land.", "The shadow of it covered the hills:\nand the branches thereof the cedars of God.", "It stretched forth its branches unto the sea, and its boughs unto the river.", "Why hast thou broken down the hedge thereof, so that all they who pass by the way do pluck it?", "The boar out of the wood hath laid it waste:\nand a singular wild beast hath devoured it.", "Turn again, O God of hosts, look down from heaven, and see, and visit this vineyard:", "And perfect the same which thy right hand hath planted:\nand upon the son of man whom thou hast confirmed for thyself.", "Things set on fire and dug down shall perish at the rebuke of thy countenance.", "Let thy hand be upon the man of thy right hand:\nand upon the son of man whom thou hast confirmed for thyself.", "And we depart not from thee, thou shalt quicken us:\nand we will call upon thy name.", "O Lord God of hosts, convert us and shew thy face, and we shall be saved."], "79"], ["Exsultate Deo", ["Rejoice to God our helper:\nsing aloud to the God of Jacob.", "Take a psalm, and bring hither the timbrel:\nthe pleasant psaltery with the harp.", "Blow up the trumpet on the new moon, on the noted day of your solemnity.", "For it is a commandment in Israel, and a judgment to the God of Jacob.", "He ordained it for a testimony in Joseph, when he came out of the land of Egypt:\nhe heard a tongue which he knew not.", "He removed his back from the burdens:\nhis hands had served in baskets.", "Thou calledst upon me in affliction, and I delivered thee:\nI heard thee in the secret place of tempest:\nI proved thee at the waters of contradiction.", "Hear, O my people, and I will testify to thee:\nO Israel, if thou wilt hearken to me,", "There shall be no new god in thee:\nneither shalt thou adore a strange god.", "For I am the Lord thy God, who brought thee out of the land of Egypt:\nopen thy mouth wide, and I will fill it.", "But my people heard not my voice:\nand Israel hearkened not to me.", "So I let them go according to the desires of their heart:\nthey shall walk in their own inventions.", "If my people had heard me:\nif Israel had walked in my ways:", "I should soon have humbled their enemies, and laid my hand on them that troubled them.", "The enemies of the Lord have lied to him:\nand their time shall be for ever.", "And he fed them with the fat of wheat, and filled them with honey out of the rock."], "80"], ["Deus stetit", ["God hath stood in the congregation of gods:\nand being in the midst of them he judgeth gods.", "How long will you judge unjustly:\nand accept the persons of the wicked?", "Judge for the needy and fatherless:\ndo justice to the humble and the poor.", "Rescue the poor;\nand deliver the needy out of the hand of the sinner.", "They have not known nor understood:\nthey walk on in darkness:\nall the foundations of the earth shall be moved.", "I have said:\nYou are gods and all of you the sons of the most High.", "But you like men shall die:\nand shall fall like one of the princes.", "Arise, O God, judge thou the earth:\nfor thou shalt inherit among all the nations."], "81"], ["Deus, quis similis?", ["O God, who shall be like to thee? hold not thy peace, neither be thou still, O God.", "For lo, thy enemies have made a noise:\nand they that hate thee have lifted up the head.", "They have taken a malicious counsel against thy people, and have consulted against thy saints.", "They have said:\nCome and let us destroy them, so that they be not a nation:\nand let the name of Israel be remembered no more.", "For they have contrived with one consent:\nthey have made a covenant together against thee,", "The tabernacles of the Edomites, and the Ismahelites:\nMoab, and the Agarens,", "Gebal, and Ammon and Amalec:\nthe Philistines, with the inhabitants of Tyre.", "Yea, and the Assyrian also is joined with them:\nthey are come to the aid of the sons of Lot.", "Do to them as thou didst to Madian and to Sisara:\nas to Jabin at the brook of Cisson.", "Who perished at Endor:\nand became as dung for the earth.", "Make their princes like Oreb, and Zeb, and Zebee, and Salmana. All their princes,", "Who have said:\nLet us possess the sanctuary of God for an inheritance.", "O my God, make them like a wheel;\nand as stubble before the wind.", "As fire which burneth the wood:\nand as a flame burning mountains:", "So shalt thou pursue them with thy tempest:\nand shalt trouble them in thy wrath.", "Fill their faces with shame;\nand they shall seek thy name, O Lord.", "Let them be ashamed and troubled for ever and ever:\nand let them be confounded and perish.", "And let them know that the Lord is thy name:\nthou alone art the most High over all the earth."], "82"], ["Quam dilecta!", ["How lovely are thy tabernacles, O Lord of hosts!", "My soul longeth and fainteth for the courts of the Lord. My heart and my flesh have rejoiced in the living God.", "For the sparrow hath found herself a house, and the turtle a nest for herself where she may lay her young ones:\nThy altars, O Lord of hosts, my king and my God.", "Blessed are they that dwell in thy house, O Lord:\nthey shall praise thee for ever and ever.", "Blessed is the man whose help is from thee:\nin his heart he hath disposed to ascend by steps,", "In the vale of tears, in the place which he hath set.", "For the lawgiver shall give a blessing, they shall go from virtue to virtue:\nthe God of gods shall be seen in Sion.", "O Lord God of hosts, hear my prayer:\ngive ear, O God of Jacob.", "Behold, O God our protector:\nand look on the face of thy Christ.", "For better is one day in thy courts above thousands. I have chosen to be an abject in the house of my God, rather than to dwell in the tabernacles of sinners.", "For God loveth mercy and truth:\nthe Lord will give grace and glory.", "He will not deprive of good things them that walk in innocence:\nO Lord of hosts, blessed is the man that trusteth in thee."], "83"], ["Benedixisti, Domine", ["Lord, thou hast blessed thy land:\nthou hast turned away the captivity of Jacob.", "Thou hast forgiven the iniquity of thy people:\nthou hast covered all their sins.", "Thou hast mitigated all thy anger:\nthou hast turned away from the wrath of thy indignation.", "Convert us, O God our saviour:\nand turn off thy anger from us.", "Wilt thou be angry with us for ever:\nor wilt thou extend thy wrath from generation to generation?", "Thou wilt turn, O God, and bring us to life:\nand thy people shall rejoice in thee.", "Shew us, O Lord, thy mercy;\nand grant us thy salvation.", "I will hear what the Lord God will speak in me:\nfor he will speak peace unto his people:\nAnd unto his saints:\nand unto them that are converted to the heart.", "Surely his salvation is near to them that fear him:\nthat glory may dwell in our land.", "Mercy and truth have met each other:\njustice and peace have kissed.", "Truth is sprung out of the earth:\nand justice hath looked down from heaven.", "For the Lord will give goodness:\nand our earth shall yield her fruit.", "Justice shall walk before him:\nand shall set his steps in the way."], "84"], ["Inclina, Domine", ["Incline thy ear, O Lord, and hear me:\nfor I am needy and poor.", "Preserve my soul, for I am holy:\nsave thy servant, O my God, that trusteth in thee.", "Have mercy on me, O Lord, for I have cried to thee all the day.", "Give joy to the soul of thy servant, for to thee, O Lord, I have lifted up my soul.", "For thou, O Lord, art sweet and mild:\nand plenteous in mercy to all that call upon thee.", "Give ear, O Lord, to my prayer:\nand attend to the voice of my petition.", "I have called upon thee in the day of my trouble:\nbecause thou hast heard me.", "There is none among the gods like unto thee, O Lord:\nand there is none according to thy works.", "All the nations thou hast made shall come and adore before thee, O Lord:\nand they shall glorify thy name.", "For thou art great and dost wonderful things:\nthou art God alone.", "Conduct me, O Lord, in thy way, and I will walk in thy truth:\nlet my heart rejoice that it may fear thy name.", "I will praise thee, O Lord my God, with my whole heart, and I will glorify thy name for ever:", "For thy mercy is great towards me:\nand thou hast delivered my soul out of the lower hell.", "O God, the wicked are risen up against me, and the assembly of the mighty have sought my soul:\nand they have not set thee before their eyes.", "And thou, O Lord, art a God of compassion, and merciful, patient, and of much mercy, and true.", "O look upon me, and have mercy on me:\ngive thy command to thy servant, and save the son of thy handmaid.", "Shew me a token for good:\nthat they who hate me may see, and be confounded, because thou, O Lord, hast helped me and hast comforted me."], "85"], ["Fundamenta ejus", ["The foundations thereof are in the holy mountains :", "The Lord loveth the gates of Sion above all the tabernacles of Jacob.", "Glorious things are said of thee, O city of God.", "I will be mindful of Rahab and of Babylon knowing me. Behold the foreigners, and Tyre, and the people of the Ethiopians, these were there.", "Shall not Sion say:\nThis man and that man is born in her? and the Highest himself hath founded her.", "The Lord shall tell in his writings of peoples and of princes, of them that have been in her.", "The dwelling in thee is as it were of all rejoicing."], "86"], ["Domine, Deus", ["O Lord, the God of my salvation:\nI have cried in the day, and in the night before thee.", "Let my prayer come in before thee:\nincline thy ear to my petition.", "For my soul is filled with evils:\nand my life hath drawn nigh to hell.", "I am counted among them that go down to the pit:\nI am become as a man without help,", "Free among the dead. Like the slain sleeping in the sepulchres, whom thou rememberest no more:\nand they are cast off from thy hand.", "They have laid me in the lower pit:\nin the dark places, and in the shadow of death.", "Thy wrath is strong over me:\nand all thy waves thou hast brought in upon me.", "Thou hast put away my acquaintance far from me:\nthey have set me an abomination to themselves. I was delivered up, and came not forth:", "My eyes languished through poverty. All the day I cried to thee, O Lord:\nI stretched out my hands to thee.", "Wilt thou shew wonders to the dead? or shall physicians raise to life, and give praise to thee?", "Shall any one in the sepulchre declare thy mercy:\nand thy truth in destruction?", "Shall thy wonders be known in the dark;\nand thy justice in the land of forgetfulness?", "But I, O Lord, have cried to thee:\nand in the morning my prayer shall prevent thee.", "Lord, why castest thou off my prayer:\nwhy turnest thou away thy face from me?", "I am poor, and in labours from my youth:\nand being exalted have been humbled and troubled.", "Thy wrath hath come upon me:\nand thy terrors have troubled me.", "They have come round about me like water all the day:\nthey have compassed me about together.", "Friend and neighbour thou hast put far from me:\nand my acquaintance, because of misery."], "87"], ["Misericordias Domini", ["The mercies of the Lord I will sing for ever. I will shew forth thy truth with my mouth to generation and generation.", "For thou hast said:\nMercy shall be built up for ever in the heavens:\nthy truth shall be prepared in them.", "I have made a covenant with my elect:\nI have sworn to David my servant:", "Thy seed will I settle for ever. And I will build up thy throne unto generation and generation.", "The heavens shall confess thy wonders, O Lord:\nand thy truth in the church of the saints.", "For who in the clouds can be compared to the Lord:\nor who among the sons of God shall be like to God?", "God, who is glorified in the assembly of the saints:\ngreat and terrible above all them that are about him.", "O Lord God of hosts, who is like to thee? thou art mighty, O Lord, and thy truth is round about thee.", "Thou rulest the power of the sea:\nand appeasest the motion of the waves thereof.", "Thou hast humbled the proud one, as one that is slain:\nwith the arm of thy strength thou hast scattered thy enemies.", "Thine are the heavens, and thine is the earth:\nthe world and the fulness thereof thou hast founded:", "The north and the sea thou hast created. Thabor and Hermon shall rejoice in thy name:", "Thy arm is with might. Let thy hand be strengthened, and thy right hand exalted:", "Justice and judgment are the preparation of thy throne. Mercy and truth shall go before thy face:", "Blessed is the people that knoweth jubilation. They shall walk, O Lord, in the light of thy countenance:", "And in thy name they shall rejoice all the day, and in thy justice they shall be exalted.", "For thou art the glory of their strength:\nand in thy good pleasure shall our horn be exalted.", "For our protection is of the Lord, and of our king the holy one of Israel.", "Then thou spokest in a vision to thy saints, and saidst:\nI have laid help upon one that is mighty, and have exalted one chosen out of my people.", "I have found David my servant:\nwith my holy oil I have anointed him.", "For my hand shall help him:\nand my arm shall strengthen him.", "The enemy shall have no advantage over him:\nnor the son of iniquity have power to hurt him.", "And I will cut down his enemies before his face;\nand them that hate him I will put to flight.", "And my truth and my mercy shall be with him:\nand in my name shall his horn be exalted.", "And I will set his hand in the sea;\nand his right hand in the rivers.", "He shall cry out to me:\nThou art my father:\nmy God, and the support of my salvation.", "And I will make him my firstborn, high above the kings of the earth.", "I will keep my mercy for him for ever:\nand my covenant faithful to him.", "And I will make his seed to endure for evermore:\nand his throne as the days of heaven.", "And if his children forsake my law, and walk not in my judgments:", "If they profane my justices:\nand keep not my commandments:", "I will visit their iniquities with a rod and their sins with stripes.", "But my mercy I will not take away from him:\nnor will I suffer my truth to fail.", "Neither will I profane my covenant:\nand the words that proceed from my mouth I will not make void.", "Once have I sworn by my holiness:\nI will not lie unto David:", "His seed shall endure for ever.", "And his throne as the sun before me:\nand as the moon perfect for ever, and a faithful witness in heaven.", "But thou hast rejected and despised:\nthou hast been angry with thy anointed.", "Thou hast overthrown the covenant of thy servant:\nthou hast profaned his sanctuary on the earth.", "Thou hast broken down all his hedges:\nthou hast made his strength fear.", "All that pass by the way have robbed him:\nhe is become a reproach to his neighbours.", "Thou hast set up the right hand of them that oppress him:\nthou hast made all his enemies to rejoice.", "Thou hast turned away the help of his sword;\nand hast not assisted him in battle.", "Thou hast made his purification to cease:\nand thou hast cast his throne down to the ground.", "Thou hast shortened the days of his time:\nthou hast covered him with confusion.", "How long, O Lord, turnest thou away unto the end? shall thy anger burn like fire?", "Remember what my substance is:\nfor hast thou made all the children of men in vain?", "Who is the man that shall live, and not see death:\nthat shall deliver his soul from the hand of hell?", "Lord, where are thy ancient mercies, according to what thou didst swear to David in thy truth?", "Be mindful, O Lord, of the reproach of thy servants (which I have held in my bosom) of many nations:", "Wherewith thy enemies have reproached, O Lord;\nwherewith they have reproached the change of thy anointed.", "Blessed be the Lord for evermore. So be it. So be it."], "88"], ["Domine, refugium", ["Lord, thou hast been our refuge from generation to generation.", "Before the mountains were made, or the earth and the world was formed;\nfrom eternity and to eternity thou art God.", "Turn not man away to be brought low:\nand thou hast said:\nBe converted, O ye sons of men.", "For a thousand years in thy sight are as yesterday, which is past. And as a watch in the night,", "Things that are counted nothing, shall their years be.", "In the morning man shall grow up like grass;\nin the morning he shall flourish and pass away:\nin the evening he shall fall, grow dry, and wither.", "For in thy wrath we have fainted away:\nand are troubled in thy indignation.", "Thou hast set our iniquities before thy eyes:\nour life in the light of thy countenance.", "For all our days are spent;\nand in thy wrath we have fainted away. Our years shall be considered as a spider:", "The days of our years in them are threescore and ten years. But if in the strong they be fourscore years:\nand what is more of them is labour and sorrow. For mildness is come upon us:\nand we shall be corrected.", "Who knoweth the power of thy anger, and for thy fear", "Can number thy wrath? So make thy right hand known:\nand men learned in heart, in wisdom.", "Return, O Lord, how long? and be entreated in favour of thy servants.", "We are filled in the morning with thy mercy:\nand we have rejoiced, and are delighted all our days.", "We have rejoiced for the days in which thou hast humbled us:\nfor the years in which we have seen evils.", "Look upon thy servants and upon their works:\nand direct their children.", "And let the brightness of the Lord our God be upon us:\nand direct thou the works of our hands over us;\nyea, the work of our hands do thou direct."], "89"], ["Qui habitat", ["He that dwelleth in the aid of the most High, shall abide under the protection of the God of Jacob.", "He shall say to the Lord:\nThou art my protector, and my refuge:\nmy God, in him will I trust.", "For he hath delivered me from the snare of the hunters:\nand from the sharp word.", "He will overshadow thee with his shoulders:\nand under his wings thou shalt trust.", "His truth shall compass thee with a shield:\nthou shalt not be afraid of the terror of the night.", "Of the arrow that flieth in the day, of the business that walketh about in the dark:\nof invasion, or of the noonday devil.", "A thousand shall fall at thy side, and ten thousand at thy right hand:\nbut it shall not come nigh thee.", "But thou shalt consider with thy eyes:\nand shalt see the reward of the wicked.", "Because thou, O Lord, art my hope:\nthou hast made the most High thy refuge.", "There shall no evil come to thee:\nnor shall the scourge come near thy dwelling.", "For he hath given his angels charge over thee;\nto keep thee in all thy ways.", "In their hands they shall bear thee up:\nlest thou dash thy foot against a stone.", "Thou shalt walk upon the asp and the basilisk:\nand thou shalt trample under foot the lion and the dragon.", "Because he hoped in me I will deliver him:\nI will protect him because he hath known my name.", "He shall cry to me, and I will hear him:\nI am with him in tribulation, I will deliver him, and I will glorify him.", "I will fill him with length of days;\nand I will shew him my salvation."], "90"], ["Bonum est confiteri", ["It is good to give praise to the Lord:\nand to sing to thy name, O most High.", "To shew forth thy mercy in the morning, and thy truth in the night:", "Upon an instrument of ten strings, upon the psaltery:\nwith a canticle upon the harp.", "For thou hast given me, O Lord, a delight in thy doings:\nand in the works of thy hands I shall rejoice.", "O Lord, how great are thy works! thy thoughts are exceeding deep.", "The senseless man shall not know:\nnor will the fool understand these things.", "When the wicked shall spring up as grass:\nand all the workers of iniquity shall appear:\nThat they may perish for ever and ever:", "But thou, O Lord, art most high for evermore.", "For behold thy enemies, O lord, for behold thy enemies shall perish:\nand all the workers of iniquity shall be scattered.", "But my horn shall be exalted like that of the unicorn:\nand my old age in plentiful mercy.", "My eye also hath looked down upon my enemies:\nand my ear shall hear of the downfall of the malignant that rise up against me.", "The just shall flourish like the palm tree:\nhe shall grow up like the cedar of Libanus.", "They that are planted in the house of the Lord shall flourish in the courts of the house of our God.", "They shall still increase in a fruitful old age:\nand shall be well treated,", "That they may shew, That the Lord our God is righteous, and there is no iniquity in him."], "91"], ["Dominus regnavit", ["The Lord hath reigned, he is clothed with beauty:\nthe Lord is clothed with strength, and hath girded himself. For he hath established the world which shall not be moved.", "Thy throne is prepared from of old:\nthou art from everlasting.", "The floods have lifted up, O Lord:\nthe floods have lifted up their voice. The floods have lifted up their waves,", "With the noise of many waters. Wonderful are the surges of the sea:\nwonderful is the Lord on high.", "Thy testimonies are become exceedingly credible:\nholiness becometh thy house, O Lord, unto length of days."], "92"], ["Deus ultionum", ["The Lord is the God to whom revenge belongeth:\nthe God of revenge hath acted freely.", "Lift up thyself, thou that judgest the earth:\nrender a reward to the proud.", "How long shall sinners, O Lord:\nhow long shall sinners glory?", "Shall they utter, and speak iniquity:\nshall all speak who work injustice?", "Thy people, O Lord, they have brought low:\nand they have afflicted thy inheritance.", "They have slain the widow and the stranger:\nand they have murdered the fatherless.", "And they have said:\nThe Lord shall not see:\nneither shall the God of Jacob understand.", "Understand, ye senseless among the people:\nand, you fools, be wise at last.", "He that planted the ear, shall he not hear? or he that formed the eye, doth he not consider?", "He that chastiseth nations, shall he not rebuke:\nhe that teacheth man knowledge?", "The Lord knoweth the thoughts of men, that they are vain.", "Blessed is the man whom thou shalt instruct, O Lord:\nand shalt teach him out of thy law.", "That thou mayst give him rest from the evil days:\ntill a pit be dug for the wicked.", "For the Lord will not cast off his people:\nneither will he forsake his own inheritance.", "Until justice be turned into judgment:\nand they that are near it are all the upright in heart.", "Who shall rise up for me against the evildoers? or who shall stand with me against the workers of iniquity?", "Unless the Lord had been my helper, my soul had almost dwelt in hell.", "If I said:\nMy foot is moved:\nthy mercy, O Lord, assisted me.", "According to the multitude of my sorrows in my heart, thy comforts have given joy to my soul.", "Doth the seat of iniquity stick to thee, who framest labour in commandment?", "They will hunt after the soul of the just, and will condemn innocent blood.", "But the Lord is my refuge:\nand my God the help of my hope.", "And he will render them their iniquity:\nand in their malice he will destroy them:\nthe Lord our God will destroy them."], "93"], ["Venite, exultemus", ["Come let us praise the Lord with joy:\nlet us joyfully sing to God our saviour.", "Let us come before his presence with thanksgiving;\nand make a joyful noise to him with psalms.", "For the Lord is a great God, and a great King above all gods.", "For in his hand are all the ends of the earth:\nand the heights of the mountains are his.", "For the sea is his, and he made it:\nand his hands formed the dry land.", "Come let us adore and fall down:\nand weep before the Lord that made us.", "For he is the Lord our God:\nand we are the people of his pasture and the sheep of his hand.", "Today if you shall hear his voice, harden not your hearts:", "As in the provocation, according to the day of temptation in the wilderness:\nwhere your fathers tempted me, they proved me, and saw my works.", "Forty years long was I offended with that generation, and I said:\nThese always err in heart.", "And these men have not known my ways:\nso I swore in my wrath that they shall not enter into my rest."], "94"], ["Cantate Domino", ["Sing ye to the Lord a new canticle:\nsing to the Lord, all the earth.", "Sing ye to the Lord and bless his name:\nshew forth his salvation from day to day.", "Declare his glory among the Gentiles:\nhis wonders among all people.", "For the Lord is great, and exceedingly to be praised:\nhe is to be feared above all gods.", "For all the gods of the Gentiles are devils:\nbut the Lord made the heavens.", "Praise and beauty are before him:\nholiness and majesty in his sanctuary.", "Bring ye to the Lord, O ye kindreds of the Gentiles, bring ye to the Lord glory and honour:", "Bring to the Lord glory unto his name. Bring up sacrifices, and come into his courts:", "Adore ye the Lord in his holy court. Let all the earth be moved at his presence.", "Say ye among the Gentiles, the Lord hath reigned. For he hath corrected the world, which shall not be moved:\nhe will judge the people with justice.", "Let the heavens rejoice, and let the earth be glad, let the sea be moved, and the fulness thereof:", "The fields and all things that are in them shall be joyful. Then shall all the trees of the woods rejoice", "Before the face of the Lord, because he cometh:\nbecause he cometh to judge the earth. He shall judge the world with justice, and the people with his truth."], "95"], ["Dominus regnavit", ["The Lord hath reigned, let the earth rejoice:\nlet many islands be glad.", "Clouds and darkness are round about him:\njustice and judgment are the establishment of his throne.", "A fire shall go before him, and shall burn his enemies round about.", "His lightnings have shone forth to the world:\nthe earth saw and trembled.", "The mountains melted like wax, at the presence of the Lord:\nat the presence of the Lord of all the earth.", "The heavens declared his justice:\nand all people saw his glory.", "Let them be all confounded that adore graven things, and that glory in their idols. Adore him, all you his angels:", "Sion heard, and was glad. And the daughters of Juda rejoiced, because of thy judgments, O Lord.", "For thou art the most high Lord over all the earth:\nthou art exalted exceedingly above all gods.", "You that love the Lord, hate evil:\nthe Lord preserveth the souls of his saints, he will deliver them out of the hand of the sinner.", "Light is risen to the just, and joy to the right of heart.", "Rejoice, ye just, in the Lord:\nand give praise to the remembrance of his holiness."], "96"], ["Cantate Domino", ["Sing ye to the Lord a new canticle:\nbecause he hath done wonderful things. His right hand hath wrought for him salvation, and his arm is holy.", "The Lord hath made known his salvation:\nhe hath revealed his justice in the sight of the Gentiles.", "He hath remembered his mercy and his truth toward the house of Israel. All the ends of the earth have seen the salvation of our God.", "Sing joyfully
