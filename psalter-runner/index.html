<script>
"use strict";
// Psalter Runner: a 16-bit auto-runner through all 150 psalms.
// One file, nothing to load. Left half of the screen: tap to jump, hold to
// float. Right half: tap to attack. Keys: Space / Up / W to jump (hold to
// float), X / J / Enter to attack, P or Esc to pause, M for sound.

// ---- The psalms ------------------------------------------------------------------
// The text in the background, and under the run: The Grail Psalms (1963),
// as chanted in the Divine Office, taken from the Lumina project
// (github.com/munkachy/lumina), with the line breaks of the Psalter. Each
// phase below names the verses it shows, counting from 0.
const flat = (v) => v.replace(/\n/g, " ");
// [Latin incipit, verses], Psalms 1 to 150 in the Grail's own numbering.
const PSALTER = [["Beatus vir qui non abiit", ["Happy indeed is the man\nwho follows not the counsel of the wicked,\nnor lingers in the way of sinners\nnor sits in the company of scorners,", "but whose delight is the law of the Lord\nand who ponders his law day and night.", "He is like a tree that is planted\nbeside the flowing waters,\nthat yields its fruit in due season\nand whose leaves shall never fade;\nand all that he does shall prosper.", "Not so are the wicked, not so!\nFor they like winnowed chaff\nshall be driven away by the wind.", "When the wicked are judged they shall not stand,\nnor find room among those who are just;", "for the Lord guards the way of the just\nbut the way of the wicked leads to doom."]], ["Quare fremuerunt gentes", ["Why this tumult among nations,\namong peoples this useless murmuring?", "They arise, the kings of the earth,\nprinces plot against the Lord and his Anointed.", "“Come, let us break their fetters,\ncome, let us cast off their yoke.”", "He who sits in the heavens laughs;\nthe Lord is laughing them to scorn.", "Then he will speak in his anger,\nhis rage will strike them with terror.", "“It is I who have set up my king on Zion,\nmy holy mountain.”", "(I will announce the decree of the Lord:)\nThe Lord said to me: “You are my Son.\nIt is I who have begotten you this day.", "Ask and I shall bequeath you the nations,\nput the ends of the earth in your possession.", "With a rod of iron you will break them,\nshatter them like a potter’s jar.”", "Now, O kings, understand,\ntake warning, rulers of the earth;", "serve the Lord with awe\nand trembling, pay him your homage", "lest he be angry and you perish;\nfor suddenly his anger will blaze.\nBlessed are they who put their trust in God."]], ["Domine, quid multiplicati", ["How many are my foes, O Lord!\nHow many are rising up against me!", "How many are saying about me:\n“There is no help for him in God.”", "But you, Lord, are a shield about me,\nmy glory, who lift up my head.", "I cry aloud to the Lord.\nHe answers from his holy mountain.", "I lie down to rest, and I sleep.\nI wake, for the Lord upholds me.", "I will not fear even thousands of people\nwho are ranged on every side against me.", "Arise, Lord; save me, my God,\nyou who strike my foes on the mouth,\nyou who break the teeth of the wicked!", "O Lord of salvation, bless your people!"]], ["Cum invocarem", ["When I call, answer me, O God of justice;\nfrom anguish you released me, have mercy and hear me!", "O men, how long will your hearts be closed,\nwill you love what is futile and seek what is false?", "It is the Lord who grants favors to those whom he loves;\nthe Lord hears me whenever I call him.", "Fear him; do not sin: ponder on your bed and be still.", "Make justice your sacrifice, and trust in the Lord.", "“What can bring us happiness?” many say.\nLet the light of your face shine on us, O Lord.", "You have put into my heart a greater joy\nthan they have from abundance of corn and new wine.", "I will lie down in peace and sleep comes at once\nfor you alone, Lord, make me dwell in safety."]], ["Verba mea auribus", ["To my words give ear, O Lord,\ngive heed to my groaning.", "Attend to the sound of my cries,\nmy King and my God.", "It is you whom I invoke, O Lord.\nIn the morning you hear me;\nin the morning I offer you my prayer,\nwatching and waiting.", "You are no God who loves evil;\nno sinner is your guest.", "The boastful shall not stand their ground\nbefore your face.", "You hate all who do evil;\nyou destroy all who lie.\nThe deceitful and bloodthirsty man\nthe Lord detests.", "But I through the greatness of your love\nhave access to your house.\nI bow down before your holy temple,\nfilled with awe.", "Lead me, Lord, in your justice,\nbecause of those who lie in wait;\nmake clear your way before me.", "No truth can be found in their mouths,\ntheir heart is all mischief,\ntheir throat a wide-open grave,\nall honey their speech.", "Declare them guilty, O God.\nLet them fail in their designs.\nDrive them out for their many offenses,\nfor they have defied you.", "All those you protect shall be glad\nand ring out their joy.\nYou shelter them; in you they rejoice,\nthose who love your name.", "It is you who bless the just man\nyou surround him with favor as with a shield."]], ["Domine, ne in furore", ["Lord, do not reprove me in your anger;\npunish me not in your rage.", "Have mercy on me, Lord, I have no strength;\nLord, heal me, my body is racked;", "my soul is racked with pain.\nBut you, O Lord...how long?", "Return, Lord, rescue my soul.\nSave me in your merciful love;", "for in death no one remembers you;\nfrom the grave, who can give you praise?", "I am exhausted with my groaning;\nevery night I drench my pillow with tears;\nI bedew my bed with weeping.", "My eye wastes away with grief;\nI have grown old surrounded by my foes.", "Leave me, all you who do evil;\nfor the Lord has heard my weeping.", "The Lord has heard my plea;\nThe Lord will accept my prayer.", "All my foes will retire in confusion,\nfoiled and suddenly confounded."]], ["Domine, Deus meus", ["Lord God, I take refuge in you.\nFrom my pursuer save me and rescue me,", "lest he tear me to pieces like a lion\nand drag me off with no one to rescue me.", "Lord God, if my hands have done wrong,", "if I have paid back evil for good,\nI who saved my unjust oppressor:", "then let my foe pursue me and seize me,\nlet him trample my life to the ground\nand lay my soul in the dust.", "Lord, rise up in your anger,\nrise against the fury of my foes;\nmy God, awake! You will give judgment.", "Let the company of nations gather round you,\ntaking your seat above them on high.", "(The Lord is judge of the peoples.)\nGive judgment for me, Lord; I am just\nand innocent of heart.", "Put an end to the evil of the wicked!\nMake the just stand firm,\nyou who test mind and heart,\nO just God!", "God is the shield that protects me,\nwho saves the upright of heart.", "God is a just judge\nslow to anger;\nbut he threatens the wicked every day,", "men who will not repent.\nGod will sharpen his sword;\nhe has braced his bow and taken aim.", "For them he has prepared deadly weapons;\nhe barbs his arrows with fire.", "Here is one who is pregnant with malice,\nwho conceives evil and brings forth lies.", "He digs a pitfall, digs it deep;\nand in the trap he has made he will fall.", "His malice will recoil on himself;\non his own head his violence will fall.", "I will thank the Lord for his justice:\nI will sing to the Lord, the Most High."]], ["Domine, Dominus noster", ["How great is your name, O Lord our God,\nthrough all the earth!\nYour majesty is praised above the heavens;", "on the lips of children and of babes\nyou have found praise to foil your enemy,\nto silence the foe and the rebel.", "When I see the heavens, the work of your hands,\nthe moon and the stars which you arranged,", "what is man that you should keep him in mind,\nmortal man that you care for him?", "Yet you have made him little less than a god;\nwith glory and honor you crowned him,", "gave him power over the works of your hands,\nput all things under his feet.", "All of them, sheep and cattle,\nyes, even the savage beasts,", "birds of the air, and fish\nthat make their way through the waters.", "How great is your name, O Lord our God\nthrough all the earth!"]], ["Confitebor tibi", ["I will praise you, Lord, with all my heart;\nI will recount all your wonders.", "I will rejoice in you and be glad,\nand sing psalms to your name, O Most High.", "See how my enemies turn back,\nhow they stumble and perish before you.", "You upheld the justice of my cause;\nyou sat enthroned, judging with justice.", "You have checked the nations, destroyed the wicked;\nyou have wiped out their name for ever and ever.", "The foe is destroyed, eternally ruined.\nYou uprooted their cities; their memory has perished.", "But the Lord sits enthroned for ever.\nHe has set up his throne for judgment;", "he will judge the world with justice,\nhe will judge the peoples with his truth.", "For the oppressed let the Lord be a stronghold,\na stronghold in times of distress.", "Those who know your name will trust you;\nyou will never forsake those who seek you.", "Sing psalms to the Lord who dwells in Zion.\nProclaim his mighty works among the peoples,", "for the Avenger of blood has remembered them,\nhas not forgotten the cry of the poor.", "Have pity on me, Lord, see my sufferings,\nyou who save me from the gates of death;", "that I may recount all your praise\nat the gates of the city of Zion\nand rejoice in your saving help.", "The nations have fallen in the pit which they made,\ntheir feet caught in the snare they laid.", "The Lord has revealed himself, and given judgment.\nThe wicked are snared in the work of their own hands.", "Let the wicked go down among the dead,\nall the nations forgetful of God;", "for the needy shall not always be forgotten\nnor the hopes of the poor be in vain.", "Arise, Lord, let men not prevail!\nLet the nations be judged before you.", "Lord, strike them with terror,\nlet the nations know they are but men."]], ["Ut quid Domine", ["Lord, why do you stand afar off\nand hide yourself in times of distress?", "The poor man is devoured by the pride of the wicked:\nhe is caught in the schemes that others have made.", "For the wicked man boasts of his heart’s desires;\nthe covetous blasphemes and spurns the Lord.", "In his pride the wicked says: “He will not punish.\nThere is no God.” Such are his thoughts.", "His path is ever untroubled;\nyour judgment is far from his mind.\nHis enemies he regards with contempt.", "He thinks: “Never shall I falter:\nmisfortune shall never be my lot.”", "His mouth is full of cursing, guile, oppression;\nmischief and deceit are under his tongue.", "He lies in wait among the reeds;\nthe innocent he murders in secret.\nHis eyes are on the watch for the helpless man.", "He lurks in hiding like a lion in his lair;\nhe lurks in hiding to seize the poor;\nhe seizes the poor man and drags him away.", "He crouches, preparing to spring,\nand the helpless fall beneath such strength.", "He thinks in his heart: “God forgets,\nhe hides his face, he does not see.”", "Arise then, Lord, lift up your hand!\nO God, do not forget the poor!", "Why should the wicked spurn the Lord\nand think in his heart: “God will not punish”?", "But you have seen the trouble and sorrow,\nyou note it, you take it in hand.\nThe helpless trusts himself to you;\nfor you are the helper of the orphan.", "Break the power of the wicked and the sinner!\nPunish their wickedness till nothing remains!", "The Lord is king for ever and ever.\nThe heathen shall perish from the land he rules.", "Lord, you hear the prayer of the poor;\nyou strengthen their hearts; you turn your ear", "to protect the rights of the orphan and oppressed:\nso that mortal man may strike terror no more."]], ["In Domino confido", ["In the Lord I have taken my refuge.\nHow can you say to my soul:\n“Fly like a bird to its mountain.", "See the wicked bracing their bow;\nthey are fixing their arrows on the string\nto shoot upright men in the dark.", "Foundations once destroyed, what can the just do?”", "The Lord is in his holy temple,\nthe Lord, whose throne is in heaven.\nHis eyes look down on the world;\nhis gaze tests mortal men.", "The Lord tests the just and the wicked;\nthe lover of violence he hates.", "He sends fire and brimstone on the wicked;\nhe sends a scorching wind as their lot.", "The Lord is just and loves justice;\nthe upright shall see his face."]], ["Salva me fac", ["Help, O Lord, for good men have vanished;\ntruth has gone from the sons of men.", "Falsehood they speak one to another,\nwith lying lips, with a false heart.", "May the Lord destroy all lying lips,\nthe tongue that speaks high-sounding words,", "those who say: “Our tongue is our strength;\nour lips are our own, who is our master?”", "“For the poor who are oppressed and the needy who groan\nI myself will arise,” says the Lord,\n“I will grant them the salvation for which they thirst.”", "The words of the Lord are words without alloy,\nsilver from the furnace, seven times refined.", "It is you, O Lord, who will take us in your care\nand protect us for ever from this generation.", "See how the wicked prowl on every side,\nwhile the worthless are prized highly by the sons of men."]], ["Usquequo, Domine?", ["How long, O Lord, will you forget me?\nHow long will you hide your face?", "How long must I bear grief in my soul,\nthis sorrow in my heart day and night?\nHow long shall my enemy prevail?", "Look at me, answer me, Lord my God!\nGive light to my eyes lest I fall asleep in death,", "lest my enemy say: “I have overcome him”;\nlest my foes rejoice to see my fall.", "As for me, I trust in your merciful love.\nLet my heart rejoice in your saving help:", "Let me sing to the Lord for his goodness to me,\nsinging psalms to the name of the Lord, the Most High."]], ["Dixit insipiens", ["The fool has said in his heart:\n“There is no God above.”\nTheir deeds are corrupt, depraved;\nnot a good man is left.", "From heaven the Lord looks down\non the sons of men\nto see if any are wise,\nif any seek God.", "All have left the right path,\ndepraved, every one;\nthere is not a good man left,\nno, not even one.", "Will the evil-doers not understand?\nThey eat up my people\nas though they were eating bread:\nthey never pray to the Lord.", "See how they tremble with fear\nwithout cause for fear:\nfor God is with the just.", "You may mock the poor man’s hope,\nbut his refuge is the Lord.", "O that Israel’s salvation might come from Zion!\nWhen the Lord delivers his people from bondage,\nthen Jacob will be glad and Israel rejoice."]], ["Domine, quis habitabit?", ["Lord, who shall be admitted to your tent\nand dwell on your holy mountain?", "He who walks without fault;\nhe who acts with justice\nand speaks the truth from his heart;", "he who does not slander with his tongue;\nHe who does no wrong to his brother,\nwho casts no slur on his neighbor,", "who holds the godless in disdain,\nbut honors those who fear the Lord;\nhe who keeps his pledge, come what may;", "who takes no interest on a loan\nand accepts no bribes against the innocent.\nSuch a man will stand firm forever."]], ["Conserva me, Domine", ["Preserve me, God, I take refuge in you.", "I say to the Lord: “You are my God.\nMy happiness lies in you alone.”", "He has put into my heart a marvelous love\nfor the faithful ones who dwell in his land.", "Those who choose other gods increase their sorrows.\nNever will I offer their offerings of blood.\nNever will I take their name upon my lips.", "O Lord, it is you who are my portion and cup;\nit is you yourself who are my prize.", "The lot marked out for me is my delight:\nwelcome indeed the heritage that falls to me!", "I will bless the Lord who gives me counsel,\nwho even at night directs my heart.", "I keep the Lord ever in my sight:\nsince he is at my right hand, I shall stand firm.", "And so my heart rejoices, my soul is glad;\neven my body shall rest in safety.", "For you will not leave my soul among the dead,\nnor let your beloved know decay.", "You will show me the path of life,\nthe fullness of joy in your presence,\nat your right hand happiness for ever."]], ["Exaudi Domine", ["Lord, hear a cause that is just,\npay heed to my cry.\nTurn your ear to my prayer:\nno deceit is on my lips.", "From you may my judgment come forth.\nYour eyes discern the truth.", "You search my heart, you visit me by night.\nYou test me and you find in me no wrong.", "My words are not sinful as are men’s words.\nI kept from violence because of your word,", "I kept my feet firmly in your paths;\nthere was no faltering in my steps.", "I am here and I call, you will hear me, O God.\nTurn your ear to me; hear my words.", "Display your great love, you whose right hand saves\nyour friends from those who rebel against them.", "Guard me as the apple of your eye.\nHide me in the shadow of your wings", "from the violent attack of the wicked.\nMy foes encircle me with deadly intent.", "Their hearts tight shut, their mouths speak proudly.", "They advance against me, and now they surround me.\nTheir eyes are watching to strike me to the ground,", "as though they were lions ready to claw\nor like some young lion crouched in hiding.", "Lord, arise, confront them, strike them down!\nLet your sword rescue my soul from the wicked;", "let your hand, O Lord, rescue me from men,\nfrom men whose reward is in this present life.\nYou give them their fill of your treasures;\nthey rejoice in abundance of offspring\nand leave their wealth to their children.", "As for me, in my justice I shall see your face\nand be filled, when I awake, with the sight of your glory."]], ["Diligam te, Domine", ["I love you, Lord, my strength,", "my rock, my fortress, my savior.\nMy God is the rock where I take refuge;\nmy shield, my mighty help, my stronghold.", "The Lord is worthy of all praise,\nwhen I call I am saved from my foes.", "The waves of death rose about me;\nthe torrents of destruction assailed me;", "the snares of the grave entangled me;\nthe traps of death confronted me.", "In my anguish I called to the Lord;\nI cried to God for help.\nFrom his temple he heard my voice;\nmy cry came to his ears.", "Then the earth reeled and rocked;\nthe mountains were shaken to their base:\nthey reeled at his terrible anger.", "Smoke came forth from his nostrils\nand scorching fire from his mouth:\ncoals were set ablaze by its heat.", "He lowered the heavens and came down,\na black cloud under his feet.", "He came enthroned on the cherubim,\nhe flew on the wings of the wind.", "He made the darkness his covering,\nthe dark waters of the clouds, his tent.", "A brightness shone out before him\nwith hailstones and flashes of fire.", "The Lord thundered in the heavens;\nThe Most High let his voice be heard.", "He shot his arrows, scattered the foe,\nflashed his lightnings and put them to flight.", "The bed of the ocean was revealed;\nthe foundations of the world were laid bare\nat the thunder of your threat, O Lord,\nat the blast of the breath of your anger.", "From on high he reached down and seized me;\nhe drew me forth from the mighty waters.", "he snatched me from my powerful foe,\nfrom my enemies whose strength I could not match.", "They assailed me in the day of my misfortune,\nbut the Lord was my support.", "He brought me forth into freedom,\nhe saved me because he loved me.", "He rewarded me because I was just,\nrepaid me, for my hands were clean,", "for I have kept the way of the Lord,\nand have not fallen away from my God.", "For his judgments are all before me:\nI have never neglected his commands.", "I have always been upright before him;\nI have kept myself from guilt.", "He repaid me because I was just\nand my hands were clean in his eyes.", "You are loving with those who love you:\nyou show yourself perfect with the perfect.", "With the sincere you show yourself sincere,\nbut the cunning you outdo in cunning.", "For you save a humble people\nbut humble the eyes that are proud.", "You, O Lord, are my lamp,\nmy God who lightens my darkness.", "With you I can break through any barrier,\nwith my God I can scale any wall.", "As for God, his ways are perfect;\nthe word of the Lord, purest gold.\nHe indeed is the shield\nof all who make him their refuge.", "For who is God but the Lord?\nWho is a rock but our God?", "the God who girds me with strength\nand makes the path safe before me.", "My feet you make swift as the deer’s;\nyou have made me stand firm on the heights.", "You have trained my hands for battle\nand my arms to bend the heavy bow.", "You gave me your saving shield;\nyou upheld me, trained me with care.", "You gave me freedom for my steps;\nmy feet have never slipped.", "I pursued and overtook my foes,\nnever turning back till they were slain.", "I smote them so they could not rise;\nthey fell beneath my feet.", "You girded me with strength for battle;\nyou made my enemies fall beneath me,", "you made my foes take flight;\nthose who hated me I destroyed.", "They cried, but there was no one to save them;\nthey cried to the Lord, but in vain.", "I crushed them fine as dust before the wind;\ntrod them down like dirt in the streets.", "You saved me from the feuds of the people\nand put me at the head of the nations.\nPeople unknown to me served me:", "when they heard of me they obeyed me.\nForeign nations came to me cringing:", "foreign nations faded away.\nThey came trembling out of their strongholds.", "Long life to the Lord, my rock!\nPraised be the God who saves me,", "the God who gives me redress\nand subdues people under me.", "You saved me from my furious foes.\nYou set me above my assailants.\nYou saved me from violent men,", "so I will praise you, Lord, among the nations:\nI will sing a psalm to your name.", "He has given great victories to his king\nand shown his love for his anointed,\nfor David and his sons for ever."]], ["Caeli enarrant", ["The heavens proclaim the glory of God,\nand the firmament shows forth the work of his hands.", "Day unto day takes up the story\nand night unto night makes known the message.", "No speech, no word, no voice is heard", "yet their span extends through all the earth,\ntheir words to the utmost bounds of the world.\nThere he has placed a tent for the sun;", "it comes forth like a bridegroom coming from his tent,\nrejoices like a champion to run its course.", "At the end of the sky is the rising of the sun;\nto the furthest end of the sky is its course.\nThere is nothing concealed from its burning heat.", "The law of the Lord is perfect,\nit revives the soul.\nThe rule of the Lord is to be trusted,\nit gives wisdom to the simple.", "The precepts of the Lord are right,\nthey gladden the heart.\nThe command of the Lord is clear,\nit gives light to the eyes.", "The fear of the Lord is holy,\nabiding for ever.\nThe decrees of the Lord are truth\nand all of them just.", "They are more to be desired than gold,\nthan the purest of gold\nand sweeter are they than honey,\nthan honey from the comb.", "So in them your servant finds instruction;\ngreat reward is in their keeping.", "But who can detect all his errors?\nFrom hidden faults acquit me.", "From presumption restrain your servant\nand let it not rule me.\nThen shall I be blameless,\nclean from grave sin.", "May the spoken words of my mouth,\nthe thoughts of my heart,\nwin favor in your sight, O Lord,\nmy rescuer, my rock!"]], ["Exaudiat te Dominus", ["May the Lord answer in time of trial;\nmay the name of Jacob’s God protect you.", "May he send you help from his shrine\nand give you support from Zion.", "May he remember all your offerings\nand receive your sacrifice with favor.", "May he give you your heart’s desire\nand fulfill every one of your plans.", "May we ring out our joy at your victory\nand rejoice in the name of our God.\n(May the Lord grant all your prayers.)", "I am sure now that the Lord\nwill give victory to his anointed,\nwill reply from his holy heaven\nwith the mighty victory of his hand.", "Some trust in chariots or horses,\nbut we in the name of the Lord.", "They will collapse and fall,\nbut we shall hold and stand firm.", "Give victory to the king, O Lord,\ngive answer on the day we call."]], ["Domine, in virtute tua", ["O Lord, your strength gives joy to the King;\nhow your saving help makes him glad!", "You have granted him his heart’s desire;\nyou have not refused the prayer of his lips.", "You came to meet him with the blessings of success,\nyou have set on his head a crown of pure gold.", "He asked you for life and this you have given,\ndays that will last from age to age.", "Your saving help has given him glory.\nYou have laid upon him majesty and splendor,", "you have granted your blessings to him forever.\nYou have made him rejoice with the joy of your presence.", "The king has put his trust in the Lord:\nthrough the mercy of the Most High he shall stand firm.", "His hand will seek and find all his foes,\nhis right hand find out those that hate him.", "You will burn them like a blazing furnace\non the day when you appear.\nAnd the Lord will destroy them in his anger;\nfire will swallow them up.", "You will wipe out their race from the earth\nand their children from the sons of men.", "Though they plan evil against you,\nthough they plot, they shall not prevail.", "For you will force them to retreat;\nat them you will aim with your bow.", "O Lord, arise in your strength;\nwe shall sing and praise your power."]], ["Deus, Deus meus", ["My God, my God, why have you forsaken me?\nYou are far from my plea and the cry of my distress.", "O my God, I call by day and you give no reply;\nI call by night and I find no peace.", "Yet you, O God, are holy,\nenthroned on the praises of Israel.", "In you our fathers put their trust;\nthey trusted and you set them free.", "When they cried to you, they escaped.\nIn you they trusted and never in vain.", "But I am a worm and no man,\nscorned by men, despised by the people.", "All who see me deride me.\nThey curl their lips, they toss their heads.", "“He trusted in the Lord, let him save him;\nlet him release him if this is his friend.”", "Yes, it was you who took me from the womb,\nentrusted me to my mother’s breast.", "To you I was committed from my birth,\nfrom my mother’s womb you have been my God.", "Do not leave me alone in my distress;\nCome close, there is none else to help.", "Many bulls have surrounded me,\nfierce bulls of Bashan close me in.", "Against me they open wide their jaws,\nlike lions, rending and roaring.", "Like water I am poured out,\ndisjointed are all my bones.\nMy heart has become like wax,\nit is melted within my breast.", "Parched as burnt clay is my throat,\nmy tongue cleaves to my jaws.", "Many dogs have surrounded me,\na band of the wicked beset me.\nThey tear holes in my hands and my feet\nand lay me in the dust of death.", "I can count every one of my bones.\nThese people stare at me and gloat;", "they divide my clothing among them.\nThey cast lots for my robe.", "O Lord, do not leave me alone,\nmy strength, make haste to help me!", "Rescue my soul from the sword,\nmy life from the grip of these dogs.", "Save my life from the jaws of these lions,\nmy poor soul from the horns of these oxen.", "I will tell of your name to my brethren\nand praise you where they are assembled.", "“You who fear the Lord give him praise;\nall sons of Jacob, give him glory.\nRevere him, Israel’s sons.", "For he has never despised\nnor scorned the poverty of the poor.\nFrom him he has not hidden his face,\nbut he heard the poor man when he cried.”", "You are my praise in the great assembly.\nMy vows I will pay before those who fear him.", "The poor shall eat and shall have their fill.\nThey shall praise the Lord, those who seek him.\nMay their hearts live for ever and ever!", "All the earth shall remember and return to the Lord,\nall families of the nations worship before him;", "for the kingdom is the Lord’s, he is ruler of the nations.", "They shall worship him, all the mighty of the earth;\nbefore him shall bow all who go down to the dust.", "And my soul shall live for him, my children serve him.\nThey shall tell of the Lord to generations yet to come,", "declare his faithfulness to peoples yet unborn:\n“These things the Lord has done.”"]], ["Dominus regit me", ["The Lord is my shepherd;\nthere is nothing I shall want.", "Fresh and green are the pastures\nwhere he gives me repose.\nNear restful waters he leads me,", "to revive my drooping spirit.\nHe guides me along the right path;\nhe is true to his name.", "If I should walk in the valley of darkness\nno evil would I fear.\nYou are there with your crook and your staff;\nwith these you give me comfort.", "You have prepared a banquet for me\nin the sight of my foes.\nMy head you have anointed with oil;\nmy cup is overflowing.", "Surely goodness and kindness shall follow me\nall the days of my life.\nIn the Lord’s own house shall I dwell\nfor ever and ever."]], ["Domini est terra", ["The Lord’s is the earth and its fullness,\nthe world and all its peoples.", "It is he who set it on the seas;\non the waters he made it firm.", "Who shall climb the mountain of the Lord?\nWho shall stand in his holy place?", "The man with clean hands and pure heart,\nwho desires not worthless things,\n(who have not sworn so as to deceive their neighbor.)", "He shall receive blessings from the Lord\nand reward from the God who saves him.", "Such are the men who seek him,\nseek the face of the God of Jacob.", "O gates, lift high your heads;\ngrow higher, ancient doors.\nLet him enter, the king of glory!", "Who is the king of glory?\nThe Lord, the mighty, the valiant,\nthe Lord, the valiant in war.", "O gates, lift high your heads;\ngrow higher, ancient doors.\nLet him enter, the king of glory!", "Who is he, the king of glory?\nHe, the Lord of armies,\nhe is the king of glory."]], ["Ad te, Domine, levavi", ["To you, O Lord, I lift up my soul.", "I trust you, let me not be disappointed;\ndo not let my enemies triumph.", "Those who hope in you shall not be disappointed,\nbut only those who wantonly break faith.", "Lord, make me know your ways.\nLord, teach me your paths.", "Make me walk in your truth, and teach me:\nfor you are God my savior.\nIn you I hope all day long\nbecause of your goodness, O Lord.", "Remember your mercy, Lord,\nand the love you have shown from of old.", "Do not remember the sins of my youth.\nIn your love remember me.", "The Lord is good and upright.\nHe shows the path to those who stray,", "He guides the humble in the right path,\nHe teaches his way to the poor.", "His ways are faithfulness and love\nfor those who keep his covenant and law.", "Lord, for the sake of your name\nforgive my guilt, for it is great.", "If anyone fears the Lord\nhe will show him the path he should choose.", "His soul shall live in happiness\nand his children shall possess the land.", "The Lord’s friendship is for those who revere him;\nto them he reveals his covenant.", "My eyes are always on the Lord;\nfor he rescues my feet from the snare.", "Turn to me and have mercy\nfor I am lonely and poor.", "Relieve the anguish of my heart\nand set me free from my distress.", "See my affliction and my toil\nand take all my sins away.", "See how many are my foes;\nhow violent their hatred for me.", "Preserve my life and rescue me.\nDo not disappoint me, you are my refuge.", "May innocence and uprightness protect me:\nfor my hope is in you, O Lord.", "Redeem Israel, O God, from all its distress."]], ["Judica me, Domine", ["Give judgment for me, O Lord:\nfor I walk the path of perfection.\nI trust in the Lord; I have not wavered.", "Examine me, Lord, and try me;\nO test my heart and my mind,", "for your love is before my eyes\nand I walk according to your truth.", "I never take my place with liars\nand with hypocrites I shall not go.", "I hate the evil-doer’s company:\nI will not take my place with the wicked.", "To prove my innocence I wash my hands\nand take my place around your altar,", "singing a song of thanksgiving,\nproclaiming all your wonders.", "O Lord, I love the house where you dwell,\nthe place where your glory abides.", "Do not sweep me away with sinners,\nnor my life with bloodthirsty men", "in whose hands are evil plots,\nwhose right hands are filled with gold.", "As for me, I walk the path of perfection.\nRedeem me and show me your mercy.", "My foot stands on level ground:\nI will bless the Lord in the assembly."]], ["Dominus illuminatio", ["The Lord is my light and my help;\nwhom shall I fear?\nThe Lord is the stronghold of my life;\nbefore whom shall I shrink?", "When evil-doers draw near\nto devour my flesh,\nit is they, my enemies and foes,\nwho stumble and fall.", "Though an army encamp against me\nmy heart would not fear.\nThough war break out against me\neven then would I trust.", "There is one thing I ask of the Lord,\nfor this I long,\nto live in the house of the Lord,\nall the days of my life,\nto savor the sweetness of the Lord,\nto behold his temple.", "For there he keeps me safe in his tent\nin the day of evil.\nHe hides me in the shelter of his tent,\non a rock he sets me safe.", "And now my head shall be raised\nabove my foes who surround me\nand I shall offer within his tent\na sacrifice of joy.\nI will sing and make music for the Lord.", "O Lord, hear my voice when I call;\nhave mercy and answer.", "Of you my heart has spoken:\n“Seek his face.”\nIt is your face, O Lord, that I seek;", "hide not your face.\nDismiss not your servant in anger;\nyou have been my help.\nDo not abandon or forsake me,\nO God my help!", "Though father and mother forsake me,\nthe Lord will receive me.", "Instruct me, Lord, in your way;\non an even path lead me.", "When they lie in ambush protect me\nfrom my enemy’s greed.\nFalse witnesses rise against me,\nbreathing out fury.", "I am sure I shall see the Lord’s goodness\nin the land of the living.", "Hope in him, hold firm and take heart.\nHope in the Lord!"]], ["Ad te Domine", ["To you, O Lord, I call,\nmy rock, hear me.\nIf you do not heed I shall become\nlike those in the grave.", "Hear the voice of my pleading\nas I call for help,\nas I lift up my hands in prayer\nto your holy place.", "Do not drag me away with the wicked,\nwith the evil-doers,\nwho speak words of peace to their neighbors\nbut with evil in their hearts.", "Repay them as their actions deserve\nand the malice of their deeds.\nRepay them for the works of their hands;\ngive them their desserts.", "For they ignore the deeds of the Lord\nand the work of his hands.\n(May he ruin them and never rebuild them.)", "Blessed be the Lord for he has heard\nmy cry, my appeal.", "The Lord is my strength and my shield;\nin him my heart trusts.\nI was helped, my heart rejoices\nand I praise him with my song.", "The Lord is the strength of his people,\na fortress where his anointed find salvation.", "Save your people; bless Israel your heritage.\nBe their shepherd and carry them for ever."]], ["Afferte Domino", ["O give the Lord, you sons of God,\ngive the Lord glory and power;", "give the Lord the glory of his name.\nAdore the Lord in his holy court.", "The Lord’s voice resounding on the waters,\nthe Lord on the immensity of waters;", "the voice of the Lord, full of power,\nthe voice of the Lord, full of splendor.", "The Lord’s voice shattering the cedars,\nthe Lord shatters the cedars of Lebanon;", "he makes Lebanon leap like a calf\nand Sirion like a young wild ox.", "(The Lord’s voice flashes flames of fire.)", "The Lord’s voice shaking the wilderness,\nthe Lord shakes the wilderness of Kadesh;", "the Lord’s voice rending the oak tree\nand stripping the forest bare.\nThe God of glory thunders.", "In his temple they all cry: “Glory!”\nThe Lord sat enthroned over the flood;\nthe Lord sits as king for ever.", "The Lord will give strength to his people,\nthe Lord will bless his people with peace."]], ["Exaltabo te, Domine", ["I will praise you, Lord, you have rescued me\nand have not let my enemies rejoice over me.", "O Lord, I cried to you for help\nand you, my God, have healed me.", "O Lord, you have raised my soul from the dead,\nrestored me to life from those who sink into the grave.", "Sing psalms to the Lord, you who love him,\ngive thanks to his holy name.", "His anger lasts a moment; his favor all through life.\nAt night there are tears, but joy comes with dawn.", "I said to myself in my good fortune:\n“Nothing will ever disturb me.”", "Your favor had set me on a mountain fastness,\nthen you hid your face and I was put to confusion.", "To you, Lord, I cried,\nto my God I made appeal:", "“What profit would my death be, my going to the grave?\nCan dust give you praise or proclaim your truth?", "The Lord listened and had pity.\nThe Lord came to my help.", "For me you have changed my mourning into dancing,\nyou removed my sackcloth and clothed me with joy.", "So my soul sings psalms to you unceasingly.\nO Lord my God, I will thank you for ever."]], ["In te, Domine, speravi", ["In you, O Lord, I take refuge.\nLet me never be put to shame.\nIn your justice, set me free,", "hear me and speedily rescue me.\nBe a rock of refuge for me,\na mighty stronghold to save me,", "for you are my rock, my stronghold.\nFor your name’s sake, lead me and guide me.", "Release me from the snares they have hidden\nfor you are my refuge, Lord.", "Into your hands I commend my spirit.\nIt is you who will redeem me, Lord.", "O God of truth, you detest\nthose who worship false and empty gods.", "As for me, I trust in the Lord:\nlet me be glad and rejoice in your love.\nYou who have seen my affliction\nand taken heed of my soul’s distress,", "have not handed me over to the enemy,\nbut set my feet at large.", "Have mercy on me, O Lord,\nfor I am in distress.\nTears have wasted my eyes,\nmy throat and my heart.", "For my life is spent with sorrow\nand my years with sighs.\nAffliction has broken down my strength\nand my bones waste away.", "In the face of all my foes\nI am a reproach,\nan object of scorn to my neighbors\nand of fear to my friends.\nThose who see me in the street\nrun far away from me.", "I am like a dead man, forgotten,\nlike a thing thrown away.", "I have heard the slander of the crowd,\nfear is all around me,\nas they plot together against me,\nas they plan to take my life.", "But as for me, I trust in you, Lord;\nI say: “You are my God.", "My life is in your hands, deliver me\nfrom the hands of those who hate me.", "Let your face shine on your servant.\nSave me in your love.", "Let me not be put to shame for I call you,\nlet the wicked be shamed!\nLet them be silenced in the grave,", "let lying lips be dumb,\nthat speak haughtily against the just\nwith pride and contempt.”", "How great is the goodness, Lord,\nthat you keep for those who fear you,\nthat you show to those who trust you\nin the sight of men.", "You hide them in the shelter of your presence\nfrom the plotting of men;\nyou keep them safe within your tent\nfrom disputing tongues.", "Blessed be the Lord who has shown me\nthe wonders of his love\nin a fortified city.", "“I am far removed from your sight”\nI said in my alarm.\nYet you heard the voice of my plea\nwhen I cried for help.", "Love the Lord, all you saints.\nHe guards his faithful\nbut the Lord will repay to the full\nthose who act with pride.", "Be strong, let your heart take courage,\nall who hope in the Lord."]], ["Beati quorum", ["Happy the man whose offense is forgiven,\nwhose sin is remitted.", "O happy the man to whom the Lord\nimputes no guilt,\nin whose spirit is no guile.", "I kept it secret and my frame was wasted.\nI groaned all day long,", "for night and day your hand was heavy upon me.\nIndeed my strength was dried up\nas by the summer’s heat.", "But now I have acknowledged my sins;\nmy guilt I did not hide.\nI said: “I will confess\nmy offense to the Lord.”\nAnd you, Lord, have forgiven\nthe guilt of my sin.", "So let every good man pray to you\nin the time of need.\nThe floods of water may reach high\nbut him they shall not reach.", "You are my hiding place, O Lord;\nyou save me from distress.\n(You surround me with cries of deliverance.)", "I will instruct you and teach you\nthe way you should go;\nI will give you counsel\nwith my eye upon you.", "Be not like horse and mule, unintelligent,\nneeding bridle and bit\nelse they will not approach you.", "Many sorrows has the wicked\nbut he who trusts in the Lord,\nloving mercy surrounds him.", "Rejoice, rejoice in the Lord,\nexult, you just!\nO come, ring out your joy,\nall you upright of heart."]], ["Exultate, justi", ["Ring out your joy to the Lord, O you just;\nfor praise is fitting for loyal hearts.", "Give thanks to the Lord upon the harp,\nwith a ten-stringed lute sing him songs.", "O sing him a song that is new,\nplay loudly, with all your skill.", "For the word of the Lord is faithful\nand all his works to be trusted.", "The Lord loves justice and right\nand fills the earth with his love.", "By his word the heavens were made,\nby the breath of his mouth all the stars.", "He collects the waves of the ocean;\nhe stores up the depths of the sea.", "Let all the earth fear the Lord\nall who live in the world revere him.", "He spoke; and it came to be.\nHe commanded; it sprang into being.", "He frustrates the designs of the nations,\nhe defeats the plans of the peoples.", "His own designs shall stand for ever,\nthe plans of his heart from age to age.", "They are happy, whose God is the Lord,\nthe people he has chosen as his own.", "From the heavens the Lord looks forth,\nhe sees all the children of men.", "From the place where he dwells he gazes\non all the dwellers on the earth;", "he who shapes the hearts of them all;\nand considers all their deeds.", "A king is not saved by his army,\nnor a warrior preserved by his strength.", "A vain hope for safety is the horse;\ndespite its power it cannot save.", "The Lord looks on those who revere him,\non those who hope in his love,", "to rescue their souls from death,\nto keep them alive in famine.", "Our soul is waiting for the Lord.\nThe Lord is our help and our shield.", "In him do our hearts find joy.\nWe trust in his holy name.", "May your love be upon us, O Lord,\nas we place all our hope in you."]], ["Benedicam Dominum", ["I will bless the Lord at all times,\nhis praise always on my lips;", "in the Lord my soul shall make its boast.\nThe humble shall hear and be glad.", "Glorify the Lord with me.\nTogether let us praise his name.", "I sought the Lord and he answered me;\nfrom all my terrors he set me free.", "Look towards him and be radiant;\nlet your faces not be abashed.", "This poor man called, the Lord heard him\nand rescued him from all his distress.", "The angel of the Lord is encamped\naround those who revere him, to rescue them.", "Taste and see that the Lord is good.\nHe is happy who seeks refuge in him.", "Revere the Lord, you his saints.\nThey lack nothing, those who revere him.", "Strong lions suffer want and go hungry\nbut those who seek the Lord lack no blessing.", "Come, children, and hear me\nthat I may teach you the fear of the Lord.", "Who is he who longs for life\nand many days, to enjoy his prosperity?", "Then keep your tongue from evil\nand your lips from speaking deceit.", "Turn aside from evil and do good;\nseek and strive after peace.", "The Lord turns his face against the wicked\nto destroy their remembrance from the earth.", "The Lord turns his eyes to the just\nand his ears to their appeal.", "They call and the Lord hears\nand rescues them in all their distress.", "The Lord is close to the broken-hearted;\nthose whose spirit is crushed he will save.", "Many are the trials of the just man\nbut from them all the Lord will rescue him.", "He will keep guard over all his bones,\nnot one of his bones shall be broken.", "Evil brings death to the wicked;\nthose who hate the good are doomed.", "The Lord ransoms the souls of his servants.\nThose who hide in him shall not be condemned."]], ["Judica, Domine", ["O Lord, plead my cause against my foes;\nfight those who fight me.", "Take up your buckler and shield;\narise to help me.", "Take up the javelin and the spear\nagainst those who pursue me.\nO Lord, say to my soul:\n“I am your salvation.”", "Let those who seek my life\nbe shamed and disgraced.\nLet those who plan evil against me\nbe routed in confusion.", "Let them be like chaff before the wind;\nlet God’s angel scatter them.", "Let their path be slippery and dark;\nlet God’s angel pursue them.", "They have hidden a net for me wantonly;\nthey have dug a pit.", "Let ruin fall upon them\nand take them by surprise.\nLet them be caught in the net they have hidden;\nlet them fall into their pit.", "But my soul shall be joyful in the Lord\nand rejoice in his salvation.", "My whole being will say:\n“Lord, who is like you\nwho rescue the weak from the strong\nand the poor from the oppressor?”", "Lying witnesses arise\nand accuse me unjustly.", "They repay me evil for good;\nmy soul is forlorn.", "When they were sick I went into mourning,\nafflicted with fasting.\nMy prayer was ever on my lips,", "as for a brother, a friend.\nI went as though mourning a mother,\nbowed down with grief.", "Now that I am in trouble they gather,\nthey gather and mock me.\nThey take me by surprise and strike me\nand tear me to pieces.", "They provoke me with mockery on mockery\nand gnash their teeth.", "O Lord, how long will you look on?\nCome to my rescue!\nSave my life from these raging beasts,\nmy soul from these lions.", "I will thank you in the great assembly,\namid the throng I will praise you.", "Do not let my lying foes\nrejoice over me.\nDo not let those who hate me unjustly\nwink eyes at each other.", "They wish no peace to the peaceful\nwho live in the land.\nThey make deceitful plots", "and with mouths wide open\ntheir cry against me is: “Yes!\nWe saw you do it!”", "O Lord, you have seen, do not be silent,\ndo not stand afar off!", "Awake, stir to my defense,\nto my cause, O God!", "Vindicate me, Lord, in your justice,\ndo not let them rejoice.", "Do not let them think: “Yes, we have won,\nwe have brought you to an end!”", "Let them be shamed and brought to disgrace\nwho rejoice at my misfortune.\nLet them be covered with shame and confusion\nwho raise themselves against me.", "Let there be joy for those who love my cause.\nLet them say without end:\n“Great is the Lord who delights\nin the peace of his servant.”", "Then my tongue shall speak of your justice,\nand all day long of your praise."]], ["Dixit injustus", ["Sin speaks to the sinner\nin the depths of his heart.\nThere is no fear of God\nbefore his eyes.", "He so flatters himself in his mind\nthat he knows not his guilt.", "In his mouth are mischief and deceit.\nAll wisdom is gone.", "He plots the defeat of goodness\nas he lies on his bed.\nHe has set his foot on evil ways,\nhe clings to what is evil.", "Your love, Lord, reaches to heaven;\nyour truth to the skies.", "Your justice is like God’s mountain,\nyour judgments like the deep.\nTo both man and beast you give protection.", "O Lord, how precious is your love.\nMy God, the sons of men\nfind refuge in the shelter of your wings.", "They feast on the riches of your house;\nthey drink from the stream of your delight.", "In you is the source of life\nand in your light we see light.", "Keep on loving those who know you,\ndoing justice for upright hearts.", "Let the foot of the proud not crush me\nnor the hand of the wicked cast me out.", "See how the evil-doers fall!\nFlung down, they shall never arise."]], ["Noli aemulari", ["Do not fret because of the wicked;\ndo not envy those who do evil,", "for they wither quickly like grass\nand fade like the green of the fields.", "If you trust in the Lord and do good,\nthen you will live in the land and be secure.", "If you find your delight in the Lord,\nhe will grant your heart’s desire", "Commit your life to the Lord,\ntrust in him and he will act,", "so that your justice breaks forth like the light,\nyour cause like the noonday sun.", "Be still before the Lord and wait in patience;\ndo not fret at the man who prospers;\na man who makes evil plots\nto bring down the needy and the poor.", "Calm your anger and forget your rage;\ndo not fret, it only leads to evil.", "For those who do evil shall perish;\nthe patient shall inherit the land.", "A little longer—and the wicked shall have gone.\nLook at his place, he is not there.", "But the humble shall own the land\nand enjoy the fullness of peace.", "The wicked man plots against the just\nand gnashes his teeth against him;", "but the Lord laughs at the wicked\nfor he sees that his day is at hand.", "The sword of the wicked is drawn,\nhis bow is bent to slaughter the upright.", "Their sword shall pierce their own hearts\nand their bows shall be broken to pieces.", "The just man’s few possessions\nare better than the wicked man’s wealth;", "for the power of the wicked shall be broken\nand the Lord will support the just.", "He protects the lives of the upright,\ntheir heritage will last for ever.", "They shall not be put to shame in evil days,\nin time of famine their food shall not fail.", "But all the wicked shall perish\nand all the enemies of the Lord.\nThey are like the beauty of the meadows,\nthey shall vanish, they shall vanish like smoke.", "The wicked man borrows without repaying,\nbut the just man is generous and gives.", "Those blessed by the Lord shall own the land,\nbut those he has cursed shall be destroyed.", "The Lord guides the steps of a man\nand makes safe the path of one he loves.", "Though he stumble he shall never fall\nfor the Lord holds him by the hand.", "I was young and now I am old,\nbut I have never seen the just man forsaken\nnor his children begging for bread.", "All the day he is generous and lends\nand his children become a blessing.", "Then turn away from evil and do good\nand you shall have a home for ever;", "for the Lord loves justice\nand will never forsake his friends.\nThe unjust shall be wiped out for ever\nand the children of the wicked destroyed.", "The just shall inherit the land;\nthere they shall live for ever.", "The just man’s mouth utters wisdom\nand his lips speak what is right;", "the law of his God is in his heart,\nhis steps shall be saved from stumbling.", "The wicked man watches for the just\nand seeks occasion to kill him.", "The Lord will not leave him in his power\nnor let him be condemned when he is judged.", "Then wait for the Lord, keep to his way.\nIt is he who will free you from the wicked,\nraise you up to possess the land\nand see the wicked destroyed.", "I have seen the wicked triumphant,\ntowering like a cedar of Lebanon.", "I passed by again; he was gone.\nI searched; he was nowhere to be found.", "See the just man, mark the upright,\nfor the peaceful man a future lies in store,", "but sinners shall all be destroyed.\nNo future lies in store for the wicked.", "The salvation of the just comes from the Lord,\ntheir stronghold in time of distress.", "The Lord helps them and delivers them\nand saves them: for their refuge is in him."]], ["Domine, ne in furore", ["O Lord, do not rebuke me in your anger;\ndo not punish me, Lord, in your rage.", "Your arrows have sunk deep in me;\nyour hand has come down upon me.", "Through your anger all my body is sick:\nthrough my sin, there is no health in my limbs.", "My guilt towers higher than my head;\nit is a weight too heavy to bear.", "My wounds are foul and festering,\nthe result of my own folly.", "I am bowed and brought to my knees.\nI go mourning all the day long.", "All my frame burns with fever;\nall my body is sick.", "Spent and utterly crushed,\nI cry aloud in anguish of heart.", "O Lord, you know all my longing:\nmy groans are not hidden from you.", "My heart throbs, my strength is spent;\nthe very light has gone from my eyes.", "My friends avoid me like a leper;\nthose closest to me stand afar off.", "Those who plot against my life lay snares;\nthose who seek my ruin speak of harm,\nplanning treachery all the day long.", "But I am like the deaf who cannot hear,\nlike the dumb unable to speak.", "I am like a man who hears nothing\nin whose mouth is no defense.", "I count on you, O Lord:\nit is you, Lord God, who will answer.", "I pray: “Do not let them mock me,\nthose who triumph if my foot should slip.”", "For I am on the point of falling\nand my pain is always before me.", "I confess that I am guilty\nand my sin fills me with dismay.", "My wanton enemies are numberless\nand my lying foes are many.", "They repay me evil for good\nand attack me for seeking what is right.", "O Lord, do not forsake me!\nMy God, do not stay afar off!", "Make haste and come to my help,\nO Lord, my God, my savior!"]], ["Dixi, custodiam", ["I said: “I will be watchful of my ways\nfor fear I should sin with my tongue.\nI will put a curb on my lips\nwhen the wicked man stands before me.”", "I was dumb, silent and still.\nHis prosperity stirred my grief.", "My heart was burning within me.\nAt the thought of it, the fire blazed up\nand my tongue burst into speech:", "“O Lord, you have shown me my end,\nhow short is the length of my days.\nNow I know how fleeting is my life.", "You have given me a short span of days;\nmy life is as nothing in your sight.\nA mere breath, the man who stood so firm,", "a mere shadow, the man passing by;\na mere breath the riches he hoards,\nnot knowing who will have them.”", "And now, Lord, what is there to wait for?\nIn you rests all my hope.", "Set me free from all my sins,\ndo not make me the taunt of the fool.", "I was silent, not opening my lips,\nbecause this was all your doing.", "Take away your scourge from me.\nI am crushed by the blows of your hand.", "You punish man’s sins and correct him;\nlike the moth you devour all he treasures.\nMortal man is no more than a breath;", "O Lord, hear my prayer.\nO Lord, turn your ear to my cry.\nDo not be deaf to my tears.\nIn your house I am a passing guest,\na pilgrim, like all my fathers.", "Look away that I may breathe again\nbefore I depart to be no more."]], ["Expectans, expectavi", ["I waited, I waited for the Lord\nand he stooped down to me;\nhe heard my cry.", "He drew me from the deadly pit,\nfrom the miry clay.\nHe set my feet upon a rock\nand made my footsteps firm.", "He put a new song into my mouth,\npraise of our God.\nMany shall see and fear\nand shall trust in the Lord.", "Happy the man who has placed\nhis trust in the Lord\nand has not gone over to the rebels\nwho follow false gods.", "How many, O Lord my God,\nare the wonders and designs\nthat you have worked for us;\nyou have no equal.\nShould I proclaim and speak of them,\nthey are more than I can tell!", "You do not ask for sacrifice and offerings,\nbut an open ear.\nYou do not ask for holocaust and victim.", "Instead, here am I.\nIn the scroll of the book it stands written", "that I should do your will.\nMy God, I delight in your law\nin the depth of my heart.", "Your justice I have proclaimed\nin the great assembly.\nMy lips I have not sealed;\nyou know it, O Lord.", "I have not hidden your justice in my heart\nbut declared your faithful help.\nI have not hidden your love and your truth\nfrom the great assembly.", "O Lord, you will not withhold\nyour compassion from me.\nYour merciful love and your truth\nwill always guard me.", "For I am beset with evils\ntoo many to be counted.\nMy sins have fallen upon me\nand my sight fails me.\nThey are more than the hairs of my head\nand my heart sinks.", "O Lord, come to my rescue;\nLord, come to my aid.", "O let there be shame and confusion\non those who seek my life.\nO let them turn back in confusion,\nwho delight in my harm.", "Let them be appalled, covered with shame,\nwho jeer at my lot.", "O let there be rejoicing and gladness\nfor all who seek you.\nLet them ever say: “The Lord is great,”\nwho love your saving help.", "As for me, wretched and poor,\nthe Lord thinks of me.\nYou are my rescuer, my help,\nO God, do not delay."]], ["Beatus qui intelligit", ["Happy the man who considers the poor and the weak.\nThe Lord will save him in the day of evil,", "will guard him, give him life, make him happy in the land\nand will not give him up to the will of his foes.", "The Lord will help him on his bed of pain,\nhe will bring him back from sickness to health.", "As for me, I said: “Lord, have mercy on me,\nheal my soul for I have sinned against you.”", "My foes are speaking evil against me.\n“How long before he dies and his name be forgotten?”", "They come to visit me and speak empty words,\ntheir hearts full of malice, they spread it abroad.", "My enemies whisper together against me.\nThey all weigh up the evil which is on me.", "“Some deadly thing has fastened upon him,\nhe will not rise again from where he lies.”", "Thus even my friend, in whom I trusted,\nwho ate my bread, has turned against me.", "But you, O Lord, have mercy on me.\nLet me rise once more and I will repay them.", "By this I shall know that you are my friend,\nif my foes do not shout in triumph over me.", "If you uphold me I shall be unharmed\nand set in your presence for ever more.", "Blessed be the Lord, the God of Israel\nfrom age to age. Amen. Amen."]], ["Quemadmodum", ["Like the deer that yearns\nfor running streams,\nso my soul is yearning\nfor you, my God.", "My soul is thirsting for God,\nthe God of my life;\nwhen can I enter and see\nthe face of God?", "My tears have become my bread,\nby night, by day,\nas I hear it said all the day long:\n“Where is your God?”", "These things will I remember\nas I pour out my soul:\nhow I would lead the rejoicing crowd\ninto the house of God,\namid cries of gladness and thanksgiving,\nthe throng wild with joy.", "Why are you cast down, my soul,\nwhy groan within me?\nHope in God; I will praise him still,\nmy savior and my God.", "My soul is cast down within me\nas I think of you,\nfrom the country of Jordan and Mount Hermon,\nfrom the Hill of Mizar.", "Deep is calling on deep,\nin the roar of waters;\nyour torrents and all your waves\nswept over me.", "By day the Lord will send\nhis loving kindness;\nby night I will sing to him,\npraise the God of my life.", "I will say to God, my rock:\n“Why have you forgotten me?\nWhy do I go mourning\noppressed by the foe?”", "With cries that pierce me to the heart,\nmy enemies revile me,\nsaying to me all day long:\n“Where is your God?”", "Why are you cast down, my soul,\nwhy groan within me?\nHope in God; I will praise him still,\nmy savior and my God."]], ["Judica me, Deus", ["Defend me, O God, and plead my cause\nagainst a godless nation.\nFrom deceitful and cunning men\nrescue me, O God.", "Since you, O God, are my stronghold,\nwhy have you rejected me?\nWhy do I go mourning\noppressed by the foe?", "O send forth your light and your truth;\nlet these be my guide.\nLet them bring me to your holy mountain,\nto the place where you dwell.", "And I will come to the altar of God,\nthe God of my joy.\nMy redeemer, I will thank you on the harp,\nO God, my God.", "Why are you cast down my soul,\nwhy groan within me?\nHope in God; I will praise him still,\nmy savior and my God."]], ["Deus, auribus", ["We heard with our own ears, O God,\nour fathers have told us the story\nof the things you did in their days,\nyou yourself, in days long ago.", "To plant them you uprooted the nations;\nto let them spread you laid peoples low.", "No sword of their own won the land;\nno arm of their own brought them victory.\nIt was your right hand, your arm\nand the light of your face; for you loved them.", "It is you, my king, my God,\nwho granted victories to Jacob.", "Through you we beat down our foes;\nin your name we trampled down our aggressors.", "For it was not in my bow that I trusted\nnor yet was I saved by my sword:", "it was you who saved us from our foes,\nit was you who put our foes to shame.", "All day long our boast was in God\nand we praised your name without ceasing.", "Yet now you have rejected us, disgraced us;\nyou no longer go forth with our armies.", "You make us retreat from the foe\nand our enemies plunder us at will.", "You make us like sheep for the slaughter\nand scatter us among the nations.", "You sell your own people for nothing\nand make no profit by the sale.", "You make us the taunt of our neighbors,\nthe laughing stock of all who are near.", "Among the nations, you make us a byword,\namong the peoples a thing of derision.", "All day long my disgrace is before me;\nmy face is covered with shame", "at the voice of the taunter, the scoffer,\nat the sight of the foe and avenger.", "This befell us though we had not forgotten you,\nthough we had not been false to your covenant,", "though we had not withdrawn our hearts;\nthough our feet had not strayed from your path.", "Yet you have crushed us in a place of sorrows\nand covered us with the shadow of death.", "Had we forgotten the name of our God,\nor stretched out our hands to another god", "would not God have found this out,\nhe who knows the secrets of the heart?", "It is for you that we face death all day long\nand are counted as sheep for the slaughter.", "Awake, O Lord, why do you sleep?\nArise, do not reject us for ever!", "Why do you hide your face\nand forget our oppression and misery?", "For we are brought down low to the dust;\nour body lies prostrate on the earth.", "Stand up and come to our help!\nRedeem us because of your love!"]], ["Eructavit cor meum", ["My heart overflows with noble words.\nTo the king I must speak the song I have made,\nmy tongue as nimble as the pen of a scribe.", "You are the fairest of the children of men\nand graciousness is poured upon your lips:\nbecause God has blessed you for evermore.", "O mighty one, gird your sword upon your thigh;", "in splendor and state, ride on in triumph\nfor the cause of truth and goodness and right.\nTake aim with your bow in your dread right hand.", "Your arrows are sharp, peoples fall beneath you.\nThe foes of the king fall down and lose heart.", "Your throne, O God, shall endure for ever.\nA scepter of justice is the scepter of your kingdom.", "Your love is for justice; your hatred for evil.\nTherefore God, your God, has anointed you\nwith the oil of gladness above other kings:", "your robes are fragrant with aloes and myrrh.\nFrom the ivory palace you are greeted with music.", "The daughters of kings are among your loved ones.\nOn your right stands the queen in gold of Ophir.", "Listen, O daughter, give ear to my words:\nforget your own people and your father’s house.", "So will the king desire your beauty:\nHe is your lord, pay homage to him.", "And the people of Tyre shall come with gifts,\nthe richest of the people shall seek your favor.", "The daughter of the king is clothed with splendor,\nher robes embroidered with pearls set in gold.", "She is led to the king with her maiden companions.", "They are escorted amid gladness and joy;\nthey pass within the palace of the king.", "Sons shall be yours in place of your fathers:\nyou will make them rulers over all the earth.", "May this song make your name for ever remembered.\nMay the peoples praise you from age to age."]], ["Deus noster refugium", ["God is for us a refuge and strength,\na helper close at hand, in time of distress,", "so we shall not fear though the earth should rock,\nthough the mountains fall into the depths of the sea;", "even though its waters rage and foam,\neven though the mountains be shaken by its waves.\nThe Lord of hosts is with us:\nthe God of Jacob is our stronghold.", "The waters of a river give joy to God’s city,\nthe holy place where the Most High dwells.", "God is within, it cannot be shaken;\nGod will help it at the dawning of the day.", "Nations are in tumult, kingdoms are shaken:\nhe lifts his voice, the earth shrinks away.", "The Lord of hosts is with us:\nthe God of Jacob is our stronghold.", "Come, consider the works of the Lord,\nthe redoubtable deeds he has done on the earth.", "He puts an end to wars over all the earth;\nthe bow he breaks, the spear he snaps.\n(He burns the shields with fire.)", "“Be still and know that I am God,\nsupreme among the nations, supreme on the earth!”", "The Lord of hosts is with us:\nthe God of Jacob is our stronghold."]], ["Omnes gentes, plaudite", ["All peoples, clap your hands,\ncry to God with shouts of joy!", "For the Lord, the Most High, we must fear,\ngreat king over all the earth.", "He subdues peoples under us\nand nations under our feet.", "Our inheritance, our glory, is from him,\ngiven to Jacob out of love.", "God goes up with shouts of joy;\nthe Lord goes up with trumpet blast.", "Sing praise for God, sing praise,\nsing praise to our king, sing praise.", "God is king of all the earth,\nsing praise with all your skill.", "God is king over the nations;\nGod reigns on his holy throne.", "The princes of the people are assembled\nwith the people of Abraham’s God.\nThe rulers of the earth belong to God,\nto God who reigns over all."]], ["Magnus Dominus", ["The Lord is great and worthy to be praised\nin the city of our God.", "His holy mountain rises in beauty,\nthe joy of all the earth.\nMount Zion, true pole of the earth,\nthe Great King’s city!", "God, in the midst of its citadels,\nhas shown himself its stronghold.", "For the kings assembled together,\ntogether they advanced.", "They saw; at once they were astounded;\ndismayed, they fled in fear.", "A trembling seized them there,\nlike the pangs of birth.", "By the east wind you have destroyed\nthe ships of Tarshish.", "As we have heard, so we have seen\nin the city of our God,\nin the city of the Lord of hosts\nwhich God upholds for ever.", "O God, we ponder your love\nwithin your temple.", "Your praise, O God, like your name\nreaches the ends of the earth.\nWith justice your right hand is filled.", "Mount Zion rejoices;\nthe people of Judah rejoice\nat the sight of your judgments.", "Walk through Zion, walk all round it;\ncount the number of its towers.", "Review all its ramparts,\nexamine its castles,\nthat you may tell the next generation", "that such is our God,\nour God for ever and always.\nIt is he who leads us."]], ["Audite haec, omnes", ["Hear this, all you peoples,\ngive heed, all who dwell in the world,", "men both high and low,\nrich and poor alike!", "My lips will speak words of wisdom.\nMy heart is full of insight.", "I will turn my mind to a parable,\nwith the harp I will solve my problem.", "Why should I fear in evil days\nthe malice of the foes who surround me,", "men who trust in their wealth,\nand boast of the vastness of their riches?", "For no man can buy his own ransom,\nor pay a price to God for his life.", "The ransom of his soul is beyond him.", "He cannot buy life without end,\nnor avoid coming to the grave.", "He knows that wise men and fools must both perish\nand must leave their wealth to others.", "Their graves are their homes for ever,\ntheir dwelling place from age to age,\nthough their names spread wide through the land.", "In his riches, man lacks wisdom;\nhe is like the beasts that are destroyed.", "This is the lot of those who trust in themselves,\nwho have others in their beck and call.", "Like sheep they are driven to the grave,\nwhere death shall be their shepherd\nand the just shall become their rulers.\nWith the morning their outward show vanishes\nand the grave becomes their home.", "But God will ransom me from death\nand take my soul to himself.", "Then do not fear when a man grows rich,\nwhen the glory of his house increases.", "He takes nothing with him when he dies,\nhis glory does not follow him below.", "Though he flattered himself while he lived:\n“Men will praise me for all my success,”", "yet he will go to join his fathers,\nand will never see the light any more.", "In his riches, man lacks wisdom;\nhe is like the beasts that are destroyed."]], ["Deus deorum", ["The God of gods, the Lord,\nhas spoken and summoned the earth,\nfrom the rising of the sun to its setting.", "Out of Zion’s perfect beauty he shines.", "(Our God comes, he keeps silence no longer.)\nBefore him fire devours,\naround him tempest rages.", "He calls on the heavens and the earth\nto witness his judgment of his people.", "“Summon before me my people\nwho made covenant with me by sacrifice.”", "The heavens proclaim his justice,\nfor he, God, is the judge.", "“Listen, my people, I will speak;\nIsrael, I will testify against you,\nfor I am God, your God.\nI accuse you, lay the charge before you.", "I find no fault with your sacrifices,\nyour offerings are always before me.", "I do not ask more bullocks from your farms,\nnor goats from among your herds.", "For I own all the beasts of the forest,\nbeasts in their thousands on my hills.", "I know all the birds in the sky,\nall that moves in the field belongs to me.", "Were I hungry, I would not tell you,\nfor I own the world and all it holds.", "Do you think I eat the flesh of bulls,\nor drink the blood of goats?", "Pay your sacrifice of thanksgiving to God\nand render him your votive offerings.", "Call on me in the day of distress.\nI will free and you shall honor me.”", "(But God says to the wicked:)\n“But how can you recite my commandments\nand take my covenant on your lips,", "you who despise my law\nand throw my words to the winds,", "you who see a thief and go with him;\nwho throw in your lot with adulterers,", "who unbridle your mouth for evil\nand whose tongue is plotting crime,", "you who sit and malign your brother\nand slander your own mother’s son.", "You do this, and should I keep silence?\nDo you think that I am like you?", "Mark this, you who never think of God,\nlest I seize you and you cannot escape;", "a sacrifice of thanksgiving honors me\nand I will show God’s salvation to the upright.”"]], ["Miserere mei, Deus", ["Have mercy on me, God, in your kindness.\nIn your compassion blot out my offense.", "O wash me more and more from my guilt\nand cleanse me from my sin.", "My offenses truly I know them;\nmy sin is always before me.", "Against you, you alone, have I sinned;\nwhat is evil in your sight I have done.\nThat you may be justified when you give sentence\nand be without reproach when you judge,", "O see, in guilt I was born,\na sinner was I conceived.", "Indeed you love truth in the heart;\nthen in the secret of my heart teach me wisdom.", "O purify me, then I shall be clean;\nO wash me, I shall be whiter than snow.", "Make me hear rejoicing and gladness,\nthat the bones you have crushed may thrill.", "From my sins turn away your face\nand blot out all my guilt.", "A pure heart create for me, O God,\nput a steadfast spirit within me.", "Do not cast me away from your presence,\nnor deprive me of your holy spirit.", "Give me again the joy of your help;\nwith a spirit of fervor sustain me,", "that I may teach transgressors your ways\nand sinners may return to you.", "O rescue me, God, my helper,\nand my tongue shall ring out your goodness.", "O Lord, open my lips\nand my mouth shall declare your praise.", "For in sacrifice you take no delight,\nburnt offering from me you would refuse,", "my sacrifice, a contrite spirit,\na humbled, contrite heart you will not spurn.", "In your goodness, show favor to Zion:\nrebuild the walls of Jerusalem.", "Then you will be pleased with lawful sacrifice,\n(burnt offerings wholly consumed),\nthen you will be offered young bulls on your altar."]], ["Quid gloriaris?", ["Why do you boast of your wickedness,\nyou champion of evil,", "planning ruin all day long,\n(your tongue like a sharpened razor),\nyou master of deceit?", "You love evil more than good,\nlies more than truth.", "You love the destructive word,\nyou tongue of deceit.", "For this God will destroy you\nand remove you for ever.\nHe will snatch you from your tent and uproot you\nfrom the land of the living.", "The just shall see and fear.\nThey shall laugh and say:", "“So this is the man who refused\nto take God as a stronghold,\nbut trusted in the greatness of his wealth\nand grew powerful by his crimes.”", "But I am like a growing olive tree\nin the house of God.\nI trust in the goodness of God\nfor ever and ever.", "I will thank you for evermore;\nfor this is your doing.\nI will proclaim that your name is good,\nin the presence of your friends."]], ["Dixit insipiens", ["The fool has said in his heart:\n“There is no God above.”\nTheir deeds are corrupt, depraved;\nnot a good man is left.", "God looks down from heaven\non the sons of men\nto see if any are wise,\nif any seek God.", "All have left the right path;\ndepraved, every one;\nThere is not a good man left,\nno, not even one.", "Will the evil-doers not understand?\nThey eat up my people\nas though they were eating bread;\nthey never pray to God.", "See how they tremble with fear\nwithout cause for fear,\nfor God scatters the bones of the wicked.\nThey are shamed, God rejects them.", "O that Israel’s salvation might come from Zion!\nWhen God delivers his people from bondage,\nthen Jacob will be glad and Israel rejoice."]], ["Deus, in nomine", ["O God, save me by your name;\nby your power, uphold my cause.", "O God, hear my prayer;\nlisten to the words of my mouth.", "For proud men have risen against me,\nruthless men seek my life.\nThey have no regard for God.", "But I have God for my help.\nThe Lord upholds my life.", "Let the evil recoil upon my foes;\nyou who are faithful, destroy them.", "I will sacrifice to you with willing heart\nand praise your name for it is good:", "for you have rescued me from all distress\nand my eyes have seen the downfall of my foes."]], ["Exaudi, Deus", ["O God, listen to my prayer,\ndo not hide from my pleading,", "attend to me and reply;\nwith my cares, I cannot rest.", "I tremble at the shouts of the foe,\nat the cries of the wicked;\nfor they bring down evil upon me.\nThey assail me with fury.", "My heart is stricken within me,\ndeath’s terror is on me,", "trembling and fear fall upon me\nand horror overwhelms me.", "O that I had wings like a dove\nto fly away and be at rest.", "So I would escape far away\nand take refuge in the desert.", "I would hasten to find a shelter\nfrom the raging wind,\nfrom the destructive storm, O Lord,", "and from their plotting tongues.\nFor I can see nothing\nbut violence and strife in the city.", "Night and day they patrol\nhigh on the city walls.\nIt is full of wickedness and evil;", "it is full of sin.\nIts streets are never free\nfrom tyranny and deceit.", "If this had been done by an enemy\nI could bear his taunts.\nIf a rival had risen against me,\nI could hide from him.", "But it is you, my own companion,\nmy intimate friend!", "(How close was the friendship between us.)\nWe talked together in harmony\nin the house of God.", "May death fall suddenly upon them!\nLet them go to the grave;\nfor wickedness dwells in their homes\nand deep in their hearts.", "As for me, I will cry to God\nand the Lord will save me.", "Evening, morning and at noon\nI will cry and lament.", "He will deliver my soul in peace\nin the attack against me;\nfor those who fight me are many,\nbut he hears my voice.", "God will hear and will humble them,\nthe eternal judge;\nfor they will not amend their ways.\nThey have no fear of God.", "The traitor has turned against his friends;\nhe has broken his word.", "His speech is softer than butter,\nbut war is in his heart,\nHis words are smoother than oil,\nbut they are naked swords.", "Entrust your cares to the Lord\nand he will support you.\nHe will never allow\nthe just man to stumble.", "But you, O God, will bring them down\nto the pit of death.\nDeceitful and bloodthirsty men\nshall not live half their days.\nO Lord, I will trust in you."]], ["Miserere mei, Deus", ["Have mercy on me, God, men crush me;\nthey fight me all day long and oppress me.", "My foes crush me all day long,\nfor many fight proudly against me.", "When I fear, I will trust in you,", "in God, whose word I praise.\nIn God I trust, I shall not fear;\nwhat can mortal man do to me?", "All day long they distort my words,\nall their thought is to harm me.", "They band together in ambush,\ntrack me down and seek my life.", "Repay them, God, for their crimes;\nin your anger, cast down the peoples.", "You have kept an account of my wanderings;\nyou have kept a record of my tears;\n(are they not written in your book?)", "Then my foes will be put to flight\non the day that I call to you.\nThis I know, that God is on my side.", "In God, whose word I praise,\n(in the Lord whose word I praise,)", "in God I trust; I shall not fear;\nwhat can mortal man do to me?", "I am bound by the vows I have made you.\nO God, I will offer you praise", "for you have rescued my soul from death,\nyou kept my feet from stumbling\nthat I may walk in the presence of God\nand enjoy the light of the living."]], ["Miserere mei, Deus", ["Have mercy on me, God, have mercy\nfor in you my soul has taken refuge.\nIn the shadow of your wings I take refuge\ntill the storms of destruction pass by.", "I call to you God the Most High,\nto you who have always been my help.", "May you send from heaven and save me\nand shame those who assail me.\nO God, send your truth and your love.", "My soul lies down among lions,\nwho would devour the sons of men.\nTheir teeth are spears and arrows,\ntheir tongue a sharpened sword.", "O God, arise above the heavens;\nmay your glory shine on earth!", "They laid a snare for my steps,\nmy soul was bowed down.\nThey dug a pit in my path\nbut fell in it themselves.", "My heart is ready, O God,\nmy heart is ready.\nI will sing, I will sing your praise.", "Awake, my soul;\nawake, lyre and harp,\nI will awake the dawn.", "I will thank you, Lord, among the peoples,\namong the nations I will praise you", "for your love reaches to the heavens\nand your truth to the skies.", "O God, arise above the heavens;\nmay your glory shine on earth."]], ["Si vere utique", ["Do you truly speak justice, you who hold divine power?\nDo you mete out fair judgment to the sons of men?", "No, in your hearts you devise injustice;\nyour hands deal out violence to the land.", "In their wickedness they have gone astray from their birth;\nthey wandered among lies as soon as they were born.", "Their venom is like the venom of the snake;\nthey are heedless as the adder that turns a deaf ear", "lest it should catch the snake-charmer’s voice,\nthe voice of the skillful dealer in spells.", "O God, break the teeth in their mouths,\ntear out the fangs of these wild beasts, O Lord!", "Let them vanish like water that runs away;\nlet them wither like grass that is trodden under foot:", "let them be like the snail that dissolves into slime;\nlike a woman’s miscarriage that never sees the sun.", "Before they put forth thorns, like a bramble,\nlet them be swept away, green wood or dry!", "The just shall rejoice at the
