<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Run the Way</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>

<body>
<canvas id="screen" aria-label="Run the Way"></canvas>
<script>
"use strict";
// Run the Way: the saints of Psalter Runner race a demon through the seven
// mansions of St. Teresa's Interior Castle. Slopes speed them up and slow them
// down, ramps throw them into the sky, springs bounce them onto roads of cloud,
// rails carry them grinding, and loops take them round, if they are fast
// enough. In the air, swipes are tricks; land on your feet for style and speed.
// Verses about running go by on a ticker at the foot of the screen.
// One file, nothing to load. Left half of the screen: tap to jump, hold to
// float. Right half: hold to run faster, the longer the faster. Anywhere, in
// the air: swipe for tricks. Keys: Space / Up / W to jump, Right / D to run
// faster, arrows in the air for tricks, P or Esc to pause, M for sound.
//
// The screen, the words, the music and the saints come from Psalter Runner
// (psalter-runner/index.html); the run itself is new.
const flat = (v) => v.replace(/\n/g, " ");
// ---- The screen -----------------------------------------------------------------
// A 320 x 180 picture, scaled up with hard edges, as a 16-bit console would.
const W = 320, H = 180;
// The picture is still laid out on a 320 x 180 grid, and the art keeps its
// big square pixels; but the canvas itself is finer (R times), so words
// come out smooth and easy to read.
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0, R = 3;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  R = clamp(Math.round(scale * (window.devicePixelRatio || 1)), 2, 4);
  cv.width = W * R; cv.height = H * R;
  ctx.imageSmoothingEnabled = false;
  const w = Math.floor(W * scale), h = Math.floor(H * scale);
  offX = Math.floor((innerWidth - w) / 2); offY = Math.floor((innerHeight - h) / 2);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.style.left = offX + "px"; cv.style.top = offY + "px";
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
addEventListener("resize", resize); resize();
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// ---- Words ---------------------------------------------------------------------
// Clear type, drawn at the canvas's full resolution: a friendly sans-serif
// for the game's own words, a book serif for the psalms.
const SANS = "'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif";
const SERIF = "Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif";
const fontOf = (size, serif) => (serif ? "italic 600 " : "700 ") + size + "px " + (serif ? SERIF : SANS);
function measure(str, size, serif) { ctx.save(); ctx.font = fontOf(size, serif); const w = ctx.measureText(str).width; ctx.restore(); return w; }
function text(str, x, y, o) {
  o = o || {};
  const size = o.size || 8, color = o.color || "#ffffff", edge = o.edge === undefined ? "#140c1c" : o.edge;
  ctx.save();
  ctx.font = fontOf(size, o.serif);
  ctx.textAlign = o.align || "left"; ctx.textBaseline = "top";
  if (edge) { ctx.lineJoin = "round"; ctx.lineWidth = Math.max(1.6, size / 4.5); ctx.strokeStyle = edge; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width;
  ctx.restore();

}
function wrapText(str, size, width, serif) {
  const words = flat(str).split(" "), lines = []; let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (measure(t, size, serif) > width && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}

// ---- Music and sound ----------------------------------------------------------------
// The sound of the 16-bit consoles and the Commodore 64, made in the browser:
// pulse waves whose width sweeps, a resonant filter on a sawtooth for the
// bass, a stepped triangle, drums of noise. The techniques are Tim Follin's:
// chords played as one voice switching notes fifty times a second, so the
// ear hears the whole chord shimmer; trills, bends and late vibrato on the
// lead; an echo that is the music repeating itself a little later; and a
// lift into a new key. Every stage has its own song, built on one of the
// Gregorian psalm tones and set to the scene: peaceful by the river, in
// heaven and in the dream; driving in the wind and on the mountain;
// dangerous over the fire and among the teeth.
const Snd = (() => {
  let ac = null, master, musicGain, sfxGain, reverbSend, echoIn, echoDelay, noise, metal;
  const waves = {};
  let on = true, song = null, pending = null, wanted = null;
  let gridTime = 0, step = 0, SIX = 0.1, leadIndex = 0, lastLead = null;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    ac = new A();
    master = ac.createGain(); master.gain.value = on ? 0.8 : 0;
    const limiter = ac.createDynamicsCompressor();
    limiter.threshold.value = -4; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.002; limiter.release.value = 0.1;
    master.connect(limiter).connect(ac.destination);
    const squeeze = ac.createDynamicsCompressor();
    squeeze.threshold.value = -14; squeeze.knee.value = 10; squeeze.ratio.value = 3; squeeze.attack.value = 0.005; squeeze.release.value = 0.2;
    squeeze.connect(master);
    musicGain = ac.createGain(); musicGain.gain.value = 0.55; musicGain.connect(squeeze);
    sfxGain = ac.createGain(); sfxGain.gain.value = 2.2; sfxGain.connect(master);
    // A stone church: a long, soft reverb made from decaying noise.
    const reverb = ac.createConvolver(), len = ac.sampleRate * 3, imp = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = imp.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
    reverb.buffer = imp; reverbSend = ac.createGain(); reverbSend.gain.value = 0.5; reverbSend.connect(reverb); reverb.connect(master);
    const room = ac.createGain(); room.gain.value = 0.2; sfxGain.connect(room).connect(reverbSend);
    // The echo: the music repeating itself a dotted eighth later, darker each time.
    echoIn = ac.createGain(); echoDelay = ac.createDelay(2);
    const fb = ac.createGain(); fb.gain.value = 0.38; const dark = ac.createBiquadFilter(); dark.type = "lowpass"; dark.frequency.value = 2600;
    const wet = ac.createGain(); wet.gain.value = 0.45;
    echoIn.connect(echoDelay); echoDelay.connect(dark).connect(fb).connect(echoDelay); echoDelay.connect(wet).connect(musicGain);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // The consoles' short noise: a 93-step pattern from a shift register, for the hats.
    metal = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const md = metal.getChannelData(0); let reg = 1;
    for (let i = 0; i < md.length; i++) { if (i % 3 === 0) { const bit = (reg ^ (reg >> 6)) & 1; reg = (reg >> 1) | (bit << 14); } md[i] = reg & 1 ? 0.8 : -0.8; }
    if (wanted) { const w = wanted; wanted = null; play(w); }
  }
  function toggle() { on = !on; if (master) master.gain.setTargetAtTime(on ? 0.8 : 0, ac.currentTime, 0.05); save.sound = on; store(); }

  // ---- The instruments ----
  function pulseWave(duty) {
    const k = "p" + duty; if (waves[k]) return waves[k];
    const n = 48, re = new Float32Array(n + 1), im = new Float32Array(n + 1);
    for (let h = 1; h <= n; h++) re[h] = (2 * Math.sin(Math.PI * h * duty)) / (Math.PI * h);
    return (waves[k] = ac.createPeriodicWave(re, im));
  }
  function triWave() {
    if (waves.tri) return waves.tri;
    const N = 512, n = 32, re = new Float32Array(n + 1), im = new Float32Array(n + 1), w = [];
    for (let i = 0; i < N; i++) { const x = i / N, tri = x < 0.5 ? 4 * x - 1 : 3 - 4 * x; w.push(Math.round(tri * 7.5 + 7.5) / 7.5 - 1); }
    for (let h = 1; h <= n; h++) { let a = 0, b = 0; for (let i = 0; i < N; i++) { a += w[i] * Math.cos((2 * Math.PI * h * i) / N); b += w[i] * Math.sin((2 * Math.PI * h * i) / N); } re[h] = (2 * a) / N; im[h] = (2 * b) / N; }
    return (waves.tri = ac.createPeriodicWave(re, im));
  }
  const env = (g, t, level, attack, hold, release) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(level, t + attack); g.gain.setValueAtTime(level, t + Math.max(attack, hold)); g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(attack, hold) + release); };
  // A swept pulse: a sawtooth minus itself a moment later, the moment moving slowly.
  function sweptPulse(t, midi, rate, out) {
    const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.setValueAtTime(mtof(midi), t);
    const period = 1 / mtof(midi), d = ac.createDelay(0.05); d.delayTime.setValueAtTime(period * 0.5, t);
    const lfo = ac.createOscillator(); lfo.frequency.value = rate; const depth = ac.createGain(); depth.gain.value = period * 0.3;
    lfo.connect(depth).connect(d.delayTime);
    const inv = ac.createGain(); inv.gain.value = -1;
    o.connect(out); o.connect(d).connect(inv).connect(out); lfo.start(t);
    return { o, lfo };
  }
  // Follin's chords: one voice switching notes `rate` times a second.
  function arpChord(t, dur, notes, o) {
    o = o || {};
    const osc = ac.createOscillator();
    if (o.tri) osc.setPeriodicWave(triWave()); else osc.setPeriodicWave(pulseWave(o.duty || 0.25));
    const every = 1 / (o.rate || 50); let k = 0;
    for (let at = t; at < t + dur; at += every, k++) osc.frequency.setValueAtTime(mtof(notes[k % notes.length]), at);
    const g = ac.createGain(); env(g, t, o.vol || 0.06, o.attack || 0.004, dur - (o.release || 0.03), o.release || 0.03);
    if (o.cutoff) { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.cutoff; osc.connect(f).connect(g); } else osc.connect(g);
    g.connect(musicGain);
    if (o.echo) { const e = ac.createGain(); e.gain.value = o.echo; g.connect(e).connect(echoIn); }
    if (o.verb) { const v = ac.createGain(); v.gain.value = o.verb; g.connect(v).connect(reverbSend); }
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  // The filter bass: a sawtooth through a resonant filter that snaps shut.
  function filterBass(midi, t, length, accent, bright) {
    const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.setValueAtTime(mtof(midi), t);
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.Q.value = accent ? 9 : 6;
    f.frequency.setValueAtTime((accent ? 1500 : 950) * (bright || 1), t); f.frequency.exponentialRampToValueAtTime(170, t + length);
    const g = ac.createGain(); g.gain.setValueAtTime(accent ? 0.4 : 0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t + length * 0.96);
    o.connect(f).connect(g).connect(musicGain); o.start(t); o.stop(t + length + 0.02);
  }
  function triBass(midi, t, length, level) {
    const o = ac.createOscillator(); o.setPeriodicWave(triWave()); o.frequency.setValueAtTime(mtof(midi), t);
    const g = ac.createGain(); env(g, t, level || 0.28, 0.004, length * 0.8, length * 0.2 + 0.02);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + length + 0.05);
  }
  // A lead note: bent in from below or trilled, with late vibrato, into the echo.
  function lead(t, dur, midi, o) {
    o = o || {};
    const out = ac.createGain(), f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.cutoff || 5200;
    const g = ac.createGain(); env(g, t, o.vol || 0.1, 0.008, dur * 0.85, dur * 0.15 + 0.06);
    out.connect(f).connect(g).connect(musicGain);
    const e = ac.createGain(); e.gain.value = o.echo === undefined ? 0.35 : o.echo; g.connect(e).connect(echoIn);
    if (o.verb) { const v = ac.createGain(); v.gain.value = o.verb; g.connect(v).connect(reverbSend); }
    const v = sweptPulse(t, midi, o.sweep || 3, out), osc = v.o;
    if (o.glideFrom) { osc.frequency.setValueAtTime(mtof(o.glideFrom), t); osc.frequency.exponentialRampToValueAtTime(mtof(midi), t + 0.1); }
    else if (o.trill) { for (let k = 0, at = t; at < t + Math.min(dur * 0.55, 0.3); at += 0.035, k++) osc.frequency.setValueAtTime(mtof(k % 2 ? o.trill : midi), at); osc.frequency.setValueAtTime(mtof(midi), t + Math.min(dur * 0.55, 0.3)); }
    else if (o.bend) { osc.frequency.setValueAtTime(mtof(midi - o.bend), t); osc.frequency.exponentialRampToValueAtTime(mtof(midi), t + 0.05); }
    if (dur > 0.25) { const vib = ac.createOscillator(); vib.frequency.value = o.vibRate || 5.5; const amt = ac.createGain(); amt.gain.setValueAtTime(0, t); amt.gain.setValueAtTime(0, t + Math.min(0.22, dur * 0.4)); amt.gain.linearRampToValueAtTime(o.vibDepth || 14, t + Math.min(0.5, dur * 0.8)); vib.connect(amt).connect(osc.detune); vib.start(t); vib.stop(t + dur + 0.3); }
    osc.start(t); osc.stop(t + dur + 0.35); v.lfo.stop(t + dur + 0.35);
  }
  function kick(t, level) { const o = ac.createOscillator(); o.setPeriodicWave(triWave()); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.07); const g = ac.createGain(); g.gain.setValueAtTime(level || 0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.22); }
  function noiseHit(t, type, freq, level, length, out, buf) { const s = ac.createBufferSource(); s.buffer = buf || noise; const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = ac.createGain(); g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(0.001, t + length); s.connect(f).connect(g).connect(out || musicGain); s.start(t, Math.random() * 0.5); s.stop(t + length + 0.02); }
  function snare(t, level) { noiseHit(t, "bandpass", 1900, (level || 1) * 0.3, 0.17); const o = ac.createOscillator(); o.setPeriodicWave(triWave()); o.frequency.setValueAtTime(230, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.06); const g = ac.createGain(); g.gain.setValueAtTime((level || 1) * 0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08); o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.1); }
  const hat = (t, open, level) => noiseHit(t, "highpass", 7000, level || (open ? 0.07 : 0.045), open ? 0.14 : 0.035, musicGain, metal);
  const crash = (t) => { noiseHit(t, "highpass", 4000, 0.11, 0.9); noiseHit(t, "highpass", 4000, 0.05, 1.2, reverbSend); };
  function tom(t, freq, level) { const o = ac.createOscillator(); o.setPeriodicWave(triWave()); o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + 0.12); const g = ac.createGain(); g.gain.setValueAtTime(level || 0.42, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16); o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.18); }
  function bell(t, base, level) { for (const [r, a, d] of [[0.5, 0.6, 3], [1, 1, 2.2], [1.2, 0.5, 1.6], [1.5, 0.4, 1.4], [2, 0.5, 1.2], [2.5, 0.25, 0.9], [3, 0.2, 0.7]]) { const o = ac.createOscillator(); o.frequency.value = base * r; const g = ac.createGain(); g.gain.setValueAtTime(level * a, t); g.gain.exponentialRampToValueAtTime(0.0005, t + d); o.connect(g); g.connect(musicGain); g.connect(reverbSend); o.start(t); o.stop(t + d + 0.05); } }

  // ---- The modes and the psalm tones ----
  // The eight church modes, as scales above their final.
  const MODES = { 1: [0, 2, 3, 5, 7, 9, 10], 3: [0, 1, 3, 5, 7, 8, 10], 5: [0, 2, 4, 5, 7, 9, 11], 7: [0, 2, 4, 5, 7, 9, 10] };
  // The psalm tones, each a short melody: intonation, reciting note, cadence.
  const TONES = {
    t1: [65, 67, 69, 69, 69, 71, 69, 67, 69, 69, 69, 67, 65, 64, 62],
    t2: [60, 62, 65, 65, 65, 64, 65, 62, 65, 65, 65, 64, 62, 60, 62],
    t3: [67, 69, 72, 72, 72, 74, 71, 72, 72, 72, 69, 72, 71, 69, 64],
    t4: [69, 67, 69, 69, 69, 71, 69, 67, 69, 69, 69, 67, 69, 65, 64],
    t5: [65, 69, 72, 72, 72, 74, 72, 72, 72, 72, 69, 72, 70, 72, 69],
    t6: [65, 67, 69, 69, 69, 67, 69, 65, 67, 69, 69, 69, 67, 65, 65],
    t7: [72, 71, 72, 74, 74, 74, 76, 74, 74, 74, 76, 74, 72, 71, 69],
    t8: [67, 69, 72, 72, 72, 74, 72, 72, 72, 72, 71, 72, 69, 67, 67],
    tp: [69, 71, 69, 69, 69, 67, 69, 69, 67, 67, 67, 65, 67, 64, 62],
  };
  // Every song: tempo; mode and final; four chord progressions (degrees of
  // the mode, one chord a bar); and how each part plays.
  //   drums: none, soft, half, drive, march, fire, tick
  //   bass: tri, walk, filter, march;  chords: gate, pad, box;  lead: bright, deep
  //   extra: wind, danger, bells, water, quake, brass
  const SONGS = {
    title:    { bpm: 96,  mode: 7, final: 67, tone: "t8", prog: [[0, 3, 4, 0], [0, 6, 3, 4]], drums: "none", bass: "tri", chords: "pad", lead: "deep", extra: ["bells"] },
    alley:    { bpm: 92,  mode: 3, final: 64, tone: "t3", prog: [[0, 1, 0, 6], [0, 5, 1, 0]], drums: "half", bass: "walk", chords: "pad", lead: "deep", cutoff: 1400, extra: ["creep"] },
    river:    { bpm: 104, mode: 5, final: 65, tone: "t6", prog: [[0, 3, 4, 0], [0, 5, 3, 4]], drums: "soft", bass: "tri", chords: "gate", gate: 1, lead: "bright", calm: true, extra: ["water"] },
    desert:   { bpm: 138, mode: 1, final: 62, tone: "t1", prog: [[0, 6, 5, 6], [0, 3, 4, 0]], drums: "drive", bass: "filter", fig: 0, chords: "gate", gate: 0, lead: "bright", lift: 2, extra: ["wind"] },
    abyss:    { bpm: 154, mode: 3, final: 64, tone: "t4", prog: [[0, 1, 0, 1], [0, 6, 1, 0]], drums: "fire", bass: "filter", fig: 2, chords: "gate", gate: 2, duty: 0.125, lead: "bright", trills: true, extra: ["danger"] },
    kings:    { bpm: 116, mode: 1, final: 62, tone: "t2", prog: [[0, 5, 6, 4], [0, 3, 6, 0]], drums: "march", bass: "march", chords: "pad", lead: "deep", extra: ["brass"] },
    heaven:   { bpm: 78,  mode: 5, final: 65, tone: "t5", prog: [[0, 3, 4, 0], [5, 3, 0, 4]], drums: "none", bass: "tri", chords: "pad", lead: "deep", bright: true, extra: ["bells", "water"] },
    mountain: { bpm: 132, mode: 1, final: 62, tone: "t7", prog: [[0, 6, 3, 4], [0, 5, 6, 4]], drums: "drive", bass: "filter", fig: 1, chords: "gate", gate: 0, lead: "bright", lift: 2, extra: ["quake"] },
    flames:   { bpm: 162, mode: 3, final: 64, tone: "t8", prog: [[0, 1, 6, 1], [0, 3, 1, 0]], drums: "fire", bass: "filter", fig: 2, chords: "gate", gate: 2, duty: 0.125, lead: "bright", trills: true, extra: ["danger"] },
    foes:     { bpm: 144, mode: 1, final: 62, tone: "tp", prog: [[0, 6, 5, 6], [0, 5, 6, 4]], drums: "drive", heavy: true, bass: "filter", fig: 0, chords: "gate", gate: 0, lead: "bright", trills: true, extra: ["brass"] },
    shield:   { bpm: 128, mode: 5, final: 65, tone: "t5", prog: [[0, 4, 5, 3], [0, 3, 4, 0]], drums: "drive", bass: "filter", fig: 1, chords: "gate", gate: 1, lead: "bright", lift: 2, extra: ["bells"] },
    dream:    { bpm: 68,  mode: 5, final: 65, tone: "t6", prog: [[0, 5, 3, 4], [0, 3, 0, 4]], drums: "none", bass: "tri", chords: "box", lead: "deep", soft: true, extra: ["bells"] },

    // Lament: by the rivers of Babylon, in the pit. Slow, bare, no drums.
    lament:   { bpm: 64,  mode: 3, final: 64, tone: "tp", prog: [[0, 6, 5, 0], [0, 1, 3, 0]], drums: "none", bass: "tri", chords: "pad", lead: "deep", cutoff: 1500, extra: ["bells"] },
    // Praise him with trumpet and drum: bright, quick, every voice in.
    festival: { bpm: 140, mode: 5, final: 65, tone: "t8", prog: [[0, 3, 4, 0], [0, 5, 3, 4]], drums: "drive", heavy: true, bass: "filter", fig: 1, chords: "gate", gate: 1, lead: "bright", lift: 2, extra: ["bells", "brass"] },
    teeth:    { bpm: 126, mode: 3, final: 64, tone: "t3", prog: [[0, 1, 0, 6], [0, 1, 5, 1]], drums: "tick", bass: "walk", chords: "gate", gate: 2, duty: 0.125, lead: "deep", cutoff: 2400, extra: ["danger"] },

// ---- Building a zone ------------------------------------------------------------------
// The ground is a height for every 4 pixels of the way (NaN over a pit). On it

  const back = button("BACK", W / 2 - 40, 159, 80, 17, true);
  for (const tp of input.taps) {
    const b = tp.x !== undefined && boxes.find((q) => inBox(tp, q));
    if (b) { game.saint = b.s; save.saint = b.i; store(); Snd.sfx("select"); }
    else if (tp.key === "Escape" || tp.key === "Enter" || (tp.x !== undefined && inBox(tp, back))) state = "title";
  }
  input.taps = [];
}
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];
function drawZones(t) {
  menuSky(t);
  text("THE INTERIOR CASTLE", W / 2, 3, { align: "center", color: "#ffe08a", size: 11 });
  const boxes = [];
  ZONES.forEach((Z, i) => {
    const row = i < 4 ? 0 : 1, x = row ? 46 + (i - 4) * 78 : 7 + i * 78, y = 19 + row * 64, open = i < save.open || window.__unlock;
    rect(x - 1, y - 1, 74, 62, "#140c1c");
    const sky = open ? Z.sky : ["#2a2240"];
    sky.forEach((c, k) => rect(x, y + (k * 42) / sky.length, 72, 42 / sky.length + 1, c));
    rect(x, y + 42, 72, 18, open ? Z.dirt[0] : "#1a1430"); rect(x, y + 42, 72, 2, open ? Z.grass : "#1a1430");
    text(ROMAN[i], x + 4, y + 2, { color: "#ffe08a", size: 9 });
    if (open) drawDemon(Z.demon, x + 62, y + 9, t, 0.7);
    // The name, on two lines if it needs them.
    wrapText(Z.name, 7, 66).forEach((l, k) => text(l, x + 36, y + 14 + k * 9, { align: "center", color: "#ffffff", size: 7 }));
    if (open) {
      const b = save.best[Z.id];
      text(save.wins[Z.id] ? "WON " + (b ? hms(b) : "") : b ? "LOST TO " + Z.demon.name.toUpperCase() : "vs " + Z.demon.name, x + 36, y + 44, { align: "center", color: save.wins[Z.id] ? "#fff4a0" : "#fff0c8", size: 6 });
      if (save.style[Z.id]) text("STYLE " + commas(save.style[Z.id]), x + 36, y + 52, { align: "center", color: "#c8f0ff", size: 6 });
    } else text("beat the demon before", x + 36, y + 34, { align: "center", color: "#c8b8ff", size: 6, edge: null });
    boxes.push({ x, y, w: 72, h: 60, i, open });
  });
  const back = button("BACK", W / 2 - 40, 152, 80, 18, false);
  for (const tp of input.taps) {
    const b = tp.x !== undefined && boxes.find((q) => inBox(tp, q));
    if (b && b.open) { Snd.sfx("select"); startZone(b.i); }
    else if (tp.key === "Escape" || (tp.x !== undefined && inBox(tp, back))) state = "title";
  }
  input.taps = [];
}
function drawDone(t) {
  drawPlay(t);
  rect(0, 0, W, H, "#000000b8");
  const Z = level.Z, sin = Z.demon, k = Z.id;
  text(Z.num.toUpperCase(), W / 2, 8, { align: "center", color: "#ffffff", size: 8 });
  text(Z.name.toUpperCase(), W / 2, 18, { align: "center", color: "#ffe08a", size: 13 });
  if (game.won) {
    text("YOU OUTRAN THE DEMON OF " + sin.name.toUpperCase(), W / 2, 38, { align: "center", color: "#8ae86a", size: 11 });
    text("by " + Math.max(1, Math.round((level.goal - D.x) / 40)) + " paces", W / 2, 52, { align: "center", color: "#ffffff", size: 8 });
  } else {
    text("THE DEMON OF " + sin.name.toUpperCase() + " WAS FIRST", W / 2, 38, { align: "center", color: "#ff8a7a", size: 11 });
    text("by " + (game.time - game.demonTime).toFixed(1) + " seconds. Beat him to go deeper.", W / 2, 52, { align: "center", color: "#ffffff", size: 8 });
  }
  text("TIME " + hms(game.time) + (game.newBest ? "   NEW BEST!" : "   best " + hms(save.best[k])), W / 2, 66, { align: "center", color: game.newBest ? "#8ae86a" : "#ffffff", size: 9 });
  text("STYLE " + commas(game.style) + (game.newStyle ? "   NEW BEST!" : "   best " + commas(save.style[k] || 0)), W / 2, 79, { align: "center", color: game.newStyle ? "#8ae86a" : "#c8f0ff", size: 9 });
  text("NEUMES " + game.neumes, W / 2, 92, { align: "center", color: "#ffcf5a", size: 8 });
  const last = game.zone >= ZONES.length - 1;
  if (last && game.won) text("God alone suffices.   St. Teresa of Ávila", W / 2, 108, { align: "center", color: "#fff4c0", size: 9, serif: true });
  else text("“So run that you may obtain.”  1 Corinthians 9:24", W / 2, 108, { align: "center", color: "#fff0c8", size: 8, serif: true });
  const nextOpen = !last && game.zone + 1 < save.open;
  const again = button("AGAIN", W / 2 - 154, 130, 100, 20, !nextOpen);
  const next = nextOpen ? button("NEXT MANSION", W / 2 - 50, 130, 100, 20, true) : null;
  const menu = button("CASTLE", W / 2 + 54, 130, 100, 20, false);
  for (const tp of input.taps) {
    if ((tp.x !== undefined && inBox(tp, again)) || (!next && tp.key === "Enter")) startZone(game.zone);
    else if (next && (tp.key === "Enter" || (tp.x !== undefined && inBox(tp, next)))) startZone(game.zone + 1);
    else if (tp.key === "Escape" || (tp.x !== undefined && inBox(tp, menu))) state = "zones";
  }
  input.taps = [];
}
function drawPause(t) {
  drawPlay(t);
  rect(0, 0, W, H, "#000000c0");
  text("PAUSED", W / 2, 6, { align: "center", color: "#ffe08a", size: 14 });
  text("Left half: tap to jump, hold to float.   Right half: hold to run faster.", W / 2, 26, { align: "center", size: 7 });
  text("In the air, swipe anywhere (or use the arrow keys) to do a trick:", W / 2, 38, { align: "center", size: 7, color: "#c8f0ff" });
  const rows = TRICKS.map((k) => [k.keys.split("").map((d) => ARROW[d]).join(" "), trickName(k), k.pts]);
  rows.forEach(([keys, name, pts], i) => {
    const x = i % 2 ? W / 2 + 10 : 22, y = 50 + Math.floor(i / 2) * 11;
    text(keys, x, y, { color: "#ffe08a", size: 8 }); text(name + "  " + pts, x + 48, y, { size: 7 });
  });
  text("Land on your feet: a trick not finished when you land is a crash (but clouds bounce).", W / 2, 96, { align: "center", size: 6, color: "#ffffff" });
  text("Land a chain of tricks for points × tricks, and a burst of speed.", W / 2, 105, { align: "center", size: 6, color: "#ffffff" });
  const go = button("RESUME", W / 2 - 84, 122, 80, 20, true), quit = button("QUIT", W / 2 + 4, 122, 80, 20, false);
  for (const tp of input.taps) {
    if (tp.key === "KeyP" || tp.key === "Escape" || tp.key === "Enter" || (tp.x !== undefined && inBox(tp, go))) { state = "play"; input.jumpHeld = false; input.rushHeld = false; pointers.clear(); }
    else if (tp.x !== undefined && inBox(tp, quit)) { state = "zones"; Snd.stop(); }
  }
  input.taps = [];
}

// ---- Input -------------------------------------------------------------------------------
// Left half: jump (on the ground at once; in the air, a tap is the second
// jump and a hold is the float). Right half: hold to run faster. Anywhere, in
// the air: swipe up, down, left, right for tricks; the finger holding the
// right side can swipe without letting go.
const input = { jumpHeld: false, jumpPressed: false, rushHeld: false, taps: [] };
const pointers = new Map();
const SWIPE = 12;   // how far a finger moves (in the game's pixels) to make one swipe
const airborne = () => state === "play" && P && P.mode === "air";
function toGame(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / (r.width / W), y: (ev.clientY - r.top) / (r.height / H) }; }
function held() {
  let j = false, r = false;
  for (const q of pointers.values()) { if (q.left && !q.swiped) j = true; if (!q.left) r = true; }
  input.jumpHeld = j || JUMP_KEYS.some((k) => keys.has(k));
  input.rushHeld = r || RUSH_KEYS.some((k) => keys.has(k));
}
addEventListener("pointerdown", (ev) => {
  if (ev.cancelable) ev.preventDefault();
  Snd.init();
  const p = toGame(ev);
  if (state === "play") {
    if (p.x > W - 24 && p.y < 14) { state = "pause"; input.taps = []; return; }
    const left = ev.clientX < innerWidth / 2;
    const q = { left, ax: p.x, ay: p.y, swiped: false, t0: performance.now(), late: false };
    pointers.set(ev.pointerId, q);
    if (left) { if (airborne()) q.late = true; else input.jumpPressed = true; }
    held();
  } else input.taps.push(p);
}, { passive: false });
addEventListener("pointermove", (ev) => {
  const q = pointers.get(ev.pointerId);
  if (!q || state !== "play") return;
  const p = toGame(ev), dx = p.x - q.ax, dy = p.y - q.ay;
  if (Math.hypot(dx, dy) < SWIPE) return;
  q.ax = p.x; q.ay = p.y;
  if (!airborne()) return;
  swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : dy > 0 ? "D" : "U");
  q.swiped = true; held();
});
const release = (ev) => {
  const q = pointers.get(ev.pointerId);
  pointers.delete(ev.pointerId);
  // A quick tap on the left in the air, not a swipe: the second jump.
  if (q && q.late && !q.swiped && performance.now() - q.t0 < 300 && airborne()) input.jumpPressed = true;
  held();
};
addEventListener("pointerup", release); addEventListener("pointercancel", release);
addEventListener("contextmenu", (e) => e.preventDefault());
const JUMP_KEYS = ["Space", "ArrowUp", "KeyW", "KeyZ"], RUSH_KEYS = ["ArrowRight", "KeyD", "KeyX"];
const KEY_DIRS = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R" };
const keys = new Set();
addEventListener("keydown", (e) => {
  Snd.init();
  if (e.repeat) return;
  keys.add(e.code);
  if (state === "play") {
    // In the air the arrows are tricks (the right arrow still drives him on).
    if (airborne() && KEY_DIRS[e.code]) { swipe(KEY_DIRS[e.code]); e.preventDefault(); if (e.code === "ArrowRight") input.rushHeld = true; return; }
    if (JUMP_KEYS.includes(e.code)) { input.jumpHeld = true; input.jumpPressed = true; e.preventDefault(); }
    if (RUSH_KEYS.includes(e.code)) { input.rushHeld = true; e.preventDefault(); }
    if (e.code === "ArrowDown") e.preventDefault();
    if (e.code === "KeyP" || e.code === "Escape") { state = "pause"; input.taps = []; }
  } else input.taps.push({ key: e.code });
  if (e.code === "KeyM") Snd.toggle();
});
addEventListener("keyup", (e) => { keys.delete(e.code); held(); });
addEventListener("blur", () => { if (state === "play") state = "pause"; });

// ---- The loop ------------------------------------------------------------------------------
let last = performance.now(), clock = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; clock += dt;
  ctx.setTransform(R, 0, 0, R, 0, 0); ctx.imageSmoothingEnabled = false;
  if (state === "title" || state === "saints" || state === "zones") Snd.play("title");
  Snd.update();
  if (state === "play") { tick(dt); if (state === "play") drawPlay(clock); }
  if (state === "title") drawTitle(clock);
  else if (state === "saints") drawSaints(clock);
  else if (state === "zones") drawZones(clock);
  else if (state === "done") drawDone(clock);
  else if (state === "pause") drawPause(clock);
  if (innerHeight > innerWidth * 1.1 && state !== "play") { rect(0, 0, W, 12, "#000"); text("Turn your phone sideways for a bigger view", W / 2, 2, { align: "center", color: "#c8b8ff", size: 8 }); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// For testing: ?zone=2 starts there; ?god keeps the saint safe; ?unlock opens every mansion.
const Q = new URLSearchParams(location.search);
if (Q.has("god")) window.__god = true;
if (Q.has("unlock")) window.__unlock = true;
if (Q.has("saint")) game.saint = SAINTS[+Q.get("saint")] || game.saint;
if (Q.has("zone")) startZone(+Q.get("zone") - 1);
window.RW = { get P() { return P; }, get D() { return D; }, get level() { return level; }, get state() { return state; }, set state(v) { state = v; }, get game() { return game; }, input, startZone, swipe, step(dt) { if (state === "play") tick(dt); }, ZONES, SAINTS, TRICKS, get save() { return save; } };

Snd.on = save.sound !== false;
</script>
