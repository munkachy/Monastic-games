<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SaintStyle Turbo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="screen" aria-label="SaintStyle Turbo"></canvas>
<script>
"use strict";
// SaintStyle Turbo: the saints of Psalter Runner race the seven deadly sins
// through the seven mansions of St. Teresa's Interior Castle. Slopes speed
// them up and slow them down; great ramps throw them high, the wind of the
// Spirit holds them up, springs bounce them onto roads of cloud, rails carry
// them grinding, and loops take them round. Running gets a saint only so far:
// in the air he does tricks (a tap, or swipes), and a trick landed on his
// feet is paid in style points and a surge of speed. The demon runs the same
// way by the same rules, tricks and all. The band is funk, and plays more of
// the song the faster the saint goes. The Novitiate teaches it all.
// One file, nothing to load. Left half of the screen: tap to jump, hold to
// float. Right half: hold to run faster. In the air: tap the right side for a
// quick trick, swipe for the others. Keys: Space / Up / W to jump, Right / D
// to run faster, arrows in the air for tricks, P or Esc to pause, M for sound.
// (This game was Run the Way; it keeps that name for its saved progress.)
//
// The screen, the words and the saints come from Psalter Runner
// (psalter-runner/index.html); the music and the run are its own.
const flat = (v) => v.replace(/\n/g, " ");
// ---- The screen -----------------------------------------------------------------
// A 320 x 180 picture, scaled up with hard edges, as a 16-bit console would.
const W = 320, H = 180;
// The picture is still laid out on a 320 x 180 grid, and the art keeps its
// big square pixels; but the canvas itself is finer (R times), so words
// come out smooth and easy to read.
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0, R = 3;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  R = clamp(Math.round(scale * (window.devicePixelRatio || 1)), 2, 4);
  cv.width = W * R; cv.height = H * R;
  ctx.imageSmoothingEnabled = false;
  const w = Math.floor(W * scale), h = Math.floor(H * scale);
  offX = Math.floor((innerWidth - w) / 2); offY = Math.floor((innerHeight - h) / 2);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.style.left = offX + "px"; cv.style.top = offY + "px";
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
addEventListener("resize", resize); resize();
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// ---- Words ---------------------------------------------------------------------
// Clear type, drawn at the canvas's full resolution: a friendly sans-serif
// for the game's own words, a book serif for the psalms.
const SANS = "'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif";
const SERIF = "Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif";
const fontOf = (size, serif) => (serif ? "italic 600 " : "700 ") + size + "px " + (serif ? SERIF : SANS);
function measure(str, size, serif) { ctx.save(); ctx.font = fontOf(size, serif); const w = ctx.measureText(str).width; ctx.restore(); return w; }
function text(str, x, y, o) {
  o = o || {};
  const size = o.size || 8, color = o.color || "#ffffff", edge = o.edge === undefined ? "#140c1c" : o.edge;
  ctx.save();
  ctx.font = fontOf(size, o.serif);
  ctx.textAlign = o.align || "left"; ctx.textBaseline = "top";
  if (edge) { ctx.lineJoin = "round"; ctx.lineWidth = Math.max(1.6, size / 4.5); ctx.strokeStyle = edge; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}
function wrapText(str, size, width, serif) {
  const words = flat(str).split(" "), lines = []; let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (measure(t, size, serif) > width && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}

// ---- Music and sound ----------------------------------------------------------------
// Funk, made in the browser. A drummer who swings his sixteenths and plays
// ghost notes on the snare; a bass that is thumbed and popped, or a synth
// bass that slides; a clavinet through an envelope filter; chicken-scratch
// and wah-wah guitar; a horn section; a talk box; Rhodes, Hammond, disco
// strings and a gospel choir. Every mansion has its own groove. The band
// listens to the run: high in a big jump the music goes muffled, as if heard
// from far above, and opens up when the saint lands; while he surges, the
// horns come in.
const Snd = (() => {
  let ac = null, master, musicBus, airLP, musicGain, drumBus, sfxGain, stingBus, verbSend, echoSend, echo, noise, metal;
  let on = true, song = null, pending = null, wanted = null, gridTime = 0, step = 0, SIX = 0.15;
  let layer = 4, airAmt = 0, hitQ = null, lastBass = null, lastLead = null, openHat = null, mute = null;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  let waves = {};

  // The wiring, on a live context or (for testing) an offline one.
  function build(ctx) {
    ac = ctx; waves = {}; openHat = null;
    master = ac.createGain(); master.gain.value = on ? 0.8 : 0;
    const limiter = ac.createDynamicsCompressor();
    limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.002; limiter.release.value = 0.12;
    master.connect(limiter).connect(ac.destination);
    // The band: glued by a compressor, through a filter that closes when the saint is high in the air.
    const glue = ac.createDynamicsCompressor();
    glue.threshold.value = -15; glue.knee.value = 8; glue.ratio.value = 3; glue.attack.value = 0.008; glue.release.value = 0.2;
    musicBus = ac.createGain();
    airLP = ac.createBiquadFilter(); airLP.type = "lowpass"; airLP.frequency.value = 18000; airLP.Q.value = 1.2;
    musicGain = ac.createGain(); musicGain.gain.value = 0.7;
    musicBus.connect(airLP).connect(glue).connect(musicGain).connect(master);
    drumBus = ac.createGain(); drumBus.gain.value = 1.25; drumBus.connect(musicBus);
    sfxGain = ac.createGain(); sfxGain.gain.value = 1.5; sfxGain.connect(master);
    stingBus = ac.createGain(); stingBus.gain.value = 0.9; stingBus.connect(master);
    // A small bright room, not a cathedral: funk is played close.
    const verb = ac.createConvolver(), len = Math.floor(ac.sampleRate * 1.2), imp = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = imp.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4); }
    verb.buffer = imp; verbSend = ac.createGain(); verbSend.gain.value = 0.3; verbSend.connect(verb); verb.connect(musicBus);
    // A tape echo, three sixteenths behind, for the talk box and the horns.
    echo = ac.createDelay(2); const fb = ac.createGain(); fb.gain.value = 0.3;
    const dark = ac.createBiquadFilter(); dark.type = "lowpass"; dark.frequency.value = 2400;
    echoSend = ac.createGain(); echoSend.connect(echo); echo.connect(dark).connect(fb).connect(echo);
    const wet = ac.createGain(); wet.gain.value = 0.32; echo.connect(wet).connect(musicBus);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // The metal of the hats: six square waves at clashing pitches, as the drum machines made it.
    metal = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
    const md = metal.getChannelData(0), fr = [205.3, 304.4, 369.6, 522.7, 540, 800].map((f) => f * 2.4);
    for (let i = 0; i < md.length; i++) { const t = i / ac.sampleRate; let v = 0; for (const f of fr) v += Math.sin(2 * Math.PI * f * t) > 0 ? 1 : -1; md[i] = v / 6; }
    kit = makeKit();
  }
  function init() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    build(new A());
    if (wanted) { const w = wanted; wanted = null; play(w); }
  }
  function toggle() { on = !on; if (master) master.gain.setTargetAtTime(on ? 0.8 : 0, ac.currentTime, 0.05); save.sound = on; store(); }

  // ---- The instruments ----
  function pulse(duty) {
    const k = "p" + duty; if (waves[k]) return waves[k];
    const n = 48, re = new Float32Array(n + 1), im = new Float32Array(n + 1);
    for (let h = 1; h <= n; h++) re[h] = (2 * Math.sin(Math.PI * h * duty)) / (Math.PI * h);
    return (waves[k] = ac.createPeriodicWave(re, im));
  }
  // A gain that swells, falls to a sustain, holds, and dies away. Returns when it is silent.
  function adsr(g, t, peak, a, d, s, len, r) {
    const hold = Math.max(a + d, len), sus = Math.max(0.0002, peak * s);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(sus, t + a + d);
    g.gain.setValueAtTime(sus, t + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + hold + r);
    return t + hold + r;
  }
  const send = (node, bus, amt) => { if (amt) { const g = ac.createGain(); g.gain.value = amt; node.connect(g).connect(bus); } };
  function osc(type, freq, t) { const o = ac.createOscillator(); if (type[0] === "p") o.setPeriodicWave(pulse(+type.slice(1))); else o.type = type; o.frequency.setValueAtTime(freq, t); return o; }
  function noiseHit(t, type, freq, level, length, out, q) {
    const s = ac.createBufferSource(); s.buffer = noise;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
    const g = ac.createGain(); g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(0.0008, t + length);
    s.connect(f).connect(g).connect(out || drumBus); s.start(t, Math.random() * 0.4); s.stop(t + length + 0.02);
    return g;
  }
  // Noise swept from one pitch to another: wind, a whoosh, a riser.
  function sweep(t, f0, f1, len, level, out, q) {
    const s = ac.createBufferSource(); s.buffer = noise; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = q || 2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + len);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(level, t + len * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + len + 0.05);
  }

  // The drums, made once as samples by plain arithmetic (cheap to play: every
  // hit after that is one buffer and one gain), with the clicks and scrapes
  // the other instruments use.
  let kit = {};
  function makeKit() {
    const sr = ac.sampleRate, K = {};
    // An RBJ biquad filter, run over an array.
    function filt(d, type, f, q) {
      const w = (2 * Math.PI * f) / sr, cs = Math.cos(w), al = Math.sin(w) / (2 * (q || 0.707));
      let b0, b1, b2; const a0 = 1 + al, a1 = -2 * cs, a2 = 1 - al;
      if (type === "lp") { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = b0; } else if (type === "hp") { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = b0; } else { b0 = al; b1 = 0; b2 = -al; }
      let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
      for (let i = 0; i < d.length; i++) { const x = d[i], y = (b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0; x2 = x1; x1 = x; y2 = y1; y1 = y; d[i] = y; }
      return d;
    }
    const white = (n) => { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1; return a; };
    const metalOf = (n) => { const a = new Float32Array(n), fr = [205.3, 304.4, 369.6, 522.7, 540, 800].map((f) => f * 2.4); for (let i = 0; i < n; i++) { const t = i / sr; let v = 0; for (const f of fr) v += Math.sin(2 * Math.PI * f * t) > 0 ? 1 : -1; a[i] = v / 6; } return a; };
    // A tone swept from f0 to f1 over `len` seconds (sine, triangle or square).
    const swept = (n, f0, f1, len, shape) => { const a = new Float32Array(n); let ph = 0; for (let i = 0; i < n; i++) { const t = i / sr, f = t < len ? f0 * Math.pow(f1 / f0, t / len) : f1; ph += f / sr; const x = ph % 1; a[i] = shape === "tri" ? 4 * Math.abs(x - 0.5) - 1 : shape === "sq" ? (x < 0.5 ? 1 : -1) : Math.sin(2 * Math.PI * ph); } return a; };
    // Add a source into d from `at` seconds, falling exponentially from `level` to silence over `len`.
    const add = (d, src, level, len, at) => { const o = Math.floor((at || 0) * sr); for (let i = 0; i + o < d.length && i < src.length; i++) { const t = i / sr; if (t > len) break; d[i + o] += src[i] * level * Math.pow(0.0008 / level, t / len); } };

    make("kick", 0.4, (d, n) => { add(d, swept(n, 140, 46, 0.1), 0.9, 0.34); add(d, swept(n, 300, 95, 0.05, "tri"), 0.32, 0.07); add(d, filt(white(n), "hp", 2500), 0.1, 0.012); });
    for (const [name, ghost] of [["snare", false], ["ghost", true]]) make(name, ghost ? 0.1 : 0.25, (d, n) => { add(d, filt(white(n), "hp", 1400), 0.3, ghost ? 0.06 : 0.17); add(d, filt(white(n), "bp", 4200, 0.8), 0.12, ghost ? 0.04 : 0.1); add(d, swept(n, 225, 165, 0.05, "tri"), 0.3, 0.09); });
    make("clap", 0.25, (d, n) => { for (const at of [0, 0.011, 0.023]) add(d, filt(white(n), "bp", 1250, 1.2), 0.26, 0.028, at); add(d, filt(white(n), "bp", 1250, 1.2), 0.17, 0.15, 0.03); });
    make("hatC", 0.06, (d, n) => add(d, filt(filt(metalOf(n), "hp", 7800), "bp", 10500, 0.7), 0.2, 0.042));
    make("hatO", 0.34, (d, n) => add(d, filt(filt(metalOf(n), "hp", 6500), "bp", 10500, 0.7), 0.2, 0.3));
    make("tamb", 0.1, (d, n) => { add(d, filt(white(n), "hp", 7500), 0.1, 0.06); add(d, filt(white(n), "bp", 11000, 2), 0.06, 0.06, 0.012); });
    make("shaker", 0.06, (d, n) => add(d, filt(white(n), "bp", 6500, 1.5), 0.05, 0.045));
    make("cowbell", 0.3, (d, n) => { add(d, filt(swept(n, 562, 562, 1, "sq"), "bp", 1700, 1.4), 0.07, 0.26); add(d, filt(swept(n, 845, 845, 1, "sq"), "bp", 1700, 1.4), 0.07, 0.26); });
    for (const [name, f] of [["congaL", 230], ["congaH", 340]]) make(name, 0.25, (d, n) => { add(d, swept(n, f * 1.4, f, 0.03), 0.36, 0.22); add(d, filt(white(n), "bp", 2400), 0.05, 0.02); });
    for (const [name, f] of [["tomH", 190], ["tomL", 140]]) make(name, 0.3, (d, n) => add(d, swept(n, f * 1.35, f, 0.04), 0.42, 0.26));
    make("crash", 1.7, (d, n) => { add(d, filt(metalOf(n), "hp", 4200), 0.09, 1.6); add(d, filt(white(n), "hp", 5000), 0.12, 1.2); });
    make("slap", 0.03, (d, n) => add(d, filt(white(n), "bp", 1800, 1), 0.08, 0.018));
    make("pop", 0.03, (d, n) => add(d, filt(white(n), "hp", 3000), 0.05, 0.015));
    make("dead", 0.03, (d, n) => add(d, filt(white(n), "bp", 1200), 0.09, 0.02));
    make("scrape", 0.04, (d, n) => add(d, filt(white(n), "bp", 2400, 1.6), 0.15, 0.03));
    make("keyclick", 0.02, (d, n) => add(d, filt(white(n), "bp", 3000), 0.025, 0.012));

  }
  function hit(name, t, v, out) {
    const s = ac.createBufferSource(); s.buffer = kit[name];
    const g = ac.createGain(); g.gain.value = v === undefined ? 1 : v;
    s.connect(g).connect(out || drumBus); s.start(t);
    return g;
  }
  const kick = (t, v) => hit("kick", t, v || 1);
  function snare(t, v) { v = v || 1; if (v < 0.5) hit("ghost", t, v); else { hit("snare", t, v); hit("snare", t, 0.22 * v, verbSend); } }
  const clap = (t, v) => { hit("clap", t, v || 1); hit("clap", t, 0.25 * (v || 1), verbSend); };
  function hat(t, open, v) {
    // A closed hat chokes an open one still ringing.
    if (openHat && !open) { try { openHat.gain.setTargetAtTime(0.0001, t, 0.008); } catch (e) { } openHat = null; }
    const g = hit(open ? "hatO" : "hatC", t, (v || 1) * (0.92 + Math.random() * 0.16));
    if (open) openHat = g;
  }
  const tamb = (t, v) => hit("tamb", t, v || 1);
  const shaker = (t, v) => hit("shaker", t, v || 1);
  const cowbell = (t, v) => hit("cowbell", t, v || 1);
  const conga = (t, high, v) => hit(high ? "congaH" : "congaL", t, v || 1);
  const tom = (t, high, v) => hit(high ? "tomH" : "tomL", t, v || 1);
  const crash = (t, v, out) => hit("crash", t, v || 1, out);

  // The bass. kind: slap (thumbed), pop (plucked, an octave up), dead (a muted
  // thump), slide (in from below), round (fingered, soft), synth (a fat
  // synth bass that glides from note to note).

    if (from) for (const o of [a]) { o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(fr, t + 0.06); }

      f.Q.value = 9; f.frequency.setValueAtTime(5200, t); f.frequency.exponentialRampToValueAtTime(900, t + 0.14);
      end = adsr(out, t, 0.32 * v, 0.002, 0.12, 0.45, len, 0.05); hit("pop", t, v, musicBus);
    } else if (kind === "synth") {
      f.Q.value = 11; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(320, t + Math.min(0.35, len + 0.05));
      end = adsr(out, t, 0.3 * v, 0.004, 0.1, 0.75, len, 0.06);
    } else if (kind === "round") {
      f.Q.value = 2; f.frequency.setValueAtTime(1100, t); f.frequency.exponentialRampToValueAtTime(420, t + 0.2);
      end = adsr(out, t, 0.34 * v, 0.008, 0.15, 0.7, len, 0.08);
    } else {
      f.Q.value = 6; f.frequency.setValueAtTime(3400, t); f.frequency.exponentialRampToValueAtTime(420, t + 0.15);
      end = adsr(out, t, 0.33 * v, 0.002, 0.08, 0.6, len, 0.05); hit("slap", t, v, musicBus);
    }
    out.connect(musicBus);
    a.start(t); a.stop(end + 0.02);
    if (kind !== "dead") lastBass = midi;
  }

  // Keys and guitars.
  // The clavinet: a thin pulse through a filter that opens with each stroke.
  function clav(t, notes, len, v) {
    v = v || 1;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 3.5;
    bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2000 + 1200 * v, t + 0.025); bp.frequency.exponentialRampToValueAtTime(800, t + len + 0.05);
    const g = ac.createGain(), end = adsr(g, t, 0.6 * v, 0.002, 0.06, 0.5, len, 0.03);
    bp.connect(g).connect(musicBus);

  }
  // Chicken scratch: a muted strum, and on the accents a bright chop of the chord.
  function scratch(t, notes, accent, v) {
    v = v || 1;
    hit("scrape", t, (accent ? 2.4 : 1.8) * v, musicBus);
    if (!accent) return;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.2; bp.frequency.value = accent ? 1800 : 1100;
    const g = ac.createGain(), end = adsr(g, t, 0.7 * v, 0.002, 0.02, 0.5, 0.07, 0.02);
    bp.connect(g).connect(musicBus);
    for (const m of notes) { const o = osc("sawtooth", mtof(m), t); o.connect(bp); o.start(t); o.stop(end + 0.02); }
  }
  // Wah-wah: a strum through a filter whose pedal rocks with the bar (pos, 0 to 1).
  function wah(t, notes, len, v, pos) {

// A small figure in the style of the game, drawn from blocks: robe, head,
// veil or hood, hands. (x, y) is the top-left of a 12 x 22 box; f is the
// running frame; face is 1 (right) or -1 (left).
function drawFigure(L, x, y, f, opt) {
  opt = opt || {};
  x = Math.round(x); y = Math.round(y);
  const ink = "#140c1c";
  const bob = opt.still ? 0 : (f % 2);
  const fy = y + bob;
  // A halo behind the head: a crown of stars for Our Lady, a cross for Our Lord.
  if (L.halo) {
    ctx.globalAlpha = 0.85; ctx.strokeStyle = "#ffd84a"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x + 6, fy + 4, 7.5, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    if (L.halo === "cross") { rect(x + 5, fy - 5, 2, 3, "#d8324a"); rect(x - 3, fy + 3, 3, 2, "#d8324a"); rect(x + 12, fy + 3, 3, 2, "#d8324a"); }
    else for (let k = 0; k < 7; k++) { const a = Math.PI + k * Math.PI / 6; rect(x + 6 + Math.cos(a) * 8 - 0.5, fy + 4 + Math.sin(a) * 8 - 0.5, 1.5, 1.5, "#fff4a0"); }
  }
  // Legs and feet, running.
  if (!opt.seated) {
    const a = opt.air ? 1 : f % 4 < 2 ? 0 : 1;
    rect(x + 2 + (a ? 0 : 2), y + 19, 3, 3, ink); rect(x + 7 - (a ? 0 : 2), y + 19, 3, 3, ink);
  }
  // Robe.
  rect(x + 1, fy + 8, 10, 12, ink);
  rect(x + 2, fy + 9, 8, 10, L.robe);
  rect(x + 2, fy + 15, 8, 4, L.shade);
  if (L.mantle) { rect(x + 1, fy + 9, 2, 10, L.mantle); rect(x + 9, fy + 9, 2, 10, L.mantle); }
  if (L.armor) { rect(x + 2, fy + 9, 8, 6, L.armor); rect(x + 3, fy + 10, 6, 1, "#ffffff"); }
  if (L.cord) { rect(x + 2, fy + 13, 8, 1, L.cord); rect(x + 4, fy + 14, 1, 4, L.cord); }
  // Arms.
  rect(x + (opt.reach ? 10 : 9), fy + 10, 3, 3, L.skin);
  // Head.
  rect(x + 2, fy, 8, 9, ink);
  rect(x + 3, fy + 1, 6, 7, L.skin);
  rect(x + 7, fy + 3, 1, 1, ink);
  if (L.veil) { rect(x + 2, fy, 3, 9, L.veil); rect(x + 2, fy, 8, 2, L.veil); rect(x + 4, fy + 1, 5, 1, L.wimple); rect(x + 3, fy + 7, 6, 2, L.wimple); }
  if (L.hood) { rect(x + 2, fy, 2, 9, L.robe); rect(x + 2, fy, 8, 1, L.robe); }
  if (L.long) rect(x + 2, fy + 1, 2, 9, L.hair);
  if (L.hair && !L.hood) { rect(x + 3, fy + 1, 6, 1, L.hair); rect(x + 3, fy + 1, 1, 3, L.hair); }
  if (L.tonsure) { rect(x + 3, fy + 1, 6, 2, L.hair); rect(x + 5, fy + 1, 2, 1, L.skin); }
  if (L.beard) { rect(x + 4, fy + 5, 5, 3, L.beard); }
  if (L.helm) { rect(x + 2, fy - 1, 8, 3, "#c8ccd4"); rect(x + 5, fy - 3, 2, 2, "#b8322a"); }
  if (L.crown) { rect(x + 3, fy - 2, 6, 2, "#e8b94a"); rect(x + 3, fy - 4, 1, 2, "#e8b94a"); rect(x + 5, fy - 4, 2, 2, "#e8b94a"); rect(x + 8, fy - 4, 1, 2, "#e8b94a"); }
  if (L.eyes) rect(x + 6, fy + 3, 2, 1, L.eyes);
  // Things held.
  if (L.hold === "rose") { rect(x + 11, fy + 8, 2, 2, "#d8324a"); rect(x + 11, fy + 10, 1, 3, "#2f7a3a"); }
  if (L.staff) { rect(x + 12, fy + 2, 1, 18, "#8a5a2b"); rect(x + 11, fy + 2, 3, 1, "#8a5a2b"); }
  if (L.board && !opt.air) { rect(x - 5, fy - 2, 4, 22, "#140c1c"); rect(x - 4, fy - 1, 2, 20, "#ffcf5a"); rect(x - 4, fy + 8, 2, 2, "#3a8ad0"); }
  if (L.sprig) { rect(x + 11, fy + 6, 1, 6, "#2f7a3a"); rect(x + 10, fy + 5, 3, 2, "#5ac04a"); rect(x + 12, fy + 8, 2, 1, "#5ac04a"); }
  if (L.gold) { rect(x + 2, fy + 13, 8, 1, "#e8b94a"); }
  if (L.wreath) { rect(x + 3, fy - 1, 6, 1, "#f4f0e8"); rect(x + 3, fy - 1, 1, 1, "#ff7a9a"); rect(x + 6, fy - 1, 1, 1, "#ff7a9a"); }
  if (L.keys) { rect(x + 11, fy + 9, 3, 1, "#e8b94a"); rect(x + 12, fy + 9, 1, 5, "#e8b94a"); rect(x + 11, fy + 12, 3, 1, "#cfd6dc"); }
  if (L.mitre) { rect(x + 3, fy - 4, 6, 4, "#f4f0e8"); rect(x + 5, fy - 6, 2, 2, "#f4f0e8"); rect(x + 5, fy - 4, 2, 4, "#e8b94a"); }
  if (L.heart) { rect(x + 11, fy + 8, 3, 3, "#d8324a"); rect(x + 12, fy + 6, 1, 2, "#ffb030"); }
  if (L.sash) { for (let k = 0; k < 6; k++) rect(x + 3 + k, fy + 9 + k, 2, 1, L.sash); }
  if (L.candles) { rect(x + 2, fy - 2, 8, 2, "#3a8a3a"); for (const k of [2, 5, 8]) { rect(x + k, fy - 5, 1, 3, "#f4f0e8"); rect(x + k, fy - 7, 1, 2, "#ffcf5a"); } }
  if (L.dove) { rect(x + 1, fy - 5, 4, 2, "#ffffff"); rect(x - 1, fy - 6, 2, 1, "#ffffff"); }
  if (L.weapon) { rect(x - 3, fy + 6, 1, 14, "#8a8a92"); rect(x - 4, fy + 4, 3, 3, "#c8ccd4"); }
}

// ---- Input -------------------------------------------------------------------------------
// Left half: jump (on the ground at once; in the air, a tap is the second
// jump and a hold is the float). Right half: hold to run. In the air: a quick
// tap on the right side is the saint's flourish; a swipe anywhere, up, down,

const input = { jumpHeld: false, jumpPressed: false, rushHeld: false, taps: [] };
const pointers = new Map();

addEventListener("pointerdown", (ev) => {

const JUMP_KEYS = ["Space", "ArrowUp", "KeyW", "KeyZ"], RUSH_KEYS = ["ArrowRight", "KeyD", "KeyX"];

  else if (state === "zones") drawZones(clock);

// For testing: every trick at once, frozen at one moment of it (u from 0 to 1).
